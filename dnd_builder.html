<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D&D 5e 2014 — Конструктор персонажей</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<style>
/* ============ Темы ============ */
:root, :root[data-theme="dark"]{
  --bg:#151210; --bg2:#1f1a16; --card:#262019; --card2:#2e2620;
  --line:#4a3d2f; --line2:#5d4c38;
  --text:#ece3d4; --muted:#a89a86;
  --accent:#c9a45c; --accent2:#9a2c2c; --accent-ink:#1a1512;
  --btn:#3a2f24; --btn-hov:#4a3d2e;
  --ok:#7ba05b; --bad:#c0503f;
  --chip:#33291f;
}
:root[data-theme="light"]{
  --bg:#f3ede2; --bg2:#ece4d4; --card:#fffdf8; --card2:#f7f1e4;
  --line:#cbbfa8; --line2:#b3a489;
  --text:#2b241c; --muted:#7d6f5a;
  --accent:#8a6a2f; --accent2:#8c2323; --accent-ink:#fffdf8;
  --btn:#e6dcc6; --btn-hov:#d9ccb0;
  --ok:#3f7a35; --bad:#a33225;
  --chip:#efe6d2;
}
*{box-sizing:border-box}
html{font-size:15px}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;line-height:1.45}
h1{font-family:Georgia,'Times New Roman',serif;font-size:1.7rem;margin:.4rem 0 1rem;color:var(--accent)}
h2{font-family:Georgia,serif;font-size:1.25rem;margin:1.4rem 0 .7rem;color:var(--accent)}
h3{font-family:Georgia,serif;font-size:1.05rem;margin:.2rem 0 .6rem;color:var(--accent)}
h4{font-size:.95rem;margin:.8rem 0 .4rem;color:var(--accent)}
button{font-family:inherit}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 18px;background:var(--bg2);border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:50;flex-wrap:wrap}
.brand{font-family:Georgia,serif;font-size:1.1rem;cursor:pointer;color:var(--accent)}
.brand b{color:var(--text)}
.top-actions{display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:4px;padding:8px 18px 0;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:49px;z-index:40}
.tab{padding:8px 14px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:var(--card);color:var(--muted);cursor:pointer;font-size:.92rem}
.tab:hover{background:var(--btn-hov);color:var(--text)}
.tab.active{background:var(--accent);color:var(--accent-ink);font-weight:600}
.tab.disabled{opacity:.4;pointer-events:none}
.tab-char{margin-left:auto;align-self:center;font-size:.85rem;color:var(--muted);padding:0 6px}
main{padding:18px;max-width:1280px;margin:0 auto}
.page{max-width:1100px}
.grid{display:grid;gap:14px}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid.three{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid.six{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.char-card-name{font-family:Georgia,serif;font-size:1.15rem;color:var(--accent)}
.row{display:flex;align-items:center}
.row.gap{gap:10px}
.row.wrap{flex-wrap:wrap}
.nowrap{white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.hint{background:var(--card2);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.9rem;margin:8px 0}
.warn{color:#d98f3d}
.bad{color:var(--bad)}
.ok-t{color:var(--ok)}
.foot{margin-top:30px;text-align:center}
label{display:block;margin:6px 0;font-size:.88rem;color:var(--muted)}
input,select,textarea{font-family:inherit;font-size:.95rem;padding:7px 10px;border:1px solid var(--line2);border-radius:7px;background:var(--bg);color:var(--text);width:100%;margin-top:3px}
.sheet-portrait-preview{display:block;max-width:180px;max-height:220px;object-fit:contain;border:1px solid var(--line);border-radius:6px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
select[multiple]{min-height:90px}
label.chk{display:inline-flex;align-items:center;gap:7px;margin:3px 10px 3px 0;cursor:pointer;color:var(--text)}
label.chk input{width:auto;margin:0;accent-color:var(--accent)}
.row.gap>input,.row.gap>select{width:auto}
label.chk.wide{flex-basis:45%}
.col-list{align-items:flex-start}
.btn{padding:8px 16px;border:1px solid var(--line2);border-radius:8px;background:var(--btn);color:var(--text);cursor:pointer;font-size:.92rem;transition:background .15s}
.btn:hover{background:var(--btn-hov)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:var(--bad);color:#fff}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.ok:hover{background:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:.83rem}
.btn.die{font-family:Georgia,serif;font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.tbl th{color:var(--accent);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.table-scroll{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.prof-row{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.traits,.feats{margin:.4rem 0;padding-left:1.2rem;font-size:.9rem}
.feats li{margin-bottom:5px}
.tag{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:.75rem;color:var(--accent)}
.sub-feat{border-left:2px solid var(--accent2);padding-left:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:2px 10px;font-size:.8rem;cursor:pointer;color:var(--muted)}
.chip:hover{color:var(--text);border-color:var(--accent)}
.bg-desc{padding:8px 12px;background:var(--card2);border:1px dashed var(--accent);border-radius:8px;cursor:pointer;font-size:.9rem;margin:8px 0}
.abil-box{text-align:center;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px}
.abil-name{font-size:.8rem;color:var(--muted)}
.stepper{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0}
.stepper b{font-size:1.2rem;min-width:26px}
.asi-row{margin-bottom:8px}
.spell-lvl{margin:6px 0}
.spell-lvl summary{cursor:pointer;font-weight:600;color:var(--accent);padding:4px 0}
.spell-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px 14px;margin:6px 0}
.spell-filterbar{display:flex;align-items:end;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.spell-filterbar>label:not(.chk){flex:1 1 170px}
.spell-filterbar .chk{white-space:nowrap}
.spell-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 6px;border-radius:6px;font-size:.88rem}
.spell-row:hover{background:var(--card2)}
.spell-row.picked{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.spell-row.bonus{background:color-mix(in srgb,var(--ok) 12%,transparent)}
.spell-row .chk{margin:0;flex:1}
.spell-name{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.spell-name:hover{color:var(--accent)}
.chk.prep{font-size:.78rem;color:var(--muted)}
.class-row select{width:auto}
.shop-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 6px;border-bottom:1px solid var(--line);font-size:.88rem}
.hp-big{font-size:2.2rem;font-family:Georgia,serif;text-align:center;margin:6px 0}
.hp-big .muted{font-size:1.1rem}
.pips{display:inline-flex;gap:4px;flex-wrap:wrap}
.pip{display:inline-block;width:15px;height:15px;border-radius:50%;border:2px solid var(--accent);cursor:pointer;vertical-align:middle}
.pip.on{background:var(--accent)}
.pip.fail{border-color:var(--bad)}
.pip.fail.on{background:var(--bad)}
.slot-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.slots{margin-bottom:6px}
.dice-log{margin-top:10px;max-height:220px;overflow:auto;border-top:1px solid var(--line);padding-top:6px}
.log-entry{padding:3px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
#modal{display:none;position:fixed;inset:0;z-index:100}
.modal-back{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border:1px solid var(--accent);border-radius:12px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:20px 24px;position:relative}
.modal-x{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer}
.modal-x:hover{color:var(--text)}
/* тултипы */
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 8px);z-index:200;width:280px;background:var(--card2);color:var(--text);border:1px solid var(--accent);border-radius:8px;padding:8px 12px;font-size:.82rem;font-weight:400;line-height:1.4;text-transform:none;letter-spacing:0;white-space:pre-line;box-shadow:0 4px 14px rgba(0,0,0,.35);pointer-events:none}
.tip-i{display:inline-block;color:var(--accent);border:1px solid var(--accent);border-radius:50%;width:15px;height:15px;line-height:13px;text-align:center;font-size:.68rem;cursor:help;margin-left:5px;vertical-align:middle}
/* секции магазина */
.shop-sec{margin:12px 0 4px}
.shop-sec>summary{cursor:pointer;font-family:Georgia,serif;font-size:1.02rem;color:var(--accent);padding:7px 10px;background:var(--card2);border:1px solid var(--line);border-radius:8px;list-style:none}
.shop-sec>summary::-webkit-details-marker{display:none}
.shop-sec>summary::before{content:'▸ ';color:var(--muted)}
.shop-sec[open]>summary{border-radius:8px 8px 0 0;border-bottom:2px solid var(--accent)}
.shop-sec[open]>summary::before{content:'▾ '}
.shop-sec .shop-body{border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;padding:2px 8px}

.spell-full{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:.92rem;white-space:pre-line}

.sheet-choice{display:flex;justify-content:center;gap:8px;align-items:center;margin:0 auto 12px;font-size:.9rem}
.sheet-choice select{width:auto;min-width:150px}
.no-print-bar{display:flex;gap:12px;align-items:center}
.pdf-sheet{display:flex;flex-direction:column;align-items:center;gap:12px}
.pdf-page{width:min(900px,100%);aspect-ratio:210/297;padding:4.8%;background:#fff;color:#111;font:11px/1.2 Arial,sans-serif;position:relative;overflow:hidden;box-shadow:0 3px 14px #0003;display:grid;gap:5px}
.pdf-page *{box-sizing:border-box}
.pdf-page14{font-family:Arial,sans-serif;background:#fff;padding:4.8% 5.9% 10%}
.pdf-page14 .pdf-cap{font-size:10px}
.pdf-page14 .pdf-title{font-size:11px}
.pdf-page14 .pdf-small{font-size:10px}
.p14-name strong,.p14-id b{font-size:12px}
.pdf-page24{background-color:#fff;background-image:linear-gradient(#eee 1px,transparent 1px),linear-gradient(90deg,#eee 1px,transparent 1px);background-size:8px 8px;padding:4.8% 5%}
.pdf-page24 .pdf-box{border-radius:5px}
.pdf-box{border:1px solid #222;border-radius:2px;background:#fff;padding:4px;min-width:0;min-height:0;overflow:hidden}
.pdf-title{font-size:10px;font-weight:bold;text-align:center;text-transform:uppercase;border-bottom:1px solid #333;padding:2px;margin:-1px -1px 3px;letter-spacing:.02em}
.pdf-cap{font-size:9px;text-transform:uppercase;line-height:1.1}
.pdf-value{font-size:12px;font-weight:600;line-height:1.15}
.pdf-line{border-bottom:1px solid #555;padding:2px 1px;min-width:0}
.pdf-row{display:flex;justify-content:space-between;align-items:center;gap:3px;min-width:0}
.pdf-small{font-size:9px}
.pdf-lines{background-image:linear-gradient(to bottom,transparent 11px,#ccc 11px,#ccc 12px,transparent 12px);background-size:100% 12px;background-repeat:repeat}
.p14-page1{grid-template-rows:9% 1fr;row-gap:30px}
.p14-header{display:grid;grid-template-columns:32.8fr 67.2fr;gap:12px;align-items:start}
.p14-name{align-self:center;border-bottom:1px solid #222;padding-bottom:3px;min-height:12px}
.p14-id{border:1px solid #333;border-radius:2px;padding:4px;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:4px 8px;min-height:100%}
.p14-body{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;min-height:0}
.p14-col{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
.p14-leftsplit{display:grid;grid-template-columns:minmax(0,29fr) minmax(0,71fr);gap:2px;flex:2.15;min-height:0}
.p14-abilities{display:flex;flex-direction:column;gap:20px;min-height:0;background:#eee;border-radius:24px;padding:30px 3px 45px}
.p14-ability{position:relative;display:block;padding:4px 3px;flex:1;min-height:0;border:1px solid #222;border-radius:7px;background:#fff}
.p14-ability .pdf-cap{display:block;text-align:center;font-size:8px;white-space:nowrap;transform:scaleX(.82)}
.p14-ability .pdf-row{display:block}
.p14-ability:nth-child(3) .pdf-cap{font-size:5.5px;transform:none}
.p14-ability .mod{position:absolute;left:0;right:0;top:11px;height:19px;display:block;border:0;border-radius:0;background:transparent;text-align:center;font-size:19px;line-height:19px}
.p14-ability .score{position:absolute;left:50%;right:auto;bottom:2px;transform:translateX(-50%);width:32px;height:20px;border:1px solid #222;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;font-size:12px}
.p14-list{display:flex;flex-direction:column;gap:2px;min-height:0}
.p14-leftside{gap:0}
.p14-insp{flex:0 0 35px;text-align:center}
.p14-pb{align-self:stretch;flex:0 0 35px;width:auto;margin-top:15px;border-radius:18px;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:6px;text-align:center;padding:0}
.p14-pb strong{display:flex;flex:none;width:35px;height:35px;border:2px solid #222;border-radius:50%;align-items:center;justify-content:center;font:bold 15px Georgia,serif}
.p14-pb .pdf-cap{flex:1;font-size:7px}
.p14-saves{flex:0 0 133px;margin-top:0}
.p14-saves .p14-list{gap:1px}
.p14-skills{flex:1;margin-top:18px}
.p14-skills .p14-list{gap:0}
.p14-skills .p14-skill{min-height:14px}
.p14-saves .p14-skill{min-height:15px}
.p14-skill{display:flex;gap:4px;align-items:baseline;font-size:10px;min-height:18px}
.p14-skill b{min-width:20px;text-align:right}
.p14-passive{display:flex;align-items:center;gap:8px;flex:0 0 32px;border-radius:18px;padding:2px}
.p14-passive span{flex:1;text-align:center;font-size:8.5px;font-weight:bold;text-transform:uppercase}
.p14-status{display:grid;grid-template-columns:.85fr 1fr 1fr;gap:24px}
.p14-col>.p14-status:not(.p14-dice){flex:0 0 70px;padding-top:5px}
.p14-col>.p14-status:not(.p14-dice) .pdf-box:not(:first-child){display:flex;flex-direction:column;align-items:center;justify-content:center;height:54px;margin-top:7px}
.p14-col>.p14-status:not(.p14-dice) .pdf-box:not(:first-child) .pdf-cap{order:2;margin-top:auto}
.p14-col>.p14-status:not(.p14-dice) .pdf-box:first-child .pdf-cap{position:absolute;top:5px;z-index:1;font-size:7px}
.p14-col>.p14-status:not(.p14-dice) .pdf-box:first-child{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:62px;border:0;background:transparent;clip-path:none}
.p14-col>.p14-status:not(.p14-dice) .pdf-box:first-child::before,.p14-col>.p14-status:not(.p14-dice) .pdf-box:first-child::after{content:'';position:absolute;inset:0;clip-path:polygon(15% 0,85% 0,100% 15%,88% 78%,50% 100%,12% 78%,0 15%)}
.p14-col>.p14-status:not(.p14-dice) .pdf-box:first-child::before{z-index:0;background:#111}
.p14-col>.p14-status:not(.p14-dice) .pdf-box:first-child::after{inset:1px;z-index:0;background:#fff}
.p14-col>.p14-status:not(.p14-dice) .pdf-box:first-child strong{position:relative;z-index:1;margin-top:10px}
.p14-status.four{grid-template-columns:repeat(4,1fr)}
.p14-status .pdf-box{text-align:center;min-height:0}
.p14-hp{flex:0 0 86px;min-height:0;text-align:center}
.p14-currenthp{flex:0 0 70px;min-height:0;margin-top:6px;display:flex;flex-direction:column;justify-content:space-around;text-align:center}
.p14-dice{flex:0 0 62px;min-height:0;margin-top:0;grid-template-columns:1fr 1fr}
.p14-dice .pdf-box{text-align:center;min-height:0;height:100%}
.p14-attacks{display:flex;flex:0 0 28.2%;flex-direction:column;min-height:0;margin-top:17px}
.p14-attacks>.pdf-title{order:3;margin-top:auto}
.p14-attacks .p24-table{order:1}
.p14-attacks .pdf-lines{order:2;flex:1;min-height:0}
.p14-equipment{display:flex;flex:1;flex-direction:column;min-height:0}
.p14-equipment .pdf-row{order:1}
.p14-equipment>.pdf-small{order:2}
.p14-equipment .pdf-lines{order:3;flex:1;min-height:0}
.p14-equipment>.pdf-title{order:4;margin-top:auto}
.p14-body>.p14-col:last-child{gap:18px}
.p14-personality{display:grid;grid-template-rows:repeat(4,1fr);gap:4px;flex:0 0 34.5%;min-height:0}
.p14-body>.p14-col:first-child{gap:6px}
.p14-body>.p14-col:first-child>.pdf-box:last-child{display:flex;flex-direction:column}
.p14-passive{margin-top:6px}
.p14-body>.p14-col:first-child>.pdf-box:last-child>.pdf-title{order:2;margin-top:auto}
.p14-personality .pdf-lines{flex:1}
.p14-personality .pdf-title{margin-top:auto}
.p14-features{display:flex;flex-direction:column;flex:1;min-height:0;background-image:linear-gradient(#ddd 1px,transparent 1px);background-size:100% 14px}
.p14-features>.pdf-title{order:3;margin-top:auto}
.p14-features ul{margin:0;padding:0 0 0 10px;font-size:10px}
.p14-features li{margin:0 0 3px;break-inside:avoid}
.p14-page2{grid-template-rows:9% 1fr;row-gap:30px}
.p14-appearance{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:4px;min-height:0}
.p14-page2grid{display:grid;grid-template-columns:33fr 67fr;grid-template-rows:1fr 1fr;gap:11px;min-height:0}
.p14-page2grid .story{grid-row:1}
.p14-page2grid .goals{grid-row:2}
.p14-page2grid .detail-stack{display:grid;grid-column:2;grid-row:1/3;grid-template-rows:1fr 1fr 1fr;gap:6px;min-height:0}
.p14-page2grid>.pdf-box,.p14-page2grid .detail-stack>.pdf-box{display:flex;flex-direction:column}
.p14-page2grid .pdf-lines{flex:1;min-height:0}
.p14-page2grid .pdf-title{margin-top:auto}
.p14-page3{grid-template-rows:9% 1fr;row-gap:29px}
.p14-notes-header{display:flex;align-items:end}
.p14-notes-header .p14-name{width:32%;margin-bottom:0}
.p14-notes-grid{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:repeat(3,1fr);gap:7px 11px;min-height:0}
.p14-notes-grid .pdf-title{order:2;align-self:center;width:max-content;margin:auto 0 -1px;padding:2px 8px;background:#fff;border:0}
.p14-notes-grid .pdf-lines{order:1}
.p14-notes-grid .pdf-box{display:flex;flex-direction:column;min-height:0}
.p14-notes-grid .pdf-lines{flex:1;margin-top:3px}
.p14-page4{grid-template-rows:6% 1fr;row-gap:15px}
.p14-spellhead{display:grid;grid-template-columns:1.75fr 1fr 1fr 1fr;gap:24px;align-items:center}
.p14-spellcols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;min-height:0}

const SPELLS=[{"id":"acid_splash","ru":"Брызги кислоты","en":"Acid Splash","lvl":0,"school":"воплощение","cls":["sorcerer","wizard"],"time":"1 действие","range":"60 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"урон 1d6 (кислотой); спасбросок Ловкости; на высоких уровнях: усиливается (1d6)","full":"Вы кидаете кислотный шарик.\n\nВыберите одно видимое1 вами существо в пределах дистанции или два видимых2 вами существа в пределах дистанции, находящихся в пределах 5 футов друг от друга. Цель должна преуспеть в спасброске Ловкости, иначе она получает 1к6 урона кислотой.\n\nУрон этого заклинания увеличивается на 1к6, когда вы достигаете 5 уровня (2к6), 11 уровня (3к6) и 17 уровня (4к6).","translationSource":"5e14.ttg.club"},{"id":"mage_hand","ru":"Волшебная рука","en":"Mage Hand","lvl":0,"school":"вызов","cls":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"30 футов","comp":"В, С","dur":"1 минута","ritual":false,"desc":"","full":"В точке, выбранной вами в пределах дистанции, появляется призрачная парящая рука. Рука существует, пока заклинание активно, или пока вы не отпустите её Действием. Рука исчезает, если окажется более чем в 30 футах от вас, или если вы повторно используете это заклинание.\n\nВы можете Действием контролировать руку. Вы можете с её помощью манипулировать предметами, открывать незапертые двери и контейнеры, убирать предметы в открытые контейнеры и доставать их оттуда, или выливать содержимое флаконов.\n\nПри каждом использовании руки вы можете переместить её на 30 футов. Рука не может совершать атаки, активировать магические предметы и переносить более 10 фунтов.","translationSource":"5e14.ttg.club"},{"id":"shillelagh","ru":"Дубинка","en":"Shillelagh","lvl":0,"school":"преобразование","cls":["druid"],"time":"1 бонусное действие","range":"Касание","comp":"В, С, М","dur":"1 минута","ritual":false,"desc":"","full":"Дерево дубинки или боевого посоха, который вы держите, наполняется силой природы.\n\nПока заклинание активно, вы можете использовать свою базовую характеристику вместо Силы для бросков рукопашной атаки и урона при использовании этого оружия, и кость урона становится равной 1к8.\n\nЕсли оружие не было магическим, оно становится им.\n\nЗаклинание оканчивается, если вы наложите его ещё раз или выпустите оружие из рук.","translationSource":"5e14.ttg.club"},{"id":"vicious_mockery","ru":"Злая насмешка","en":"Vicious Mockery","lvl":0,"school":"очарование","cls":["bard"],"time":"1 действие","range":"60 футов","comp":"В","dur":"Мгновенная","ritual":false,"desc":"урон 1d4 (психический); спасбросок Мудрости; на высоких уровнях: усиливается (1d4)","full":"Вы испускаете на существо, видимое в пределах дистанции, поток оскорблений вперемешку с тонкой магией.\n\nЕсли цель слышит вас (при этом она не обязана вас понимать), она должна преуспеть в спасброске Мудрости, иначе получит 1к4 урона психической энергией, и следующий бросок атаки до конца своего следующего хода совершит с помехой.\n\nУрон этого заклинания увеличивается на 1к4, когда вы достигаете 5 уровня (2к4), 11 уровня (3к4) и 17 уровня (4к4).","translationSource":"5e14.ttg.club"},{"id":"druidcraft","ru":"Искусство друидов","en":"Druidcraft","lvl":0,"school":"преобразование","cls":["druid"],"time":"1 действие","range":"30 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"","full":"Пошептавшись с духами природы, вы создаёте один из следующих эффектов в пределах дистанции:\n\nВы создаёте крохотный безвредный ощутимый эффект, предсказывающий погоду в текущем месте в течение следующих 24 часов. Это может быть золотистый шарик, означающий ясную погоду, облачко, означающее дождь, снежинка, и так далее. Эффект длится 1 раунд.\nВы мгновенно заставляете цветок распуститься, семечко прорасти, или почку раскрыться.\nВы создаёте мгновенный безвредный ощутимый эффект, такой как падающие листья, порыв ветра, звук маленького животного, или слабый запах скунса. Эффект должен находиться в кубе с длиной ребра 5 футов.\nВы мгновенно зажигаете или тушите свечу, факел или небольшой костёр.","translationSource":"5e14.ttg.club"},{"id":"chill_touch","ru":"Леденящее прикосновение","en":"Chill Touch","lvl":0,"school":"некромантия","cls":["sorcerer","warlock","wizard"],"time":"1 действие","range":"120 футов","comp":"В, С","dur":"1 раунд","ritual":false,"desc":"урон 1d8 (некротический); атака заклинанием; на высоких уровнях: усиливается (1d8)","full":"Вы создаёте призрачную руку скелета в пространстве существа, находящегося в пределах дистанции.\n\nСовершите дальнобойную атаку заклинанием по существу, чтобы окутать его могильным холодом. При попадании цель получает 1к8 урона некротической энергией, и не может восстанавливать хиты до начала вашего следующего хода. Всё это время рука держится за цель.\n\nЕсли вы попадаете по нежити, то она также до конца вашего следующего хода совершает по вам броски атаки с помехой.\n\nУрон этого заклинания увеличивается на 1к8, когда вы достигаете 5 уровня (2к8), 11 уровня (3к8), 17 уровня (4к8).","translationSource":"5e14.ttg.club"},{"id":"ray_of_frost","ru":"Луч холода","en":"Ray of Frost","lvl":0,"school":"воплощение","cls":["sorcerer","wizard"],"time":"1 действие","range":"60 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"урон 1d8 (холодом); атака заклинанием; на высоких уровнях: усиливается (1d8)","full":"Холодный сине-белый луч устремляется к существу, находящемуся в пределах дистанции.\n\nСовершите по цели дальнобойную атаку заклинанием. При попадании цель получает 1к8 урона холодом, а скорость до начала вашего следующего хода уменьшается на 10 футов.\n\nУрон от заклинания увеличивается на 1к8, когда вы достигаете 5 уровня (2к8), 11 уровня (3к8) и 17 уровня (4к8).","translationSource":"5e14.ttg.club"},{"id":"minor_illusion","ru":"Малая иллюзия","en":"Minor Illusion","lvl":0,"school":"иллюзия","cls":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"30 футов","comp":"С, М","dur":"1 минута","ritual":false,"desc":"","full":"Вы создаёте звук или образ предмета в пределах дистанции, существующий, пока активно заклинание. Иллюзия также оканчивается, если вы отпустите её Действием или используете это заклинание ещё раз.\n\nЕсли вы создаёте звук, его громкость может быть как шёпотом, так и криком. Это может быть ваш голос, чей-то другой голос, львиный рык, бой барабанов или любой другой звук. Звук звучит всю длительность заклинания, или вы можете создавать отдельные звуки в разное время, пока заклинание активно.\n\nЕсли вы создаёте образ предмета — например, стул, отпечаток в грязи, или небольшой сундук — он должен помещаться в куб с длиной ребра 5 футов. Образ не может издавать звуки, свет, запах или прочие сенсорные эффекты. Физическое взаимодействие с образом даёт понять, что это иллюзия, потому что сквозь него всё проходит.\n\nЕсли существо действием исследует звук или образ, оно может понять, что это иллюзия, совершив успешную проверку Интеллекта (Анализ) против Сл ваших заклинаний. Если существо распознаёт иллюзию, она для него становится нечёткой.","translationSource":"5e14.ttg.club"},{"id":"true_strike","ru":"Меткий удар","en":"True Strike","lvl":0,"school":"прорицание","cls":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"30 футов","comp":"С","dur":"Концентрация, up to 1 round","ritual":false,"desc":"","full":"Вы вытягиваете руку и указываете пальцем на цель, находящуюся в пределах дистанции. Ваша магия даёт краткое понимание защит цели.\n\nВ своём следующем ходу вы совершаете с преимуществом первый бросок атаки по цели, при условии, что заклинание к тому моменту не окончится.","translationSource":"5e14.ttg.club"},{"id":"eldritch_blast","ru":"Мистический заряд","en":"Eldritch Blast","lvl":0,"school":"воплощение","cls":["warlock"],"time":"1 действие","range":"120 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"урон 1d10 (силовым уроном); атака заклинанием","full":"К существу, находящемуся в пределах дистанции, устремляется луч потрескивающей энергии.\n\nСовершите дальнобойную атаку заклинанием по цели. При попадании цель получает 1к10 урона силовым полем.\n\nЗаклинание создаёт ещё один луч, когда вы достигаете больших уровней: два луча на 5 уровне, три луча на 11 уровне четыре луча на 17 уровне.\n\nВы можете направить лучи в одну цель или в разных. Для каждого луча совершите свой бросок атаки.","translationSource":"5e14.ttg.club"},{"id":"fire_bolt","ru":"Огненный снаряд","en":"Fire Bolt","lvl":0,"school":"воплощение","cls":["sorcerer","wizard"],"time":"1 действие","range":"120 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"урон 1d10 (огнём); атака заклинанием; на высоких уровнях: усиливается (1d10)","full":"Вы кидаете сгусток огня в существо или предмет в пределах дистанции.\n\nСовершите по цели дальнобойную атаку заклинанием. При попадании цель получает 1к10 урона огнём. Горючие предметы, по которым попало это заклинание, воспламеняются, если их никто не несёт и не носит.\n\nУрон этого заклинания увеличивается на 1к10, когда вы достигаете 5 уровня (2к10), 11 уровня (3к10) и 17 уровня (4к10).","translationSource":"5e14.ttg.club"},{"id":"dancing_lights","ru":"Пляшущие огоньки","en":"Dancing Lights","lvl":0,"school":"воплощение","cls":["bard","sorcerer","wizard"],"time":"1 действие","range":"120 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"","full":"Вы создаёте до четырёх огоньков размером с факел в пределах дистанции, делая их похожими на факелы, фонари или светящиеся сферы, парящие в воздухе. Вы можете также объединить четыре огонька в одну светящуюся человекоподобную фигуру Среднего размера. Какую бы форму вы не выбрали, каждый огонёк излучает тусклый свет в радиусе 10 футов.\n\nВы можете бонусным действием в свой ход переместить огоньки на 60 футов в новое место в пределах дистанции. Каждый огонёк должен находиться в пределах 20 футов от другого огонька, созданного этим заклинанием, и огонёк тухнет, если оказывается за пределами дистанции заклинания.","translationSource":"5e14.ttg.club"},{"id":"mending","ru":"Починка","en":"Mending","lvl":0,"school":"преобразование","cls":["cleric","bard","druid","sorcerer","wizard"],"time":"1 минута","range":"Касание","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"","full":"Это заклинание чинит одно повреждение или разрыв на предмете, которого касаетесь, например, разорванное звено цепи, две половинки сломанного ключа, порванный плащ или протекающий бурдюк.\n\nЕсли повреждение или разрыв не больше 1 фута в длину, вы чините его, не оставляя следов. Это заклинание может физически починить магический предмет или конструкта, но не может восстановить магию в таких предметах.","translationSource":"5e14.ttg.club"},{"id":"light","ru":"Свет","en":"Light","lvl":0,"school":"воплощение","cls":["bard","cleric","sorcerer","wizard"],"time":"1 действие","range":"Касание","comp":"В, М","dur":"1 час","ritual":false,"desc":"спасбросок Ловкости","full":"Вы касаетесь одного предмета, длина которого ни по одному из измерений не превышает 10 футов.\n\nПока заклинание активно, предмет испускает яркий свет в радиусе 20 футов и тусклый свет в пределах ещё 20 футов. Свет может быть любого выбранного вами цвета. Полное покрытие предмета чем-то непрозрачным блокирует свет.\n\nЗаклинание оканчивается, если вы наложите его ещё раз или окончите Действием. Если вы нацелились на предмет, несомый или носимый враждебным существом, это существо должно преуспеть в спасброске Ловкости, чтобы увернуться от заклинания.","translationSource":"5e14.ttg.club"},{"id":"sacred_flame","ru":"Священное пламя","en":"Sacred Flame","lvl":0,"school":"воплощение","cls":["cleric"],"time":"1 действие","range":"60 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"урон 1d8 (излучением); спасбросок Ловкости; на высоких уровнях: усиливается (1d8)","full":"Похожее на огонь сияние нисходит на существо, которое вы видите в пределах дистанции. Цель должна преуспеть в спасброске Ловкости, иначе она получает 1к8 урона излучением. Для этого спасброска цель не получает преимуществ от укрытия.\n\nУрон этого заклинания увеличивается на 1к8, когда вы достигаете 5 уровня (2к8), 11 уровня (3к8) и 17 уровня (4к8).","translationSource":"5e14.ttg.club"},{"id":"message","ru":"Сообщение","en":"Message","lvl":0,"school":"преобразование","cls":["bard","sorcerer","wizard"],"time":"1 действие","range":"120 футов","comp":"В, С, М","dur":"1 раунд","ritual":false,"desc":"","full":"Вы указываете пальцем на существо, находящееся в пределах дистанции, и шепчете послание. Цель (и только цель) слышит его, и может ответить шёпотом, который услышите только вы. Вы можете использовать это заклинание сквозь твёрдые препятствия, если вы знакомы с целью и знаете, что она находится за барьером.\n\nМагическая тишина, 1 фут камня, 1 дюйм обычного металла, тонкий лист свинца или 3 фута дерева блокируют заклинание. Заклинание не обязано идти по прямой линии, и может огибать углы и проходить через отверстия.","translationSource":"5e14.ttg.club"},{"id":"resistance","ru":"Сопротивление","en":"Resistance","lvl":0,"school":"ограждение","cls":["cleric","druid"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"","full":"Вы касаетесь одного согласного существа.\n\nПока заклинание активно, цель может один раз бросить к4 и добавить выпавшее число к одному спасброску на свой выбор. Кость можно кидать до или после спасброска. После этого заклинание оканчивается.","translationSource":"5e14.ttg.club"},{"id":"produce_flame","ru":"Сотворение пламени","en":"Produce Flame","lvl":0,"school":"вызов","cls":["druid"],"time":"1 действие","range":"На себя","comp":"В, С","dur":"10 минут","ritual":false,"desc":"урон 1d8 (огнём); атака заклинанием; на высоких уровнях: усиливается (1d8)","full":"В вашей ладони появляется мерцающее пламя. Оно остаётся там, пока заклинание активно, и не вредит ни вам, ни вашему снаряжению. Огонь испускает яркий свет в радиусе 10 футов и тусклый свет в пределах ещё 10 футов.\n\nЗаклинание оканчивается, если вы оканчиваете его Действием или накладываете ещё раз.\n\nВы можете атаковать этим пламенем, но это тоже оканчивает заклинание. Когда вы накладываете это заклинание, или другим действием в одном из последующих ходов вы можете метнуть пламя в существо, находящееся в пределах 30 футов от вас.\n\nСовершите дальнобойную атаку заклинанием. При попадании цель получает 1к8 урона огнём.\n\nУрон этого заклинания увеличивается на 1к8, когда вы достигаете 5 уровня (2к8), 11 уровня (3к8) и 17 уровня (4к8).","translationSource":"5e14.ttg.club"},{"id":"guidance","ru":"Указание","en":"Guidance","lvl":0,"school":"прорицание","cls":["cleric","druid"],"time":"1 действие","range":"Касание","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"","full":"Вы касаетесь одного согласного существа.\n\nОдин раз, пока заклинание активно, цель может бросить к4 и добавить выпавшее число к одной проверке характеристики на свой выбор.\n\nЭту кость можно бросить до или после совершения проверки. После этого заклинание оканчивается.","translationSource":"5e14.ttg.club"},{"id":"spare_the_dying","ru":"Уход за умирающим","en":"Spare the Dying","lvl":0,"school":"некромантия","cls":["cleric"],"time":"1 действие","range":"Касание","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы касаетесь живого существа, у которого 0 хитов. Оно становится стабилизированным.\n\nЭто заклинание не оказывает никакого эффекта на нежить и конструктов.","translationSource":"5e14.ttg.club"},{"id":"prestidigitation","ru":"Фокусы","en":"Prestidigitation","lvl":0,"school":"преобразование","cls":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"10 футов","comp":"В, С","dur":"1 час","ritual":false,"desc":"","full":"Это заклинание — небольшой магический трюк, на котором практикуются начинающие заклинатели. Вы создаёте один из следующих магических эффектов в пределах дистанции:\n\nВы создаёте мгновенный безвредный сенсорный эффект, такой как сноп искр, порыв ветра, тихую мелодию, или необычный запах.\nВы мгновенно зажигаете или тушите свечу, факел или небольшой костёр.\nВы мгновенно чистите или мараете предмет, размерами не превышающий 1 кубического фута.\nВы остужаете, нагреваете или придаёте запах и вкус 1 кубическому футу неживой материи на 1 час.\nВы создаёте на поверхности или предмете маленькую цветную метку или символ, существующую 1 час.\nВы создаёте немагическую безделушку или иллюзорное изображение, помещающееся в вашу ладонь, и существующий до конца вашего следующего хода.\n\nЕсли вы накладываете это заклинание несколько раз, вы можете иметь не более трёх немгновенных эффектов одновременно, и можете Действием окончить один любой из этих эффектов.","translationSource":"5e14.ttg.club"},{"id":"thaumaturgy","ru":"Чудотворство","en":"Thaumaturgy","lvl":0,"school":"преобразование","cls":["cleric"],"time":"1 действие","range":"30 футов","comp":"В","dur":"1 минута","ritual":false,"desc":"","full":"Вы создаёте небольшое чудо, знак сверхъестественной силы. Вы создаёте один из следующих магических эффектов в пределах дистанции:\n\nВаш голос в течение 1 минуты звучит в три раза громче.\nВы заставляете пламя в течение 1 минуты мерцать, светить ярче или тусклее, или изменять цвет.\nВы вызываете безвредную дрожь в полу в течение 1 минуты.\nВы создаёте мгновенный звук, исходящий из выбранной вами точки в пределах дистанции, такой как раскат грома, крик ворона или зловещий шёпот.\nВы мгновенно заставляете незапертое окно или дверь распахнуться или захлопнуться.\nВы на 1 минуту изменяете внешний вид своих глаз.\n\nЕсли вы накладываете это заклинание несколько раз, у вас может быть до трёх активных эффектов с длительностью в 1 минуту, и вы можете оканчивать такие эффекты действием.","translationSource":"5e14.ttg.club"},{"id":"shocking_grasp","ru":"Электрошок","en":"Shocking Grasp","lvl":0,"school":"воплощение","cls":["sorcerer","wizard"],"time":"1 действие","range":"Касание","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"урон 1d8 (электричеством); атака заклинанием; на высоких уровнях: усиливается (1d8)","full":"Молния спрыгивает с вашей руки и ударяет существо, которого вы пытались коснуться.\n\nСовершите по цели рукопашную атаку заклинанием. Вы совершаете бросок атаки с преимуществом, если цель носит доспех из металла. При попадании цель получает 1к8 урона электричеством, и до начала своего следующего хода не может совершать реакции.\n\nУрон заклинания увеличивается на 1к8, когда вы достигаете 5 уровня (2к8), 11 уровня (3к8) и 17 уровня (4к8).","translationSource":"5e14.ttg.club"},{"id":"poison_spray","ru":"Ядовитые брызги","en":"Poison Spray","lvl":0,"school":"вызов","cls":["druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"10 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"урон 1d12 (ядом); спасбросок Телосложения; на высоких уровнях: усиливается (1d12)","full":"Вы простираете руку к существу, видимому в пределах дистанции, и выпускаете из ладони клубы токсичного газа. Это существо должно преуспеть в спасброске Телосложения, иначе оно получит 1к12 урона ядом.\n\nУрон этого заклинания увеличивается на 1к12, когда вы достигаете 5 уровня (2к12), 11 уровня (3к12) и 17 уровня (4к12).","translationSource":"5e14.ttg.club"},{"id":"hellish_rebuke","ru":"Адское возмездие","en":"Hellish Rebuke","lvl":1,"school":"воплощение","cls":["paladin","warlock"],"time":"1 реакция","range":"60 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"урон 2d10 (огнём); спасбросок Ловкости; на высоких уровнях: усиливается (1d10)","full":"Вы указываете пальцем, и существо, причинившее вам урон, мгновенно окружается пламенем. Существо должно совершить спасбросок Ловкости. Оно получает 2к10 урона огнём при провале, или половину этого урона при успехе.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, урон увеличивается на 1к10 за каждый уровень ячейки выше первого.","translationSource":"5e14.ttg.club"},{"id":"silent_image","ru":"Безмолвный образ","en":"Silent Image","lvl":1,"school":"иллюзия","cls":["bard","sorcerer","wizard"],"time":"1 действие","range":"60 футов","comp":"В, С, М","dur":"Концентрация, до 10 минут","ritual":false,"desc":"","full":"Вы создаёте образ предмета, существа или другого видимого явления, помещающийся в объёме в куб с длиной ребра 15 футов. Образ появляется в точке, которую вы видите в пределах дистанции, и существует, пока активно заклинание.\n\nЭто исключительно зрительная иллюзия, не сопровождаемая звуками, запахами и прочими сенсорными эффектами.\n\nВы можете Действием заставить образ переместиться в любое место в пределах дистанции. Пока образ меняет местоположение, вы можете изменять его внешность, чтобы перемещение выглядело естественным.\n\nНапример, если вы создаёте образ существа и перемещаете его, вы можете изменить образ, чтобы казалось, что оно идёт. Физическое взаимодействие с образом даёт понять, что это иллюзия, потому что сквозь него всё проходит. Существа, исследующие образ действием, могут определить, что это иллюзия, совершив успешную проверку Интеллекта (Анализ) против Сл ваших заклинаний.\n\nЕсли существо распознаёт иллюзию, оно может видеть сквозь неё.","translationSource":"5e14.ttg.club"},{"id":"bless","ru":"Благословение","en":"Bless","lvl":1,"school":"очарование","cls":["cleric","paladin"],"time":"1 действие","range":"30 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вы благословляете до трёх существ на свой выбор в пределах дистанции.\n\nКаждый раз, когда до окончания заклинания цель совершает бросок атаки или спасбросок, она может бросить к4 и добавить выпавшее число к результату.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше первого.","translationSource":"5e14.ttg.club"},{"id":"divine_favor","ru":"Божественное благоволение","en":"Divine Favor","lvl":1,"school":"воплощение","cls":["cleric","paladin"],"time":"1 бонусное действие","range":"На себя","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"урон 1d4 (излучением)","full":"Ваша молитва наполняет вас божественной энергией.\n\nПока заклинание активно, ваши атаки оружием причиняют при попадании дополнительно 1к4 урона излучением.","translationSource":"5e14.ttg.club"},{"id":"thunderwave","ru":"Волна грома","en":"Thunderwave","lvl":1,"school":"воплощение","cls":["bard","cleric","druid","sorcerer","wizard"],"time":"1 действие","range":"На себя","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"урон 2d8 (звуком); спасбросок Телосложения; на высоких уровнях: усиливается (1d8)","full":"От вас исходит волна громовой силы.\n\nВсе существа в кубе с длиной ребра 15 футов, исходящего от вас, должны совершить спасбросок Телосложения. При провале существо получает 2к8 урона звуком и толкается на 10 футов от вас. При успехе существо получает половину урона и не толкается.\n\nКроме того, незакреплённые предметы, оказавшиеся полностью в области эффекта, автоматически толкаются на 10 футов от вас эффектом заклинания, и заклинание издаёт громовой рокот, слышимый на расстоянии 300 футов.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, урон увеличивается на 1к8 за каждый уровень ячейки выше первого.","translationSource":"5e14.ttg.club"},{"id":"magic_missile","ru":"Волшебная стрела","en":"Magic Missile","lvl":1,"school":"воплощение","cls":["sorcerer","wizard"],"time":"1 действие","range":"120 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"урон 1d4 + 1 (силовым уроном); на высоких уровнях: усиливается","full":"Вы создаёте три светящихся дротика из магической силы. Каждый дротик попадает в существо на ваш выбор, видимое в пределах дистанции.\n\nДротик причиняет 1к4 + 1 урона силовым полем своей цели.\n\nВсе дротики атакуют одновременно, и вы можете направить их как в одно существо, так и в разных.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, заклинание создаёт по одному дополнительному дротику за каждый уровень ячейки выше первого.","translationSource":"5e14.ttg.club"},{"id":"heroism","ru":"Героизм","en":"Heroism","lvl":1,"school":"очарование","cls":["bard","paladin"],"time":"1 действие","range":"Касание","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"","full":"Согласное существо, которого вы касаетесь, наполняется храбростью.\n\nПока заклинание активно, существо получает иммунитет к состоянию испуга, и в начале каждого своего хода получает временные хиты, равные модификатору вашей базовой характеристики.\n\nКогда это заклинание оканчивается, цель теряет все временные хиты, оставшиеся от этого заклинания.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше первого.","translationSource":"5e14.ttg.club"},{"id":"mage_armor","ru":"Доспехи мага","en":"Mage Armor","lvl":1,"school":"ограждение","cls":["sorcerer","wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"8 часов","ritual":false,"desc":"","full":"Вы касаетесь согласного существа, не носящего доспех, и на время действия заклинания его окутывает защитное магическое поле.\n\nБазовый КД существа становится равен 13 + его модификатор Ловкости.\n\nЗаклинание оканчивается, если цель надевает доспех или вы оканчиваете его Действием.","translationSource":"5e14.ttg.club"},{"id":"animal_friendship","ru":"Дружба с животными","en":"Animal Friendship","lvl":1,"school":"очарование","cls":["bard","druid","ranger"],"time":"1 действие","range":"30 футов","comp":"В, С, М","dur":"24 часа","ritual":false,"desc":"спасбросок Мудрости; на высоких уровнях: усиливается","full":"Это заклинание позволяет убедить зверя, что вы не намерены причинять ему вред. Выберите зверя, которого вы видите в пределах дистанции. Он должен видеть и слышать вас.\n\nЕсли у зверя Интеллект не меньше 4, заклинание проваливается. В противном случае зверь должен преуспеть в спасброске Мудрости, иначе он станет очарованным на время действия заклинания.\n\nЕсли вы или один из ваших спутников причинит цели вред, заклинание окончится.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, вы можете воздействовать на одного дополнительного зверя за каждый уровень ячейки выше первого.","translationSource":"5e14.ttg.club"},{"id":"tashas_hideous_laughter","ru":"Жуткий смех Таши","en":"Tasha's Hideous Laughter","lvl":1,"school":"очарование","cls":["bard","warlock","wizard"],"time":"1 действие","range":"30 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Мудрости","full":"Существо на ваш выбор, которое вы видите в пределах дистанции, начинает воспринимать всё как невероятно смешное и корчится от смеха, если заклинание на него действует.\n\nЦель должна преуспеть в спасброске Мудрости, иначе она падает ничком, становится недееспособной и не может встать в течение действия заклинания. Заклинание не действует на существ со значением Интеллекта 4 или ниже.\n\nВ конце каждого своего хода и каждый раз, когда цель получает урон, она может повторить спасбросок Мудрости. Цель совершает этот спасбросок с преимуществом, если он вызван получением урона. При успехе заклинание оканчивается.","translationSource":"5e14.ttg.club"},{"id":"protection_from_evil_and_good","ru":"Защита от добра и зла","en":"Protection from Evil and Good","lvl":1,"school":"ограждение","cls":["cleric","paladin","warlock","wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"Концентрация, до 10 минут","ritual":false,"desc":"","full":"Пока заклинание активно, одно согласное существо, которого вы коснулись, защищено от существ следующих видов: аберрации, исчадия, небожители, нежить, феи и элементали.\n\nЗащита предоставляет несколько преимуществ. Данные существа совершают с помехой броски атаки по цели. Цель также не может быть очарована, испугана и одержима ими. Если цель уже очарована, испугана или одержима ими, цель совершает последующие спасброски от таких эффектов с преимуществом.","translationSource":"5e14.ttg.club"},{"id":"healing_word","ru":"Лечащее слово","en":"Healing Word","lvl":1,"school":"воплощение","cls":["bard","cleric","druid"],"time":"1 бонусное действие","range":"60 футов","comp":"В","dur":"Мгновенная","ritual":false,"desc":"на высоких уровнях: усиливается (1d4)","full":"Существо на ваш выбор, видимое в пределах дистанции, восстанавливает количество хитов, равное 1к4 + ваш модификатор базовой характеристики.\n\nЭто заклинание не оказывает никакого эффекта на нежить и конструктов.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, количество восстанавливаемых хитов увеличивается на 1к4 за каждый уровень ячейки выше первого.","translationSource":"5e14.ttg.club"},{"id":"cure_wounds","ru":"Лечение ран","en":"Cure Wounds","lvl":1,"school":"воплощение","cls":["bard","cleric","druid","paladin","ranger"],"time":"1 действие","range":"Касание","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"на высоких уровнях: усиливается (1d8)","full":"Существо, которого вы касаетесь, восстанавливает количество хитов, равное 1к8 + ваш модификатор базовой характеристики.\n\nЭто заклинание не оказывает никакого эффекта на нежить и конструктов.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, лечение увеличивается на 1к8 за каждый уровень ячейки выше первого.","translationSource":"5e14.ttg.club"},{"id":"disguise_self","ru":"Маскировка","en":"Disguise Self","lvl":1,"school":"иллюзия","cls":["bard","cleric","sorcerer","wizard"],"time":"1 действие","range":"На себя","comp":"В, С","dur":"1 час","ritual":false,"desc":"","full":"Вы заставляете себя — включая одежду, доспехи, оружие и прочее имущество — выглядеть иначе, пока заклинание не окончится, или пока вы не окончите его преждевременно, Действием.\n\nВы можете выглядеть на 1 фут (30 сантиметров) выше или ниже, а также стать худым, толстым или получить среднее телосложение.\n\nВы не можете менять основу тела, поэтому у новой формы должен быть такой же набор конечностей. Во всём остальном характер иллюзии определяете вы. Изменения, вызванные этим заклинанием, не выдерживают проверку физическим исследованием.\n\nНапример, если вы добавили к своему снаряжению шляпу, предметы будут проходить сквозь неё, и все, кто к ней прикоснутся, либо ничего не почувствуют, либо почувствуют вашу голову и волосы.\n\nЕсли вы становитесь худее, то рука того, кто к вам тянется, наткнётся на вас на полпути, ещё в воздухе.\n\nДля обнаружения того, что вы замаскированы, существо должно Действием обследовать вашу внешность и преуспеть в проверке Интеллекта (Анализ) против вашей Сл заклинаний.","translationSource":"5e14.ttg.club"},{"id":"hunters_mark","ru":"Метка охотника","en":"Hunter's Mark","lvl":1,"school":"прорицание","cls":["paladin","ranger"],"time":"1 бонусное действие","range":"90 футов","comp":"В","dur":"Концентрация, до 1 часа","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вы выбираете существо, видимое в пределах дистанции, и объявляете его своей добычей.\n\nПока заклинание активно, вы причиняете цели дополнительный урон 1к6 каждый раз, когда попадаете по ней атакой оружием, и вы совершаете с преимуществом проверки Мудрости (Внимательность) и Мудрость (Выживание), совершённые для её поиска.\n\nЕсли хиты цели опускаются до 0, пока заклинание активно, вы можете в свой следующий ход бонусным действием выбрать целью новое существо.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 3 или 4 уровня, вы можете поддерживать концентрацию 8 часов. Если вы используете ячейку заклинания 5 уровня или выше, вы можете поддерживать концентрацию 24 часа.","translationSource":"5e14.ttg.club"},{"id":"inflict_wounds","ru":"Нанесение ран","en":"Inflict Wounds","lvl":1,"school":"некромантия","cls":["cleric"],"time":"1 действие","range":"Касание","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"урон 3d10 (некротический); атака заклинанием; на высоких уровнях: усиливается (1d10)","full":"Совершите рукопашную атаку заклинанием по существу в пределах досягаемости. При попадании цель получает 3к10 урона некротической энергией.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, урон увеличивается на 1к10 за каждый уровень ячейки выше первого.","translationSource":"5e14.ttg.club"},{"id":"guiding_bolt","ru":"Направленный снаряд","en":"Guiding Bolt","lvl":1,"school":"воплощение","cls":["cleric"],"time":"1 действие","range":"120 футов","comp":"В, С","dur":"1 раунд","ritual":false,"desc":"урон 4d6 (излучением); атака заклинанием; на высоких уровнях: усиливается (1d6)","full":"Вспышка света устремляется к выбранному вами существу в пределах дистанции.\n\nСовершите дальнобойную атаку заклинанием по цели. При попадании цель получает 4к6 урона излучением, и следующий бросок атаки по цели, совершённый до конца вашего следующего хода, совершается с преимуществом, благодаря мистическому тусклому свету, остающемуся недолго на цели.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, урон увеличивается на 1к6 за каждый уровень ячейки выше первого.","translationSource":"5e14.ttg.club"},{"id":"illusory_script","ru":"Невидимое письмо","en":"Illusory Script","lvl":1,"school":"иллюзия","cls":["bard","warlock","wizard"],"time":"1 минута","range":"Касание","comp":"С, М","dur":"10 дней","ritual":true,"desc":"","full":"Вы пишете на пергаменте, бумаге или другом подходящем материале, и накрываете его иллюзией, существующей, пока активно заклинание. Для вас и всех существ, указанных вами при накладывании заклинания, письмена кажутся обычными, написанными вашей рукой, и передающими тот самый смысл, который вкладывали вы.\n\nДля всех остальных письмена кажутся написанными на неизвестном или магическом языке, который невозможно прочитать.\n\nВ качестве альтернативы вы можете заставить письмена поменять смысл, или сделать так, чтобы они выглядели написанными другой рукой или на другом языке, но язык при этом должен быть тем, который вы знаете.\n\nЕсли заклинание рассеять, исчезает и исходное письмо и иллюзия. Существо с истинным зрением может читать скрытое послание.","translationSource":"5e14.ttg.club"},{"id":"unseen_servant","ru":"Невидимый слуга","en":"Unseen Servant","lvl":1,"school":"вызов","cls":["bard","warlock","wizard"],"time":"1 действие","range":"60 футов","comp":"В, С, М","dur":"1 час","ritual":true,"desc":"","full":"Это заклинание создаёт невидимую, бессознательную и бесформенную силу Среднего размера1, выполняющую отдаваемые вами простые поручения.\n\nСлуга появляется в свободном пространстве на земле в пределах дистанции. У него КД 10, 1 хит, Сила 2, и он не может атаковать.\n\nЕсли его хиты опускаются до 0, заклинание оканчивается. Один раз в каждом своём ходу вы можете бонусным действием отдать команду слуге переместиться на 15 футов и совершить манипуляции с каким-нибудь предметом. Слуга может выполнять простые задачи, доступные человеку, такие как подношение предметов, чистка, починка и складывание одежды, разжигание костра, подача пищи и разливание вина.\n\nПолучив команду, слуга начинает её выполнять, стараясь изо всех сил, пока не выполнит, после чего начинает ждать вашу следующую команду.\n\nЕсли вы отдаёте слуге поручение, из-за которого тот окажется дальше чем в 60 футах от вас, заклинание оканчивается.","translationSource":"5e14.ttg.club"},{"id":"detect_poison_and_disease","ru":"Обнаружение болезней и яда","en":"Detect Poison and Disease","lvl":1,"school":"прорицание","cls":["cleric","druid","paladin","ranger"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"Концентрация, до 10 минут","ritual":true,"desc":"","full":"Пока заклинание активно, вы можете ощущать присутствие и местонахождение ядов, ядовитых существ и болезней в пределах 30 футов от себя. Вы также распознаёте вид яда, ядовитого существа или болезни.\n\nЗаклинание проницает большую часть барьеров, но блокируется 1 футом камня, 1 дюймом обычного металла, тонким листом свинца или 3 футами дерева или земли.","translationSource":"5e14.ttg.club"},{"id":"detect_evil_and_good","ru":"Обнаружение добра и зла","en":"Detect Evil and Good","lvl":1,"school":"прорицание","cls":["cleric","paladin"],"time":"1 действие","range":"На себя","comp":"В, С","dur":"Концентрация, до 10 минут","ritual":false,"desc":"","full":"Пока заклинание активно, вы знаете, есть ли в пределах 30 футов от вас аберрации, исчадия, небожители, нежить, феи или элементали, а также их местоположение.\n\nКроме того, вы знаете, есть ли в пределах 30 футов от вас место или предмет, который был магически освящён или осквернён.\n\nЗаклинание проницает большую часть барьеров, но блокируется 1 футом камня, 1 дюймом обычного металла, тонким листом свинца или 3 футами дерева или земли.","translationSource":"5e14.ttg.club"},{"id":"detect_magic","ru":"Обнаружение магии","en":"Detect Magic","lvl":1,"school":"прорицание","cls":["bard","cleric","druid","paladin","ranger","sorcerer","wizard"],"time":"1 действие","range":"На себя","comp":"В, С","dur":"Концентрация, до 10 минут","ritual":true,"desc":"","full":"Пока заклинание активно, вы чувствуете присутствие магии в пределах 30 футов. Если вы почувствовали за счёт этого заклинания присутствие магии, вы можете Действием увидеть слабую ауру вокруг видимого существа или предмета, несущего на себе магию, а также узнать школу этой магии, если она есть.\n\nЗаклинание проницает большую часть барьеров, но блокируется 1 футом камня, 1 дюймом обычного металла, тонким листом свинца или 3 футами дерева или земли.","translationSource":"5e14.ttg.club"},{"id":"burning_hands","ru":"Огненные ладони","en":"Burning Hands","lvl":1,"school":"воплощение","cls":["cleric","sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"урон 3d6 (огнём); спасбросок Ловкости; на высоких уровнях: усиливается (1d6)","full":"Соединив ладони и растопырив пальцы веером, вы испускаете из них тонкие языки пламени.\n\nВсе существа в пределах 15-футового конуса должны совершить спасбросок Ловкости. Существо получает 3к6 урона огнём в случае провала и половину этого урона в случае успеха. Пламя поджигает все горючие предметы, никем не несомые и не носимые.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, урон увеличивается на 1к6 за каждый уровень ячейки выше первого.","translationSource":"5e14.ttg.club"},{"id":"faerie_fire","ru":"Огонь фей","en":"Faerie Fire","lvl":1,"school":"воплощение","cls":["bard","cleric","druid","warlock"],"time":"1 действие","range":"60 футов","comp":"В","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Ловкости","full":"Все предметы в кубе с длиной ребра 20 футов в пределах дистанции подсвечиваются синим, зелёным или фиолетовым цветом (на ваш выбор).\n\nВсе существа в этой области тоже подсвечиваются, если проваливают спасбросок Ловкости. На время длительности заклинания подсвеченные предметы и существа испускают тусклый свет в радиусе 10 футов.\n\nВсе броски атаки по затронутым существам и предметам совершаются с преимуществом, если атакующий видит их, и эти существа и предметы не получают преимуществ от невидимости.","translationSource":"5e14.ttg.club"},{"id":"identify","ru":"Опознание","en":"Identify","lvl":1,"school":"прорицание","cls":["bard","cleric","wizard"],"time":"1 минута","range":"Касание","comp":"В, С, М","dur":"Мгновенная","ritual":true,"desc":"","full":"Вы выбираете один предмет, не переставая касаться его во время всего накладывания заклинания. Если это магический предмет, вы узнаёте его свойства, способ их использования, требуется ли для использования настройка на него, и сколько осталось зарядов, если они есть. Вы узнаёте, действуют ли в данный момент заклинания на этот предмет, и что это за заклинания. Если предмет был создан заклинанием, вы узнаёте, что это было за заклинание. Если вы вместо этого во время накладывания заклинания касаетесь существа, вы узнаёте, какие заклинания в данный момент действуют на него.","translationSource":"5e14.ttg.club"},{"id":"entangle","ru":"Опутывание","en":"Entangle","lvl":1,"school":"вызов","cls":["druid"],"time":"1 действие","range":"90 футов","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Силы","full":"Из точки в пределах дистанции на площади квадрата с длиной стороны в 20 футов вырастают цепкие травы и плети. Пока заклинание активно, эти растения превращают землю в труднопроходимую местность.\n\nСущества, находящиеся в этой области, когда вы накладываете заклинание, должны преуспеть в спасброске Силы, иначе они станут опутанными растениями до окончания действия заклинания.\n\nОпутанное растениями существо может Действием совершать проверки Силы против Сл ваших заклинаний. В случае успеха оно освобождается. Когда заклинание оканчивается, вызванные растения увядают.","translationSource":"5e14.ttg.club"},{"id":"charm_person","ru":"Очарование личности","en":"Charm Person","lvl":1,"school":"очарование","cls":["bard","cleric","druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"30 футов","comp":"В, С","dur":"1 час","ritual":false,"desc":"спасбросок Мудрости; на высоких уровнях: усиливается","full":"Вы пытаетесь очаровать гуманоида, которого видите в пределах дистанции. Он должен совершить спасбросок Мудрости, с преимуществом, если вы или ваши спутники сражаетесь с ним.\n\nЕсли он проваливает спасбросок, он очарован вами, пока заклинание активно или пока вы или ваши спутники не причините ему вред. Очарованное существо считает вас своим другом.\n\nКогда заклинание оканчивается, существо знает, что было очаровано вами.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше первого. Эти существа должны находиться в пределах 30 футов друг от друга, чтобы вы могли на них нацелиться.","translationSource":"5e14.ttg.club"},{"id":"purify_food_and_drink","ru":"Очищение пищи и питья","en":"Purify Food and Drink","lvl":1,"school":"преобразование","cls":["cleric","druid","paladin"],"time":"1 действие","range":"10 футов","comp":"В, С","dur":"Мгновенная","ritual":true,"desc":"","full":"Вся немагическая еда и питьё в пределах сферы с радиусом 5 футов с центром на точке, выбранной вами в пределах дистанции, очищается и избавляется от ядов и болезней.","translationSource":"5e14.ttg.club"},{"id":"feather_fall","ru":"Падение пёрышком","en":"Feather Fall","lvl":1,"school":"преобразование","cls":["bard","sorcerer","wizard"],"time":"1 реакция","range":"60 футов","comp":"В, М","dur":"1 минута","ritual":false,"desc":"","full":"Выберите до пяти падающих существ в пределах дистанции. До окончания действия заклинания их скорость падения уменьшается до 60 футов в раунд. Если такое существо приземлится до окончания заклинания, оно не получает урон от падения и может приземлиться на ноги, и тогда заклинание оканчивает действие на него.","translationSource":"5e14.ttg.club"},{"id":"find_familiar","ru":"Поиск фамильяра","en":"Find Familiar","lvl":1,"school":"вызов","cls":["wizard"],"time":"1 час","range":"10 футов","comp":"В, С, М","dur":"Мгновенная","ritual":true,"desc":"","full":"Вы получаете в услужение фамильяра — духа, принимающего облик выбранного вами животного: ворона [raven], кошки [cat], краба [crab], крысы [rat], летучей мыши [bat], лягушки (жабы) [frog], морского конька [sea horse], осьминога [octopus], паука [spider], рыбы (пиранья) [quipper], совы [owl], хорька/куницы/ласки [weasel], ядовитой змеи [poisonous snake], ястреба [hawk] или ящерицы [lizard].\n\nПоявившись в свободном пространстве в пределах дистанции, фамильяр приобретает характеристики выбранной формы, хотя он не зверь, а небожитель, фея или исчадие (на ваш выбор).\n\nВаш фамильяр действует независимо от вас, но всегда повинуется вашим командам. В сражении оно определяет свою инициативу и действует в свой ход. Фамильяр не может атаковать, но может совершать другие действия как обычно.\n\nКогда хиты фамильяра опускаются до 0, он исчезает, не оставляя физического тела. Он возвращается, когда вы используете это заклинание ещё раз.\n\nПока фамильяр находится в пределах 100 футов, вы можете общаться с ним телепатически. Кроме того, вы можете действием начать смотреть глазами фамильяра и слушать его ушами до начала своего следующего хода, получая преимущество от особых чувств, которыми может обладать фамильяр. В это время для своих собственных чувств вы слепы и глухи.\n\nВы можете Действием временно отпустить своего фамильяра. Тот исчезает в карманном измерении, где будет ждать, пока вы его не призовёте. Если фамильяр несет какие-то вещи, то они остаются на месте исчезновения, после его ухода в карманное измерение. Пока фамильяр временно отпущен, вы можете действием вернуть его в свободное пространство в пределах 30 футов от себя.\n\nВ качестве альтернативы, вы можете отпустить его насовсем.\n\nУ вас не может быть больше одного фамильяра одновременно. Если вы накладываете это заклинание, уже имея фамильяра, вы заставляете принять его новый облик. Выберите один из описанных выше обликов. Ваш фамильяр становится этим существом.\n\nЕсли вы накладываете заклинание с дистанцией «Касание», его может передать фамильяр, как если бы это он его накладывал.\n\nВаш фамильяр должен при этом находиться в пределах 100 футов от вас, и он использует свою Реакцию, когда вы накладываете его.\n\nЕсли заклинание требует броска атаки, вы используете свой модификатор атаки.","translationSource":"5e14.ttg.club"},{"id":"comprehend_languages","ru":"Понимание языков","en":"Comprehend Languages","lvl":1,"school":"прорицание","cls":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"1 час","ritual":true,"desc":"","full":"Пока заклинание активно, вы понимаете буквальный смысл всех услышанных речей на любых языках. Вы также понимаете письмена на любых языках, но вы должны касаться поверхности, на которой записаны слова. Требуется примерно 1 минута для чтения одной страницы текста. Это заклинание не расшифровывает тайные послания в текстах и символы, такие как магические знаки, не являющиеся частью текста.","translationSource":"5e14.ttg.club"},{"id":"bane","ru":"Порча","en":"Bane","lvl":1,"school":"очарование","cls":["bard","cleric","paladin"],"time":"1 действие","range":"30 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Харизмы; на высоких уровнях: усиливается","full":"До трёх существ в пределах дистанции, которых вы видите, должны совершить спасброски Харизмы. Пока заклинание активно, каждый раз, когда цель, провалившая этот спасбросок, совершает бросок атаки или спасбросок, она должна бросать к4 и вычитать выпавший результат из броска атаки или спасброска.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше первого.","translationSource":"5e14.ttg.club"},{"id":"expeditious_retreat","ru":"Поспешное отступление","en":"Expeditious Retreat","lvl":1,"school":"преобразование","cls":["sorcerer","warlock","wizard"],"time":"1 бонусное действие","range":"На себя","comp":"В, С","dur":"Концентрация, до 10 минут","ritual":false,"desc":"","full":"Это заклинание позволяет перемещаться с невероятной скоростью.\n\nКогда вы накладываете это заклинание, а также в последующие ходы, бонусным действием, пока активно заклинание, вы можете совершать действие Рывок.","translationSource":"5e14.ttg.club"},{"id":"command","ru":"Приказ","en":"Command","lvl":1,"school":"очарование","cls":["cleric","paladin","warlock"],"time":"1 действие","range":"60 футов","comp":"В","dur":"1 раунд","ritual":false,"desc":"спасбросок Мудрости; на высоких уровнях: усиливается","full":"Вы произносите команду из одного слова существу, которое видите в пределах дистанции. Цель должна преуспеть в спасброске Мудрости, иначе в свой следующий ход будет исполнять эту команду. Заклинание не оказывает эффект, если цель — нежить, если цель не понимает ваш язык, или если ваша команда ему напрямую вредит. Ниже описаны самые типичные команды и их эффекты.\n\nВы можете отдавать и другие команды. В этом случае поведение цели определяет Мастер. Если цель не может выполнить вашу команду, заклинание оканчивается.\n\nБрось. Цель роняет то, что держит, и оканчивает ход.\nПадай. Цель падает ничком и оканчивает ход.\nПодойди. Цель перемещается ближе к вам по кратчайшему и самому прямому маршруту, оканчивая ход, если оказывается в пределах 5 футов от вас.\nСтой. Цель не перемещается и не совершает никаких действий. Летающее существо продолжает лететь, при условии, что может это делать. Если оно должно лететь, чтобы не упасть, то пролетает минимально необходимое расстояние.\nУбегай. Цель тратит ход на то, что перемещается прочь от вас самым быстрым способом.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, вы можете воздействовать на одно дополнительное существо за каждый уровень ячейки выше первого. Существа должны находиться в пределах 30 футов друг от друга, чтобы стать целями.","translationSource":"5e14.ttg.club"},{"id":"jump","ru":"Прыжок","en":"Jump","lvl":1,"school":"преобразование","cls":["druid","ranger","sorcerer","wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"1 минута","ritual":false,"desc":"","full":"Вы касаетесь существа. Пока заклинание активно, расстояние прыжка этого существа увеличивается в три раза.","translationSource":"5e14.ttg.club"},{"id":"false_life","ru":"Псевдожизнь","en":"False Life","lvl":1,"school":"некромантия","cls":["sorcerer","wizard"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"1 час","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Укрепив себя некромантским подобием жизни, вы получаете 1к4 + 4 временных хита на время длительности заклинания.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, вы получаете 5 дополнительных временных хитов за каждый уровень ячейки выше первого.","translationSource":"5e14.ttg.club"},{"id":"speak_with_animals","ru":"Разговор с животными","en":"Speak with Animals","lvl":1,"school":"прорицание","cls":["bard","cleric","druid","paladin","ranger"],"time":"1 действие","range":"На себя","comp":"В, С","dur":"10 минут","ritual":true,"desc":"","full":"Вы получаете на время действия заклинания возможность понимать зверей и общаться с ними устно. Знание и сознание многих зверей ограничено их интеллектом, но они как минимум могут дать информацию о ближайших местах и чудовищах, включая тех, кого они видели за последний день. На усмотрение Мастера, вы можете попытаться убедить зверя оказать вам небольшую помощь.","translationSource":"5e14.ttg.club"},{"id":"color_spray","ru":"Сверкающие брызги","en":"Color Spray","lvl":1,"school":"иллюзия","cls":["sorcerer","wizard"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"1 раунд","ritual":false,"desc":"на высоких уровнях: усиливается (2d10)","full":"Из вашей руки вылетают яркие разноцветные лучи.\n\nБросьте 6к10 это количество хитов, которые используется для расчета количества существ попадающих под эффект заклинания.\n\nСущества в 15 футовом конусе, исходящем от вас, попадают под эффект в порядке увеличения текущих хитов (игнорируя тех, кто без сознания и не может видеть).\n\nНачиная с существа с наименьшим числом текущих хитов, все существа, попавшие под действие заклинания, становятся ослеплёнными до конца вашего следующего хода1. Вычитайте из остатка хиты уже ослеплённых существ и переходите к следующим. Хиты существа не должны превышать остаток, чтобы это существо попало под действие заклинания.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, бросайте дополнительно 2к10 за каждый уровень ячейки выше первого.","translationSource":"5e14.ttg.club"},{"id":"alarm","ru":"Сигнал тревоги","en":"Alarm","lvl":1,"school":"ограждение","cls":["ranger","wizard"],"time":"1 минута","range":"30 футов","comp":"В, С, М","dur":"8 часов","ritual":true,"desc":"","full":"Вы устанавливаете сигнализацию на случай вторжения. Выберите дверь, окно или область в пределах дистанции не больше куба с длиной ребра 20 футов. До окончания действия заклинания тревога уведомляет вас каждый раз, когда охраняемой области касается или входит в неё существо с размером не меньше Крошечного.\n\nПри накладывании заклинания вы можете указать существ, которые не будут вызывать срабатывание тревоги. Вы также выбираете, мысленной будет тревога или слышимой. Мысленная тревога предупреждает вас звоном в сознании, если вы находитесь в пределах 1 мили от охраняемой области. Этот звон пробуждает вас, если вы спите. Слышимая тревога издаёт звон колокольчика в течение 10 секунд в пределах 60 футов.","translationSource":"5e14.ttg.club"},{"id":"grease","ru":"Скольжение","en":"Grease","lvl":1,"school":"вызов","cls":["wizard"],"time":"1 действие","range":"60 футов","comp":"В, С, М","dur":"1 минута","ritual":false,"desc":"спасбросок Ловкости","full":"Скользкий жир покрывает пол в квадрате с длиной стороны 10 футов с центром на точке в пределах дистанции, делая эту местность труднопроходимой, пока заклинание активно.\n\nКогда жир появляется, все существа, стоящие в этой области, должны преуспеть в спасброске Ловкости, иначе они падают ничком.\n\nСущества, входящие в эту область или оканчивающие там ход, тоже должны преуспеть в спасброске Ловкости, чтобы не упасть.","translationSource":"5e14.ttg.club"},{"id":"longstrider","ru":"Скороход","en":"Longstrider","lvl":1,"school":"преобразование","cls":["bard","druid","ranger","wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"1 час","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вы касаетесь существа. Пока заклинание активно, скорость существа увеличивается на 10 футов.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше первого.","translationSource":"5e14.ttg.club"},{"id":"create_or_destroy_water","ru":"Сотворение или уничтожение воды","en":"Create or Destroy Water","lvl":1,"school":"преобразование","cls":["cleric","druid"],"time":"1 действие","range":"30 футов","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вы либо создаёте, либо уничтожаете воду.\n\nСотворение воды. Вы создаёте до 10 галлонов (40 литров) чистой воды в пределах дистанции в открытом контейнере. В качестве альтернативы, вода выпадает дождём в кубе с длиной ребра 30 футов в пределах дальности, туша открытое пламя.\n\nУничтожение воды. Вы уничтожаете до 10 галлонов (40 литров) воды в открытом контейнере в пределах дистанции. В качестве альтернативы, вы уничтожаете туман в кубе с длиной ребра 30 футов в пределах дистанции.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, вы создаёте или уничтожаете 10 дополнительных галлонов (40 литров) воды, и длина ребра куба увеличивается на 5 футов за каждый уровень ячейки выше первого.","translationSource":"5e14.ttg.club"},{"id":"tensers_floating_disk","ru":"Тензеров парящий диск","en":"Tenser's Floating Disk","lvl":1,"school":"вызов","cls":["wizard"],"time":"1 действие","range":"30 футов","comp":"В, С, М","dur":"1 час","ritual":true,"desc":"","full":"Это заклинание создаёт круглый горизонтальный диск из силового поля диаметром 3 фута и толщиной 1 дюйм (2,5 см.), парящий в 3 футах над полом в свободном пространстве на ваш выбор, видимом в пределах дистанции.\n\nДиск существует, пока заклинание активно, и может вынести на себе 500 фунтов. Если на него поместить больший вес, заклинание окончится, и всё, что было на диске, падает на пол. Диск неподвижен, пока вы находитесь в пределах 20 футов от него. Если вы переместитесь от него на расстояние, превышающее 20 футов, диск следует за вами, оставаясь в пределах 20 футов. Он может перелетать по неровной поверхности, перемещаться по лестницам, склонам и подобным препятствиям, но не может пересекать перепады по высоте в 10 футов и более.\n\nНапример, диск не сможет перелететь над 10-футовой ямой, и не сможет из неё выбраться, если будет создан на её дне. Если вы переместитесь более чем на 100 футов от диска (например, если он из-за препятствия не сможет последовать за вами), заклинание оканчивается.","translationSource":"5e14.ttg.club"},{"id":"fog_cloud","ru":"Туманное облако","en":"Fog Cloud","lvl":1,"school":"вызов","cls":["cleric","druid","ranger","sorcerer","wizard"],"time":"1 действие","range":"120 футов","comp":"В, С","dur":"Концентрация, до 1 часа","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вы создаёте сферу с радиусом 20 футов из тумана с центром на точке в пределах дистанции. Сфера обходит углы, и её пространство — сильно заслонённая местность. Она существует до окончания действия заклинания, или пока её не рассеет ветер (со скоростью как минимум 10 миль в час).\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, радиус тумана увеличивается на 20 футов за каждый уровень ячейки выше первого.","translationSource":"5e14.ttg.club"},{"id":"sanctuary","ru":"Убежище","en":"Sanctuary","lvl":1,"school":"ограждение","cls":["cleric","paladin"],"time":"1 бонусное действие","range":"30 футов","comp":"В, С, М","dur":"1 минута","ritual":false,"desc":"спасбросок Мудрости","full":"Вы защищаете одно существо в пределах дистанции от атаки.\n\nПока заклинание активно, все существа, нацеливающиеся на защищённое существо атаками или вредоносными заклинаниями, должны вначале совершить спасбросок Мудрости. При провале существо должно выбрать новую цель или потеряет атаку или заклинание.\n\nЭто заклинание не защищает от эффектов, действующих на площадь, таких как взрыв огненного шара. Если защищённое существо совершает атаку, накладывает заклинание, оказывающее действие на враждебное существо или наносит урон другому существу, это заклинание оканчивается","translationSource":"5e14.ttg.club"},{"id":"sleep","ru":"Усыпление","en":"Sleep","lvl":1,"school":"очарование","cls":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"90 футов","comp":"В, С, М","dur":"1 минута","ritual":false,"desc":"на высоких уровнях: усиливается (2d8)","full":"Это заклинание посылает существ в магический сон.\n\nБросьте 5к8 этот результат будет количеством хитов существ, на которых это заклинание может подействовать.\n\nСущества в пределах 20 футов от точки, выбранной вами в пределах дистанции, попадают под действие в порядке увеличения их текущих хитов (игнорируя тех, что находятся без сознания). Начиная с существа с наименьшим количеством текущих хитов все существа, попадающие под действие этого заклинания, теряют сознание до окончания действия заклинания, пока не получат урон, или пока кто-нибудь другой не разбудит их, потратив Действие на тряску или пощёчину. Вычитайте хиты каждого существа из общей суммы, после чего переходите к следующему существу с наименьшим числом хитов.\n\nДля того чтобы существо попало под действие заклинания, нужно чтобы количество её текущих хитов не превышало оставшуюся сумму. Нежить и существа, обладающие иммунитетом к очарованию, не попадают под действие этого заклинания.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, бросайте дополнительно 2к8 за каждый уровень яче
