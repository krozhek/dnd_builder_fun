го заклинания увеличивается на 1к6 при достижении определенных уровней: 5-го уровня (2к6), 11-го уровня (3к6) и 17-го уровня (4к6).","src":"Таша","translationSource":"5e14.ttg.club"},{"id":"tasha's_caustic_brew","ru":"Едкое варево Таши","en":"Tasha's Caustic Brew","lvl":1,"school":"воплощение","cls":["sorcerer","wizard"],"time":"1 действие","range":"На себя (30-футовая линия)","comp":"Вербальный, Соматический, Материальный (кусочек испорченной еды)","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"","full":"От вас исходит в выбранном направлении струя кислоты — линия длиной 30 футов и шириной 5 футов.\n\nКаждое существо в этой линии должно преуспеть в спасброске Ловкости. При провале существо покрывается кислотой на время действия заклинания, пока оно или другое существо не потратит своё Действие, чтобы очистить его или смыть кислоту.\n\nСущество, покрытое кислотой, получает 2к4 урона кислотой в начале каждого своего хода.\n\nНа более высоких уровнях: Когда вы произносите это заклинание, используя ячейку заклинания 2-го уровня или выше, урон увеличивается на 2к4 для каждого уровня ячейки выше 1-го.","src":"Таша","translationSource":"5e14.ttg.club"},{"id":"tasha's_mind_whip","ru":"Психическая плеть Таши","en":"Tasha's Mind Whip","lvl":2,"school":"очарование","cls":["sorcerer","wizard"],"time":"1 действие","range":"90 футов","comp":"Вербальный","dur":"1 раунд","ritual":false,"desc":"","full":"Вы ментально хлещете одно существо, которое видите в пределах дистанции заклинания. Цель должна совершить спасбросок Интеллекта. При провале цель получает 3к6 урона психической энергией и не может совершать реакции до конца своего следующего хода.\n\nБолее того, цель должна выбрать, что она будет делать в свой следующий ход: передвигаться, совершать действие или бонусное действие — цель может совершить лишь что-то одно.\n\nПри успехе цель получает половину урона и избегает других эффектов заклинания.\n\nНа более высоких уровнях: Когда вы накладываете это заклинание, используя ячейку заклинания 3-го уровня или выше, вы можете нацелить на одно дополнительное существо за каждый уровень ячейки выше 2-го, существа должны находиться в пределах 30 футов друг от друга.","src":"Таша","translationSource":"5e14.ttg.club"},{"id":"intellect_fortress","ru":"Крепость интеллекта","en":"Intellect Fortress","lvl":3,"school":"ограждение","cls":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"30 футов","comp":"Вербальный","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"На время действия вы или одно желающее существо, которого вы видите в пределах дистанции, имеете сопротивление к урону психической энергией, а также преимущество в спасбросках Интеллекта, Мудрости и Харизмы.\n\nНа более высоких уровнях: Когда вы накладываете это заклинание, используя ячейку заклинания 4-го уровня или выше, вы можете нацелить его на одно дополнительное существо за каждый уровень ячейки выше 3-го. Когда вы накладываете это заклинание, существа должны находиться в пределах 30 футов друг от друга.","src":"Таша","translationSource":"5e14.ttg.club"},{"id":"spirit_shroud","ru":"Покров духа","en":"Spirit Shroud","lvl":3,"school":"некромантия","cls":["cleric","paladin","warlock","wizard"],"time":"1 бонусное действие","range":"На себя","comp":"Вербальный, Соматический","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"","full":"Вы взываете к духам умерших, и они окружают вас на протяжении длительности заклинания. Духи неосязаемы и неуязвимы.\n\nДо окончания действия заклинания любая ваша атака наносит дополнительно 1к8 урона, если вы атакуете существо в пределах 10 футов от вас.\n\nВы выбираете вид урона в момент наложения этого заклинания из следующих вариантов: излучение, некротическая энергия или холод. Любое существо, получившее этот урон, не сможет восстанавливать хиты до начала вашего следующего хода.\n\nВ дополнение к этому, скорость каждого видимого вами существа по вашему выбору, начинающего ход в пределах 10 футов от вас, будет уменьшена на 10 футов до начала вашего следующего хода.\n\nНа более высоких уровнях: Когда вы произносите это заклинание, используя ячейку заклинания 4-го уровня или выше, урон увеличивается на 1к8 за каждые два уровня ячейки выше 3-го.","src":"Таша","translationSource":"5e14.ttg.club"},{"id":"summon_fey","ru":"Призыв духа феи","en":"Summon Fey","lvl":3,"school":"вызов","cls":["druid","ranger","warlock","wizard"],"time":"1 действие","range":"90 футов","comp":"Вербальный, Соматический, Материальный (позолоченный цветок стоимостью не менее 300 зм)","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"Вы вызываете дух феи. Он проявляется в незанятом пространстве, которое вы можете видеть в пределах досягаемости. Эта телесная форма использует блок характеристик духа феи [fey spirit].\n\nКогда вы накладываете заклинание, выберите настроение: сердитое, довольное, или лукавое.\n\nСущество похоже на выбранное вами тип фей, отмеченное выбранным настроением, которое определяет одну из черт в его блоке характеристик. Существо исчезает, когда его хиты опускаются до 0 или когда заклинание заканчивается.\n\nСущество - союзник вам и вашим товарищам. В бою существо получает вашу инициативу, но его ход идет сразу после вашего. Он подчиняется вашим словесным командам (от вас не требуется никаких действий). Если вы не даете команд, фея выполняет действие Уклонения и использует свой ход, чтобы избежать опасности.\n\nНа более высоких уровнях: Когда вы накладываете  это заклинание с помощью ячейки заклинания 4-го уровня или выше, используйте более высокий уровень везде, где уровень заклинания появляется в блоке характеристик.","src":"Таша","translationSource":"5e14.ttg.club"},{"id":"summon_shadowspawn","ru":"Призыв духа порождения теней","en":"Summon Shadowspawn","lvl":3,"school":"вызов","cls":["warlock","wizard"],"time":"1 действие","range":"90 футов","comp":"Вербальный, Соматический, Материальный (слезы внутри драгоценного камня стоимостью не менее 300 зм)","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"Вы призываете призрачный дух. Он появляется в незанятом пространстве, которое вы можете видеть вокруг себя. Эта телесная форма использует блок характеристик дух тени [shadow spirit].\n\nКогда вы читаете заклинание, выберите эмоцию: Ярость, Отчаяние, Страх.\n\nСущество напоминает двуногое деформированное тело, отмеченного выбранной эмоцией, которая определяет черты в его блоке характеристик. Существо исчезает, когда его хиты упадут до 0 или когда заклинание закончится.\n\nСущество - союзник вам и вашим товарищам. В бою существо имеет такую же инициативу как у вас, но ходит сразу после вас. Он подчиняется вашим словесным командам (от вас не требуется никаких действий). Если вы не даете команд духу, то он выполняет действие Уклонения и использует свой ход, чтобы избежать опасности.\n\nНа более высоких уровнях: Когда вы накладываете заклинание с помощью ячейки заклинания 4-го уровня или выше, используйте более высокий уровень везде, где уровень заклинания появляется в блоке характеристик.","src":"Таша","translationSource":"5e14.ttg.club"},{"id":"summon_undead","ru":"Призыв духа нежити","en":"Summon Undead","lvl":3,"school":"некромантия","cls":["warlock","wizard"],"time":"1 действие","range":"90 футов","comp":"Вербальный, Соматический, Материальный (позолоченный череп стоимостью не менее 300 зм)","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"Вы вызываете дух нежити. Он появляется в незанятом пространстве, которое вы можете видеть в пределах досягаемости. Эта телесная форма использует блок характеристик дух нежити [undead spirit].\n\nКогда вы накладываете заклинание, выберите форму духа: призрачный, гнилой или скелетный.\n\nДух принимает форму выбранной нежити и имеет соответствующие признаки, описанные в блоке характеристик. Существо исчезает, когда его хиты опускаются до 0 или когда заклинание заканчивается.\n\nСущество - союзник вам и вашим товарищам. В бою существо разделяет вашу инициативу и его ход идет сразу после вашего. Он подчиняется вашим словесным командам (от вас не требуется никаких действий). Если вы их не даете, он выполняет действие Уклонение и использует свой ход, чтобы избежать опасности.\n\nНа более высоких уровнях: Когда вы накладываете это заклинание, используя ячейку заклинания 4-го уровня или выше, используйте более высокий уровень везде, где уровень заклинания появляется в блоке характеристик.","src":"Таша","translationSource":"5e14.ttg.club"},{"id":"summon_aberration","ru":"Призыв духа аберрации","en":"Summon Aberration","lvl":4,"school":"вызов","cls":["warlock","wizard"],"time":"1 действие","range":"90 футов","comp":"Вербальный, Соматический, Материальный (маринованное щупальце и глазное яблоко в инкрустированном платиной флаконе стоимостью не менее 400 зм)","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"Вы вызываете дух аберрации [aberrant spirit]. Он проявляется в незанятом пространстве, которое вы можете видеть. Эта телесная форма использует блок характеристик дух аберрации.\n\nКогда вы произносите заклинание, выберите бехолдер, слаад или звездное порождение. Существо похожее на аберрацию такого рода, которая определяет определенные черты в его блоке характеристик. Существо исчезает, когда его хиты опускаются до 0 или когда заклинание заканчивается.\n\nСущество - союзник вам и вашим товарищам. В бою существо имеет ту же инициативу, что у вас, но его ход идет сразу после вашего. Он подчиняется вашим словесным командам (от вас не требуется никаких действий). Если вы не даете команды, существо выполняет действие Уклонение и использует свой ход, чтобы избежать опасности.\n\nНа более высоких уровнях: Когда вы накладываете это заклинание, используя ячейку заклинания 5-го уровня или выше, используйте более высокий уровень везде, где уровень заклинания появляется в блоке состояния.","src":"Таша","translationSource":"5e14.ttg.club"},{"id":"summon_construct","ru":"Призыв духа конструкта","en":"Summon Construct","lvl":4,"school":"вызов","cls":["wizard"],"time":"1 действие","range":"90 футов","comp":"Вербальный, Соматический, Материальный (богато украшенный каменный и металлический сундук стоимостью не менее 400 зм)","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"Вы вызываете дух конструкта. Он проявляется в незанятом пространстве, которое вы можете видеть в пределах досягаемости. Эта телесная форма использует блок характеристик дух конструкта [construct spirit].\n\nКогда вы произносите это заклинание, выберите материал: глина, металл или камень.\n\nСущество напоминает голема или модрона (на ваш выбор), сделанного из выбранного материала, который определяет определенные черты в его блоке характеристик. Существо исчезает, когда его хиты опускаются до 0 или когда заклинание заканчивается.\n\nСущество - союзник вам и вашим товарищам. В бою существо принимает вашу инициативу, но его ход идет сразу после вашего. Он подчиняется вашим словесным командам (от вас не требуется никаких действий). Если вы не даете команды, существо выполняет действие Уклонения и использует свой ход, чтобы избежать опасности.\n\nНа более высоких уровнях: Когда вы накладываете это заклинание с помощью ячейки заклинания 4-го уровня или выше, используйте более высокий уровень везде, где уровень заклинания появляется в блоке характеристик.","src":"Таша","translationSource":"5e14.ttg.club"},{"id":"summon_elemental","ru":"Призыв духа элементалей","en":"Summon Elemental","lvl":4,"school":"вызов","cls":["druid","ranger","wizard"],"time":"1 действие","range":"90 футов","comp":"Вербальный, Соматический, Материальный (воздух, галька, зола и вода в инкрустированном золотом флаконе стоимостью не менее 400 зм)","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"Вы вызываете элементальный дух. Он проявляется в незанятом пространстве, которое вы можете видеть в пределах досягаемости. Эта телесная форма использует блок характеристик дух стихий [elemental spirit].\n\nКогда вы произносите заклинание, выберите элемент: Воздух, Земля, Огонь или Вода.\n\nСущество напоминает двуногую форму, заключенную в выбранном элементе, который определяет определенные черты в его блоке характеристик. Существо исчезает, когда его хиты опускаются до 0 или когда заклинание заканчивается.\n\nСущество - союзник вам и вашим товарищам. В бою существо принимает вашу инициативу, но его ход идет сразу после вашего. Он подчиняется вашим словесным командам (от вас не требуется никаких действий). Если вы не даете команд, он выполняет действие Уклонение и использует свой ход, чтобы избежать опасности.\n\nНа более высоких уровнях: Когда вы накладываете это заклинание, используя ячейку заклинания 5-го уровня или выше, используйте более высокий уровень везде, где уровень заклинания появляется в блоке характеристик.","src":"Таша","translationSource":"5e14.ttg.club"},{"id":"summon_celestial","ru":"Призыв духа небожителей","en":"Summon Celestial","lvl":5,"school":"вызов","cls":["cleric","paladin"],"time":"1 действие","range":"90 футов","comp":"Вербальный, Соматический, Материальный (золотой реликварий стоимостью не менее 500 зм)","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"Вы вызываете дух небожителя. Он проявляется в ангельской форме в незанятом пространстве, которое вы можете видеть в пределах досягаемости. Эта телесная форма использует блок характеристик духа небожителя [celestial spirit].\n\nКогда вы произносите заклинание, выберите Мстителя или Защитника.\n\nВаш выбор определяет атаку существа в его блоке характеристик. Существо исчезает, когда его хиты опускаются до 0 или когда заклинание заканчивается.\n\nСущество - союзник вам и вашим товарищам. В бою существо разделяет ваш счетчик инициативы, но его ход идет сразу после вашего. Он подчиняется вашим словесным командам (от вас не требуется никаких действий). Если вы не выпускаете ни одного, он выполняет действие Уклонение и использует свой ход, чтобы избежать опасности.\n\nНа более высоких уровнях: Когда вы накладываете это заклинание, используя ячейку заклинания 6-го уровня или выше, используйте более высокий уровень всякий раз, когда уровень заклинания появляется в блоке характеристик.","src":"Таша","translationSource":"5e14.ttg.club"},{"id":"summon_fiend","ru":"Призыв духа исчадия","en":"Summon Fiend","lvl":6,"school":"вызов","cls":["warlock","wizard"],"time":"1 действие","range":"90 футов","comp":"Вербальный, Соматический, Материальный (кровь гуманоида внутри рубинового флакона стоимостью не менее 600 зм)","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"Вы вызываете демонический дух. Он проявляется в незанятом пространстве, которое вы можете видеть в пределах досягаемости.\n\nЭта телесная форма использует блок характеристик дух исчадия [fiendish spirit].\n\nКогда вы произносите заклинание, выберите: демона, дьявола, юголота.\n\nСущество напоминает демона выбранного типа, что определяет определенные черты в его блоке характеристик. Существо исчезает, когда его хиты опускаются до 0 или когда заклинание заканчивается.\n\nСущество - союзник вам и вашим товарищам. В бою существо разделяет ваш счетчик инициативы, но его ход идет сразу после вашего. Он подчиняется вашим словесным командам (от вас не требуется никаких действий). Если вы не даете команды, дух исчадия выполняет действие Уклонения и использует свой ход, чтобы избежать опасности.\n\nНа более высоких уровнях: Когда вы накладываете это заклинание, используя ячейку заклинания 7-го уровня или выше, используйте более высокий уровень везде, где уровень заклинания появляется в блоке характеристик.","src":"Таша","translationSource":"5e14.ttg.club"},{"id":"tasha's_otherworldly_guise","ru":"Потусторонний облик Таши","en":"Tasha's Otherworldly Guise","lvl":6,"school":"преобразование","cls":["sorcerer","warlock","wizard"],"time":"1 бонусное действие","range":"На себя","comp":"Вербальный, Соматический, Материальный (объект с выгравированным символом Внешних планов, стоимостью не менее 500 зм.)","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"","full":"Произнося заклинание, вы обращаетесь к магии нижних или верхних планов (на ваш выбор), чтобы трансформировать себя. Вы получаете следующие преимущества, пока заклинание не закончится:\n\nВы получаете иммунитет к урону огнем и ядом (нижние планы) или излучению и некротическому урону (верхние планы).\nВы получаете иммунитет к состоянию отравленный (нижние планы) или очарованный (верхние планы).\nПризрачные крылья появляются на вашей спине, обеспечивая вам скорость полета 40 футов.\nУ вас есть бонус +2 к КД.\nВсе ваши атаки оружием являются магическими, и когда вы совершаете атаку оружием, вы можете использовать модификатор способности заклинания вместо Силы или Ловкости для бросков атаки и урона.\nВы можете атаковать дважды, а не один раз, когда выполняете действие Атаки в свой ход. Вы игнорируете это преимущество, если у вас уже есть такая способность, как Дополнительная атака, которая позволяет вам атаковать более одного раза, в свой ход.","src":"Таша","translationSource":"5e14.ttg.club"},{"id":"dream_of_the_blue_veil","ru":"Сон синей вуали","en":"Dream of the Blue Veil","lvl":7,"school":"вызов","cls":["bard","sorcerer","warlock","wizard"],"time":"10 минут","range":"20 футов","comp":"Вербальный, Соматический, Материальный (магический предмет или желающее существо из целевого мира)","dur":"6 часов","ritual":false,"desc":"","full":"Вы и до восьми согласных существ в пределах досягаемости теряете сознание на время действия заклинания и испытываете видения другого мира на Материальном плане, как, например, Орта, Торила, Кринна или Эберрона. Если заклинание поддерживается в течение своей полной длительности, то видения приводят к тому, что каждый из вас находит и отодвигает загадочный синий занавес.\n\nЗаклинание заканчивается тем, что вы ментально и физически переноситесь в мир, который был в видениях.\n\nЧтобы наложить это заклинание, у вас должен быть магический предмет, созданный в мире, в который вы хотите попасть, и вы должны знать о существовании этого мира, даже если вы не знаете его названия. Вы попадает в безопасное место в пределах 1 мили от того места, где используемый магический предмет был создан. Вы можете наложить заклинание без магического предмета, если одно из существ под действием этого заклинания родилось в том мире. В таком случае пункт назначения будет безопасным местом в пределах 1 мили от того места, где это существо родилось.\n\nЗаклинание заканчивается раньше времени для существа, получающего какой-либо урон, и это существо не переносится. Если заклинатель получает какой-либо урон, заклинание заканчивается для всех существ, и никто не будет перенесён.","src":"Таша","translationSource":"5e14.ttg.club"},{"id":"blade_of_disaster","ru":"Клинок разрушения","en":"Blade of Disaster","lvl":9,"school":"вызов","cls":["sorcerer","warlock","wizard"],"time":"1 бонусное действие","range":"60 футов","comp":"Вербальный, Соматический","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"","full":"Вы создаете пространственную трещину в форме клинка длиной около 3 футов в свободном пространстве, которое вы можете видеть в пределах дистанции заклинания. Клинок существует до окончания действия заклинания. Когда вы произносите это заклинание, вы можете совершить до двух заклинательных атак ближнего боя этим клинком, против существа, неудерживаемого предмета или постройки в пределах 5 футов от клинка.\n\nПри попадании цель получает 4к12 урона силовым полем. Эта атака считается критическим попаданием, при выпадении на к20 значений «18-20». При критическом попадании клинок дополнительно наносит 8к12 урона силовым полем (в общей сложности 12к12 урона силовым полем).\n\nБонусным действием в свой ход вы можете переместить клинок на расстояние до 30 футов в незанятое пространство, которое вы можете видеть, а затем снова совершить до двух заклинательных атак ближнего боя клинком.\n\nКлинок может без вреда перемещаться через любые барьеры, в том числе созданные заклинанием силовая стена [wall of force].","src":"Таша","translationSource":"5e14.ttg.club"},{"id":"armor_of_agathys","ru":"Доспех Агатиса","en":"Armor of Agathys","lvl":1,"school":"ограждение","cls":["warlock"],"time":"1 действие","range":"На себя","comp":"Вербальный, Соматический, Материальный (чашка воды)","dur":"1 час","ritual":false,"desc":"","full":"Вас окружает защитное магическое поле, проявляющееся в виде призрачной изморози, покрывшей вас и ваше снаряжение. Вы получаете 5 временных хитов на период действия заклинания.\n\nЕсли существо попадает по вам рукопашной атакой, пока у вас есть эти хиты, оно получает 5 урона холодом.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, и временные хиты и урон холодом увеличиваются на 5 за каждый уровень ячейки выше первого.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"arms_of_hadar","ru":"Руки Хадара","en":"Arms of Hadar","lvl":1,"school":"вызов","cls":["warlock"],"time":"1 действие","range":"На себя (10-футовый радиус)","comp":"Вербальный, Соматический","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы взываете к мощи Хадара, Тёмного Алкателя. Из вас вырываются щупальца из тёмной энергии, бьющие всех существ в пределах 10 футов.\n\nВсе существа в этой области должны совершить спасбросок Силы. В случае провала цель получает 2к6 урона некротической энергией и до следующего своего хода не может совершать реакции. В случае успеха существо получает половину урона, и других эффектов нет.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, урон увеличивается на 1к6 за каждый уровень ячейки выше первого.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"blinding_smite","ru":"Ослепляющая кара","en":"Blinding Smite","lvl":3,"school":"воплощение","cls":["paladin"],"time":"1 бонусное действие","range":"На себя","comp":"Вербальный","dur":"Концентрация, вплоть до 1 минуты","ritual":false,"desc":"","full":"Когда вы в следующий раз попадёте по существу рукопашной атакой оружием, пока заклинание активно, ваше оружие вспыхивает ярким светом, и атака причиняет цели дополнительно 3к8 урона излучением.\n\nКроме того, цель должна преуспеть в спасброске Телосложения, иначе она станет ослеплённой до окончания заклинания. Ослеплённое этим заклинанием существо совершает спасброски Телосложения в конце каждого своего хода. В случае успеха оно перестаёт быть ослеплённым.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"cloud_of_daggers","ru":"Облако кинжалов","en":"Cloud of Daggers","lvl":2,"school":"вызов","cls":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"60 футов","comp":"Вербальный, Соматический, Материальный (осколок стекла)","dur":"Концентрация, вплоть до 1 минуты","ritual":false,"desc":"","full":"Вы заполняете воздух крутящимися кинжалами в кубе с длиной ребра 5 футов, с центром на точке, выбранной вами в пределах дистанции. Существо получает 4к4 рубящего урона, когда впервые за ход входит в область заклинания или начинает там ход.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 3 уровня или выше, урон увеличивается на 2к4 за каждый уровень ячейки выше второго.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"crown_of_madness","ru":"Корона безумия","en":"Crown of Madness","lvl":2,"school":"очарование","cls":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"120 футов","comp":"Вербальный, Соматический","dur":"Концентрация, вплоть до 1 минуты","ritual":false,"desc":"","full":"Один гуманоид на ваш выбор, видимый вами в пределах дистанции должен преуспеть в спасброске Мудрости, иначе он станет очарованным вами на время действия заклинания.\n\nПока цель очарована таким способом, на её голове появляется изогнутая железная корона, а в глазах светится безумие. Очарованная цель должна в каждый свой ход перед перемещением совершать Действием рукопашную атаку по любому существу кроме себя, которое вы мысленно выбираете.\n\nЦель может действовать в свой ход как обычно, если вы не выбрали существо или в пределах его досягаемости нет других существ.\n\nВ последующие ходы вы должны Действием поддерживать контроль над целью, иначе заклинание оканчивается.\n\nКроме того, цель в конце каждого своего хода может совершать спасброски Мудрости. В случае успеха заклинание оканчивается.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"dissonant_whispers","ru":"Диссонирующий шёпот","en":"Dissonant Whispers","lvl":1,"school":"очарование","cls":["bard"],"time":"1 действие","range":"60 футов","comp":"Вербальный","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы шёпотом пропеваете нестройную мелодию, которую слышит только выбранное вами существо в пределах дистанции, и которая причиняет ему жуткую боль.\n\nЦель должна совершить спасбросок Мудрости. В случае провала она получает 3к6 урона психической энергией и должна немедленно реакцией переместиться прочь от вас на расстояние, равное своей скорости.\n\nСущество не будет входить в очевидно опасные места, такие как огонь или яма. При успешном спасброске цель получает половину урона и не должно отходить. Глухое существо автоматически преуспевает в спасброске.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, урон увеличивается на 1к6 за каждый уровень ячейки выше первого.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"hex","ru":"Сглаз","en":"Hex","lvl":1,"school":"очарование","cls":["warlock"],"time":"1 бонусное действие","range":"90 футов","comp":"Вербальный, Соматический, Материальный (окаменевший глаз тритона)","dur":"Концентрация, вплоть до 1 часа","ritual":false,"desc":"","full":"Вы проклинаете существо, которое видите в пределах дистанции.\n\nПока заклинание активно, вы наносите цели дополнительно 1к6 урон некротической энергией каждый раз, когда попадаете по ней атакой.\n\nКроме того, выберите одну характеристику, когда накладываете заклинание. Цель совершает с помехой проверки выбранной характеристики.\n\nЕсли хиты цели опускаются до 0, пока заклинание активно, вы можете в последующий свой ход бонусным действием проклясть новое существо.\n\nЗаклинание снятие проклятья [remove curse], наложенное на цель, оканчивает это заклинание преждевременно.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 3 или 4 уровня, вы можете поддерживать концентрацию на нём до 8 часов. Если вы используете ячейку заклинания 5 уровня или выше, вы можете поддерживать концентрацию на нём до 24 часов.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"hunger_of_hadar","ru":"Голод Хадара","en":"Hunger of Hadar","lvl":3,"school":"вызов","cls":["warlock"],"time":"1 действие","range":"150 футов","comp":"Вербальный, Соматический, Материальный (маринованное щупальце осьминога)","dur":"Концентрация, вплоть до 1 минуты","ritual":false,"desc":"","full":"Вы открываете врата в межзвёздную тьму, область, населённую неизвестными кошмарами. Появляется сфера мглы и холода с радиусом 20 футов, с центром на точке в пределах дистанции, существующая, пока активно заклинание.\n\nЭта пустота заполнена какофонией тихих шёпотов и хлюпающих шумов, которые слышно в пределах 30 футов. Никакой свет, ни магический, ни обычный, не может осветить эту местность, и существа, полностью находящиеся в этой области ослеплены.\n\nПустота создаёт искажения в ткани пространства, и её местность является труднопроходимой. Все существа, начинающие ход в этой местности, получают 2к6 урона холодом.\n\nВсе существа, оканчивающие ход в этой местности, должны преуспеть в спасброске Ловкости, иначе получают 2к6 урона кислотой, так как к ним прикасаются бледные потусторонние щупальца.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"phantasmal_force","ru":"Воображаемая сила","en":"Phantasmal Force","lvl":2,"school":"иллюзия","cls":["bard","sorcerer","wizard"],"time":"1 действие","range":"60 футов","comp":"Вербальный, Соматический, Материальный (кусок овечьей шерсти)","dur":"Концентрация, вплоть до 1 минуты","ritual":false,"desc":"","full":"Вы создаёте иллюзию в сознании существа, видимого в пределах дистанции.\n\nЦель должна совершить спасбросок Интеллекта. При провале вы создаёте воображаемый предмет, существо или другое видимое явление на свой выбор, помещающееся в куб с длиной ребра 10 футов, и воспринимаемое только целью, пока действует заклинание.\n\nЭто заклинание не оказывает никакого эффекта на нежить и конструктов.\n\nИллюзия включает звуки, температуру и прочие раздражители, очевидные только для этого же существа. Цель может действием исследовать иллюзию проверкой Интеллекта (Анализ) против Сл ваших заклинаний. Если проверка была успешной, цель понимает, что перед ней иллюзия, и заклинание оканчивается.\n\nПока цель находится под действием этого заклинания, она считает иллюзию настоящей. Она сама придумывает объяснения нелогичности взаимодействия с иллюзией.\n\nНапример, попытавшись пройти по вымышленному мосту над провалом, она упадёт вниз. Если цель выживет, она всё равно будет считать, что мост существует, а пройти ей помешало что-то другое — её толкнули, она поскользнулась, или её сбил сильный порыв ветра. Цель настолько уверена в существовании иллюзии, что даже будет получать от неё урон.\n\nИллюзия в форме существа может атаковать цель. Иллюзия, выглядящая как огонь, бассейн с кислотой или лава, могут сжечь цель. Каждый раунд в ваш ход иллюзия может причинить цели 1к6 урона психической энергией, если та находится в области иллюзии или в пределах 5 футов от иллюзии существа или опасности, способной причинять урон, например, атаковав. Цель воспринимает урон того вида, что соответствует цели.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"power_word_heal","ru":"Слово силы: Исцеление","en":"Power Word Heal","lvl":9,"school":"воплощение","cls":["bard","cleric"],"time":"1 действие","range":"Касание","comp":"Вербальный, Соматический","dur":"Мгновенная","ritual":false,"desc":"","full":"Волна целительной энергии окутывает существо, которого вы касаетесь. Цель восстанавливает все свои хиты. Если существо испугано, очаровано, ошеломлено или парализовано, это состояние оканчивается.\n\nЕсли существо лежит ничком, оно может реакцией встать. Это заклинание не оказывает никакого эффекта на нежить и конструктов.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"staggering_smite","ru":"Оглушающая кара","en":"Staggering Smite","lvl":4,"school":"воплощение","cls":["paladin"],"time":"1 бонусное действие","range":"На себя","comp":"Вербальный","dur":"Концентрация, вплоть до 1 минуты","ritual":false,"desc":"","full":"В следующий раз, когда вы попадёте по существу рукопашной атакой оружием, пока активно это заклинание, ваша атака пронзает не только его тело, но и сознание, и атака причиняет цели дополнительно 4к6 урона психической энергией.\n\nЦель должна совершить спасбросок Мудрости. При провале она до конца своего следующего хода совершает с помехой броски атаки и проверки характеристик, а также не может совершать реакции.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"swift_quiver","ru":"Быстрый колчан","en":"Swift Quiver","lvl":5,"school":"преобразование","cls":["ranger"],"time":"1 бонусное действие","range":"Касание","comp":"Вербальный, Соматический, Материальный (колчан, содержащий как минимум один боеприпас)","dur":"Концентрация, вплоть до 1 минуты","ritual":false,"desc":"","full":"Вы так модифицируете свой колчан, что он начинает производить бесконечный запас немагических боеприпасов, которые сами прыгают в вашу руку, когда вы тянетесь за ними.\n\nПока заклинание активно, вы в каждом своём ходу можете бонусным действием совершить две атаки оружием, использующим боеприпасы из колчана. Каждый раз, когда вы совершаете такую дальнобойную атаку, ваш колчан при помощи магии заменяет использованный вами боеприпас таким же немагическим боеприпасом.\n\nВсе боеприпасы, созданные этим заклинанием, распадаются, когда заклинание оканчивается. Если колчан перестаёт быть вашей собственностью, заклинание оканчивается.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"chromatic_orb","ru":"Цветной шарик","en":"Chromatic Orb","lvl":1,"school":"воплощение","cls":["sorcerer","wizard"],"time":"1 действие","range":"90 футов","comp":"Вербальный, Соматический, Материальный (алмаз, стоящий как минимум 50 зм)","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы бросаете 4-дюймовую (10-сантиметровую) сферу энергии в существо, которое видите в пределах дистанции.\n\nВыберите звук, кислоту, огонь, холод, электричество или яд при создании сферы, а затем совершите по цели дальнобойную атаку заклинанием. Если атака попадает, существо получает урон 3к8 выбранного вида.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, урон увеличивается на 1к8 за каждый уровень ячейки выше первого.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"elemental_weapon","ru":"Стихийное оружие","en":"Elemental Weapon","lvl":3,"school":"преобразование","cls":["druid","paladin","ranger"],"time":"1 действие","range":"Касание","comp":"Вербальный, Соматический","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"Немагическое оружие, которого вы касаетесь, становится магическим.\n\nВыберите один из следующих видов урона: звук, кислота, огонь, холод или электричество. Пока заклинание активно, оружие получает бонус +1 к броскам атаки и причиняет при попадании дополнительный урон выбранного вида 1к4.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 5 или 6 уровня, бонус к броску атаки увеличивается до +2, а дополнительный урон увеличивается до 2к4. Если вы используете ячейку заклинания 7 уровня или выше, бонус увеличивается до +3, а дополнительный урон увеличивается до 3к4.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"feign_death","ru":"Притворная смерть","en":"Feign Death","lvl":3,"school":"некромантия","cls":["bard","cleric","druid","wizard"],"time":"1 действие","range":"Касание","comp":"Вербальный, Соматический, Материальный (щепотка кладбищенской земли)","dur":"1 час","ritual":true,"desc":"","full":"Вы касаетесь согласного существа и погружаете его в каталептическое состояние, не отличимое от смерти.\n\nПока заклинание активно, или пока вы не коснётесь Действием цели, снимая заклинание, цель выглядит мёртвой для любого обследования и заклинаний, определяющих состояние цели.\n\nЦель ослеплена и недееспособна, а скорость равна 0.\n\nЦель получает сопротивление всем видам урона кроме психической энергии.\n\nЕсли цель была больна или отравлена, когда вы накладываете это заклинание, или становится больной или отравленной, находясь под его действием, болезни и яды не оказывают никакого эффекта, пока заклинание не окончится.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"wrathful_smite","ru":"Гневная кара","en":"Wrathful Smite","lvl":1,"school":"воплощение","cls":["paladin"],"time":"1 бонусное действие","range":"На себя","comp":"Вербальный","dur":"Концентрация, вплоть до 1 минуты","ritual":false,"desc":"","full":"В следующий раз, когда вы попадёте рукопашной атакой оружием, пока активно это заклинание, ваша атака причиняет дополнительно 1к6 урона психической энергией.\n\nКроме того, если цель — существо, оно должно совершить спасбросок Мудрости, иначе оно станет испуганным до окончания действия заклинания. Существо может Действием совершить проверку Мудрости против Сл ваших заклинаний, чтобы успокоиться и окончить это заклинание.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"searing_smite","ru":"Палящая кара","en":"Searing Smite","lvl":1,"school":"воплощение","cls":["paladin","ranger"],"time":"1 бонусное действие","range":"На себя","comp":"Вербальный","dur":"Концентрация, вплоть до 1 минуты","ritual":false,"desc":"","full":"Когда вы в следующий раз попадёте по существу рукопашной атакой оружием, пока заклинание активно, ваше оружие вспыхивает ярким белым светом, и атака причиняет цели дополнительно 1к6 урона огнём и поджигает её.\n\nПока заклинание активно, цель в начале каждого своего хода должна совершать спасбросок Телосложения. При провале она получает 1к6 урона огнём. При успехе заклинание заканчивается.\n\nЕсли цель или существо, находящееся в пределах 5 футов от неё, потратит Действие на тушение пламени, или если какой-то другой эффект потушит пламя (например, погружение в воду), заклинание тоже закончится.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, первичный дополнительный урон от атаки увеличивается на 1к6 за каждый уровень ячейки выше первого.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"thunderous_smite","ru":"Громовая кара","en":"Thunderous Smite","lvl":1,"school":"воплощение","cls":["paladin"],"time":"1 бонусное действие","range":"На себя","comp":"Вербальный","dur":"Концентрация, вплоть до 1 минуты","ritual":false,"desc":"","full":"В первый раз, когда вы попадаете рукопашной атакой оружием, пока заклинание активно, ваше оружие издаёт громовой рокот, слышимый с расстояния 300 футов, и атака причиняет цели дополнительно 2к6 урона звуком.\n\nКроме того, если цель — существо, она должна преуспеть в спасброске Силы, иначе она будет отброшена на 10 футов от вас и сбита с ног.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"ensnaring_strike","ru":"Опутывающий удар","en":"Ensnaring Strike","lvl":1,"school":"вызов","cls":["ranger"],"time":"1 бонусное действие","range":"На себя","comp":"Вербальный","dur":"Концентрация, вплоть до 1 минуты","ritual":false,"desc":"","full":"Когда вы в следующий раз попадёте по существу атакой оружием, пока заклинание активно, в точке удара появляется извивающаяся масса растений с шипами, и цель должна преуспеть в спасброске Силы, иначе она станет опутана магическими плетьми, пока заклинание активно.\n\nСущества с размером Большое и ещё больше совершают этот спасбросок с преимуществом. Если цель преуспевает в спасброске, плети усыхают.\n\nБудучи опутанной этим заклинанием, цель получает 1к6 колющего урона в начале каждого своего хода. Опутанное существо или существо, способное коснуться его, может Действием совершить проверку Силы против Сл ваших заклинаний. При успехе цель освобождается.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, урон увеличивается на 1к6 за каждый уровень ячейки выше первого.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"hail_of_thorns","ru":"Град шипов","en":"Hail of Thorns","lvl":1,"school":"вызов","cls":["ranger"],"time":"1 бонусное действие","range":"На себя","comp":"Вербальный","dur":"Концентрация, вплоть до 1 минуты","ritual":false,"desc":"","full":"В следующий раз, когда вы попадёте по существу дальнобойной атакой оружием, пока активно это заклинание, из дальнобойного оружия или боеприпаса вылетит град шипов.\n\nВ дополнение к обычному эффекту атаки, цель и все существа в пределах 5 футов от неё, должны совершить спасбросок Ловкости. При провале существо получает 1к10 колющего урона, или половину этого урона при успехе.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, урон увеличивается на 1к10 за каждый уровень ячейки выше первого (до максимума 6к10).","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"cordon_of_arrows","ru":"Завеса стрел","en":"Cordon of Arrows","lvl":2,"school":"преобразование","cls":["ranger"],"time":"1 действие","range":"5 футов","comp":"Вербальный, Соматический, Материальный (как минимум четыре стрелы или арбалетных болта)","dur":"8 часов","ritual":false,"desc":"","full":"Вы втыкаете четыре немагических боеприпаса — стрелы или арбалетные болты — в землю в пределах дистанции и накладываете на них заклинание, защищающее область.\n\nПока заклинание активно, каждый раз, когда другое существо кроме вас впервые за ход оказывается в пределах 30 футов от боеприпасов или оканчивает там ход, один боеприпас вылетает и атакует его.\n\nСущество должно преуспеть в спасброске Ловкости, иначе оно получит 1к6 колющего урона. Боеприпас при этом уничтожается.\n\nЗаклинание заканчивается, когда кончаются боеприпасы. Накладывая это заклинание, вы можете указать любых существ, которых это заклинание будет игнорировать.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 3 уровня или выше, количество боеприпасов увеличивается на два за каждый уровень ячейки выше второго.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"conjure_barrage","ru":"Вызов заграждения","en":"Conjure Barrage","lvl":3,"school":"вызов","cls":["ranger"],"time":"1 действие","range":"На себя (60-футовый конус)","comp":"Вербальный, Соматический, Материальный (метательное оружие или один боеприпас)","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы метаете немагическое оружие или выстреливаете немагический боеприпас в воздух, создавая конус одинакового оружия, летящего вперёд и потом исчезающего.\n\nВсе существа в 60-футовом конусе должны преуспеть в спасброске Ловкости. При провале существо получает урон 3к8, а при успехе половину этого урона. Вид урона такой же, как у оружия или боеприпаса, использованного в качестве компонента.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"conjure_volley","ru":"Вызов залпа","en":"Conjure Volley","lvl":5,"school":"вызов","cls":["ranger"],"time":"1 действие","range":"150 футов","comp":"Вербальный, Соматический, Материальный (один боеприпас)","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы метаете немагическое оружие или выстреливаете немагический боеприпас в воздух и выбираете точку в пределах дистанции. Сотни экземпляров такого же оружия или боеприпаса падают залпом и потом исчезают.\n\nВсе существа в цилиндре с радиусом 40 футов и высотой 20 футов должны совершить спасбросок Ловкости. При провале существо получает 8к8 урона, а при успехе половину этого урона. Вид урона такой же, как у оружия или боеприпаса, использованного в качестве компонента.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"lightning_arrow","ru":"Молниевая стрела","en":"Lightning Arrow","lvl":3,"school":"преобразование","cls":["ranger"],"time":"1 бонусное действие","range":"На себя","comp":"Вербальный, Соматический","dur":"Концентрация, вплоть до 1 минуты","ritual":false,"desc":"","full":"В следующий раз, когда вы совершите дальнобойную атаку оружием, пока активно это заклинание, ваш боеприпас или само оружие, если это метательное оружие, превращается в разряд молнии.\n\nСовершите бросок атаки как обычно. Вместо обычного урона от оружия цель при попадании получает 4к8 урона электричеством, или половину урона при промахе.\n\nВне зависимости от попадания или промаха, все существа в пределах 10 футов от цели должны совершить спасбросок Ловкости. При провале эти существа получают 2к8 урона электричеством, или половину урона при успехе.\n\nПосле этого боеприпас или оружие возвращается в обычную форму.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 4 уровня или выше, урон от обоих эффектов увеличивается на 1к8 за каждый уровень ячейки выше третьего.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"arcane_gate","ru":"Магические врата","en":"Arcane Gate","lvl":6,"school":"вызов","cls":["sorcerer","warlock","wizard"],"time":"1 действие","range":"500 футов","comp":"Вербальный, Соматический","dur":"Концентрация, вплоть до 10 минут","ritual":false,"desc":"","full":"Вы создаёте связанные порталы для телепортации, остающиеся открытыми на время длительности. Выберите две точки на земле, которые вы видите, одну в пределах 10 футов от себя, и вторую в пределах 500 футов. В каждой точке появляется круглый портал диаметром 10 футов. Если портал должен открыться в пространстве, занятом существом, заклинание проваливается.\n\nПорталы представляют собой двумерные светящиеся круги, заполненные туманом, парящие в паре сантиметров над землёй и перпендикулярные выбранной вами точке. Круги видны только с одной стороны (на ваш выбор), которая и функционирует как портал.\n\nВсе существа и предметы, входящие в портал, выходят из другого портала, как если бы они были смежны друг с другом; прохождение сквозь портал с неактивной стороны не оказывает никакого эффекта. Туман, заполняющий порталы, непрозрачный, и блокирует зрение. Вы в свой ход можете бонусным действием повернуть кольца, чтобы активные стороны поменялись местами с неактивными.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"circle_of_power","ru":"Круг силы","en":"Circle of Power","lvl":5,"school":"ограждение","cls":["paladin"],"time":"1 действие","range":"На себя (30-футовый радиус)","comp":"Вербальный","dur":"Концентрация, вплоть до 10 минут","ritual":false,"desc":"","full":"От вас исходит божественная энергия, искажающая и рассеивающая магическую энергию в пределах 30 футов от вас. Пока заклинание активно, сфера перемещается вместе с вами, оставаясь с центром на вас.\n\nВсе дружественные существа в этой области (включая вас) получают преимущество к спасброскам от заклинаний и других магических эффектов.\n\nКроме того, когда такое существо преуспевает в спасброске от заклинания или магического эффекта, позволяющего совершить спасбросок для получения всего лишь половины урона, оно не получает урон вообще.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"destructive_wave","ru":"Разрушительная волна","en":"Destructive Wave","lvl":5,"school":"воплощение","cls":["paladin"],"time":"1 действие","range":"На себя (30-футовый радиус)","comp":"Вербальный","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы топаете по полу, создавая волну божественной энергии, исходящей от вас.\n\nВсе существа, выбранные вами в пределах 30 футов, должны преуспеть в спасброске Телосложения, иначе они получат 5к6 урона звуком, а также 5к6 урона излучением или некротической энергией (на ваш выбор), и будут сбиты с ног. Существо, преуспевшее в спасброске, получает половину урона и не сбивается с ног.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"banishing_smite","ru":"Изгоняющая кара","en":"Banishing Smite","lvl":5,"school":"ограждение","cls":["paladin"],"time":"1 бонусное действие","range":"На себя","comp":"Вербальный","dur":"Концентрация, вплоть до 1 минуты","ritual":false,"desc":"","full":"В следующий раз, когда вы попадёте по существу атакой оружием, пока активно это заклинание, ваше оружие покрывается силовым полем, и атака причиняет цели дополнительный 5к10 урона силовым полем.\n\nКроме того, если эта атака опустила хиты цели до 50 или ниже, вы изгоняете её. Если цель родом не с того плана существования, на котором сейчас находитесь вы, цель исчезает, возвращаясь на свой родной план.\n\nЕсли цель родом с того плана, на котором находитесь вы, она исчезает в безопасном демиплане. Находясь там, цель недееспособна. Она остаётся там, пока активно заклинание, после чего возвращается в пространство, из которого исчезла, или ближайшее свободное пространство, если то место занято.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"compelled_duel","ru":"Вызов на дуэль","en":"Compelled Duel","lvl":1,"school":"очарование","cls":["paladin"],"time":"1 бонусное действие","range":"30 футов","comp":"Вербальный","dur":"Концентрация, вплоть до 1 минуты","ritual":false,"desc":"","full":"Вы пытаетесь вызвать существо на дуэль. Одно существо, которое вы видите в пределах дистанции, должно совершить спасбросок Мудрости. При провале существо влечет к вам, следуя вашему божественному требованию.\n\nПока заклинание активно, это существо совершает с помехой броски атаки по всем существам кроме вас, и должно совершать спасброски Мудрости каждый раз, когда пытается переместиться в пространство, находящееся более чем в 30 футах от вас; в случае успеха это заклинание не ограничивает перемещения цели в этот ход.\n\nЗаклинание оканчивается, если вы атакуете другое существо, если вы активируете заклинание, нацеленное на враждебное существо, но не на цель, если дружественное вам существо причиняет цели урон или накладывает на неё вредоносное заклинание, или если вы оканчиваете ход далее, чем в 30 футах от цели.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"grasping_vine","ru":"Цепкая лоза","en":"Grasping Vine","lvl":4,"school":"вызов","cls":["druid","ranger"],"time":"1 бонусное действие","range":"30 футов","comp":"Вербальный, Соматический","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"","full":"Вы создаёте лозу, вырастающую из земли в свободном пространстве на ваш выбор, видимом вами в пределах дистанции. Когда вы накладываете это заклинание, вы можете приказать лозе ухватить видимое вами существо, находящееся в пределах 30 футов от неё.\n\nЭто существо должно преуспеть в спасброске Ловкости, иначе его подтянет на 20 футов к лозе. Пока заклинание активно, вы можете в каждом своём ходу бонусным действием приказывать лозе ухватить то же самое или другое существо.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"aura_of_life","ru":"Аура жизни","en":"Aura of Life","lvl":4,"school":"ограждение","cls":["cleric","paladin"],"time":"1 действие","range":"На себя (30-футовый радиус)","comp":"Вербальный","dur":"Концентрация, до 10 минут","ritual":false,"desc":"","full":"От вас исходит защищающая жизнь аура с радиусом 30 футов. Пока заклинание активно, аура перемещается вместе с вами, оставаясь с центром на вас.\n\nВсе невраждебные существа в ауре (включая вас) обладают сопротивлением к урону некротической энергией, и максимум их хитов не может уменьшаться.\n\nКроме того, невраждебные живые существа восстанавливают 1 хит, когда начинают ход в этой ауре с 0 хитов.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"aura_of_purity","ru":"Аура очищения","en":"Aura of Purity","lvl":4,"school":"ограждение","cls":["cleric","paladin"],"time":"1 действие","range":"На себя (30-футовый радиус)","comp":"Вербальный","dur":"Концентрация, до 10 минут","ritual":false,"desc":"","full":"От вас исходит очищающая аура с радиусом 30 футов. Пока заклинание активно, аура перемещается вместе с вами, оставаясь с центром на вас.\n\nВсе невраждебные существа в ауре (включая вас) не могут заболеть, имеют сопротивление к урону ядом и совершают с преимуществом спасброски от эффектов, вызывающих следующие состояния: глухота, испуг, ослепление, отравление, очарование, ошеломление и паралич.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"aura_of_vitality","ru":"Аура живучести","en":"Aura of Vitality","lvl":3,"school":"воплощение","cls":["cleric","druid","paladin"],"time":"1 действие","range":"На себя (30-футовый радиус)","comp":"Вербальный","dur":"Концентрация, вплоть до 1 минуты","ritual":false,"desc":"","full":"От вас исходит аура живительной энергии с радиусом 30 футов. Пока заклинание активно, аура перемещается вместе с вами, оставаясь с центром на вас. Вы можете бонусным действием восстанавливать одному любому существу в ауре (включая себя) 2к6 хитов.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"crusaders_mantle","ru":"Мантия крестоносца","en":"Crusader's Mantle","lvl":3,"school":"воплощение","cls":["paladin"],"time":"1 действие","range":"На себя","comp":"Вербальный","dur":"Концентрация, вплоть до 1 минуты","ritual":false,"desc":"","full":"От вас начинает исходить святая сила аурой с радиусом 30 футов, пробуждающая в дружественных существах отвагу.\n\nПока заклинание активно, аура перемещается вместе с вами, оставаясь с центром на вас. Находясь в ауре, все невраждебные существа (включая вас) при попадании атакой оружием причиняют дополнительно 1к4 урона излучением.","src":"PHB","translationSource":"5e14.ttg.club"}];

function calculateMaxHp(classes, constitutionModifier, bonus = 0) {
  const rolled = classes.reduce((hp, cls, index) => {
    const firstLevel = index === 0 ? cls.hitDie : Math.floor(cls.hitDie / 2) + 1;
    return hp + Math.max(1, firstLevel + constitutionModifier)
      + (cls.level - 1) * Math.max(1, Math.floor(cls.hitDie / 2) + 1 + constitutionModifier);
  }, 0);
  return Math.max(1, rolled + bonus);
}

function calculateMovementSpeed({ base, monkBonus = 0, barbarianBonus = 0, rovingBonus = 0, mobileBonus = 0, heavyArmorPenalty = 0 }) {

}

let STORAGE_WARNING_SHOWN=false, STORAGE_CORRUPT=false;
function readStorage(key){try{return {value:localStorage.getItem(key)}}catch(error){console.error(`Не удалось прочитать ${key}`,error);return {error}}}

    :'Не удалось сохранить данные персонажей в браузере. Скачайте резервную копию и проверьте свободное место в хранилище.');
}

  if(!writeStorage(LS_KEY,JSON.stringify(LIB))){if(replaceCorrupt)STORAGE_WARNING_SHOWN=false;warnStorage();return false}

    return false;
  }

// ponytail: legacy versions share migrate()'s normalization; add a version step only when a schema change needs a distinct transform.
const SCHEMA_MIGRATIONS={
  4:character=>{
    const used={...(character.game.hdUsedByClass||{})};
    if(!Object.keys(used).length){
      let remaining=Math.max(0,Math.floor(character.game.hdUsed||0));
      for(const cls of character.classes){const count=Math.min(cls.lvl,remaining);if(count)used[cls.cls]=count;remaining-=count}
    }
    return {...character,game:{...character.game,hdUsedByClass:used}};
  }
};
function migrate(ch){
  const d=newChar();
  const m={...d,...Object.fromEntries(Object.entries(ch).filter(([key])=>Object.hasOwn(d,key)))};
  m.bases={...d.bases,...(ch.bases||{})};
  ['standard','point','manual'].forEach(k=>{
    m.bases[k]={...(k==='standard'?(()=>{const s={};ABILS.forEach(([a],i)=>s[a]=STD_SET[i]);return s})():k==='point'?(()=>{const s={};ABILS.forEach(([a])=>s[a]=8);return s})():(()=>{const s={};ABILS.forEach(([a])=>s[a]=10);return s})()), ...(ch.bases&&ch.bases[k]&&!Array.isArray(ch.bases[k])?ch.bases[k]:{})};
  });
  m.game={...d.game,...(ch.game||{})};
  m.game.hdUsedByClass=isRecord(ch.game?.hdUsedByClass)?ch.game.hdUsedByClass:{};
  m.personality={...d.personality,...(ch.personality||{})};
  m.appearance={...d.appearance,...(isRecord(ch.appearance)?ch.appearance:{})};
  m.choices={...d.choices,...(isRecord(ch.choices)?ch.choices:{})};
  m.race=RACES[m.race]?m.race:d.race;
  m.bg=BACKGROUNDS[m.bg]?m.bg:d.bg;
  if(!['standard','point','manual'].includes(m.abilityMethod))m.abilityMethod=d.abilityMethod;
  for(const key of ['asi','classSkills','cantrips','spellsKnown','spellsPrepared','arcanum','racialSpells','equipChoice'])m[key]={...d[key],...(isRecord(ch[key])?ch[key]:{})};
  for(const key of ['halfElfPicks','raceSkills','raceAsiPicks','expertise','languages','extraLangs','spellbook','inventory','attunement'])m[key]=Array.isArray(ch[key])?ch[key]:d[key];
  if(!Array.isArray(m.classes)||!m.classes.length)m.classes=[{cls:'fighter',lvl:1,sub:'champion'}];
  const styles={...(isRecord(m.choices.fightingStyles)?m.choices.fightingStyles:{})};
  if(!Object.keys(styles).length&&m.choices.fightingStyle){
    const source=m.classes.find(c=>FIGHTING_STYLES[c.cls]&&c.lvl>=(c.cls==='fighter'?1:2)&&FIGHTING_STYLES[c.cls].some(([id])=>id===m.choices.fightingStyle));
    if(source)styles[source.cls]=m.choices.fightingStyle;
  }
  if(m.choices.fightingStyle2&&m.classes.some(c=>c.cls==='fighter'&&c.sub==='champion'&&c.lvl>=10)&&m.choices.fightingStyle2!==styles.fighter)styles.championExtra=m.choices.fightingStyle2;
  m.choices.fightingStyles=styles;
  delete m.choices.fightingStyle;delete m.choices.fightingStyle2;
  if(typeof m.id!=='string'||!m.id)m.id=uid();
  let version=Number.isInteger(ch.schemaVersion)?ch.schemaVersion:1;
  while(version<CHARACTER_SCHEMA){
    if(SCHEMA_MIGRATIONS[version])Object.assign(m,SCHEMA_MIGRATIONS[version](m));
    version++;
  }
  m.schemaVersion=CHARACTER_SCHEMA;
  return m;
}

}

function exportJson(){
  if(!validCharacter(C)){alert('Исправьте некорректные значения персонажа перед экспортом.');return}
  const blob=new Blob([JSON.stringify(C,null,1)],{type:'application/json'});

  a.href=URL.createObjectURL(blob);
  a.download=(C.name||'character').replace(/[\\/:*?"<>|]/g,'_')+'.json';

function exportLibrary(){
  if(!LIB.every(c=>validCharacter(c))){alert('В библиотеке есть некорректный персонаж; резервная копия не создана.');return}
  const backup={format:'dnd-builder-backup',version:1,exportedAt:new Date().toISOString(),characters:LIB};
  const blob=new Blob([JSON.stringify(backup,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`dnd-builder-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();URL.revokeObjectURL(a.href);
}
function importJson(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(data&&data.format==='dnd-builder-backup'){
        if(data.version!==1||!Array.isArray(data.characters)||!data.characters.every(validCharacter)||!hasUniqueCharacterIds(data.characters))throw new Error('Некорректная резервная копия');
        if(!confirm(`Заменить текущую библиотеку резервной копией (${data.characters.length} персонажей)?`)){inp.value='';return}
        const previous=LIB;
        LIB=data.characters.map(migrate);
        if(!saveLib(true)){LIB=previous;return}
        C=null;TAB='home';render();
        alert(`Восстановлено персонажей: ${LIB.length}`);
      }else{
        if(!validCharacter(data))throw new Error('Файл не содержит корректного персонажа или резервной копии');
        const ch=migrate(data);
        ch.id=uid();ch.updated=Date.now();
        LIB.push(ch);if(!saveLib()){LIB.pop();return}
        if(C&&TAB!=='home'){openChar(ch.id)}else{render()}
        alert('Персонаж «'+ch.name+'» импортирован');
      }
    }catch(e){alert('Не удалось прочитать файл: '+e.message)}
    inp.value='';
  };
  r.readAsText(f);
}

function setPortraitFile(input){
  const file=input.files?.[0];if(!file)return;
  if(!file.type.startsWith('image/')||file.size>20*1024*1024){alert('Выберите изображение размером не более 20 МБ.');input.value='';return}
  const url=URL.createObjectURL(file),image=new Image();
  image.onload=()=>{
    URL.revokeObjectURL(url);
    try{
      const scale=Math.min(1,640/image.naturalWidth,800/image.naturalHeight),canvas=document.createElement('canvas');
      canvas.width=Math.round(image.naturalWidth*scale);canvas.height=Math.round(image.naturalHeight*scale);
      canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
      let portrait='';
      for(const quality of [.82,.65,.48]){portrait=canvas.toDataURL('image/jpeg',quality);if(portrait.length<=MAX_PORTRAIT_DATA)break}
      input.value='';
      if(portrait.length>MAX_PORTRAIT_DATA){alert('Не удалось сжать изображение до 150 КБ. Выберите другое.');return}
      C.portrait=portrait;persist();render();
    }catch(error){input.value='';alert('Не удалось обработать изображение.')}
  };
  image.onerror=()=>{URL.revokeObjectURL(url);input.value='';alert('Не удалось открыть изображение.')};
  image.src=url;
}

function setStd(a,v){
  const B=C.bases.standard;
  // если значение занято — меняем местами

}
function stepPoint(a,d){

  B[a]=v;persist();render();
}
function setManual(a,v){C.bases.manual[a]=Math.max(3,Math.min(18,+v||10));persist();render()}

function setRaceAsi(i,v){
  const count=C.raceAsiMode==='three'?3:2;

  C.raceAsiPicks=C.raceAsiPicks||[];C.raceAsiPicks[i]=v;persist();render();
}

function expertiseAvailable(){

    if(c.cls==='bard'){if(c.lvl>=3)n+=2;if(c.lvl>=10)n+=2}
  });
  if(deftExplorerActive())n++;
  return n;
}

function setFightingStyle(key,value){
  const options=key==='championExtra'?FIGHTING_STYLES.fighter:FIGHTING_STYLES[key];
  if(!options||!activeFightingStyleKeys().includes(key)||value&&!options.some(([id])=>id===value))return;
  C.choices.fightingStyles=C.choices.fightingStyles||{};
  if(value&&activeFightingStyleKeys().some(other=>other!==key&&C.choices.fightingStyles[other]===value)){alert('Боевой стиль уже выбран.');render();return}
  if(value)C.choices.fightingStyles[key]=value;else delete C.choices.fightingStyles[key];
  persist();render();
}

// ================= Вкладка Заклинания =================
const LVL_NAMES=['Заговоры','1 круг','2 круг','3 круг','4 круг','5 круг','6 круг','7 круг','8 круг','9 круг'];
let SPELL_QUERY='';
const SPELL_FILTERS={cls:'',level:'',ritual:false,concentration:false};
function spellSearchData(s){return esc([s.ru,s.en,s.school,s.ritual?'ритуал':''].join(' ').toLocaleLowerCase('ru'))}
function setSpellQuery(value){SPELL_QUERY=value;filterSpellRows()}
function setSpellFilter(key,value){if(!Object.hasOwn(SPELL_FILTERS,key))return;SPELL_FILTERS[key]=value;filterSpellRows()}
function filterSpellRows(){
  const q=SPELL_QUERY.trim().toLocaleLowerCase('ru'),cls=C?.classes.find(c=>c.cls===SPELL_FILTERS.cls);
  $$('.spell-row').forEach(row=>{
    const spell=SPELLS.find(s=>s.id===row.dataset.spellId);
    row.hidden=!!q&&!row.dataset.search.includes(q)||SPELL_FILTERS.level!==''&&spell?.lvl!==+SPELL_FILTERS.level||SPELL_FILTERS.ritual&&!spell?.ritual||SPELL_FILTERS.concentration&&!/концентрац/i.test(spell?.dur||'')||!!SPELL_FILTERS.cls&&(!cls||!spell||spell.lvl>classMaxSpellLevel(cls)||spell.lvl===0&&!cantripLimit(cls.cls)||!spellClassAllowed(cls,spell.id));
  });
  $$('.spell-lvl').forEach(group=>{
    const hasMatch=!!group.querySelector('.spell-row:not([hidden])');
    group.hidden=!!q&&!hasMatch||!!SPELL_FILTERS.cls&&!hasMatch||SPELL_FILTERS.level!==''&&!hasMatch||SPELL_FILTERS.ritual&&!hasMatch||SPELL_FILTERS.concentration&&!hasMatch;
    if(q&&hasMatch)group.open=true;
  });
  const active=!!q||!!SPELL_FILTERS.cls||SPELL_FILTERS.level!==''||SPELL_FILTERS.ritual||SPELL_FILTERS.concentration,empty=$('#spellNoResults');
  if(empty)empty.hidden=!active||$$('.spell-row').some(row=>!row.hidden);
}
function racialCantripChoices(){
  const choices=[];
  if(C.race==='astralelf')choices.push({key:'astralelf',name:'Астральный огонь',ids:['dancing_lights','light','sacred_flame'],abilities:['int','wis','cha'],defaultAbility:'wis'});
  if(C.race==='elf'&&C.subrace==='high')choices.push({key:'highelf',name:'Заговор высшего эльфа',spells:SPELLS.filter(s=>s.lvl===0&&s.cls.includes('wizard')),ability:'int'});
  return choices.map(c=>({...c,spells:c.spells||c.ids.map(id=>SPELLS.find(s=>s.id===id)).filter(Boolean)}));
}
function racialSpellEntries(){
  const entries=[],add=(id,ability,minLevel=1,usage='Постоянно')=>{const spell=SPELLS.find(s=>s.id===id);if(spell&&totalLvl()>=minLevel)entries.push({spell,ability,usage,saveDc:spellSaveDcForAbility(ability),attackBonus:spellAttackForAbility(ability)})};
  for(const choice of racialCantripChoices()){
    const id=(C.racialSpells||{})[choice.key],ability=(C.racialSpells||{})[choice.key+'Ability']||choice.defaultAbility||choice.ability;
    if(id&&choice.spells.some(s=>s.id===id))add(id,ability,1,'Заговор');
  }
  if(C.race==='elf'&&C.subrace==='drow'){
    add('dancing_lights','cha');add('faerie_fire','cha',3,'1/долгий отдых');add('darkness','cha',5,'1/долгий отдых');
  }
  if(C.race==='gnome'&&C.subrace==='forest')add('minor_illusion','int',1,'Заговор');
  if(C.race==='tiefling'){
    add('thaumaturgy','cha',1,'Заговор');add('hellish_rebuke','cha',3,'1/долгий отдых · 2-й круг');add('darkness','cha',5,'1/долгий отдых');
  }
  return entries;
}
function setRacialSpell(key,id){const choice=racialCantripChoices().find(c=>c.key===key);if(!choice||!choice.spells.some(s=>s.id===id))return;C.racialSpells=C.racialSpells||{};C.racialSpells[key]=id;if(choice.defaultAbility&&!C.racialSpells[key+'Ability'])C.racialSpells[key+'Ability']=choice.defaultAbility;persist();render()}
function setRacialSpellAbility(key,ability){const choice=racialCantripChoices().find(c=>c.key===key);if(!choice||!choice.abilities?.includes(ability))return;C.racialSpells=C.racialSpells||{};C.racialSpells[key+'Ability']=ability;persist();render()}
function renderRacialSpells(){
  const choices=racialCantripChoices(),entries=racialSpellEntries();if(!choices.length&&!entries.length)return '';
  const abilityName=id=>ABIL_RU_FULL[id]||id;
  return `<div class="card"><h3>Заклинания, дарованные расой</h3><p class="hint">Эти заговоры и заклинания получены от вида и не расходуют лимит выбора класса.</p>
    ${choices.map(c=>{const selected=(C.racialSpells||{})[c.key]||'',ability=(C.racialSpells||{})[c.key+'Ability']||c.defaultAbility||c.ability,spell=entries.find(e=>e.spell.id===selected);return `<h4>${c.name} — выберите один заговор</h4>${c.abilities?`<label>Базовая характеристика<select onchange="setRacialSpellAbility('${c.key}',this.value)">${c.abilities.map(a=>`<option value="${a}"${ability===a?' selected':''}>${abilityName(a)}</option>`).join('')}</select></label>`:''}<div class="spell-grid">${c.spells.map(s=>`<div class="spell-row${selected===s.id?' picked':''}" data-spell-id="${s.id}" data-search="${spellSearchData(s)}"><label class="chk"><input type="radio" name="racial_${c.key}" ${selected===s.id?'checked':''} onchange="setRacialSpell('${c.key}','${s.id}')"><span class="spell-name" onclick="spellNameClick(event,'${s.id}')">${esc(s.ru)}</span></label><span class="tag">Дар расы</span></div>`).join('')}</div>${spell?`<p class="muted small">${abilityName(spell.ability)} · КС ${spell.saveDc} · бонус атаки ${fmtMod(spell.attackBonus)}</p>`:''}`}).join('')}
    ${entries.filter(e=>!choices.some(c=>(C.racialSpells||{})[c.key]===e.spell.id)).map(e=>`<div class="spell-row" data-spell-id="${e.spell.id}" data-search="${spellSearchData(e.spell)}"><span class="spell-name" onclick="spellNameClick(event,'${e.spell.id}')">${esc(e.spell.ru)}</span><span class="muted small">${e.usage}${e.ability?' · '+abilityName(e.ability):''}${e.ability?` · КС ${e.saveDc} · атака ${fmtMod(e.attackBonus)}`:''}</span><span class="tag">Дар расы</span></div>`).join('')}
  </div>`;
}
function renderSpells(){
  const casters=spellcasterClasses(),racial=renderRacialSpells();
  if(SPELL_FILTERS.cls&&!casters.some(c=>c.cls===SPELL_FILTERS.cls))SPELL_FILTERS.cls='';
  if(!casters.length&&!racial)return `<div class="page"><h1>Заклинания</h1><p class="muted">У выбранных классов и расы нет магии.</p></div>`;
  return `<div class="page"><h1>Заклинания</h1>
  <label>Поиск по названию, языковому названию или школе<input type="search" aria-label="Поиск заклинаний" value="${esc(SPELL_QUERY)}" oninput="setSpellQuery(this.value)"></label>
  <div class="spell-filterbar"><label>Класс персонажа<select aria-label="Фильтр по классу" onchange="setSpellFilter('cls',this.value)"><option value="">Все классы</option>${casters.map(c=>`<option value="${c.cls}"${SPELL_FILTERS.cls===c.cls?' selected':''}>${esc(CLASSES[c.cls].name)} · ${c.lvl} ур.</option>`).join('')}</select></label><label>Круг<select aria-label="Фильтр по кругу" onchange="setSpellFilter('level',this.value)"><option value="">Все круги</option>${LVL_NAMES.map((name,level)=>`<option value="${level}"${SPELL_FILTERS.level===String(level)?' selected':''}>${name}</option>`).join('')}</select></label><label class="chk"><input type="checkbox"${SPELL_FILTERS.ritual?' checked':''} onchange="setSpellFilter('ritual',this.checked)">Ритуал</label><label class="chk"><input type="checkbox"${SPELL_FILTERS.concentration?' checked':''} onchange="setSpellFilter('concentration',this.checked)">Концентрация</label></div>
  <p id="spellNoResults" class="muted" hidden>Заклинания не найдены. Измените поиск или фильтры.</p>
  ${racial}
  ${casters.map(c=>renderCasterBlock(c)).join('')}
  </div>`;
}

function renderCasterBlock(c){
  const cls=c.cls, cl=CLASSES[cls], abilRu=ABIL_RU_FULL[spellAbilityOf(cls)];
  const maxLvl=maxSpellLvlFor(c);
  let head=`<div class="card"><h3>${cl.name} · базовая характеристика: ${abilRu} · КС ${spellSaveDc(cls)} · атака ${fmtMod(spellAttack(cls))}</h3>`;
  // ячейки
  if(spellTypeOf(c)==='pact'){
    const p=pactSlots();
    head+=`<p class="hint">Ячейки договора: ${p.count} × ${p.level} круг (восстанавливаются на коротком отдыхе)</p>`;
  }else{
    const slots=clsSlotsFor(c);
    if(slots)head+=`<p class="hint">Ячейки: ${slots.map((n,i)=>n?`${i+1} круг — ${n}`:null).filter(Boolean).join(', ')||'—'}${isMulticlassed()?' <span class="warn small">(мультикласс: общие ячейки)</span>':''}</p>`;
  }
  const cantrips=cantripLimit(cls),selectedCantrips=C.cantrips[cls]||[];
  if(cantrips)head+=`<h4>Заговоры — ${selectedCantrips.length}/${cantrips}</h4>${spellPicker(cls,0,selectedCantrips,cantrips,'cantrips')}`;
  // заклинания по типу класса
  if(cls==='wizard'){
    head+=renderWizardSpells(c,maxLvl);
  }else if(['cleric','druid','paladin'].includes(cls)){
    const sel=C.spellsPrepared[cls]||[];
    const limit=prepLimit(cls);
    let bonus=domainSpellsOf(c);
    if(bonus.length)head+=`<p class="hint">Доменные/клятвенные/круговые (всегда подготовлены, не считаются в лимит): ${bonus.map(s=>s.ru).join(', ')}</p>`;
    head+=`<h4>Подготовленные — ${sel.length}/${limit}</h4>`;
    for(let l=1;l<=maxLvl;l++)head+=spellPicker(cls,l,sel,limit,'spellsPrepared',bonus.map(s=>s.id));
  }else{
    // известные: бард, чародей, следопыт, колдун, мистический рыцарь, мистический ловкач
    const sel=C.spellsKnown[cls]||[];
    const limit=knownLimit(cls),additional=cls==='ranger'?primalAwarenessSpells():[],additionalIds=additional.map(s=>s.id);
    if(cls==='ranger'){
      if(additional.length)head+=`<h4>Изначальная осведомлённость</h4><p class="hint">Эти заклинания известны дополнительно и не входят в лимит. Каждое можно один раз наложить без ячейки до долгого отдыха.</p><div class="spell-grid">${additional.map(({id,spellLevel,spell})=>`<div class="spell-row" data-spell-id="${id}" data-search="${spellSearchData(spell)}"><span class="spell-name" onclick="spellNameClick(event,'${id}')">${esc(spell.ru)}</span><span class="muted small">${spellLevel}-й круг</span></div>`).join('')}</div>`;
    }
    if(cls==='fighter'||cls==='rogue')head+=`<p class="hint">Заклинания из списка волшебника (Мистический рыцарь: преимущественно ограждение и воплощение; Мистический ловкач: очарование и иллюзия).</p>`;
    head+=`<h4>Известные заклинания — ${sel.filter(id=>!additionalIds.includes(id)).length}/${limit}</h4>`;
    for(let l=1;l<=maxLvl;l++)head+=spellPicker(cls,l,sel,limit,'spellsKnown',additionalIds);
    if(cls==='warlock'&&c.lvl>=11){
      const arcLvl=c.lvl>=17?9:c.lvl>=15?8:c.lvl>=13?7:6;
      const cur=C.arcanum[arcLvl];
      head+=`<label>Мистический арканум (${arcLvl} круг)<select onchange="C.arcanum['${arcLvl}']=this.value;persist();render()"><option value="">—</option>${SPELLS.filter(s=>s.lvl===arcLvl&&s.cls.includes('warlock')).map(s=>`<option value="${s.id}"${cur===s.id?' selected':''}>${s.ru}</option>`).join('')}</select></label>`;
    }
  }
  return head+'</div>';
}
function isMulticlassed(){return spellcasterClasses().length>1}
function maxSpellLvlFor(c){return classMaxSpellLevel(c)}
function clsSlotsFor(c){
  if(isMulticlassed())return spellSlots();
  return TABLES[c.cls].slots[c.lvl-1];
}
function domainSpellsOf(c){
  const out=[];
  const sub=SUBCLASSES[c.sub];
  const byId=id=>SPELLS.find(s=>s.id===id);
  if(sub&&sub.domainSpells){
    Object.entries(sub.domainSpells).forEach(([clLvl,ids])=>{if(c.lvl>=+clLvl)ids.forEach(id=>{const s=byId(id);if(s&&!out.includes(s))out.push(s)})});
  }
  if(sub&&sub.oathSpells){
    Object.entries(sub.oathSpells).forEach(([plLvl,ids])=>{if(c.lvl>=+plLvl)ids.forEach(id=>{const s=byId(id);if(s&&!out.includes(s))out.push(s)})});
  }
  if(c.cls==='druid'&&c.sub==='land'&&C.choices.druidLand){
    const cs=SUBCLASSES.land.circleSpells[C.choices.druidLand]||{};
    Object.entries(cs).forEach(([druidLvl,ids])=>{if(c.lvl>=+druidLvl)ids.forEach(id=>{const s=byId(id);if(s&&!out.includes(s))out.push(s)})});
  }
  return out;
}

function toggleSpell(store,cls,limit,id,on){

function itemName(it){
  if(it.type==='weapon'){const w=WEAPONS.find(x=>x[0]===it.id);return w?w[1]:it.id}
  if(it.type==='armor'||it.type==='shield'){const a=ARMORS.find(x=>x[0]===it.id);return a?a[1]:it.id}
  if(it.type==='gear'){const g=GEAR.find(x=>x[0]===it.id);return g?g[1]:it.id}
  if(it.type==='pack'){return (PACKS[it.id]?PACKS[it.id][0].split(':')[0]:it.id)}
  if(it.type==='instrument')return it.id;
  return it.name||it.id;
}

  return sec('weapons','🗡 Оружие',wrows)+sec('armors','🛡 Доспехи и щиты',arows)+sec('gear','🎒 Снаряжение и инструменты',grows);

function renderShop(q){const open=[...document.querySelectorAll('details.shop-sec[open]')].map(d=>d.dataset.key);$('#shopList').innerHTML=shopListHtml(q);open.forEach(k=>{const d=document.querySelector(`details.shop-sec[data-key="${k}"]`);if(d)d.open=true})}
function priceToGold(p){ // "10 зм"/"5 см"/"1 мм" -> золото
  const m=String(p).match(/([\d.,]+)\s*(зм|см|мм)/);
  if(!m)return 0;
  const v=parseFloat(m[1].replace(',','.'));
  return m[2]==='зм'?v:m[2]==='см'?v/10:v/100;
}
function buyItem(type,id,price){
  if(C.goldMode==='gold'){
    const cost=priceToGold(price);
    if((C.gold||0)<cost){alert('Не хватает золота');return}
    C.gold=Math.round((C.gold-cost)*100)/100;
  }
  addItem(type,id,1);
  persist();render();
}
function addItem(type,id,qty){
  C.inventory=C.inventory||[];
  const ex=C.inventory.find(i=>i.type===type&&i.id===id&&i.type!=='armor'&&i.type!=='shield'&&!(type==='weapon'&&i.wielded));
  if(ex)ex.qty=(ex.qty||1)+qty;else C.inventory.push({type,id,qty,equipped:false});
}
function sellItem(i){
  const it=C.inventory[i];
  if(it.equipped)it.equipped=false;
  if(C.goldMode==='gold'){
    let p=0;
    if(it.type==='weapon')p=priceToGold((WEAPONS.find(x=>x[0]===it.id)||[])[2]||0);
    if(it.type==='armor'||it.type==='shield')p=priceToGold((ARMORS.find(x=>x[0]===it.id)||[])[2]||0);
    if(it.type==='gear')p=priceToGold((GEAR.find(x=>x[0]===it.id)||[])[2]||0);
    C.gold=Math.round(((C.gold||0)+p/2*(it.qty||1))*100)/100;
  }
  if((it.qty||1)>1)it.qty--;else C.inventory.splice(i,1);
  persist();render();
}
function delItem(i){C.inventory.splice(i,1);persist();render()}
function toggleEquipItem(i){
  const it=C.inventory[i];
  if(it.type==='armor')C.inventory.forEach(x=>{if(x.type==='armor')x.equipped=false});
  if(it.type==='shield')C.inventory.forEach(x=>{if(x.type==='shield')x.equipped=false});
  it.equipped=!it.equipped;persist();render();
}
function toggleWieldWeapon(i){
  const it=C.inventory[i];if(!it||it.type!=='weapon')return;
  if(it.wielded)it.wielded=false;
  else if((it.qty||1)>1){it.qty--;C.inventory.splice(i,0,{...it,qty:1,wielded:true,grip:'one-handed'})}
  else it.wielded=true;
  persist();render();
}
function setWeaponGrip(i,grip){
  const it=C.inventory[i],w=it&&WEAPONS.find(x=>x[0]===it.id);
  if(!w||!w[5].includes('Универсальное')||!['one-handed','two-handed'].includes(grip))return;
  it.grip=grip;persist();render();
}
function applyStartingKit(){
  if(!confirm('Добавить стартовое снаряжение классов в инвентарь?'))return;
  C.inventory=[];
  C.classes.forEach(c=>{
    const choice=(C.equipChoice[c.cls]||'а');
    const se=STARTING_EQUIPMENT[c.cls];
    if(!se)return;
    const opts=se.choices;
    const chosen=opts.find(o=>o.name===choice)||opts[0];
    const all=[...(chosen?chosen.items:[]),...(se.defaults||[])];
    all.forEach(entry=>{
      const [kind,a,b]=entry;
      if(kind==='weapon')addItem('weapon',a,typeof b==='number'?b:1);
      else if(kind==='weaponAny'){ // берём первый подходящий
        const [cat,melee]=[a.includes('martial')?'martial':'simple',a.includes('melee')];
        const w=WEAPONS.find(x=>x[7]===cat&&(melee?x[6]==='melee':true));
        if(w)addItem('weapon',w[0],1);
      }
      else if(kind==='armor')addItem('armor',a,1);
      else if(kind==='shield')addItem('shield','shield',1);
      else if(kind==='ammo')addItem('gear',a,1);
      else if(kind==='gear')addItem('gear',a,1);
      else if(kind==='pack')addItem('pack',a,1);
      else if(kind==='instrument')addItem('instrument',a,1);
    });
  });
  // надеть первый доспех
  const arm=C.inventory.find(i=>i.type==='armor');if(arm)arm.equipped=true;
  persist();render();
}
function attacksHtml(){
  const weapons=(C.inventory||[]).filter(i=>i.type==='weapon');
