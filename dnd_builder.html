00 футов","comp":"В, С, М","dur":"Концентрация, до 10 минут","ritual":false,"desc":"урон 4d10 (колющий); спасбросок Телосложения; на высоких уровнях: усиливается (1d10)","full":"Рой кусачей саранчи заполняет сферу с радиусом 20 футов с центром на точке, выбранной вами в пределах дистанции. Сфера огибает углы. Сфера существует, пока активно заклинание, и её местность слабо заслонена. Пространство сферы является труднопроходимой местностью.\n\nКогда сфера появляется, все находящиеся в ней существа должны совершить спасбросок Телосложения. Существо получает колющий урон 4к10 при провале, или половину урона при успехе.\n\nСущества должны также совершать этот спасбросок Телосложения когда впервые за ход входят в область заклинания или оканчивают там ход.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 6 уровня или выше, урон увеличивается на 1к10 за каждый уровень ячейки выше пятого.","translationSource":"5e14.ttg.club"},{"id":"flame_strike","ru":"Небесный огонь","en":"Flame Strike","lvl":5,"school":"воплощение","cls":["cleric","paladin","warlock"],"time":"1 действие","range":"60 футов","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"урон 4d6 (огнём); урон 4d6 (излучением); спасбросок Ловкости; на высоких уровнях: усиливается (1d6)","full":"В указанном вами месте возникает вертикальная колонна божественного пламени.\n\nВсе существа в цилиндре с радиусом 10 футов и высотой 40 футов с центром на точке в пределах дистанции должны совершить спасбросок Ловкости, при провал существо получает 4к6 урона излучением и 4к6 урона огнем если проваливает спасбросок, или половину этого урона при успехе.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 6 уровня или выше, урон излучением или урон огнём (на ваш выбор) увеличивается на 1к6 за каждый уровень ячейки выше пятого.","translationSource":"5e14.ttg.club"},{"id":"geas","ru":"Обет","en":"Geas","lvl":5,"school":"очарование","cls":["bard","cleric","druid","paladin","wizard"],"time":"1 минута","range":"60 футов","comp":"В","dur":"30 дней","ritual":false,"desc":"урон 5d10 (психический); спасбросок Мудрости; на высоких уровнях: усиливается","full":"Вы отдаёте магическую команду существу, видимому в пределах дистанции, заставляя его оказать некую услугу или наоборот, не совершать чего-либо.\n\nЕсли существо может вас понять, оно должно преуспеть в спасброске Мудрости, иначе оно станет очарованным вами на время действия заклинания.\n\nПока существо очаровано вами, оно получает 5к10 урона психической энергией каждый раз, когда действует, противореча вашим инструкциям, но не чаще одного раза за день.\n\nСущество, не способное вас понять, не попадает под действие этого заклинания. Вы можете отдать любую команду, кроме той, что однозначно будет самоубийственной.\n\nЕсли вы отдадите такую команду, заклинание оканчивается. Вы можете окончить заклинание преждевременно, потратив на это Действие..\n\nЗаклинания снятие проклятья [remove curse], высшее восстановление [greater restoration] и исполнение желаний [wish] тоже оканчивают его.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 7 или 8 уровня, длительность равна 1 году. Если вы накладываете это заклинание, используя ячейку 9 уровня, заклинание длится, пока не будет окончено одним из упомянутых выше заклинаний.","translationSource":"5e14.ttg.club"},{"id":"cloudkill","ru":"Облако смерти","en":"Cloudkill","lvl":5,"school":"вызов","cls":["druid","sorcerer","wizard"],"time":"1 действие","range":"120 футов","comp":"В, С","dur":"Концентрация, до 10 минут","ritual":false,"desc":"урон 5d8 (ядом); спасбросок Телосложения; на высоких уровнях: усиливается (1d8)","full":"Вы создаёте сферу с радиусом 20 футов из ядовитого жёлто-зелёного тумана с центром на точке, выбранной вами в пределах дистанции. Этот туман огибает углы. Он существует, пока активно заклинание, или пока сильный ветер его не развеет, окончив длительность.\n\nЕго пространство — сильно заслонённая местность. Когда существо впервые за ход входит в область заклинания или начинает там ход, оно должно совершить спасбросок Телосложения. Существо получает 5к8 урона ядом при провале или половину этого урона в случае успеха.\n\nСущество попадает под действие заклинания даже если задерживает дыхание или вообще не должно дышать. Облако в начале каждого вашего хода перемещается на 10 футов прочь от вас, катясь по поверхности. Испарения, будучи тяжелее воздуха, стекаются вниз, и даже могут проникать в отверстия.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 6 уровня или выше, урон увеличивается на 1к8 за каждый уровень ячейки выше пятого.","translationSource":"5e14.ttg.club"},{"id":"commune","ru":"Общение","en":"Commune","lvl":5,"school":"прорицание","cls":["cleric","paladin"],"time":"1 минута","range":"На себя","comp":"В, С, М","dur":"1 минута","ritual":true,"desc":"","full":"Вы связываетесь со своим божеством или божественным посредником и задаёте три вопроса, на которые можно ответить «да» или «нет». Вы должны задать вопросы пока заклинание активно. На каждый вопрос вы получаете правильный ответ. Божественные создания не всегда всеведущи, поэтому вы можете получить ответ «неясно», если вопрос находится вне компетенции божества.\n\nЕсли односложный ответ может ввести в заблуждение или противоречит интересам божества, Мастер может выдать короткую фразу.\n\nЕсли вы накладываете это заклинание несколько раз до завершения продолжительного отдыха, существует накопительный шанс 25 процентов за каждое использование, начиная со второго, что вы не получите ответ. Мастер совершает этот бросок скрытно.","translationSource":"5e14.ttg.club"},{"id":"commune_with_nature","ru":"Общение с природой","en":"Commune with Nature","lvl":5,"school":"прорицание","cls":["druid","paladin","ranger"],"time":"1 минута","range":"На себя","comp":"В, С","dur":"Мгновенная","ritual":true,"desc":"","full":"Вы ненадолго сливаетесь с природой и получаете знание об окружающей территории. На открытом воздухе заклинание даёт вам знание о землях в пределах 3 миль. В пещерах и естественном подземном окружении радиус 300 футов.\n\nЗаклинание не действует там, где природа заменена конструкциями, например, в городах и подвалах.\n\nВы мгновенно получаете знание о трёх фактах на ваш выбор о следующих особенностях местности:\n\nместность и водоёмы\nпреобладающие растения, минералы, животные и разумные существа\nмощные исчадия, небожители, нежить, феи и элементали\nвлияние с других планов существования\nстроения\n\nНапример, вы можете определить местонахождение мощной нежити, местонахождение чистой воды для питья и местонахождение окрестных поселений.","translationSource":"5e14.ttg.club"},{"id":"raise_dead","ru":"Оживление","en":"Raise Dead","lvl":5,"school":"некромантия","cls":["bard","cleric","paladin"],"time":"1 час","range":"Касание","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы возвращаете к жизни мёртвое существо, которого касаетесь, при условии, что оно мертво не более 10 дней. Если душа этого существа может воссоединиться с телом и хочет этого, существо воскрешается с 1 хитом.\n\nЭто заклинание также нейтрализует все яды и исцеляет немагические болезни, бывшие у существа в момент смерти. Однако это заклинание не снимает магические болезни, проклятья и подобные эффекты; если их не снять до накладывания этого заклинания, они снова начнут действовать, когда существо оживёт.\n\nЭто заклинание не может оживить нежить. Это заклинание исцеляет все раны, но не восстанавливает отсутствующие части тела. Если у существа отсутствуют жизненно важные части тела — например, голова — заклинание автоматически проваливается.\n\nВозвращение к жизни — тяжёлое испытание. Цель получает штраф −4 ко всем броскам атаки, спасброскам и проверкам характеристик. Каждый раз, когда цель заканчивает продолжительный отдых, штраф уменьшается на 1, пока не исчезнет полностью.","translationSource":"5e14.ttg.club"},{"id":"animate_objects","ru":"Оживление вещей","en":"Animate Objects","lvl":5,"school":"преобразование","cls":["bard","sorcerer","wizard"],"time":"1 действие","range":"120 футов","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"на высоких уровнях: усиливается","full":"По вашему приказу оживают предметы. Выберите до десяти немагических предмета в пределах дистанции, которые никто не несёт и не носит. Цели Среднего размера считаются за два предмета, Большие цели считаются за четыре предмета, Огромные цели считаются за восемь предметов. Оживлять предметы с размером больше Огромного нельзя.\n\nВсе цели оживают и становятся существами под вашим контролем до окончания действия заклинания или пока их хиты не уменьшатся до 0.\n\nВы можете бонусным действием мысленно отдать приказ существу, созданному этим заклинанием, если оно находятся в пределах 500 футов от вас (если вы контролируете несколько существ, вы можете отдавать один и тот же приказ любому количеству из них одновременно).\n\nВы решаете, какое действие совершит это существо, и куда оно переместится в следующем ходу, или вы можете отдать общий приказ, например, охранять комнату или коридор. Если вы не отдадите команду, существо будет всего лишь защищаться от врагов. Получив приказ, существо продолжает его выполнять, пока задача не будет выполнена.\n\nПараметры оживлённого предмета\n\nРазмер\tХиты\tКД\tАтака\tСил\tЛов\nКрошечный\t20\t18\t+8 к атаке, урон 1к4 + 4\t4\t18\nМаленький\t25\t16\t+6 к атаке, урон 1к8 + 2\t5\t14\nСредний\t40\t13\t+5 к атаке, урон 2к6 + 1\t10\t12\nБольшой\t50\t10\t+6 к атаке, урон 2к10 + 2\t14\t10\nОгромный\t80\t10\t+8 к атаке, урон 2к12 + 4\t18\t6\n\nОживлённый предмет является конструктом с КД, хитами, атаками, Силой и Ловкостью, зависящими от его размера. Его Телосложение 10, Интеллект и Мудрость 3, а Харизма 1. Его скорость 30 футов; если у предмета нет ног или других придатков, которые можно использовать для перемещения, то он получает скорость полёта 30 футов и может парить.\n\nЕсли предмет прикреплён к поверхности или большему предмету, например, это цепь, прикреплённая к стене, его скорость равна 0. Он обладает слепым зрением в радиусе 30 футов и ничего не воспринимает за этими пределами. Когда хиты оживлённого предмета опускаются до 0, он возвращает себе свой обычный облик, а излишний урон переносится на оригинальный облик.\n\nЕсли вы приказываете предмету атаковать, он может совершить одну рукопашную атаку по существу в пределах 5 футов от него. Он совершает размашистую атаку с бонусом атаки и дробящим уроном, зависящим от его размера. Мастер может постановить, что этот предмет причиняет рубящий или колющий урон.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 6 уровня или выше, вы можете оживить два дополнительных предмета за каждый уровень ячейки выше пятого.","translationSource":"5e14.ttg.club"},{"id":"planar_binding","ru":"Планарные узы","en":"Planar Binding","lvl":5,"school":"ограждение","cls":["bard","cleric","druid","wizard"],"time":"1 час","range":"60 футов","comp":"В, С, М","dur":"24 часа","ritual":false,"desc":"спасбросок Харизмы; на высоких уровнях: усиливается","full":"При помощи этого заклинания вы можете попытаться подчинить исчадие, небожителя, фею или элементаля. Существо должно находиться в пределах дистанции весь период накладывания заклинания (обычно для этого существо призывается в центр вывернутого магического круга).\n\nВ конце накладывания заклинания цель должна совершить спасбросок Харизмы. При провале она должна служить вам, пока заклинание активно.\n\nЕсли существо было призвано или создано другим заклинанием, то длительность того заклинания увеличивается, чтобы совпадать с длительностью этого заклинания.\n\nПодчинённое существо должно выполнять ваши инструкции. Вы можете приказать ему сопровождать вас в приключении, охранять место, или передать послание. Существо выполняет ваши инструкции буквально, и если оно враждебно по отношению к вам, оно будет искать возможность помешать вам.\n\nЕсли существо выполняет ваши инструкции до того как заклинание оканчивается, оно отправляется к вам, чтобы сообщить об этом, если вы с ним находитесь на одном плане существования.\n\nЕсли вы находитесь на разных планах, оно возвращается к месту, где вы подчинили его, и остаётся там, пока заклинание не окончится.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку большего уровня, длительность увеличивается до 10 дней при использовании ячейки 6 уровня, 30 дней при использовании ячейки 7 уровня, 180 дней при использовании ячейки 8 уровня, и года и одного дня при использовании ячейки 9 уровня.","translationSource":"5e14.ttg.club"},{"id":"dominate_person","ru":"Подчинение личности","en":"Dominate Person","lvl":5,"school":"очарование","cls":["bard","cleric","sorcerer","warlock","wizard"],"time":"1 действие","range":"60 футов","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Мудрости; на высоких уровнях: усиливается","full":"Вы пытаетесь взять под контроль гуманоида, которого видите в пределах дистанции. Он должен преуспеть в спасброске Мудрости, иначе станет очарованным вами на время действия заклинания.\n\nЕсли вы или дружественные вам существа сражаются с ним, он совершает спасбросок с преимуществом.\n\nПока существо очаровано, вы обладаете телепатической связью с ним, пока вы оба находитесь на одном плане существования. При помощи этой связи вы можете отдавать ему команды, пока находитесь в сознании (действие не требуется), и оно должно будет их выполнять.\n\nВы можете указать общее действие, такое как «атакуй вон то существо», «беги отсюда» или «принеси вот это». Если существо выполняет приказ и не получает дальнейших указаний от вас, оно в меру своих сил обороняется и защищает себя.\n\nВы можете Действием захватить полный контроль над целью. До конца вашего следующего хода существо совершает только выбранные вами действия, и не делает ничего, что вы ему не позволяете. В это время вы можете заставлять существо совершать реакции, но при этом вы тратите и свою реакцию тоже.\n\nКаждый раз, когда цель получает урон, она совершает новый спасбросок Мудрости от этого заклинания. В случае успеха заклинание оканчивается.\n\nНа более высоких уровнях: Если вы накладываете это заклинание с уровнем ячейки 6, концентрацию можно поддерживать до 10 минут. Если вы накладываете это заклинание с уровнем ячейки 7, концентрацию можно поддерживать до 1 часа. Если вы накладываете это заклинание с уровнем ячейки 8 или выше, концентрацию можно поддерживать до 8 часов.","translationSource":"5e14.ttg.club"},{"id":"antilife_shell","ru":"Преграда жизни","en":"Antilife Shell","lvl":5,"school":"ограждение","cls":["druid"],"time":"1 действие","range":"На себя","comp":"В, С","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"От вас исходит мерцающий барьер с радиусом 10 футов, перемещающийся вместе с вами, остающийся с центром на вас, и защищающий вас от всех существ кроме нежити и конструктов. Барьер существует всё время, пока активно заклинание. Этот барьер не даёт указанным существам проходить и тянуться через него. Указанные существа могут накладывать заклинания и совершать атаки сквозь преграду дальнобойным оружием и оружием со свойством «досягаемость». Если вы перемещаетесь так, что указанное существо будет вынуждено пройти сквозь барьер, заклинание оканчивается.","translationSource":"5e14.ttg.club"},{"id":"seeming","ru":"Притворство","en":"Seeming","lvl":5,"school":"иллюзия","cls":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"30 футов","comp":"В, С","dur":"8 часов","ritual":false,"desc":"спасбросок Харизмы","full":"Это заклинание позволяет вам менять облик любого количества существ, видимых вами в пределах дистанции. Вы даёте каждой выбранной цели новый, иллюзорный облик.\n\nНесогласная цель может совершить спасбросок Харизмы, и в случае успеха заклинание на неё не действует.\n\nЭто заклинание маскирует внешний облик, а также одежду, доспехи, оружие и снаряжение. Вы можете сделать каждое существо на 1 фут (30 сантиметров) ниже или выше, и сделать его худого, толстого или обычного сложения. Вы не можете менять вид тела цели, так что у неё должен быть такой же набор конечностей.\n\nВо всём остальном иллюзию определяете вы. Вы можете закончить действие заклинания досрочно, потратив действие. Изменения, внесённые этим заклинанием, не проходят проверку физическим исследованием.\n\nНапример, если заклинание добавит шляпу к снаряжению персонажа, предметы будут проходить сквозь неё, и все, кто коснутся её, либо не почувствуют ничего, либо почувствуют голову и волосы.\n\nЕсли вы сделаете себя более худым, то рука того, кто захочет к вам прикоснуться, ударится о вас, не дойдя до видимых очертаний. Существо может Действием осмотреть цель и совершить проверку Интеллекта (Анализ) против Сл ваших заклинаний. В случае успеха оно поймёт, что облик ненатурален.","translationSource":"5e14.ttg.club"},{"id":"awaken","ru":"Пробуждение разума","en":"Awaken","lvl":5,"school":"преобразование","cls":["bard","druid"],"time":"8 часов","range":"Касание","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"","full":"Потратив время на прокладывание магических каналов в драгоценном камне, вы касаетесь им зверя или растения с размером не больше Огромного. У цели либо не должно быть значения Интеллекта, либо Интеллект должен быть не больше 3.\n\nЦель получает Интеллект 10. Цель также получает способность говорить на одном известном вам языке.\n\nЕсли цель — растение, оно получает возможность шевелить ветками, корнями, лианами, и так далее, и получает чувства, подобные человеческим. Мастер подбирает параметры для пробуждённого растения, будь то куст или дерево.\n\nПробуждённый зверь или растение очарован вами 30 дней, либо пока вы или ваши спутники не причините ему вред. Когда очарование спадает, пробуждённое существо решает, останется ли оно к вам дружелюбно, в зависимости от того, как вы с ним обращались.","translationSource":"5e14.ttg.club"},{"id":"dispel_evil_and_good","ru":"Рассеивание добра и зла","en":"Dispel Evil and Good","lvl":5,"school":"ограждение","cls":["cleric","paladin"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Харизмы; атака заклинанием","full":"Вас окружает мерцающая энергия, защищающая от фей, нежити и существ, происходящих не с Материального Плана. Пока заклинание активно, исчадия, небожители, нежить, феи и элементали совершают по вам броски атаки с помехой.\n\nВы можете закончить заклинание преждевременно, выбрав один из представленных ниже вариантов:\n\nИзгнание. Вы совершаете Действием рукопашную атаку заклинанием по исчадию, небожителю, нежити, фее или элементалю в пределах досягаемости. При попадании вы пытаетесь изгнать существо на его родной план. Существо должно преуспеть в спасброске Харизмы, иначе оно будет отправлено на свой родной план (если только оно уже не находится там). Нежить отправляется в Царство Теней, а феи в Страну Фей.\nПоломка чар. Вы Действием касаетесь существа, до которого можете дотянуться, и которое очаровано, испугано или одержимо исчадием, небожителем, нежитью, феей или элементалем. Это существо перестаёт быть очарованным, испуганным или одержимым такими существами.","translationSource":"5e14.ttg.club"},{"id":"reincarnate","ru":"Реинкарнация","en":"Reincarnate","lvl":5,"school":"преобразование","cls":["druid"],"time":"1 час","range":"Касание","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы касаетесь мёртвого гуманоида или части мёртвого гуманоида. Если это существо мертво не более 10 дней, заклинание формирует для него новое взрослое тело и зовёт душу занять его.\n\nЕсли душа цели не свободна или не хочет новое тело, заклинание проваливается. Новое тело для существа создаёт магия, и раса существа может измениться.\n\nМастер бросает к100 и сверяется с таблицей, чтобы определить, в каком теле будет жить существо, либо же выбирает тело самостоятельно.\n\nк100\tРаса\n01–04\tДраконорождённый\n05–13\tДварф, холмовой\n14–21\tДварф, горный\n22–25\tЭльф, тёмный\n26–34\tЭльф, высший\n35–42\tЭльф, лесной\n43–46\tГном, лесной\n47–52\tГном, скальный\n53–56\tПолуэльф\n57–60\tПолуорк\n61–68\tПолурослик, легконогий\n69–76\tПолурослик, коренастый\n77–96\tЧеловек\n97–00\tТифлинг\n\nРеинкарнировавшее существо помнит свою прошлую жизнь и переживания. Оно сохраняет все способности, бывшие в прежнем теле, но раса меняется на новую, изменяя расовые особенности.","translationSource":"5e14.ttg.club"},{"id":"contact_other_plane","ru":"Связь с иным миром","en":"Contact Other Plane","lvl":5,"school":"прорицание","cls":["warlock","wizard"],"time":"1 минута","range":"На себя","comp":"В","dur":"1 минута","ritual":true,"desc":"урон 6d6 (психический); спасбросок Интеллекта","full":"Вы мысленно связываетесь с полубогом, духом давно умершего мудреца или другой таинственной сущностью с другого плана существования.\n\nКонтакт с иномировой сущностью может ослабить или даже повредить ваш рассудок.\n\nНакладывая это заклинание, вы совершаете спасбросок Интеллекта со Сл 15. При провале вы получаете 6к6 урона психической энергией и становитесь безумным до окончания продолжительного отдыха.\n\nБудучи безумным, вы не можете совершать Действия, не можете понимать речь других существ, не можете читать и можете только неразборчиво бормотать.\n\nЗаклинание высшее восстановление [greater restoration], наложенное на вас, оканчивает этот эффект.\n\nПри успешном спасброске вы можете задать сущности до пяти вопросов. Вы должны задать вопросы до того как окончится заклинание. На все вопросы Мастер отвечает односложно, например, «да», «нет», «может быть», «никогда» или «неясно» (если сущность не знает ответ).\n\nЕсли односложный ответ может ввести в заблуждение, Мастер может произнести короткую фразу.","translationSource":"5e14.ttg.club"},{"id":"hallow","ru":"Святилище","en":"Hallow","lvl":5,"school":"воплощение","cls":["cleric","warlock"],"time":"24 часа","range":"Касание","comp":"В, С, М","dur":"Пока не рассеяно","ritual":false,"desc":"спасбросок Харизмы","full":"Вы касаетесь точки и наполняете область вокруг неё святой (или нечестивой) силой. Область может иметь радиус до 60 футов. Заклинание проваливается, если в этот радиус попадает область, уже находящаяся под действием заклинания святилище.\n\nНаполненная область подвергается следующим эффектам:\n\nВо-первых, исчадия, небожители, нежить, феи и элементали не могут войти в эту область, и не могут делать существ, находящихся внутри, очарованными, испуганными и одержимыми. Все существа, очарованные, испуганные или одержимые такими существами, перестают быть очарованными, испуганными и одержимыми, входя в эту область. Вы можете исключить из эффекта один или несколько видов существ.\nВо-вторых, вы можете привязать к области дополнительный эффект. Выберите один эффект из прилагающегося списка, или выберите эффект, предложенный Мастером. Некоторые из этих эффектов применяются к существам, находящимся в области; вы можете указать, будет ли он применяться ко всем существам, существам, служащим определённому божеству или лидеру, или существам определённого вида, например, оркам и троллям.\n\nКогда существо, попадающее под действие эффекта, входит в область заклинания впервые за ход или начинает там ход, оно может совершить спасбросок Харизмы. В случае успеха существо игнорирует дополнительный эффект, пока не покинет эту область.\n\nВечный покой. Мёртвые тела, похороненные в области, не могут стать нежитью.\nВмешательство в путешествия между измерениями. Затронутые существа не могут перемещаться и путешествовать, используя телепортацию или перемещение между измерениями и планами.\nДневной свет. Область освещается ярким светом. Магическая тьма, созданная заклинаниями с уровнем меньше уровня ячейки, использованной вами для накладывания этого заклинания, не может затмить свет.\nЗащита от энергии. Затронутые существа в области получают сопротивление к одному виду урона на ваш выбор кроме дробящего, колющего и рубящего.\nСтрах. Затронутые существа испуганы, пока находятся в области.\nТемнота. Область заполняется темнотой. Обычный свет, а также магический свет, созданный заклинаниями, с уровнем меньше уровня ячейки, использованной вами для накладывания этого заклинания, не могут осветить область.\nТишина. Звуки не покидают границы области, и не проникают снаружи внутрь.\nУязвимость энергии. Затронутые существа в области получают уязвимость к одному виду урона на ваш выбор кроме дробящего, колющего и рубящего.\nХрабрость. Затронутые существа не могут быть испуганы, пока находятся в области.\nЯзыки. Затронутые существа могут общаться с любыми другими существами, находящимися в области, даже если у них нет общего языка.","translationSource":"5e14.ttg.club"},{"id":"wall_of_force","ru":"Силовая стена","en":"Wall of Force","lvl":5,"school":"воплощение","cls":["wizard"],"time":"1 действие","range":"120 футов","comp":"В, С, М","dur":"Концентрация, до 10 минут","ritual":false,"desc":"","full":"Невидимая стена из силового поля появляется в точке, выбранной вами в пределах дистанции. Стена появляется, будучи ориентированной в любом направлении: горизонтальном, вертикальном или наклонённом. Она может свободно парить, а может опираться на твёрдую поверхность.\n\nВы можете создать её полусферой-куполом или сферой с радиусом до 10 футов, или можете сформировать плоскую поверхность, состоящую из плит 10 × 10 футов, количество которых может доходить до десяти.\n\nКаждая плита должна соседствовать как минимум с одной другой плитой. Какая бы форма ни была у стены, её толщина всегда 1/4 дюйма (6 миллиметров). Она существует, пока активно заклинание. Если стена при появлении проходит по пространству существа, это существо выталкивается по одну из сторон стены (на ваш выбор).\n\nНичто не может физически пройти сквозь эту стену. Она обладает иммунитетом ко всем видам урона, и не может быть рассеяна заклинанием рассеиванием магии [dispel magic].\n\nЗаклинание распад [disintegrate] полностью уничтожает стену.\n\nСтена простирается и на Эфирный План, блокируя эфирные перемещения сквозь себя.","translationSource":"5e14.ttg.club"},{"id":"passwall","ru":"Создание прохода","en":"Passwall","lvl":5,"school":"преобразование","cls":["druid","wizard"],"time":"1 действие","range":"30 футов","comp":"В, С, М","dur":"1 час","ritual":false,"desc":"","full":"В точке, которую вы видите в пределах дистанции на деревянной, оштукатуренной или каменной поверхности (такой как стена, потолок или пол) появляется проход, существующий, пока активно заклинание. Вы сами определяете габариты прохода: до 5 футов в ширину, до 8 футов в высоту и до 20 футов в глубину.\n\nЭтот проход не дестабилизирует само строение. Когда проход исчезает, все существа и предметы, всё ещё находящиеся в нём, безопасно выталкиваются в свободное пространство, ближайшее к поверхности, на которой вы активировали это заклинание.","translationSource":"5e14.ttg.club"},{"id":"creation","ru":"Сотворение","en":"Creation","lvl":5,"school":"иллюзия","cls":["sorcerer","wizard"],"time":"1 минута","range":"30 футов","comp":"В, С, М","dur":"Special","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вы зачерпываете теневую материю в Царстве Теней и создаёте в пределах дистанции неживой предмет из растительной материи: ткань, верёвку, древесину, или что-то подобное. Вы также можете этим заклинанием создавать минеральную материю, такую как камни, кристаллы и металлы.\n\nСоздаваемый предмет должен помещаться в куб с длиной ребра 5 футов, и должен иметь форму и материю, которые вы раньше видели. Длительность зависит от создаваемого материала. Если предмет составлен из нескольких материалов, используется самая короткая длительность.\n\nМатериал\tДлительность\nРастительная материя\t1 день\nКамень или кристалл\t12 часов\nДрагоценные металлы\t1 час\nДрагоценные камни\t10 минут\nАдамантин или мифрил\t1 минута\n\nИспользование материи, созданной этим заклинанием, в качестве материального компонента для другого заклинания, вызывает провал этого заклинания.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 6 уровня или выше, длина ребра куба увеличивается на 5 футов за каждый уровень ячейки выше пятого.","translationSource":"5e14.ttg.club"},{"id":"telekinesis","ru":"Телекинез","en":"Telekinesis","lvl":5,"school":"преобразование","cls":["sorcerer","warlock","wizard"],"time":"1 действие","range":"60 футов","comp":"В, С","dur":"Концентрация, до 10 минут","ritual":false,"desc":"","full":"Вы получаете способность перемещать силой мысли существ и предметы, а также манипулировать ими.\n\nКогда вы накладываете это заклинание, а также в каждом последующем раунде, новым Действием, вы можете воздействовать на одно существо или предмет, видимый в пределах дистанции, вызывая один из описанных ниже эффектов. Вы можете действовать на одну и ту же цель, а можете каждый раз выбирать новую.\n\nЕсли вы меняете цель, предыдущая перестаёт быть под действием этого заклинания.\n\nПредмет. Вы можете попытаться переместить предмет, весящий до 1 000 фунтов. Если предмет не несут и не носят, вы автоматически перемещаете его на 30 футов в любом направлении, но не за пределы дистанции заклинания. Если предмет несёт или носит существо, вы должны совершить проверку базовой характеристики, противопоставив её проверке Силы существа. Если вы выиграете проверку, вы вырываете предмет у этого существа, и можете переместить его на 30 футов в любом направлении, но не за пределы дистанции заклинания.\n\nВы очень хорошо контролируете предмет телекинетической хваткой, так что можете манипулировать простыми инструментами, открывать двери и контейнеры, доставать и убирать предметы из открытых контейнеров, а также выливать содержимое сосудов.\n\nСущество. Вы можете попытаться переместить существо с размером не больше Огромного. Совершите проверку своей базовой характеристики, противопоставив её проверке Силы существа.\n\nЕсли вы выиграете проверку, вы перемещаете существо на 30 футов в любом направлении, включая вверх, но не за пределы дистанции заклинания. До конца вашего следующего хода существо становится опутанным телекинетической хваткой. Существо, поднятое вверх, висит в воздухе. В последующих раундах вы можете Действием пытаться поддерживать телекинетический захват существа, повторяя встречную проверку.","translationSource":"5e14.ttg.club"},{"id":"hold_monster","ru":"Удержание чудовища","en":"Hold Monster","lvl":5,"school":"очарование","cls":["bard","cleric","paladin","sorcerer","warlock","wizard"],"time":"1 действие","range":"90 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Выберите существо, которое видите в пределах дистанции. Цель должна преуспеть в спасброске Мудрости, иначе станет парализованной на период действия заклинания.\n\nЭто заклинание не оказывает эффекта на нежить. В конце каждого своего хода цель может совершать новые спасброски Мудрости. В случае успеха заклинание на этой цели оканчивается.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 6 уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше пятого. Эти существа должны находиться в пределах 30 футов друг от друга, когда вы нацеливаетесь на них.","translationSource":"5e14.ttg.club"},{"id":"mislead","ru":"Фальшивый двойник","en":"Mislead","lvl":5,"school":"иллюзия","cls":["bard","wizard"],"time":"1 действие","range":"На себя","comp":"С","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"Вы становитесь невидимым, и в то же время в том месте, где вы были, появляется ваш иллюзорный двойник. Двойник существует, пока заклинание активно, но невидимость оканчивается, если вы атакуете или накладываете заклинание.\n\nВы можете Действием переместить своего иллюзорного двойника на расстояние, вдвое превышающее вашу скорость, и заставить его жестикулировать, говорить и вести себя так, как вам хочется.\n\nВы можете видеть его глазами и слышать его ушами, как если бы вы находились там же, где он.\n\nВ каждом своём ходу вы можете бонусным действием переключиться с его чувств на свои, или обратно. Пока вы используете его чувства, вы считаетесь ослеплённым и глухим для своего окружения","translationSource":"5e14.ttg.club"},{"id":"magic_jar","ru":"Волшебный сосуд","en":"Magic Jar","lvl":6,"school":"некромантия","cls":["wizard"],"time":"1 минута","range":"На себя","comp":"В, С, М","dur":"Пока не рассеяно","ritual":false,"desc":"спасбросок Харизмы","full":"Ваше тело впадает в кататоническое состояние, так как душа покидает его и входит в контейнер, выбранный материальным компонентом. Пока ваша душа обитает в контейнере, вы воспринимаете своё окружение, как если бы находились в пространстве контейнера.\n\nВы не можете перемещаться и использовать реакции. Единственное действие, которое вы можете совершать, это проецирование души на 100 футов от контейнера, чтобы либо вернуться в своё тело (окончив этим заклинание), либо попытаться овладеть телом другого гуманоида.\n\nВы можете попытаться овладеть гуманоидом, находящимся в пределах 100 футов от вас и видимым вами (нельзя овладевать существами, защищёнными заклинаниями защита от добра и зла и магический круг).\n\nЦель должна совершить спасбросок Харизмы. При провале ваша душа перемещается в тело цели, а её душа становится запертой в контейнере. При успехе цель сопротивляется вашим попыткам овладеть ею, и вы не можете повторно пытаться овладеть ею в течение 24 часов.\n\nОвладев телом существа, вы начинаете его контролировать. Ваши игровые параметры заменяются параметрами существа, но вы сохраняете своё мировоззрение и значения Интеллекта, Мудрости и Харизмы. Вы сохраняете преимущества от своих классовых умений.\n\nЕсли у цели есть уровни в классах, вы не можете использовать её классовые умения. Тем временем душа одержимого существа может воспринимать своё окружение из контейнера при помощи своих чувств, но не может перемещаться и не может совершать никаких действий.\n\nЗахватив тело, вы можете действием вернуться из него в контейнер, если он находится в пределах 100 футов, возвращая душу существа в его тело. Если тело носителя умирает, пока вы в нём находитесь, существо умирает, а вы должны совершить спасбросок Харизмы со Сл своего же заклинания. При успехе вы возвращаетесь в контейнер, если он находится в пределах 100 футов. В противном случае вы умираете.\n\nЕсли контейнер уничтожается или заклинание оканчивается, ваша душа мгновенно возвращается в ваше тело. Если ваше тело находится далее чем в 100 футах, или если ваше тело мертво, когда вы пытаетесь в него вернуться, вы умираете.\n\nЕсли в контейнере, который был уничтожен, находилась душа другого существа, эта душа возвращается в своё тело, если оно живо и находится в пределах 100 футов. В противном случае это существо умирает. Когда заклинание оканчивается, контейнер уничтожается.","translationSource":"5e14.ttg.club"},{"id":"conjure_fey","ru":"Вызов феи","en":"Conjure Fey","lvl":6,"school":"вызов","cls":["druid","warlock"],"time":"1 минута","range":"90 футов","comp":"В, С","dur":"Концентрация, до 1 часа","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вы призываете фейское существо с показателем опасности 6 или меньше, или фейского духа, который принимает облик зверя с показателем опасности 6 или меньше. Существо появляется в свободном месте, которое вы видите в пределах дистанции. Оно исчезает, когда его хиты опускаются до 0, или когда заклинание оканчивается.\n\nФейское существо дружественно к вам и вашим спутникам, пока заклинание активно. Совершите проверку инициативы за существо, и оно будет совершать свои собственные ходы. Оно подчиняется отданным вами устно командам (действие не требуется), если они не противоречат его мировоззрению.\n\nЕсли вы не отдаёте команду, оно защищается от враждебных существ, но действий не совершает. Если ваша концентрация нарушена, существо не исчезает. Вместо этого вы теряете над ним контроль, и оно становится враждебным к вам и вашим спутникам, и может напасть.\n\nНеуправляемое существо не может быть отпущено вами, но он исчезает через 1 час после того, как оно было призвано. Параметры фейского существа есть у Мастера.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 7 уровня или выше, показатель опасности увеличивается на 1 за каждый уровень ячейки выше шестого.","translationSource":"5e14.ttg.club"},{"id":"move_earth","ru":"Движение почвы","en":"Move Earth","lvl":6,"school":"преобразование","cls":["druid","sorcerer","wizard"],"time":"1 действие","range":"120 футов","comp":"В, С, М","dur":"Концентрация, up to 2 hours","ritual":false,"desc":"","full":"Выберите в пределах дистанции область с длиной стороны не больше 40 футов. Пока заклинание активно, вы можете менять поверхность земли, песка или глины. Вы можете увеличить или уменьшить высоту, создать или засыпать ров, поднять или сравнять стены, и даже формировать колонны. Высота таких изменений не может превышать половины самой большой стороны области.\n\nТаким образом, если вы воздействуете на квадрат с длиной стороны 40 футов, вы можете создать колонну высотой до 20 футов, поднять или опустить землю на расстояние до 20 футов, выкопать траншею глубиной до 20 футов, и так далее. Изменения вступают в силу в течение 10 минут.\n\nВ конце каждых 10 минут концентрации на этом заклинании вы можете выбрать новую область, чтобы подействовать на неё. Из-за того, что трансформация местности происходит медленно, обычно, существа не могут попасть в плен или получить урон из-за движений почвы.\n\nЭто заклинание не может манипулировать естественным камнем и каменными строениями. Камни и строения сдвигаются, приспосабливаясь к новой местности.\n\nЕсли изменение местности сделает строение неустойчивым, оно может разрушиться. Это заклинание также не действует на растения. Перемещаемая почва уносит с собой и растения.","translationSource":"5e14.ttg.club"},{"id":"drawmijs_instant_summons","ru":"Дромиджево появление","en":"Drawmij's Instant Summons","lvl":6,"school":"вызов","cls":["wizard"],"time":"1 минута","range":"Касание","comp":"В, С, М","dur":"Пока не рассеяно","ritual":true,"desc":"","full":"Вы касаетесь предмета, весящего не более 10 фунтов, и достигающего в длину не более 6 футов. Заклинание оставляет невидимую метку на его поверхности и невидимое название предмета на сапфире, использованном в качестве материального компонента.\n\nПри каждом использовании этого заклинания вы должны использовать новый сапфир. В любой момент впоследствии вы можете Действием произнести название предмета и раздавить сапфир. Предмет мгновенно появляется в вашей руке, вне зависимости от расстояния и планов, разделяющих вас, а заклинание оканчивается.\n\nЕсли этот предмет несёт или держит другое существо, уничтожение сапфира не переносит предмет к вам, но вы узнаёте, кто им сейчас владеет, и где это существо сейчас примерно находится.\n\nЗаклинание рассеивание магии [dispel magic] и аналогичные эффекты, успешно наложенные на сапфир, оканчивают эффект заклинания.","translationSource":"5e14.ttg.club"},{"id":"programmed_illusion","ru":"Заданная иллюзия","en":"Programmed Illusion","lvl":6,"school":"иллюзия","cls":["bard","wizard"],"time":"1 действие","range":"120 футов","comp":"В, С, М","dur":"Пока не рассеяно","ritual":false,"desc":"","full":"Вы создаёте иллюзию предмета, существа или другого видимого явления в пределах дистанции, активирующуюся при выполнении особых условий. Пока условия не выполнены, иллюзия будет неразличима. Она должна помещаться в куб с длиной ребра 30 футов, и вы при накладывании заклинания определяете, как иллюзия будет себя вести, и какие звуки она будет издавать.\n\nЗаготовленные действия могут длиться до 5 минут. Когда указанное вами условие будет выполнено, иллюзия проявляется и выполняет описанные вами действия. Как только иллюзия закончит действовать, она исчезает и остаётся спящей 10 минут. После этого иллюзия может быть снова активирована. Условие может быть простым или замысловатым, но оно должно основываться на видимом или слышимом событии, способном произойти в пределах 30 футов от области.\n\nНапример, вы можете создать иллюзию себя, появляющегося и предупреждающего тех, кто попытается открыть дверь с ловушкой, или же иллюзия может проявляться только когда существо произносит правильное слово или фразу.\n\nФизическое взаимодействие с образом даёт понять, что это иллюзия, потому что сквозь него всё проходит. Существа, исследующие образ действием, могут определить, что это иллюзия, совершив успешную проверку Интеллекта (Анализ) против Сл ваших заклинаний. Если существо распознаёт иллюзию, оно может видеть сквозь неё, и издаваемые ей звуки тоже становятся незначащими.","translationSource":"5e14.ttg.club"},{"id":"forbiddance","ru":"Запрет","en":"Forbiddance","lvl":6,"school":"ограждение","cls":["cleric"],"time":"10 минут","range":"Касание","comp":"В, С, М","dur":"24 часа","ritual":true,"desc":"","full":"Вы создаёте защиту от магического перемещения, покрывающую до 40 000 квадратных футов пола и 30 футов над полом. Пока заклинание активно, существа не могут телепортироваться в эту область и использовать порталы, например, созданные заклинанием врата, чтобы входить в эту область.\n\nЭто заклинание предотвращает и перемещения между планами, поэтому защищает от перемещений с Астрального Плана, Эфирного Плана, из Страны Фей, Царства Теней, а также от заклинания уход в иной мир [plane shift].\n\nКроме того, это заклинание причиняет урон всем существам вида, выбираемого вами при его накладывании. Выберите один или несколько видов существ: исчадия, небожители, нежить, феи и элементали. Когда существо выбранного вида впервые за ход входит в пространство заклинания или начинает в нём ход, оно получает 5к10 урона излучением или некротической энергией (вид урона выбираете вы при накладывании заклинания).\n\nКогда вы накладываете это заклинание, можете указать пароль. Существо, произносящее пароль при входе в эту местность, не получает урон от этого заклинания.\n\nПространство этого заклинания не может перекрываться с пространством другого заклинания запрет. Если вы накладываете заклинание запрет каждый день в течение 30 дней в одном и том же месте, заклинание длится, пока не будет рассеяно, и материальные компоненты последнего накладывания тратятся.","translationSource":"5e14.ttg.club"},{"id":"true_seeing","ru":"Истинное зрение","en":"True Seeing","lvl":6,"school":"прорицание","cls":["bard","cleric","sorcerer","warlock","wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"1 час","ritual":false,"desc":"","full":"Заклинание даёт согласному существу, которого вы коснулись, способность видеть вещи такими, какими они являются на самом деле.\n\nПока заклинание активно, это существо обладает истинным зрением, видит потайные двери, сокрытые магией, и его зрение простирается на Эфирный План, и всё это в пределах 120 футов.","translationSource":"5e14.ttg.club"},{"id":"circle_of_death","ru":"Круг смерти","en":"Circle of Death","lvl":6,"school":"некромантия","cls":["sorcerer","warlock","wizard"],"time":"1 действие","range":"150 футов","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"урон 8d6 (некротический); спасбросок Телосложения; на высоких уровнях: усиливается (2d6)","full":"Из точки в пределах дистанции расходится сфера негативной энергии с радиусом 60 футов. Все существа в этой области должны совершить спасбросок Телосложения. Цель получает урон некротической энергией 8к6 при провале или половину этого урона в случае успеха.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 7 уровня или выше, урон увеличивается на 2к6 за каждый уровень ячейки выше шестого.","translationSource":"5e14.ttg.club"},{"id":"wall_of_ice","ru":"Ледяная стена","en":"Wall of Ice","lvl":6,"school":"воплощение","cls":["wizard"],"time":"1 действие","range":"120 футов","comp":"В, С, М","dur":"Концентрация, до 10 минут","ritual":false,"desc":"урон 10d6 (холодом); урон 5d6 (холодом); спасбросок Ловкости; на высоких уровнях: усиливается (2d6)","full":"Вы создаёте стену изо льда на твёрдой поверхности в пределах дистанции. Вы можете сформировать её в виде купола полусферы или сферы с радиусом до 10 футов, или же вы можете создать плоскую поверхность, состоящую из десяти квадратных плит с длиной ребра 10 футов.\n\nКаждая плита должна быть смежна с другой плитой. Какая бы форма ни была у стены, у неё толщина 1 фут (30 сантиметров), и существует она пока активно заклинание.\n\nЕсли стена при появлении проходит по пространству существа, это существо выталкивается по одну из сторон стены и совершает спасбросок Ловкости. При провале существо получает 10к6 урона холодом или половину этого урона при успехе.\n\nСтена является предметом, которому можно причинить урон и, тем самым, пробить. У каждой 10-футовой секции КД 12 и по 30 хитов, а также уязвимость к урону огнём. Уменьшение хитов плиты до 0 уничтожает её, и оставляет в воздухе область холодного воздуха.\n\nСущество, впервые за ход перемещающееся через эту область холодного воздуха, должно совершить спасбросок Телосложения. Это существо получает 5к6 урона холодом при провале или половину этого урона при успехе.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 7 уровня или выше, урон, причиняемый стеной при возникновении, увеличивается на 2к6, а урон от прохождения через область холодного воздуха увеличивается на 1к6 за каждый уровень ячейки выше шестого.","translationSource":"5e14.ttg.club"},{"id":"mass_suggestion","ru":"Множественное внушение","en":"Mass Suggestion","lvl":6,"school":"очарование","cls":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"60 футов","comp":"В, М","dur":"24 часа","ritual":false,"desc":"спасбросок Мудрости; на высоких уровнях: усиливается","full":"Вы внушаете определённый курс действий (ограниченный одной-двумя фразами) и магически влияете на двенадцать существ на свой выбор, видимых в пределах дистанции, которые могут слышать и понимать вас.\n\nСущества, которые не могут быть очарованы, обладают иммунитетом к этому эффекту.\n\nВнушение должно быть сформировано так, чтобы действие звучало разумным. Просьбы ударить себя мечом, броситься на копьё, сжечь себя, или как-то иначе причинить себе вред отменяют эффект заклинания. Каждая цель должна совершить спасбросок Мудрости. При провале она следует заданному курсу действий.\n\nВнушённые действия могут продолжаться всю длительность заклинания. Если внушённую деятельность можно выполнить за меньший срок, заклинание оканчивается, когда субъект оканчивает порученную задачу.\n\nВы можете также указать условие, которое запустит особое действие во время действия заклинания.\n\nНапример, вы можете внушить группе солдат, чтобы они отдали все свои деньги первому встреченному нищему. Если до окончания действия условие не будет выполнено, деятельность не совершается. Если вы или кто-то из ваших спутников причиняют урон существу, находящемуся под действием этого заклинания, для этого существа заклинание оканчивается.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 7 уровня, длительность равна 10 дням. Если вы используете ячейку 8 уровня, длительность равна 30 дням. Если вы используете ячейку 9 уровня, длительность равна 1 году и 1 дню.","translationSource":"5e14.ttg.club"},{"id":"ottos_irresistible_dance","ru":"Неудержимая пляска Отто","en":"Otto's Irresistible Dance","lvl":6,"school":"очарование","cls":["bard","wizard"],"time":"1 действие","range":"30 футов","comp":"В","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Ловкости","full":"Выберите одно существо, видимое в пределах дистанции. Цель начинает смешно танцевать на месте, шаркая ногами, притоптывая и подпрыгивая. Существа, которые не могут быть очарованы, обладают иммунитетом к этому заклинанию. Танцующее существо должно использовать всё своё перемещение на танец, не покидая своё пространство и получая помеху к спасброскам Ловкости и броскам атаки.\n\nПока цель находится под действием этого заклинания, другие существа совершают с преимуществом броски атаки по нему.\n\nТанцующее существо может Действием совершить спасбросок Мудрости, чтобы вернуть контроль над телом. При успехе заклинание заканчивается.","translationSource":"5e14.ttg.club"},{"id":"flesh_to_stone","ru":"Окаменение","en":"Flesh to Stone","lvl":6,"school":"преобразование","cls":["warlock","wizard"],"time":"1 действие","range":"60 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Телосложения","full":"Вы пытаетесь сделать каменным одно существо, которое видите в пределах дистанции. Если тело цели состоит из плоти, она должна совершить спасбросок Телосложения. При провале она становится опутанной, так как плоть начитает отвердевать. В случае успеха существо не попадает под действие заклинания.\n\nСущество, опутанное этим заклинанием, должно совершать спасброски Телосложения в конце каждого своего хода. Если оно успешно спасается от этого заклинания три раза, оно оканчивается. Если оно провалит спасбросок три раза, оно превращается в камень и получает состояние окаменевшее на время длительности заклинания.\n\nУспехи и провалы не обязаны быть последовательными; отслеживайте их отдельно, пока не накопится три вида чего-то одного.\n\nЕсли существо физически ломается, будучи окаменевшим, при возвращении в обычное тело оно сохраняет все полученные деформации.\n\nЕсли вы сохраняете концентрацию на этом заклинании до максимально возможного времени, существо становится окаменевшим до снятия эффекта.","translationSource":"5e14.ttg.club"},{"id":"otilukes_freezing_sphere","ru":"Отилюков ледяной шар","en":"Otiluke's Freezing Sphere","lvl":6,"school":"воплощение","cls":["wizard"],"time":"1 действие","range":"300 футов","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"урон 10d6 (холодом); спасбросок Телосложения; на высоких уровнях: усиливается (1d6)","full":"Шарик холодной энергии слетает с ваших пальцев и устремляется к точке на ваш выбор в пределах дистанции, где взрывается сферой с радиусом 60 футов. Все существа в этой области должны совершить спасбросок Телосложения. При провале существо получает 10к6 урона холодом или половину этого урона при успехе.\n\nЕсли шар попадает в воду или жидкость, состоящую в основном из воды (исключая водных существ), он замораживает жидкость на глубину 6 дюймов в пределах квадрата с длиной стороны 30 футов. Лёд существует 1 минуту.\n\nСущества, плававшие по поверхности замороженной воды, сковываются льдом. Скованное существо может действием совершать проверки Силы против Сл ваших заклинаний, чтобы высвободиться.\n\nЕсли хотите, можете не метать шар после накладывания этого заклинания. В этом случае в вашей руке появляется маленький прохладный шарик размером со снаряд для пращи. В любое время вы или существо, которому вы отдадите шарик, можете метнуть его рукой (дистанция 40 футов) или из пращи (обычная дистанция пращи). При столкновении он взрывается с тем же эффектом, что и при обычном использовании этого заклинания.\n\nВы можете уничтожить шарик, не взрывая его. Через 1 минуту, если шарик ещё не взорвался, он взрывается.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 7 уровня или выше, урон увеличивается на 1к6 за каждый уровень ячейки выше шестого.","translationSource":"5e14.ttg.club"},{"id":"heroes_feast","ru":"Пир героев","en":"Heroes' Feast","lvl":6,"school":"вызов","cls":["cleric","druid"],"time":"10 минут","range":"30 футов","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"спасбросок Мудрости","full":"Вы организовываете шикарный пир, включая великолепные пищу и питьё. Пир совершается в течение 1 часа, и исчезает по прошествии этого времени, но положительные эффекты не вступают в силу, пока этот час не пройдёт. В пире могут принимать участие до двенадцати1 существ. Существо, принявшее участие в пиршестве, получает несколько преимуществ.\n\nОно излечивается от всех болезней и ядов, приобретает иммунитет к ядам и состоянию испуга, совершает спасброски Мудрости с преимуществом. Максимум его хитов увеличивается на 2к10, и оно получает такое же количество хитов.\n\nВсе эти преимущества длятся 24 часа.","translationSource":"5e14.ttg.club"},{"id":"planar_ally","ru":"Планарный союзник","en":"Planar Ally","lvl":6,"school":"вызов","cls":["cleric"],"time":"10 минут","range":"60 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы просите иномировую сущность оказать помощь. Сущность должна быть известна вам: это может быть бог, предтеча, демонический повелитель или другая сущность космического масштаба. Эта сущность посылает вам своего верного небожителя, элементаля или исчадие, создавая его в свободном пространстве в пределах дистанции.\n\nЕсли вы знаете имя конкретного существа, вы можете произнести его в момент накладывания заклинания, чтобы попросить прислать его, но вы всё равно можете получить другое существо (на выбор Мастера).\n\nКогда существо появляется, оно не обязано что-либо делать. Вы можете просить его выполнить услугу в обмен на некую плату, но оно не обязано соглашаться. Услуга может быть как простой (перелёт над пропастью, помощь в сражении), так и комплексной (слежка за врагом, защита во время исследования подземелья).\n\nДля заключения сделки вы должны иметь возможность как-то общаться с существом.\n\nПлата может быть разной. Небожитель может потребовать пожертвования золота или магических предметов для храма, а исчадие может потребовать жертвоприношение существа или сокровища в дар.\n\nНекоторые существа могут обменивать свои услуги на ваши услуги. Обычно задание, длительность которого можно измерить минутами, стоит по 100 зм за минуту. Задание, измеряемое часами, требует 1 000 за час. Задача, измеряемая днями (не более 10 дней) требует 10 000 зм за каждый день. Мастер может корректировать размер оплаты, основываясь на обстоятельствах, в которых вы используете это заклинание. Если задача связана с характером существа, оплата может быть уменьшена вдвое или вообще устранена. Неопасные задачи обычно требуют половину оплаты, а особо опасные поручения могут требовать увеличенной награды.\n\nСущества редко соглашаются на самоубийственные задания. Выполнив поручение, или после оговорённого срока существо возвращается на свой домашний план после отчёта вам, если это не противоречит задаче и вообще возможно.\n\nЕсли вы не сошлись в цене, существо мгновенно возвращается на домашний план. Существо, которому поручено войти в состав вашего отряда, считается его членом, и получает свою долю опыта.","translationSource":"5e14.ttg.club"},{"id":"chain_lightning","ru":"Пляшущая молния","en":"Chain Lightning","lvl":6,"school":"воплощение","cls":["sorcerer","wizard"],"time":"1 действие","range":"150 футов","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"урон 10d8 (электричеством); спасбросок Ловкости; на высоких уровнях: усиливается","full":"Вы создаёте разряд молнии, которая дугой бьёт цель, выбранную и видимую вами в пределах дистанции. Затем три разряда перепрыгивают с неё на другие цели, которых может быть не больше трёх, каждая из которых должна находиться в пределах 30 футов от первой цели.\n\nЦель может быть существом или предметом, и может быть целью только одного разряда. Цель должна совершить спасбросок Ловкости. Цель получает урон электричеством 10к8 при провале спасброска или половину этого урона в случае успеха.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 7 уровня или выше, из первой цели бьёт дополнительный разряд в другую цель за каждый уровень ячейки выше шестого.","translationSource":"5e14.ttg.club"},{"id":"find_the_path","ru":"Поиск пути","en":"Find the Path","lvl":6,"school":"прорицание","cls":["bard","cleric","druid"],"time":"1 минута","range":"На себя","comp":"В, С, М","dur":"Концентрация, до 24 часов","ritual":false,"desc":"","full":"Это заклинание позволяет найти кратчайший и самый прямой путь к определённому месту, знакомому вам, находящемуся на том же плане существования. Если искомое место находится на другом плане существования, если это место перемещается (например, это передвижная крепость), или это не конкретное место (например, «логово зелёного дракона»), заклинание проваливается.\n\nПока заклинание активно, и пока вы находитесь на одном плане существования с искомым местом, вы знаете, как далеко, и в каком направлении оно находится.\n\nПока вы направляетесь туда, каждый раз, когда у вас появляются разные варианты направления, вы автоматически определяете, какой путь самый короткий и прямой (но не обязательно самый безопасный) к искомому месту.","translationSource":"5e14.ttg.club"},{"id":"heal","ru":"Полное исцеление","en":"Heal","lvl":6,"school":"воплощение","cls":["cleric","druid"],"time":"1 действие","range":"60 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Выберите существо, видимое в пределах дистанции. Поток положительной энергии омывает его, восстанавливая 70 хитов. Это заклинание также отменяет слепоту, глухоту и все болезни, действующие на цель. Это заклинание не оказывает эффекта на конструктов и нежить.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 7 уровня или выше, количество восстанавливаемых хитов увеличивается на 10 за каждый уровень ячейки выше шестого.","translationSource":"5e14.ttg.club"},{"id":"harm","ru":"Поражение","en":"Harm","lvl":6,"school":"некромантия","cls":["cleric"],"time":"1 действие","range":"60 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"урон 14d6 (некротический); спасбросок Телосложения","full":"Вы насылаете смертельную болезнь на существо, которое видите в пределах дистанции.\n\nЦель должна совершить спасбросок Телосложения. В случае провала она получает урон некротической энергией 14к6, или половину этого урона в случае успеха.\n\nЭтот урон не может опустить хиты цели ниже 1.\n\nЕсли цель проваливает спасбросок, то на 1 час максимум её хитов уменьшается на количество, равное полученному урону некротической энергией. Все эффекты, лечащие болезнь, позволяют досрочно вернуть максимум хитов.","translationSource":"5e14.ttg.club"},{"id":"contingency","ru":"Предосторожность","en":"Contingency","lvl":6,"school":"воплощение","cls":["wizard"],"time":"10 минут","range":"На себя","comp":"В, С, М","dur":"10 дней","ritual":false,"desc":"","full":"Выберите заклинание 5 уровня или ниже, которое вы можете сотворить, у которого время накладывания 1 действие, и которое может нацеливаться на вас. Вы активируете это заклинание частью накладывания предосторожности, тратя ячейки заклинаний для обоих, но эффект заготовленного заклинания не проявляется. Этот эффект вступает в силу когда произойдёт определённое условие. Вы описываете это условие когда накладываете оба заклинания.\n\nНапример, предосторожность, сотворённая в паре с подводным дыханием, может сделать так, что подводное дыхание начнёт действовать когда вы окажетесь в воде или подобной жидкости. Заготовленное заклинание вступает в действие мгновенно после того как условие впервые будет выполнено, хотите вы того или нет, и после этого предосторожность заканчивается.\n\nЗаготовленное заклинание оказывает эффект только на вас, даже если в обычных обстоятельствах может нацеливаться на других.\n\nВы можете использовать только одно заклинание предосторожность одновременно. Если вы накладываете это заклинание ещё раз, эффект предыдущей предосторожности оканчивается.\n\nКроме того, предосторожность заканчивается, если материальный компонент перестанет быть в вашем распоряжении.","translationSource":"5e14.ttg.club"},{"id":"transport_via_plants","ru":"Путешествие через растения","en":"Transport via Plants","lvl":6,"school":"вызов","cls":["druid"],"time":"1 действие","range":"10 футов","comp":"В, С","dur":"1 раунд","ritual":false,"desc":"","full":"Это заклинание создаёт магическую связь между неоживлённым растением с размером не меньше Большого, находящимся в пределах дистанции, и другим растением, находящимся на любом расстоянии на том же плане существования.\n\nВы должны до этого хотя бы раз видеть или касаться растения, служащего местом назначения. Пока заклинание активно, все существа могут входить в целевое растение и выходить из растения, служащего местом назначения, использовав всего 5 футов перемещения.","translationSource":"5e14.ttg.club"},{"id":"eyebite","ru":"Разящее око","en":"Eyebite","lvl":6,"school":"некромантия","cls":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Мудрости","full":"Пока заклинание активно, ваши глаза становятся абсолютно чёрными, наполнившись жуткой энергией. Одно существо на ваш выбор в пределах 60 футов от вас, которое вы видите, должно преуспеть в спасброске Мудрости, иначе на время длительности заклинания оно попадает под действие одного из выбранных вами эффектов.\n\nВ каждый свой ход, пока заклинание активно, вы можете действием нацелиться на другое существо, если только оно не совершило успешный спасбросок от этого разящего ока.\n\nПаника. Цель испугана вами. В каждый свой ход испуганное существо должно совершать действие Рывок и перемещаться прочь от вас по самому безопасному и короткому из возможных маршруту, если ей есть куда перемещаться. Если цель окажется на расстоянии как минимум 60 футов от вас, в месте, в котором ей вас не видно, этот эффект заканчивается.\n\nСлабость. Цель совершает с помехой броски атаки и проверки характеристик. В конце каждого своего хода она сможет совершить ещё один спасбросок Мудрости. В случае успеха эффект заканчивается.\n\nСон. Цель теряет сознание. Она просыпается, если получает урон или другое существо действием потрясёт его, чтобы разбудить.","translationSource":"5e14.ttg.club"},{"id":"disintegrate","ru":"Распад","en":"Disintegrate","lvl":6,"school":"преобразование","cls":["sorcerer","wizard"],"time":"1 действие","range":"60 футов","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"урон 10d6 + 40 (силовым уроном); спасбросок Ловкости; на высоких уровнях: усиливается (3d6)","full":"Тонкий зелёный луч вылетает из вашего указательного пальца в цель, которую вы видите в пределах дистанции. Цель может быть существом, предметом или творением из магической силы, например, стеной, созданной заклинанием силовая стена [wall of force].\n\nСущество, ставшее целью этого заклинания, должно преуспеть в спасброске Ловкости, иначе получит 10к6 + 40 урона силовым полем. Если после получения этого урона у цели остаётся 0 хитов, то она распадается.1\n\nРаспавшееся существо, а также всё, что оно несло и носило, кроме магических предметов, превращается в кучку мелкого серого порошка. Такое существо можно вернуть к жизни только посредством заклинания истинное воскрешение [true resurrection] или исполнение желаний [wish].\n\nЭто заклинание вызывает автоматический распад немагических предметов и творений из магической силы с размером не больше Большого.\n\nЕсли цель — предмет или творение из магической силы с размером Огромное или больше, заклинание вызывает распад его части в кубе с длиной ребра 10 футов.\n\nНа магические предметы это заклинание не действует.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 7 уровня или выше, урон увеличивается на 3к6 за каждый уровень ячейки выше шестого.","translationSource":"5e14.ttg.club"},{"id":"word_of_recall","ru":"Слово возврата","en":"Word of Recall","lvl":6,"school":"вызов","cls":["cleric"],"time":"1 действие","range":"5 футов","comp":"В","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы и до пяти согласных существ в пределах 5 футов от вас мгновенно телепортируетесь в заранее подготовленное святилище. Вы и телепортирующиеся с вами существа появляетесь в свободном пространстве, ближайшем к месту, указанному вами при подготовке святилища (смотрите ниже).\n\nЕсли вы активируете это заклинание, не подготовив святилище, заклинание не оказывает никакого эффекта. Вы должны подготовить святилище, активировав это же заклинание в таком месте как храм, посвящённом или сильно связанном с вашим божеством. Если вы попытаетесь активировать это заклинание в месте, не связанном с вашим божеством, заклинание не окажет никакого эффекта.","translationSource":"5e14.ttg.club"},{"id":"sunbeam","ru":"Солнечный луч","en":"Sunbeam","lvl":6,"school":"воплощение","cls":["druid","sorcerer","wizard"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"урон 6d8 (излучением); спасбросок Телосложения","full":"Луч ярчайшего света исходит из вашей ладони линией шириной 5 футов и длиной 60 футов. Все существа в этой линии должны совершить спасбросок Телосложения. При провале существо получает 6к8 урона излучением и становится ослеплённым до вашего следующего хода. При успехе оно получает половину урона и не ослепляется.\n\nНежить и слизи совершают этот спасбросок с помехой. Пока заклинание активно, вы можете Действием создавать новые линии света. Пока заклинание активно, в вашей руке светится яркая искра. Она испускает яркий свет в пределах 30 футов и тусклый свет в пределах ещё 30 футов.\n\nЭто свет идентичен солнечному.","translationSource":"5e14.ttg.club"},{"id":"create_undead","ru":"Сотворение нежити","en":"Create Undead","lvl":6,"school":"некромантия","cls":["cleric","warlock","wizard"],"time":"1 минута","range":"10 футов","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вы можете накладывать это заклинание только ночью. Выберите до трёх трупов гуманоидов Среднего или Маленького размера в пределах дистанции. Все трупы становятся упырями [ghoul] под вашим контролем.\n\nВ каждом своём ходу вы можете бонусным действием мысленно приказать любому существу, оживлённому этим заклинанием, если оно находится в пределах 120 футов от вас (если вы контролируете сразу несколько существ, можете отдать одну и ту же команду сразу нескольким из них). Вы решаете, какое действие это существо совершит, и куда оно переместится в свой следующий ход, или же вы можете отдать общий приказ, например, охранять конкретную комнату или коридор. Если вы не отдадите команду, существо будет всего лишь защищаться от врагов. Получив приказ, существо продолжает его выполнять, пока задача не будет выполнена.\n\nСущество находится под вашим контролем 24 часа, после чего перестаёт слушаться команд. Для поддержания контроля ещё на 24 часа вы должны активировать это заклинание на него ещё раз до окончания 24-часового периода. Такое использование заклинания только поддерживает контроль над уже созданными существами, количество которых не может быть больше трёх, и не оживляет новых.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 7 уровня, вы оживляете или продлеваете контроль над четырьмя упырями [ghoul]. Если вы накладываете это заклинание, используя ячейку 8 уровня, вы оживляете или продлеваете контроль над пятью упырями [ghoul] или двумя вурдалаками [ghast] или умертвиями [wight]. Если вы накладываете это заклинание, используя ячейку 9 уровня, вы оживляете или продлеваете контроль над шестью упырями [ghoul], тремя вурдалаками [ghast] или умертвиями [wight], или двумя мумиями [mummy].","translationSource":"5e14.ttg.club"},{"id":"blade_barrier","ru":"Стена клинков","en":"Blade Barrier","lvl":6,"school":"воплощение","cls":["cleric"],"time":"1 действие","range":"90 футов","comp":"В, С","dur":"Концентрация, до 10 минут","ritual":false,"desc":"урон 6d10 (рубящий); спасбросок Ловкости","full":"Вы создаёте вертикальную стену из крутящихся бритвенно-острых клинков из магической энергии. Стена появляется в пределах дистанции и существует столько, сколько активно это заклинание.\n\nВы можете создать прямую стену длиной 100 футов, высотой 20 футов и толщиной 5 футов, или закольцованную стену диаметром 60 футов, высотой 20 футов и толщиной 5 футов.\n\nСтена предоставляет существам, находящимся за ней, укрытие на три четверти, и её пространство является труднопроходимой местностью.\n\nКогда существо впервые за ход входит в пространство стены или начинает там ход, оно должно совершить спасбросок Ловкости. При провале существо получает рубящий урон 6к10. При успешном спасброске существо получает половину урона.","translationSource":"5e14.ttg.club"},{"id":"guards_and_wards","ru":"Стражи","en":"Guards and Wards","lvl":6,"school":"ограждение","cls":["bard","wizard"],"time":"10 минут","range":"Касание","comp":"В, С, М","dur":"24 часа","ritual":false,"desc":"","full":"Вы создаёте защиту, охраняющую 2 500 квадратных футов пола (квадрат с длиной стороны 50 футов, сто клеток 5 × 5 футов или двадцать пять квадратов с длиной стороны 10 футов).\n\nОхраняемая область может быть до 20 футов в высоту и может иметь любую форму. Вы можете защитить несколько этажей крепости, поделив их на части, при условии, что во время накладывания этого заклинания вы можете туда попасть.\n\nПри накладывании заклинания вы можете указать тех, кто не будет попадать под действие одного или всех выбранных вами эффектов. Вы можете также указать пароль, произношение которого дарует иммунитет к этим эффектам.\n\nЗаклинание стражи создаёт в охраняемой местности следующие эффекты:\n\nДвери. Все двери в охраняемой области запираются магией, как если бы они были закрыты заклинанием волшебный замок [arcane lock]. Кроме того, вы можете покрыть до десяти дверей иллюзией (эквивалентной функции «иллюзорный предмет» заклинания малая иллюзия), заставляя их выглядеть как гладкая стена.\nКоридоры. Коридоры заполняются туманом, делающим местность сильно заслоненной. Кроме того, на каждом перекрёстке или развилке, где есть выбор направления, есть 50% шанс того, что существо (но не вы) будет считать, что идёт в сторону, противоположную той, в которую она на самом деле идёт.\nЛестницы. Все лестницы в охраняемой области сверху донизу заполняются паутиной, как от одноимённого заклинания. Нити восстанавливаются через 10 минут, если их сожгут или разрежут, а заклинание стражи ещё активно.\n\nПрочие эффекты заклинания. Вы можете добавить к охраняемой области один из следующих эффектов:\n\nПоместите пляшущие огоньки [dancing lights] в четыре коридора. Вы можете задать простую последовательность, которую огоньки будут выполнять, пока активно заклинание стражи.\nПоместите волшебные уста [magic mouth] в два места.\nПоместите зловонное облако [stinking cloud] в два места. Испарения появляются в указанных вами местах. Облака возвращаются через 10 минут, если рассеются ветром, а заклинание стражи ещё будет активно.\nПоместите постоянный порыв ветра [gust of wind] в один коридор или комнату.\nПоместите внушение [suggestion] в одно место. Выберите область с размером не больше клетки 5 × 5 футов, и все существа, входящие в эту область или проходящие по ней, мысленно воспринимают внушение.\n\nВся охраняемая область излучает магию.\n\nЗаклинание рассеивание магии [dispel magic] наложенное на конкретный эффект, в случае успеха устраняет только этот эффект.\n\nВы можете сделать эту магию постоянной, накладывая это заклинание каждый день в течение одного года.","translationSource":"5e14.ttg.club"},{"id":"globe_of_invulnerability","ru":"Сфера неуязвимости","en":"Globe of Invulnerability","lvl":6,"school":"ограждение","cls":["sorcerer","wizard"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вокруг вас возникает неподвижный слабо мерцающий барьер с радиусом 10 футов, существующий, пока активно заклинание. Все заклинания 5 уровня и ниже, наложенные снаружи барьера, не могут подействовать на существ и предметы, находящиеся внутри, даже если заклинание наложено с помощью ячейки большего уровня. Такие заклинания могут быть нацелены на существ и предметы, находящиеся внутри барьера, но не будут на них воздействовать. Пространство, защищённое барьером, тоже не включается в область действия таких заклинаний.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 7 уровня или выше, барьер защищает от заклинаний с уровнем на 1 больше за каждый уровень ячейки выше шестого.","translationSource":"5e14.ttg.club"},{"id":"wall_of_thorns","ru":"Терновая стена","en":"Wall of Thorns","lvl":6,"school":"вызов","cls":["druid"],"time":"1 действие","range":"120 футов","comp":"В, С, М","dur":"Концентрация, до 10 минут","ritual":false,"desc":"урон 7d8 (колющий); урон 7d8 (рубящий); спасбросок Ловкости; на высоких уровнях: усиливается (1d8)","full":"Вы создаёте стену из крепких, гибких, перевитых кустов с острыми как иглы шипами. Стена появляется в пределах дистанции на твёрдой поверхности и существует, пока активно заклинание.\n\nВы можете сделать стену до 60 футов в длину, до 10 футов в высоту и толщиной 5 футов или кругом с диаметром 20 футов, высотой до 20 футов и толщиной 5 футов. Эта стена блокирует линию обзора. Когда стена появляется, все существа, находящиеся в ней, должны совершить спасбросок Ловкости. При провале существо получает колющий урон 7к8, или половину этого урона при успехе.\n\nСущества могут проходить сквозь стену, но медленно и болезненно. За каждый 1 фут перемещения через стену существо должно потратить 4 фута перемещения. Кроме того, в первый раз за ход, когда существо входит в стену или оканчивает там ход, оно должно совершать спасбросок Ловкости. Оно получает рубящий урон 7к8 при провале, или половину этого урона при успехе.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 7 уровня или выше, оба вида урона увеличиваются на 1к8 за каждый уровень ячейки выше шестого.","translationSource":"5e14.ttg.club"},{"id":"wind_walk","ru":"Хождение по ветру","en":"Wind Walk","lvl":6,"school":"преобразование","cls":["druid"],"time":"1 минута","range":"30 футов","comp":"В, С, М","dur":"8 часов","ritual":false,"desc":"","full":"Вы и до десяти согласных существ, видимых вами в пределах дистанции, на время длительности заклинания принимаете газообразную форму, становясь лёгкими облачками.\n\nНаходясь в форме облака, существо получает скорость полёта 300 футов и сопротивление к урону от немагического оружия.\n\nЕдинственное действие, которое существо может совершать в этой форме, это Рывок или возвращение в естественную форму. Возврат занимает 1 минуту, во время которой существо недееспособно и не может перемещаться.\n\nПока заклинание активно, существо может вернуться в форму облака, для чего снова требуется преображение в течение 1 минуты. Если существо находится в форме облака и летит, когда оканчивается эффект, существо в течение 1 минуты снижается на 60 футов в раунд, пока не приземлится безопасно. Если через 1 минуту оно не сможет приземлиться, оно падает на оставшуюся дистанцию.","translationSource":"5e14.ttg.club"},{"id":"divine_word","ru":"Божественное слово","en":"Divine Word","lvl":7,"school":"воплощение","cls":["cleric"],"time":"1 бонусное действие","range":"30 футов","comp":"В","dur":"Мгновенная","ritual":false,"desc":"спасбросок Харизмы","full":"Вы произносите божественное слово, наделённое силой, сформировавшей мир на заре творения. Выберите любое количество существ, которых вы видите в пределах дистанции.\n\nВсе эти существа, слышащие вас, должны совершить спасбросок Харизмы. При провале существо попадает под действие эффекта, основанного на текущем количестве хитов:\n\n50 хитов или меньше: глухота на 1 минуту\n40 хитов или меньше: глухота и слепота на 10 минут\n30 хитов или меньше: слепота, глухота и ошеломление на 1 час\n20 хитов или меньше: моментальная смерть\n\nВне зависимости от текущих хитов, исчадия, небожители, феи и элементали, провалившие спасбросок, изгоняются на свой родной план (если только они уже там не находятся), и не могут вернуться на ваш текущий план в течение 24 часов кроме как посредством заклинания исполнение желаний [wish].","translationSource":"5e14.ttg.club"},{"id":"mordenkainens_magnificent_mansion","ru":"Великолепный особняк Морденкайнена","en":"Mordenkainen's Magnificent Mansion","lvl":7,"school":"вызов","cls":["bard","wizard"],"time":"1 минута","range":"300 футов","comp":"В, С, М","dur":"24 часа","ritual":false,"desc":"","full":"Вы создаёте межпространственное жилище в пределах дистанции, существующее, пока заклинание активно. Вы выбираете, где будет находиться единственный вход. Вход слабо светится; он 5 футов в ширину и 10 футов в высоту.\n\nВы и все существа, указанные вами при накладывании заклинания, можете входить в это жилище, пока дверь открыта. Вы можете открывать и закрывать дверь, если находитесь в пределах 30 футов от неё. Дверь невидима, когда закрыта. За дверью находится великолепная прихожая с многочисленными комнатами. Там свежий и тёплый воздух.\n\nВы можете создать любую планировку, но пространство не может превышать 50 кубов с длиной ребра в 10 футов. Это место украшено и обставлено мебелью так, как вы пожелаете. Там достаточно еды для 100 человек с девятью переменами блюд.\n\nВошедшим прислуживают 100 практически прозрачных слуг. Внешний облик и одежду этих слуг определяете вы. Они послушно исполняют все приказы. Каждый слуга может исполнять задачи, которые доступны любому человеческому слуге, но они не могут атаковать и совершать действия, причиняющие вред другому существу. Таким образом, слуги могут подавать вещи, чистить, штопать, гладить одежду, зажигать огни, подавать пищу, наливать вино и так далее. Слуги могут перемещаться по особняку, но не могут выходить из него.\n\nМебель и другие предметы, созданные этим заклинанием, превращаются в дым, если их вынесут из особняка. Когда заклинание заканчивается, все существа, находящиеся в межпространстве, изгоняются в свободное пространство, ближайшее к входу.\n\nВсе предметы, не созданные заклинанием, выбрасываются из особняка после завершения действия этого заклинания, и они появляются в ближайшем ко входу свободном пространстве.","translationSource":"5e14.ttg.club"},{"id":"resurrection","ru":"Воскрешение","en":"Resurrection","lvl":7,"school":"некромантия","cls":["bard","cleric"],"time":"1 час","range":"Касание","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы касаетесь существа, мёртвого не больше ста лет, умершего не от старости, и не являющегося нежитью. Если его душа свободна и согласна, цель возвращается к жизни с полными хитами.\n\nЭто заклинание нейтрализует все яды и исцеляет немагические болезни, бывшие у существа в момент смерти. Однако это заклинание не снимает магические болезни, проклятья и подобные эффекты; если их не снять до накладывания этого заклинания, они снова начнут действовать, когда существо оживёт.\n\nЭто заклинание исцеляет все раны и восстанавливает отсутствующие части тела.\n\nВозвращение к жизни — тяжёлое испытание. Цель получает штраф −4 ко всем броскам атаки, спасброскам и проверкам характеристик. Каждый раз, когда цель заканчивает длительный отдых, штраф уменьшается на 1, пока не исчезнет полностью.\n\nНакладывание этого заклинания для оживления существа, мёртвого больше года, сильно выматывает вас. Пока вы не окончите продолжительный отдых, вы не можете накладывать заклинания, и совершаете с помехой все броски атаки, проверки характеристик и спасброски.","translationSource":"5e14.ttg.club"},{"id":"conjure_celestial","ru":"Вызов небожителя","en":"Conjure Celestial","lvl":7,"school":"вызов","cls":["cleric"],"time":"1 минута","range":"90 футов","comp":"В, С","dur":"Концентрация, до 1 часа","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вы призываете небожителя с показателем опасности 4 или меньше, появляющегося в свободном месте, которое вы видите в пределах дистанции. Небожитель исчезает, когда его хиты опускаются до 0 или когда заклинание оканчивается.\n\nНебожитель дружественен к вам и вашим спутникам, пока заклинание активно. Совершите проверку инициативы за небожителя, и он будет совершать свои собственные ходы. Он подчиняется отданным вами
