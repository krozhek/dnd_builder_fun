йки выше первого.","translationSource":"5e14.ttg.club"},{"id":"goodberry","ru":"Чудо-ягоды","en":"Goodberry","lvl":1,"school":"преобразование","cls":["druid","ranger"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"","full":"В вашей руке появляются до десяти ягод, наполненных магией. Любое существо может действием съесть одну ягоду. Это восстанавливает 1 хит, и ягода настолько питательна, что насыщает существо на весь день. Ягоды теряют силу, если их не съесть через 24 часа после создания.","translationSource":"5e14.ttg.club"},{"id":"shield","ru":"Щит","en":"Shield","lvl":1,"school":"ограждение","cls":["sorcerer","wizard"],"time":"1 реакция","range":"На себя","comp":"В, С","dur":"1 раунд","ritual":false,"desc":"","full":"Невидимый барьер из магической силы появляется, защищая вас.\n\nВы получаете до начала своего следующего хода бонус +5 к КД, в том числе и против вызвавшей срабатывание атаки, и вы не получаете урон от заклинания волшебная стрела [magic missile].","translationSource":"5e14.ttg.club"},{"id":"shield_of_faith","ru":"Щит веры","en":"Shield of Faith","lvl":1,"school":"ограждение","cls":["cleric","paladin"],"time":"1 бонусное действие","range":"60 футов","comp":"В, С, М","dur":"Концентрация, до 10 минут","ritual":false,"desc":"","full":"Мерцающее поле появляется, окружая выбранное вами существо в пределах дистанции, даруя ему на время длительности бонус +2 к КД.","translationSource":"5e14.ttg.club"},{"id":"pass_without_trace","ru":"Бесследное передвижение","en":"Pass without Trace","lvl":2,"school":"ограждение","cls":["cleric","druid","ranger"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"От вас начинает исходить покров теней и тишины, скрывающий вас и ваших спутников от обнаружения.\n\nПока заклинание активно, все существа, выбранные вами в пределах 30 футов (включая вас) получают бонус +10 к проверкам Ловкости (Скрытность), и их нельзя выследить без помощи магии.\n\nСущество, получившее этот бонус, не оставляет за собой следов.","translationSource":"5e14.ttg.club"},{"id":"spiritual_weapon","ru":"Божественное оружие","en":"Spiritual Weapon","lvl":2,"school":"воплощение","cls":["cleric"],"time":"1 бонусное действие","range":"60 футов","comp":"В, С","dur":"1 минута","ritual":false,"desc":"атака заклинанием; на высоких уровнях: усиливается (1d8)","full":"Вы создаёте в пределах дистанции парящее призрачное оружие, существующее, пока заклинание активно, или пока вы не накладываете это заклинание ещё раз.\n\nКогда вы накладываете это заклинание, вы можете совершить рукопашную атаку заклинанием по существу, находящемуся в пределах 5 футов от оружия. При попадании цель получает урон силовым полем, равный 1к8 + модификатор вашей базовой характеристики.\n\nВы можете бонусным действием в свой ход переместить оружие на расстояние до 20 футов и повторить атаку по существу, находящемуся в пределах 5 футов от него.\n\nОружие может быть любой формы. Жрецы божеств, связанных с конкретным оружием (Святой Катберт известен своей булавой, а Тор [Thor] — молотом), создают эффект в виде именно такого оружия.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 3 уровня или выше, урон увеличивается на 1к8 за каждые две ячейки выше второго.","translationSource":"5e14.ttg.club"},{"id":"continual_flame","ru":"Вечный огонь","en":"Continual Flame","lvl":2,"school":"воплощение","cls":["cleric","wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"Пока не рассеяно","ritual":false,"desc":"","full":"Из предмета, которого вы касаетесь, исходит пламя, эквивалентное по яркости пламени факела [torch]. Эффект выглядит как обычное пламя, но не создаёт тепла и не использует кислород. Вечный огонь можно накрыть или спрятать, но не потушить.","translationSource":"5e14.ttg.club"},{"id":"see_invisibility","ru":"Видение невидимого","en":"See Invisibility","lvl":2,"school":"прорицание","cls":["bard","sorcerer","wizard"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"1 час","ritual":false,"desc":"","full":"Пока заклинание активно, вы видите невидимых существ и предметы, как если бы они были видимы, и ваше зрение простирается на Эфирный План.\n\nЭфирные существа и предметы выглядят призрачными и полупрозрачными.","translationSource":"5e14.ttg.club"},{"id":"suggestion","ru":"Внушение","en":"Suggestion","lvl":2,"school":"очарование","cls":["bard","cleric","sorcerer","warlock","wizard"],"time":"1 действие","range":"30 футов","comp":"В, М","dur":"Концентрация, до 8 часов","ritual":false,"desc":"спасбросок Мудрости","full":"Вы внушаете определённый курс действий (ограниченный одной-двумя фразами) существу, видимому в пределах дистанции, способному слышать и понимать вас.\n\nСущества, которые не могут быть очарованы, обладают иммунитетом к этому эффекту.\n\nВнушение должно быть сформировано так, чтобы действие звучало разумным (для существа которое является целью заклинания). Просьбы ударить себя мечом, броситься на копьё, сжечь себя, или как-то иначе причинить себе вред оканчивают заклинание.\n\nЦель должна совершить спасбросок Мудрости. При провале она следует заданному курсу действий. Внушённые действия могут продолжаться всю длительность заклинания. Если внушённую деятельность можно выполнить за меньший срок, заклинание оканчивается, когда субъект оканчивает порученную задачу.\n\nВы можете также указать условие, которое запустит особое действие во время действия заклинания.\n\nНапример, вы можете внушить рыцарю, чтобы он отдал своего боевого коня первому встреченному нищему. Если до окончания действия условие не будет выполнено, деятельность не совершается. Если вы или кто-то из ваших спутников причиняете урон цели, заклинание оканчивается.","translationSource":"5e14.ttg.club"},{"id":"magic_mouth","ru":"Волшебные уста","en":"Magic Mouth","lvl":2,"school":"иллюзия","cls":["bard","wizard"],"time":"1 минута","range":"30 футов","comp":"В, С, М","dur":"Пока не рассеяно","ritual":true,"desc":"","full":"Вы внедряете в предмет, находящийся в пределах дистанции, послание, которое будет произнесено, когда будут выполнены условия.\n\nВыберите видимый предмет, который не несёт и не носит другое существо. Произнесите послание, которое может состоять не более чем из 25 слов, хотя его можно произносить в течение 10 минут. Затем определите условие, выполнение которого заставит заклинание передать ваше послание.\n\nКогда условие будет выполнено, на предмете появляется магический рот, зачитывающий послание вашим голосом с той же самой громкостью. Если у выбранного вами предмета есть рот или что-то похожее на рот (например, рот статуи), магический рот появляется на его месте, и кажется, что слова исходят оттуда.\n\nПри накладывании заклинания вы можете сделать так, что заклинание окончится, передав сообщение, или же останется активным и будет повторять сообщение при каждом срабатывании условия. Вызывающее срабатывание условие может быть как общим, так и детализированным, но должно основываться на зрительных или слышимых условиях, происходящих в пределах 30 футов от предмета.\n\nНапример, вы можете заставить рот говорить, когда в пределах 30 футов от него пройдёт существо, или когда в пределах 30 футов от него зазвенит серебряный колокольчик.","translationSource":"5e14.ttg.club"},{"id":"arcane_lock","ru":"Волшебный замок","en":"Arcane Lock","lvl":2,"school":"ограждение","cls":["wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"Пока не рассеяно","ritual":false,"desc":"","full":"Вы касаетесь закрытой двери, окна, ворот, сундука или другого входа, и он становится запертым. Вы и указанные при накладывании этого заклинания существа можете открывать предмет как обычно.\n\nВы можете также установить пароль, произношение которого в пределах 5 футов от предмета подавляет заклинание на 1 минуту. В противном случае предмет не открывается, пока его не сломают, или пока заклинание не рассеют или не подавят.\n\nНакладывание заклинания открывания [knock] на предмет подавляет волшебный замок на 10 минут.\n\nНаходящийся под действием этого заклинания предмет гораздо сложнее взломать и открыть силой; Сл выламывания и взлома замков увеличивается на 10.","translationSource":"5e14.ttg.club"},{"id":"augury","ru":"Гадание","en":"Augury","lvl":2,"school":"прорицание","cls":["cleric"],"time":"1 минута","range":"На себя","comp":"В, С, М","dur":"Мгновенная","ritual":true,"desc":"","full":"Подбрасывая инкрустированные камнями палочки, драконьи кости, раскладывая карты или используя другие инструменты для ворожбы, вы получаете знамение от иномировой сущности о результатах особого действия, которое вы планируете совершить в течение следующих 30 минут. Мастер выбирает одно из следующих возможных знамений:\n\nБлаго, для хороших результатов\nГоре, для плохих результатов\nБлаго и горе, для результатов, одновременно хороших и плохих\nНичто, для результатов, которые и не хорошие и не плохие\n\nЗаклинание не принимает в расчёт обстоятельства, способные изменить исход, такие как накладывание дополнительных заклинаний или потерю или обретение спутников.\n\nЕсли вы накладываете это заклинание несколько раз до завершения продолжительного отдыха, существует накопительный шанс 25 процентов за каждое использование, начиная со второго, что вы получите случайный ответ. Мастер совершает этот бросок скрытно.","translationSource":"5e14.ttg.club"},{"id":"blindness_or_deafness","ru":"Глухота/слепота","en":"Blindness or Deafness","lvl":2,"school":"некромантия","cls":["bard","cleric","sorcerer","warlock","wizard"],"time":"1 действие","range":"30 футов","comp":"В","dur":"1 минута","ritual":false,"desc":"спасбросок Телосложения; на высоких уровнях: усиливается","full":"Вы можете ослепить врага или сделать его глухим.\n\nВыберите одно существо, которое видите в пределах дистанции, которое тут же совершает спасбросок Телосложения. В случае провала цель становится на время действия заклинания ослепшей или оглохшей (на ваш выбор).\n\nВ конце каждого своего хода цель может совершать спасбросок Телосложения. В случае успеха заклинание оканчивается.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 3 уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше второго.","translationSource":"5e14.ttg.club"},{"id":"flame_blade","ru":"Горящий клинок","en":"Flame Blade","lvl":2,"school":"воплощение","cls":["druid"],"time":"1 бонусное действие","range":"На себя","comp":"В, С, М","dur":"Концентрация, до 10 минут","ritual":false,"desc":"урон 3d6 (огнём); атака заклинанием; на высоких уровнях: усиливается (1d6)","full":"Вы создаёте горящий клинок в свободной руке. Этот клинок похож размерами и формой на скимитар, и он существует, пока заклинание активно.\n\nЕсли вы выпустите клинок из рук, он исчезает, но вы можете вернуть его в руку бонусным действием.\n\nВы можете Действием совершить рукопашную атаку заклинанием. При попадании цель получает 3к6 урона огнём.\n\nГорящий клинок испускает яркий свет в пределах 10 футов и тусклый свет в пределах ещё 10 футов.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 4 уровня или выше, урон увеличивается на 1к6 за каждые два уровня ячейки выше 2.","translationSource":"5e14.ttg.club"},{"id":"shatter","ru":"Дребезги","en":"Shatter","lvl":2,"school":"воплощение","cls":["bard","cleric","sorcerer","warlock","wizard"],"time":"1 действие","range":"60 футов","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"урон 3d8 (звуком); спасбросок Телосложения; на высоких уровнях: усиливается (1d8)","full":"Громкий звонкий звук исходит из выбранной вами точки в пределах дистанции. Все существа в сфере с радиусом 10 футов с центром на этой точке должны совершить спасбросок Телосложения. При провале существо получает 3к8 урона звуком, или половину этого урона при успехе.\n\nСущества, изготовленные из неорганической материи, такой как камень, кристалл или металл, совершают этот спасбросок с помехой.\n\nНемагические предметы, которые не несут и не носят, тоже получают урон, если находятся в области заклинания.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 3 уровня или выше, урон увеличивается на 1к8 за каждый уровень ячейки выше второго.","translationSource":"5e14.ttg.club"},{"id":"barkskin","ru":"Дубовая кора","en":"Barkskin","lvl":2,"school":"преобразование","cls":["cleric","druid","ranger"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"Вы касаетесь согласного существа. Пока заклинание активно, кожа цели становится грубой и похожей внешне на кору дуба, а КД не может быть ниже 16, вне зависимости от надетых доспехов.","translationSource":"5e14.ttg.club"},{"id":"beast_sense","ru":"Чутьё зверя","en":"Beast Sense","lvl":2,"school":"прорицание","cls":["druid","ranger"],"time":"1 действие","range":"Касание","comp":"С","dur":"Концентрация, до 1 часа","ritual":true,"desc":"видеть и слышать чувствами согласного зверя","full":"Вы касаетесь согласного зверя. Пока заклинание активно, вы можете действием видеть глазами зверя и слышать то, что слышит он, продолжая так до тех пор, пока не вернётесь к собственным чувствам действием.\n\nПока вы воспринимаете мир чувствами зверя, вы получаете преимущества любых особых чувств, которыми обладает это существо, и считаетесь ослеплённым и оглохшим к собственному окружению.","src":"PHB","translationSource":"5e14.ttg.club"},{"id":"protection_from_poison","ru":"Защита от яда","en":"Protection from Poison","lvl":2,"school":"ограждение","cls":["cleric","druid","paladin","ranger"],"time":"1 действие","range":"Касание","comp":"В, С","dur":"1 час","ritual":false,"desc":"","full":"Вы касаетесь существа. Если оно отравлено, вы нейтрализуете яд. Если на цель действуют несколько ядов, вы нейтрализуете тот, о котором знаете, либо же один случайным образом выбранный яд.\n\nПока заклинание активно, цель совершает с преимуществом спасброски от отравленного состояния и получает сопротивление к урону ядом.","translationSource":"5e14.ttg.club"},{"id":"branding_smite","ru":"Клеймящая кара","en":"Branding Smite","lvl":2,"school":"воплощение","cls":["paladin"],"time":"1 бонусное действие","range":"На себя","comp":"В","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"урон 2d6 (излучением); на высоких уровнях: усиливается (1d6)","full":"Когда вы в следующий раз попадёте по существу атакой оружием, пока заклинание активно, ваше оружие испускает астральное сияние.\n\nАтака причиняет цели дополнительно 2к6 урона излучением. Цель становится видимой, если была невидима, начинает испускать тусклый свет в пределах 5 футов, и не может стать невидимой, пока активно это заклинание.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 3 уровня или выше, дополнительный урон увеличивается на 1к6 за каждый уровень ячейки выше второй.","translationSource":"5e14.ttg.club"},{"id":"levitate","ru":"Левитация","en":"Levitate","lvl":2,"school":"преобразование","cls":["sorcerer","wizard"],"time":"1 действие","range":"60 футов","comp":"В, С, М","dur":"Концентрация, до 10 минут","ritual":false,"desc":"спасбросок Телосложения","full":"Одно выбранное вами существо или незакреплённый1 предмет, видимые в пределах дистанции, поднимается вертикально на расстояние до 20 футов, и остаётся висеть там на время действия заклинания.\n\nЗаклинание может заставить левитировать цель, весящую до 500 фунтов. Несогласное существо, преуспевшее в спасброске Телосложения, не попадает под действие этого заклинания.\n\nЦель может перемещаться только отталкиваясь от твёрдых предметов и поверхностей (таких как стены и потолок), а также подтягиваясь за них, что позволяет перемещаться так, как если бы они лазали.\n\nВ свой ход вы можете изменить высоту цели на 20 футов в любом направлении. Если целью являетесь вы сами, вы можете частью перемещения двигаться вверх или вниз. В противном случае, вы можете Действием переместить цель, которая должна оставаться при этом в пределах досягаемости заклинания.\n\nКогда заклинание оканчивается, если цель заклинания всё ещё находится в воздухе, она плавно опускается на землю.","translationSource":"5e14.ttg.club"},{"id":"moonbeam","ru":"Лунный луч","en":"Moonbeam","lvl":2,"school":"воплощение","cls":["druid","paladin"],"time":"1 действие","range":"120 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"урон 2d10 (излучением); спасбросок Телосложения; на высоких уровнях: усиливается (1d10)","full":"Бледный серебристый луч сияет в цилиндре с радиусом 5 футов и высотой 40 футов с центром на точке в пределах дистанции. Пока заклинание активно, цилиндр освещён тусклым светом.\n\nКогда существо впервые за ход входит в область заклинания или начинает там ход, оно окутывается призрачным пламенем, причиняющим настоящую боль, и должно совершить спасбросок Телосложения. Оно получает 2к10 урона излучением при провале или половину этого урона при успехе.\n\nПеревёртыши совершают спасбросок с помехой. При провале они мгновенно принимают свой истинный облик, и не могут принимать другие формы, пока не выйдут из света от заклинания.\n\nВ каждый последующий после накладывания заклинания ход вы можете Действием перемещать луч на 60 футов в любом направлении.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 3 уровня или выше, урон увеличивается на 1к10 за каждый уровень ячейки выше второго.","translationSource":"5e14.ttg.club"},{"id":"ray_of_enfeeblement","ru":"Луч слабости","en":"Ray of Enfeeblement","lvl":2,"school":"некромантия","cls":["warlock","wizard"],"time":"1 действие","range":"60 футов","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Телосложения; атака заклинанием","full":"Чёрный луч вылетает из вашего пальца к существу, находящемуся в пределах дистанции. Совершите по цели дальнобойную атаку заклинанием.\n\nПри попадании цель до конца действия заклинания причиняет только половину урона атаками оружием, использующими Силу. В конце каждого своего хода цель может совершать спасбросок Телосложения от этого заклинания. При успехе заклинание оканчивается.","translationSource":"5e14.ttg.club"},{"id":"magic_weapon","ru":"Магическое оружие","en":"Magic Weapon","lvl":2,"school":"преобразование","cls":["cleric","paladin","wizard"],"time":"1 бонусное действие","range":"Касание","comp":"В, С","dur":"Концентрация, до 1 часа","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вы касаетесь немагического оружия. Пока заклинание активно, это оружие становится магическим оружием с бонусом +1 к броскам атаки и урона.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 4 уровня или выше, бонус увеличивается до +2. Если вы используете ячейку заклинания 6 уровня или выше, бонус увеличивается до +3.","translationSource":"5e14.ttg.club"},{"id":"lesser_restoration","ru":"Малое восстановление","en":"Lesser Restoration","lvl":2,"school":"ограждение","cls":["bard","cleric","druid","paladin","ranger"],"time":"1 действие","range":"Касание","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы касаетесь существа и можете окончить одну болезнь или одно состояние, в котором оно находится. Этим состоянием может быть глухота, отравление, паралич или слепота.","translationSource":"5e14.ttg.club"},{"id":"melfs_acid_arrow","ru":"Мельфова кислотная стрела","en":"Melf's Acid Arrow","lvl":2,"school":"воплощение","cls":["druid","wizard"],"time":"1 действие","range":"90 футов","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"урон 4d4 (кислотой); урон 2d4 (кислотой); атака заклинанием; на высоких уровнях: усиливается (1d4)","full":"К цели, находящейся в пределах дистанции, устремляется мерцающая зелёная стрела, разлетающаяся брызгами кислоты.\n\nСовершите по цели дальнобойную атаку заклинанием. При попадании цель получает единовременно 4к4 урона кислотой и 2к4 урона кислотой в конце своего следующего хода. При промахе стрела немного задевает цель, причиняет половину единовременного урона и в конце следующего хода цель урона не получает.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 3 уровня или выше, урон (и единовременный и последующий) увеличивается на 1к4 за каждый уровень ячейки выше второго.","translationSource":"5e14.ttg.club"},{"id":"prayer_of_healing","ru":"Молебен лечения","en":"Prayer of Healing","lvl":2,"school":"воплощение","cls":["cleric"],"time":"10 минут","range":"30 футов","comp":"В","dur":"Мгновенная","ritual":false,"desc":"на высоких уровнях: усиливается (1d8)","full":"До шести существ на ваш выбор, видимых в пределах дистанции, восстанавливает количество хитов, равное 2к8 + модификатор вашей базовой характеристики.\n\nЭто заклинание не оказывает никакого эффекта на нежить и конструктов.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 3 уровня или выше, лечение увеличивается на 1к8 за каждый уровень ячейки выше второго.","translationSource":"5e14.ttg.club"},{"id":"invisibility","ru":"Невидимость","en":"Invisibility","lvl":2,"school":"иллюзия","cls":["bard","druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"Концентрация, до 1 часа","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Существо, которого вы касаетесь, становится невидимым до окончания действия заклинания. Всё, что цель несёт или носит, становится невидимым, пока остаётся у неё.\n\nЗаклинание оканчивается на цели, если она совершает атаку или накладывает заклинание.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 3 уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше второго.","translationSource":"5e14.ttg.club"},{"id":"gentle_repose","ru":"Нетленные останки","en":"Gentle Repose","lvl":2,"school":"некромантия","cls":["cleric","wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"10 дней","ritual":true,"desc":"","full":"Вы касаетесь трупа или других останков. Пока заклинание активно, цель защищена от разложения и не может стать нежитью.\n\nЭто заклинание также увеличивает ограничение по времени, в течение которого труп можно воскресить, так как дни, проведённые под воздействием этого заклинания, не учитываются при подсчёте времени со дня смерти для таких заклинаний как оживление [raise dead].","translationSource":"5e14.ttg.club"},{"id":"nystuls_magic_aura","ru":"Нистулова ложная магия","en":"Nystul's Magic Aura","lvl":2,"school":"иллюзия","cls":["wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"24 часа","ritual":false,"desc":"","full":"Вы помещаете иллюзию на существо или предмет, которого касаетесь, чтобы заклинания школы Прорицания получали о нём ложную информацию.\n\nЦелью может быть согласное существо или предмет, не несомый и не носимый другим существом. При накладывании этого заклинания выберите один из описанных ниже эффектов или сразу оба. Эффект длится, пока активно заклинание. Если вы накладываете это заклинание на одно и то же существо или предмет каждый день в течение 30 дней, используя один и тот же эффект, иллюзия начинает длиться, пока не будет рассеяна.\n\nЛожная аура. Вы меняете то, как цель представляется для заклинаний и магических эффектов, таких как обнаружение магии [detect magic], сканирующих магическую ауру. Вы можете немагический предмет заставить выглядеть магическим, магический предмет заставить выглядеть немагическим, или изменить магическую ауру предмета, чтобы казалось, что находящаяся в нём магия принадлежит другой школе магии, выбранной вами. Если вы использовали этот эффект на предмете, можете сделать так, что новая магия будет сразу видна существу, держащему его в руках.\n\nМаскировка. Вы меняете то, как цель представляется для заклинаний и магических эффектов, определяющих вид существ, таких как Божественное чувство паладина и триггер заклинания знак [symbol]. Вы выбираете вид существа, и все заклинания и магические эффекты будут считать, что цель принадлежит этому виду или имеет это мировоззрение.","translationSource":"5e14.ttg.club"},{"id":"zone_of_truth","ru":"Область истины","en":"Zone of Truth","lvl":2,"school":"очарование","cls":["bard","cleric","paladin"],"time":"1 действие","range":"60 футов","comp":"В, С","dur":"10 минут","ritual":false,"desc":"спасбросок Харизмы","full":"Вы создаёте магическую зону, защищающую от обмана в сфере с радиусом 15 футов с центром на точке, выбранной вами в пределах дистанции. Пока заклинание активно, существо, впервые за ход входящее в область этого заклинания или начинающее в ней ход, должно совершить спасбросок Харизмы.\n\nПри провале существо не может умышленно лгать, находясь в указанном радиусе. Вы знаете, какие существа прошли спасбросок, а какие провалили.\n\nПопавшее под действие заклинания существо знает о заклинании, и потому может избегать ответов на вопросы, на которые оно предпочло бы солгать. Такие существа могут давать уклончивые ответы, пока принуждены говорить правду.","translationSource":"5e14.ttg.club"},{"id":"detect_thoughts","ru":"Обнаружение мыслей","en":"Detect Thoughts","lvl":2,"school":"прорицание","cls":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Мудрости","full":"Пока заклинание активно, вы можете читать мысли некоторых существ. Если вы сотворили это заклинание, и в свой ход совершаете Действие, вы можете сосредоточиться на одном существе, которое видите в пределах 30 футов.\n\nЕсли у выбранного существа Интеллект равен 3 или ниже, или если оно не может говорить ни на одном языке, оно не попадает под действие заклинания.\n\nВначале вы знаете поверхностные мысли существа — то, что находится в его сознании на текущий момент.\n\nВы можете Действием либо перенести внимание на мысли другого существа, либо попытаться углубиться в мысли текущего существа.\n\nЕсли вы погружаетесь глубже, цель должна совершить спасбросок Мудрости. В случае провала вы получаете понимание её мыслей (если есть), её эмоционального состояния, и того, что её больше всего заботит (а также то, что она любит и ненавидит). Если существо преуспеет, заклинание оканчивается. В любом случае, цель знает, что вы прощупывали её сознание, и если вы не перевели внимание на мысли другого существа, предыдущее существо может в свой ход Действием совершить проверку Интеллекта, противопоставленную вашей проверке Интеллекта; в случае успеха заклинание оканчивается.\n\nВопросы, задаваемые устно цели, влияют на ход её мыслей, поэтому это заклинание чрезвычайно эффективно во время допросов. Вы можете также использовать это заклинание для обнаружения присутствия мыслящих существ, которых вы не видите.\n\nКогда вы накладываете это заклинание, или позже, пока оно активно, потратив Действие, вы можете поискать мысли существ в пределах 30 футов.\n\nЗаклинание проницает большую часть барьеров, но блокируется 2 футами камня, 2 дюймами обычного металла или тонким листом свинца.\n\nВы не можете обнаружить существ с Интеллектом 3 и ниже, а также тех, кто не говорят ни на одном языке.\n\nОбнаружив таким методом присутствие существа, вы можете до окончания действия заклинания читать его мысли, как описано выше, даже если вы его не видите, но оно должно находиться в пределах дистанции.","translationSource":"5e14.ttg.club"},{"id":"knock","ru":"Открывание","en":"Knock","lvl":2,"school":"преобразование","cls":["bard","sorcerer","wizard"],"time":"1 действие","range":"60 футов","comp":"В","dur":"Мгновенная","ritual":false,"desc":"","full":"Выберите предмет, видимый в пределах дистанции. Это может быть дверь, ящик, сундук, кандалы, навесной замок, или другой предмет, содержащий обычное или магическое средство, предотвращающее доступ.\n\nЦель, запертая обычным замком, заклинившая или запертая на засов, становится незапертой, незаклинившей, а засовы сами открываются.\n\nЕсли на предмете было несколько замков, открывается только один из них.\n\nЕсли вы выбрали цель, запертую заклинанием волшебный замок [arcane lock], это заклинание подавляется на 10 минут, во время которых цель может открываться и закрываться как обычно.\n\nКогда вы накладываете это заклинание, от цели исходит громкий стук, слышимый с расстояния в 300 футов.","translationSource":"5e14.ttg.club"},{"id":"mirror_image","ru":"Отражения","en":"Mirror Image","lvl":2,"school":"иллюзия","cls":["cleric","druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя","comp":"В, С","dur":"1 минута","ritual":false,"desc":"","full":"В вашем пространстве появляются три ваших иллюзорных копии. Пока заклинание активно, копии перемещаются вместе с вами и подражают вашим действиям, двигаясь так, что невозможно понять, кто из вас настоящий.\n\nВы можете Действием распустить свои копии. Каждый раз, когда существо нацеливается на вас атакой, пока заклинание активно, бросайте к20, чтобы определить, не попала ли атака вместо вас по одной из ваших копий.\n\nЕсли у вас три копии, вы должны выбросить «6» или больше, чтобы сделать целью копию. Если копий две, выбросить нужно «8» или больше. Если копия одна, вы должны выбросить «11» или больше.\n\nКД копии равен 10 + ваш модификатор Ловкости.\n\nЕсли атака попала по копии, она уничтожается. Копию может уничтожить только атака, попавшая по ней. Она игнорирует остальной урон и эффекты. Заклинание оканчивается, если все три копии будут уничтожены.\n\nСущество не попадает под действие этого заклинания, если не может видеть, если полагается на другие чувства кроме зрения, например, на слепое зрение, или если может видеть сквозь иллюзию, например, при помощи истинного зрения.","translationSource":"5e14.ttg.club"},{"id":"warding_bond","ru":"Охраняющая связь","en":"Warding Bond","lvl":2,"school":"ограждение","cls":["cleric"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"1 час","ritual":false,"desc":"","full":"Это заклинание защищает согласное существо, которого вы касаетесь, и создаёт мистическую связь между вами.\n\nПока цель находится в пределах 60 футов от вас, она получает бонус +1 к КД и спасброскам, а также сопротивление ко всем видам урона.\n\nКроме того, каждый раз, когда она получает урон, вы получаете такое же количество урона.\n\nЭто заклинание оканчивается, если ваши хиты опускаются до 0 или если расстояние между вами и целью становится больше 60 футов. Оно также заканчивается, если это заклинание наложить повторно на одно из связанных существ.\n\nВы также можете окончить это заклинание Действием.","translationSource":"5e14.ttg.club"},{"id":"scorching_ray","ru":"Палящий луч","en":"Scorching Ray","lvl":2,"school":"воплощение","cls":["cleric","sorcerer","warlock","wizard"],"time":"1 действие","range":"120 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"урон 2d6 (огнём); атака заклинанием; на высоких уровнях: усиливается","full":"Вы создаёте три огненных луча и направляете их на целей, находящихся в пределах дистанции. Это может быть одна или несколько целей. Для каждого луча совершите дальнобойную атаку заклинанием. При попадании цель получает 2к6 урона огнём.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 3 уровня или выше, вы создаёте один дополнительный луч за каждый уровень ячейки выше второго.","translationSource":"5e14.ttg.club"},{"id":"spider_climb","ru":"Паук","en":"Spider Climb","lvl":2,"school":"преобразование","cls":["druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"Пока заклинание активно, одно согласное существо, которого вы касаетесь, получает возможность перемещаться вверх, вниз и вдоль вертикальных поверхностей, а также по потолкам, оставляя руки свободными. Цель также получает скорость лазания, равную своей скорости ходьбы.","translationSource":"5e14.ttg.club"},{"id":"web","ru":"Паутина","en":"Web","lvl":2,"school":"вызов","cls":["druid","sorcerer","wizard"],"time":"1 действие","range":"60 футов","comp":"В, С, М","dur":"Концентрация, до 1 часа","ritual":false,"desc":"урон 2d4 (огнём); спасбросок Ловкости","full":"Вы создаёте массу густой и клейкой паутины в точке на ваш выбор в пределах дистанции. Паутина заполняет куб с длиной ребра 20 футов на время длительности заклинания. Паутина является труднопроходимой местностью и слабо заслоняет местность.\n\nЕсли паутина не прикована к двум прочным структурам (таким как стены или деревья) и не разложена по полу, стене или потолку, созданная паутина опадает сама, и заклинание оканчивается в начале вашего следующего хода. Паутина, разложенная по плоской поверхности, обладает толщиной 5 футов.\n\nВсе существа, начинающие ход в паутине, или входящие в неё в свой ход, должны совершать спасбросок Ловкости. При провале существо становится опутанным, пока остаётся в паутине, или пока не вырвется. Существо, опутанное паутиной, может действием совершить проверку Силы против Сл ваших заклинаний. В случае успеха оно перестаёт быть опутанным.\n\nПаутина огнеопасна. Любой 5-футовый куб паутины, соприкоснувшийся с огнём, сгорает за 1 раунд, причиняя 2к4 урона огнём всем существам, начинающим ход в огне.","translationSource":"5e14.ttg.club"},{"id":"aid","ru":"Подмога","en":"Aid","lvl":2,"school":"ограждение","cls":["cleric","paladin"],"time":"1 действие","range":"30 футов","comp":"В, С, М","dur":"8 часов","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Ваше заклинание наделяет союзников стойкостью и решимостью.\n\nВыберите до трёх существ в пределах дистанции. На время длительности максимум хитов и текущие хиты всех целей увеличиваются на 5.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 3 уровня или выше, хиты целей увеличиваются ещё на 5 за каждый уровень ячейки выше второго.","translationSource":"5e14.ttg.club"},{"id":"locate_animals_or_plants","ru":"Поиск животных или растений","en":"Locate Animals or Plants","lvl":2,"school":"прорицание","cls":["bard","druid","ranger"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"Мгновенная","ritual":true,"desc":"","full":"Назовите определённый вид зверя или растения. Сконцентрировавшись на голосе природы в окружении, вы узнаёте направление и расстояние до ближайшего существа или растения этого вида в пределах 5 миль, если они вообще есть.","translationSource":"5e14.ttg.club"},{"id":"find_traps","ru":"Поиск ловушек","en":"Find Traps","lvl":2,"school":"прорицание","cls":["cleric","druid","ranger"],"time":"1 действие","range":"120 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы чувствуете присутствие любых ловушек в пределах дистанции, находящихся в пределах линии обзора. Для этого заклинания ловушкой считается всё, что причиняет неожиданный эффект, считающийся для вас вредным или нежелательным, и специально подготовленный таким своим создателем.\n\nТаким образом, это заклинание почувствует область, защищённую заклинанием сигнал тревоги, охранные руны, или механической ловушкой, но не распознает ветхий пол, неустойчивый потолок, или промоину в земле. Это заклинание просто даёт знать, что ловушка присутствует. Вы не узнаёте местоположение всех ловушек, но зато знаете общий характер опасности, исходящей от почувствованной вами ловушки.","translationSource":"5e14.ttg.club"},{"id":"locate_object","ru":"Поиск предмета","en":"Locate Object","lvl":2,"school":"прорицание","cls":["bard","cleric","druid","paladin","ranger","wizard"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"Концентрация, до 10 минут","ritual":false,"desc":"","full":"Опишите или назовите известный вам предмет. Вы чувствуете направление к этому предмету, пока он находится в пределах 1 000 футов от вас. Если предмет перемещается, вы узнаёте его направление. Это заклинание может искать конкретный известный вам предмет, если вы хотя бы раз видели его вблизи (в пределах 30 футов).\n\nВ качестве альтернативы, это заклинание может искать ближайший предмет определённого вида, например, особый предмет одежды, ювелирное украшение, мебель, инструмент или оружие. Это заклинание не может обнаружить предмет, если прямой путь между вами перерезан свинцом, пусть даже самым тонким листом.","translationSource":"5e14.ttg.club"},{"id":"find_steed","ru":"Поиск скакуна","en":"Find Steed","lvl":2,"school":"вызов","cls":["paladin"],"time":"10 минут","range":"30 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы вызываете дух, принимающий облик невероятно умного, сильного и верного скакуна, создавая долгосрочную связь с ним. Появляясь в свободном пространстве в пределах дистанции, скакун принимает выбранный вами облик из списка: боевой конь [warhorse], пони [pony], верблюд [camel], лось [elk] или мастифф [mastiff] (Мастер может позволить призывать в качестве скакунов других животных).\n\nСкакун приобретает характеристики выбранной формы, хотя на самом деле он является небожителем, феей или исчадием (на ваш выбор).\n\nКроме того, если у вашего скакуна Интеллект 5 или меньше, его Интеллект становится равен 6, и он получает способность понимать один язык на ваш выбор, на котором вы разговариваете.\n\nВаш скакун служит вам как в бою, так и вне его, и у вас с ним есть инстинктивная связь, позволяющая сражаться как единое целое. Находясь верхом на скакуне, вы можете делать так, что наложенные вами заклинания, нацеливающиеся только на вас, будут нацелены ещё и на скакуна.\n\nКогда хиты скакуна опускаются до 0, он исчезает, не оставляя физического тела. Вы можете также в любое время отпустить скакуна Действием, заставляя его исчезнуть.\n\nВ любом случае, повторное использование этого заклинания призывает этого же скакуна, восстанавливая хиты до максимума. Пока скакун находится в пределах 1 мили от вас, вы можете общаться с друг другом1 телепатически.\n\nУ вас не может быть больше одного скакуна, призванного этим заклинанием, одновременно. Вы можете Действием навсегда отпустить скакуна, освободив его от уз и заставляя исчезнуть.","translationSource":"5e14.ttg.club"},{"id":"gust_of_wind","ru":"Порыв ветра","en":"Gust of Wind","lvl":2,"school":"воплощение","cls":["cleric","druid","sorcerer","wizard"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Силы","full":"Порыв сильного ветра длиной 60 футов и шириной 10 футов исходит от вас в выбранном направлении, пока заклинание активно.\n\nВсе существа, начинающие ход в этой линии, должны преуспеть в спасброске Силы, иначе их оттолкнёт на 15 футов от вас в направлении движения ветра.\n\nВсе существа в линии должны тратить 2 фута перемещения за каждый 1 фут, на который они перемещаются в вашу сторону.\n\nВетер рассеивает газы и испарения, а также тушит свечи, факелы и другие незащищённые источники огня. Защищённый огонь, например, в фонарях, он заставляет трепетать, и существует 50% шанс, что потухнут и они.\n\nПока заклинание активно, вы можете в каждом своём ходу бонусным действием менять направление, в котором дует ветер.","translationSource":"5e14.ttg.club"},{"id":"animal_messenger","ru":"Почтовое животное","en":"Animal Messenger","lvl":2,"school":"очарование","cls":["bard","druid","ranger"],"time":"1 действие","range":"30 футов","comp":"В, С, М","dur":"24 часа","ritual":true,"desc":"на высоких уровнях: усиливается","full":"При помощи этого заклинания вы передаёте через животное сообщение. Выберите Крохотного зверя, которого видите в пределах дистанции, такого как белку, сойку или летучую мышь.\n\nВы указываете место, которое когда-то уже посещали, и получателя, описывая его признаки, такие как «мужчина или женщина в униформе городской стражи» или «рыжий дварф в остроконечной шляпе».\n\nВы также произносите сообщение длиной не более 25 слов.\n\nЗверь в течение длительности заклинания двигается в указанное место, покрывая примерно 50 миль за 24 часа при полёте или 25 миль при других видах перемещения.\n\nПрибыв на место, зверь передаёт ваше сообщение описанному вами существу, изображая звук вашего голоса. Зверь передаст послание только существу, подходящему данному вами описанию.\n\nЕсли зверь не достигнет места до окончания действия заклинания, сообщение будет утеряно, а зверь начнёт возвращаться к тому месту, где вы наложили на него заклинание.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 3 уровня или выше, его длительность увеличивается на 48 часов за каждый уровень ячейки выше второго.","translationSource":"5e14.ttg.club"},{"id":"flaming_sphere","ru":"Пылающий шар","en":"Flaming Sphere","lvl":2,"school":"вызов","cls":["cleric","druid","wizard"],"time":"1 действие","range":"60 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"урон 2d6 (огнём); спасбросок Ловкости; на высоких уровнях: усиливается (1d6)","full":"В свободном пространстве на ваш выбор в пределах дистанции появляется шар из огня с диаметром 5 футов, существующий, пока активно заклинание.\n\nВсе существа, оканчивающие ход в пределах 5 футов от шара, должны совершать спасбросок Ловкости. Существа получают 2к6 урона огнём при провале или половину этого урона при успехе.\n\nВы можете бонусным действием переместить шар на 30 футов. Если вы тараните шаром существо, это существо должно совершить спасбросок от урона шара, и шар останавливается до конца этого хода.\n\nКогда вы перемещаете шар, вы можете поднимать его над препятствиями до 5 футов в высоту и перепрыгивать им разломы до 10 футов в длину. Шар поджигает горючие предметы, которые никто не несёт и не носит, и испускает яркий свет в пределах 20 футов и тусклый свет в пределах ещё 20 футов.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 3 уровня или выше, урон увеличивается на 1к6 за каждый уровень ячейки выше второго.","translationSource":"5e14.ttg.club"},{"id":"blur","ru":"Размытый образ","en":"Blur","lvl":2,"school":"иллюзия","cls":["druid","sorcerer","wizard"],"time":"1 действие","range":"На себя","comp":"В","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"","full":"Ваше тело становится размытым и колышущимся для всех, кто видит вас. Пока заклинание активно, все существа совершают по вам броски атаки с помехой.\n\nАтакующий получает иммунитет к этому эффекту, если полагается не на зрение, а, например, на слепое зрение, или может видеть сквозь иллюзии, например, с помощью истинного зрения.","translationSource":"5e14.ttg.club"},{"id":"heat_metal","ru":"Раскалённый металл","en":"Heat Metal","lvl":2,"school":"преобразование","cls":["bard","druid"],"time":"1 действие","range":"60 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"урон 2d8 (огнём); спасбросок Телосложения; на высоких уровнях: усиливается (1d8)","full":"Выберите рукотворный металлический предмет, такой как металлическое оружие или комплект тяжёлого или среднего доспеха, видимый в пределах дистанции. Вы делаете его раскалённым докрасна.\n\nВсе существа, находящиеся в физическом контакте с этим предметом, получают 2к8 урона огнём, когда вы накладываете это заклинание.\n\nПока заклинание активно, вы можете бонусным действием в каждом последующем ходу вновь причинять этот урон.\n\nЕсли существо держит или носит предмет, и получает от него урон, оно должно преуспеть в спасброске Телосложения, иначе оно роняет этот предмет, если может. Если существо не роняет предмет, то до начала вашего следующего хода оно совершает с помехой броски атаки и проверки характеристик.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 3 уровня или выше, урон увеличивается на 1к8 за каждый уровень ячейки выше второго.","translationSource":"5e14.ttg.club"},{"id":"enthrall","ru":"Речь златоуста","en":"Enthrall","lvl":2,"school":"очарование","cls":["bard","warlock"],"time":"1 действие","range":"60 футов","comp":"В, С","dur":"1 минута","ritual":false,"desc":"спасбросок Мудрости","full":"Вы произносите отвлекающую речь, заставляя выбранных вами существ, которых вы видите в пределах дистанции, и которые при этом могут слышать вас, совершить спасбросок Мудрости.\n\nСущества, которые не могут быть очарованными, автоматически преуспевают в спасброске, и если вы или ваши спутники сражаетесь с существом, оно совершает спасбросок с преимуществом. При провале цель получает помеху к проверкам Мудрости (Внимательность), совершённым для обнаружения других существ кроме вас, пока заклинание активно или пока цель не перестанет вас слышать.\n\nЗаклинание оканчивается, если вы становитесь недееспособны или теряете возможность говорить.","translationSource":"5e14.ttg.club"},{"id":"alter_self","ru":"Смена обличья","en":"Alter Self","lvl":2,"school":"преобразование","cls":["sorcerer","wizard"],"time":"1 действие","range":"На себя","comp":"В, С","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"Вы принимаете другой облик. При накладывании выберите один из представленных ниже вариантов, эффект от которого будет длиться всю длительность заклинания. Пока заклинание активно, вы можете Действием окончить один эффект, чтобы получить преимущества другого.\n\nАдаптация к воде. Вы приспосабливаете своё тело к существованию в воде, отращивая жабры и перепонки между пальцами. Вы можете дышать под водой и получаете скорость плавания, равную скорости хождения.\n\nЕстественное оружие. Вы отращиваете когти, клыки, шипы, рога или другое естественное оружие на свой выбор. Ваш безоружный удар причиняет дробящий, колющий или рубящий урон 1к6, в зависимости от выбранного вами оружия, и вы владеете безоружными ударами. Это оружие будет магическим, и вы получаете бонус +1 к броскам атаки и урона им.\n\nИзменение внешности. Вы изменяете свою внешность. Вы сами решаете, на кого будете походить, включая рост, вес, лицо, звук голоса, длину волос, цвета и отличительные характеристики. Вы можете стать похожим на представителя другой расы, но ваши показатели не изменяются. Вы также не можете выглядеть как существо другой категории размера, и ваше тело остаётся примерно тем же самым; например, это заклинание не сделает вас четырёхногим. Пока заклинание активно, вы можете действием изменять свою внешность.","translationSource":"5e14.ttg.club"},{"id":"silence","ru":"Тишина","en":"Silence","lvl":2,"school":"иллюзия","cls":["bard","cleric","druid","ranger"],"time":"1 действие","range":"120 футов","comp":"В, С","dur":"Концентрация, до 10 минут","ritual":true,"desc":"","full":"Пока заклинание активно, никакие звуки не могут раздаться в пределах сферы с радиусом 20 футов с центром на точке, выбранной в пределах дистанции, а также не могут проходить сквозь неё. Все существа и предметы, полностью находящиеся в сфере, получают иммунитет к урону звуком, и существа считаются оглохшими, когда полностью находятся в ней. В этом радиусе невозможно накладывать заклинания с вербальным компонентом.","translationSource":"5e14.ttg.club"},{"id":"rope_trick","ru":"Трюк с верёвкой","en":"Rope Trick","lvl":2,"school":"преобразование","cls":["wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"1 час","ritual":false,"desc":"","full":"Вы касаетесь верёвки длиной до 60 футов. Один её конец поднимается в воздух, а остальная часть висит перпендикулярно полу. На верхнем конце верёвки появляется невидимый вход в межпространство, существующий, пока заклинание активно. В межпространство можно попасть, забравшись по верёвке наверх. В этом межпространстве может поместиться восемь существ с размером не больше Среднего. Верёвку можно затянуть внутрь, после чего снаружи её не будет видно.\n\nАтаки и заклинания не могут проходить через вход внутрь межпространства и наружу, но те, кто находятся внутри, могут всё видеть как через окно 3 × 5 футов с центром на верёвке. Всё, что находится в межпространстве, вываливается наружу, когда заклинание заканчивается.","translationSource":"5e14.ttg.club"},{"id":"misty_step","ru":"Туманный шаг","en":"Misty Step","lvl":2,"school":"вызов","cls":["druid","paladin","sorcerer","warlock","wizard"],"time":"1 бонусное действие","range":"На себя","comp":"В","dur":"Мгновенная","ritual":false,"desc":"","full":"Окутавшись серебристым туманом, вы телепортируетесь на 30 футов в свободное пространство, видимое вами.","translationSource":"5e14.ttg.club"},{"id":"darkness","ru":"Тьма","en":"Darkness","lvl":2,"school":"воплощение","cls":["druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"60 футов","comp":"В, М","dur":"Концентрация, до 10 минут","ritual":false,"desc":"","full":"Из точки, выбранной вами в пределах дистанции, расползается магическая тьма сферой с радиусом 15 футов. Тьма огибает углы. Существа с тёмным зрением не могут видеть сквозь эту тьму, и немагический свет не может её осветить.\n\nЕсли выбранная вами точка находится на объекте, который вы держите или на объекте который не носят или не держат другие существа, то тьма исходит из предмета и перемещается вместе с ним. Если полностью накрыть источник тьмы непрозрачным предметом, например, чашей или шлемом, тьма будет заблокирована.\n\nЕсли часть зоны этого заклинания накрывает зону света, созданного заклинанием с уровнем не выше 2, заклинание, создавшее свет, рассеивается.","translationSource":"5e14.ttg.club"},{"id":"darkvision","ru":"Тёмное зрение","en":"Darkvision","lvl":2,"school":"преобразование","cls":["druid","ranger","sorcerer","wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"8 часов","ritual":false,"desc":"","full":"Вы касаетесь согласного существа и даруете ему возможность видеть в темноте. Пока заклинание активно, это существо обладает тёмным зрением в пределах 60 футов.","translationSource":"5e14.ttg.club"},{"id":"enlarge_or_reduce","ru":"Увеличение/уменьшение","en":"Enlarge or Reduce","lvl":2,"school":"преобразование","cls":["sorcerer","wizard"],"time":"1 действие","range":"30 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"урон 1d4 (extra); урон 1d4 (less); спасбросок Телосложения","full":"Вы увеличиваете или уменьшаете существо или предмет, видимый вами в пределах дистанции, на время действия заклинания. Выберите или существо или предмет, который никто не несёт и не носит. Если цель хочет, она может совершить спасбросок Телосложения. В случае успеха заклинание не оказывает на неё никакого влияния.\n\nЕсли цель — существо, всё, что она носит и несёт, изменяет размер вместе с ней. Всё, что это существо бросит, тут же обретает свой естественный размер.\n\nУвеличение. Размеры цели удваиваются по всем измерениям, а вес увеличивается в восемь раз. Это увеличивает размер на одну категорию — от Среднего до Большого, например. Если для цели не хватает пространства, она приобретает максимально возможный размер. Пока заклинание активно, цель совершает с преимуществом проверки и спасброски Силы. Оружие цели тоже увеличивается. Атаки увеличенным оружием причиняют дополнительный урон 1к4.\n\nУменьшение. Размеры цели уменьшаются вдвое по всем измерениям, а вес уменьшается до одной восьмой от обычного. Это уменьшает размер на одну категорию — от Среднего до Маленького, например. Пока заклинание активно, цель совершает с помехой проверки и спасброски Силы. Оружие цели тоже уменьшается. Атаки уменьшенным оружием причиняют на 1к4 меньше урона (урон не может быть меньше 1).","translationSource":"5e14.ttg.club"},{"id":"hold_person","ru":"Удержание личности","en":"Hold Person","lvl":2,"school":"очарование","cls":["bard","cleric","druid","paladin","sorcerer","warlock","wizard"],"time":"1 действие","range":"60 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Мудрости; на высоких уровнях: усиливается","full":"Выберите гуманоида, которого видите в пределах дистанции.\n\nЦель должна преуспеть в спасброске Мудрости, иначе станет парализованной на период действия заклинания.\n\nВ конце каждого своего хода цель может совершать новые спасброски Мудрости. В случае успеха заклинание на этой цели оканчивается.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 3 уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше 2. Эти гуманоиды должны находиться в пределах 30 футов друг от друга, когда вы нацеливаетесь на них.","translationSource":"5e14.ttg.club"},{"id":"enhance_ability","ru":"Улучшение характеристики","en":"Enhance Ability","lvl":2,"school":"преобразование","cls":["bard","cleric","druid","sorcerer"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"Концентрация, до 1 часа","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вы касаетесь существа и улучшаете его при помощи магии. Выберите один из следующих эффектов; цель получает этот эффект, пока заклинание активно:\n\nБычья сила. Цель совершает с преимуществом проверки Силы, а грузоподъёмность удваивается.\nКошачья ловкость. Цель совершает с преимуществом проверки Ловкости. Кроме того, она не получает урон за падение с высоты 20 футов или меньше, если она дееспособна.\nЛисья хитрость. Цель совершает с преимуществом проверки Интеллекта.\nМедвежья выносливость. Цель совершает с преимуществом проверки Телосложения. Она также получает 2к6 временных хитов, которые исчезают в конце заклинания.\nОрлиное великолепие. Цель совершает с преимуществом проверки Харизмы.\nСовиная мудрость. Цель совершает с преимуществом проверки Мудрости.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 3 уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше второго.","translationSource":"5e14.ttg.club"},{"id":"calm_emotions","ru":"Умиротворение","en":"Calm Emotions","lvl":2,"school":"очарование","cls":["bard","cleric","warlock"],"time":"1 действие","range":"60 футов","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Харизмы","full":"Вы пытаетесь подавить сильные эмоции у группы существ. Все гуманоиды в сфере с радиусом 20 футов с центром в точке, выбранной в пределах дистанции, должны совершить спасбросок Харизмы; существо может добровольно провалить этот спасбросок, если пожелает.\n\nЕсли существо проваливает спасбросок, выберите один из двух описанных ниже эффектов:\n\nВы можете подавить все эффекты, делающие цель очарованной или испуганной. Когда это заклинание оканчивается, все подавленные эффекты восстанавливаются, при условии, что за это время их действие не окончилось.\n\nВ качестве альтернативы, вы можете сделать цель безразличной к выбранным вами существам, к которым она относилась враждебно. Это безразличие оканчивается, если цель атакована или ей причинён вред заклинанием, или если она станет свидетелем того, как причиняют вред её друзьям.\n\nКогда заклинание оканчивается, существо становится вновь враждебным, если Мастер не решит по-другому.","translationSource":"5e14.ttg.club"},{"id":"spike_growth","ru":"Шипы","en":"Spike Growth","lvl":2,"school":"преобразование","cls":["cleric","druid","ranger"],"time":"1 действие","range":"150 футов","comp":"В, С, М","dur":"Концентрация, до 10 минут","ritual":false,"desc":"урон 2d4 (колющий)","full":"Пол в пределах 20-футового радиуса с центром на точке в пределах дистанции покрывается шипами и колючками. Эта местность становится труднопроходимой на время действия заклинания.\n\nКогда существо перемещением входит в эту область или идёт по ней, оно получает 2к4 колющего урона за каждые 5 пройдённых футов. Трансформация поверхности проходит практически незаметно, и шипы хорошо замаскированы. Существа, которые не видели эту местность в момент накладывания заклинания, должны совершить проверку Мудрости (Внимательность) против Сл ваших заклинаний, чтобы распознать местность опасной, перед тем как в неё войти.","translationSource":"5e14.ttg.club"},{"id":"revivify","ru":"Возрождение","en":"Revivify","lvl":3,"school":"некромантия","cls":["cleric","paladin"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы касаетесь существа, мёртвого не больше минуты. Это существо возвращается к жизни с 1 хитом. Это заклинание не может оживить существ, умерших от старости, а также не восстанавливает отсутствующие части тел.","translationSource":"5e14.ttg.club"},{"id":"animate_dead","ru":"Восставший труп","en":"Animate Dead","lvl":3,"school":"некромантия","cls":["cleric","wizard"],"time":"1 минута","range":"10 футов","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Это заклинание создаёт прислуживающую нежить.\n\nВыберите груду костей или труп гуманоида Среднего или Маленького размера в пределах дистанции. Ваше заклинание наделяет цель мерзким подобием жизни, делая из него существо-нежить. Цель становится скелетом [skeleton], если вы выбирали кости или зомби [zombie], если вы выбрали труп.\n\nВ каждый свой ход вы можете бонусным действием мысленно приказать существу, созданному этим заклинанием, если оно находится в пределах 60 футов от вас (если вы контролируете несколько существ, вы можете отдавать один и тот же приказ любому количеству из них одновременно).\n\nВы решаете, какое действие совершит это существо, и куда оно переместится в следующем ходу, или вы можете отдать общий приказ, например, охранять комнату или коридор. Если вы не отдадите команду, существо будет всего лишь защищаться от врагов. Получив приказ, существо продолжает его выполнять, пока задача не будет выполнена.\n\nСущество находится под вашим контролем 24 часа, после чего перестаёт слушаться команд. Для поддержания контроля ещё на 24 часа вы должны наложить это заклинание на него ещё раз до окончания 24-часового периода.\n\nТакое использование заклинания только поддерживает контроль над уже созданными существами, количество которых не может быть больше четырёх, и не оживляет новых.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 4 уровня или выше, вы оживляете или продлеваете контроль над двумя дополнительными существами за каждый уровень ячейки выше третьего. Для каждого создаваемого существа требуется отдельная куча костей или труп.","translationSource":"5e14.ttg.club"},{"id":"conjure_animals","ru":"Вызов животных","en":"Conjure Animals","lvl":3,"school":"вызов","cls":["druid","ranger"],"time":"1 действие","range":"60 футов","comp":"В, С","dur":"Концентрация, до 1 часа","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вы вызываете фейских духов, принимающих облик зверей и появляющихся в свободном видимом вами пространстве в пределах дистанции. Выберите один из вариантов того, кто появляется:\n\nОдин зверь с показателем опасности 2 или ниже\nДва зверя с показателем опасности 1 или ниже\nЧетыре зверя с показателем опасности 1/2 или ниже\nВосемь зверей с показателем опасности 1/4 или ниже\n\nВсе звери считаются также феями, и они исчезают, когда их хиты опускаются до 0 или когда заклинание оканчивается. Призванные существа дружественны к вам и вашим спутникам.\n\nСовершите бросок инициативы за призванных существ как за одну группу, и они будут совершать свои собственные ходы. Они подчиняются отданным вами устно командам (действие не требуется). Если вы не отдаёте команду, они защищаются от враждебных существ, но действий не совершают. Параметры существ есть у Мастера.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейки большего уровня, вы выбираете один из описанных выше вариантов, но появляется в два раза больше существ при ячейке 5 уровня, в три раза больше при ячейке 7 уровня, и в четыре раза больше при ячейке 9 уровня.","translationSource":"5e14.ttg.club"},{"id":"gaseous_form","ru":"Газообразная форма","en":"Gaseous Form","lvl":3,"school":"преобразование","cls":["druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"Концентрация, до 1 часа","ritual":false,"desc":"спасбросок Телосложения","full":"Вы превращаете на время действия заклинания согласное существо, которого касаетесь, а также всё, что оно носит и несёт, в туманное облако.\n\nЗаклинание оканчивается, если хиты существа опускаются до 0. Бестелесные существа не попадают под действие этого заклинания. Пока цель находится в этой форме, единственной её скоростью перемещения становится скорость полёта 10 футов. Цель может входить в пространство других существ и оставаться там.\n\nСущество получает сопротивление к немагическому урону, и совершает с преимуществом спасброски Силы, Ловкости и Телосложения.\n\nЦель может проходить через небольшие отверстия, узкие щели, но жидкости для неё считаются твёрдыми поверхностями. Цель не может упасть и остаётся парить, даже если становится ошеломлённой или недееспособной. Находясь в форме туманного облака, цель не может говорить и манипулировать предметами, и все предметы, которые она несёт или носит, нельзя ронять, использовать и вообще как-либо с ними взаимодействовать.\n\nЦель не может атаковать и накладывать заклинания.","translationSource":"5e14.ttg.club"},{"id":"hypnotic_pattern","ru":"Гипнотический узор","en":"Hypnotic Pattern","lvl":3,"school":"иллюзия","cls":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"120 футов","comp":"С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Мудрости","full":"Вы создаёте хитрый разноцветный узор, переплетающийся в воздухе внутри куба с длиной ребра 30 футов, находящегося в пределах дистанции. Узор появляется на краткий миг и исчезает. Все существа в этой области, видящие узор, должны совершить спасбросок Мудрости. При провале существо становится очарованным на время действия заклинания.\n\nБудучи очарованным этим заклинанием, существо недееспособно, и его скорость равна 0. Заклинание заканчивается для отдельного существа, если оно получает урон или если кто-то другой Действием потрясёт его, чтобы вывезти из ступора.","translationSource":"5e14.ttg.club"},{"id":"daylight","ru":"Дневной свет","en":"Daylight","lvl":3,"school":"воплощение","cls":["cleric","druid","paladin","ranger","sorcerer"],"time":"1 действие","range":"60 футов","comp":"В, С","dur":"1 час","ritual":false,"desc":"","full":"Из точки, выбранной вами в пределах дистанции, распространяется сфера света с радиусом 60 футов. Сфера излучает яркий свет и тусклый свет в пределах ещё 60 футов.\n\nЕсли выбранная вами точка находится на объекте, который вы держите или на объекте который не носят или не держат другие существа, то свет исходит из предмета и перемещается вместе с ним. Если полностью накрыть источник света непрозрачным предметом, например, чашей или шлемом, свет будет заблокирован.\n\nЕсли часть зоны этого заклинания накрывает зону тьмы, созданной заклинанием с уровнем не выше 3, заклинание, создавшее тьму, рассеивается.","translationSource":"5e14.ttg.club"},{"id":"spirit_guardians","ru":"Духовные стражи","en":"Spirit Guardians","lvl":3,"school":"вызов","cls":["cleric"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"Концентрация, до 10 минут","ritual":false,"desc":"урон 3d8 (излучением); урон 3d8 (некротический); спасбросок Мудрости; на высоких уровнях: усиливается (1d8)","full":"Вы вызываете духов, защищающих вас. Пока заклинание активно, они заполняют пространство в пределах 15 футов от вас.\n\nЕсли вы добрый или нейтральный, они могут выглядеть как ангелы или феи (на ваш выбор). Если вы злой, они могут выглядеть исчадиями.\n\nКогда вы активируете это заклинание, вы можете указать любое количество существ, видимых вами, на которых не будет действовать это заклинание.\n\nСкорость остальных существ в этой области уменьшена вдвое и когда существа впервые за ход попадают в область или начинают там ход, они должны совершить спасбросок Мудрости. При провале существо получает 3к8 урона излучением (если вы добрый или нейтральный) или 3к8 урона некротической энергией (если вы злой). При успехе существо получает половину урона.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 4 уровня или выше, урон увеличивается на 1к8 за каждый уровень ячейки выше третьего.","translationSource":"5e14.ttg.club"},{"id":"slow","ru":"Замедление","en":"Slow","lvl":3,"school":"преобразование","cls":["druid","sorcerer","wizard"],"time":"1 действие","range":"120 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Мудрости","full":"Вы изменяете время для шести существ на ваш выбор, находящихся в кубе с длиной ребра 40 футов в пределах дистанции. Все цели должны преуспеть в спасброске Мудрости, иначе они попадут под действие заклинания на время его длительности.\n\nСкорость попавшего под действие существа уменьшатся вдвое, оно получает штраф −2 к КД и спасброскам Ловкости, и оно не может совершать реакции.\n\nВ свой ход оно может использовать либо действие, либо бонусное действие, и не может использовать сразу оба.\n\nВне зависимости от умений и магических предметов, оно не может в свой ход совершать более одной рукопашной или дальнобойной атаки.\n\nЕсли существо попытается активировать заклинание со временем накладывания 1 действие, бросьте к20. Если выпадет «11» или больше, заклинание не вступит в силу до его следующего хода, и в том ходу оно должно будет использовать Действие для завершения заклинания.\n\nЕсли оно этого не сделает, заклинание будет потрачено. Существо, находящееся под действием этого заклинания, совершает новые спасброски Мудрости в конце каждого своего хода1. При успехе эффект для него оканчивается.","translationSource":"5e14.ttg.club"},{"id":"protection_from_energy","ru":"Защита от энергии","en":"Protection from Energy","lvl":3,"school":"ограждение","cls":["cleric","druid","paladin","ranger","sorcerer","wizard"],"time":"1 действие","range":"Касание","comp":"В, С","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"Пока заклинание активно, согласное существо, которого вы коснулись, получает сопротивление к одному виду урона на ваш выбор: звук, кислота, огонь, холод или электричество.","translationSource":"5e14.ttg.club"},{"id":"stinking_cloud","ru":"Зловонное облако","en":"Stinking Cloud","lvl":3,"school":"вызов","cls":["bard","druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"90 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Телосложения","full":"Вы создаёте сферу с радиусом 20 футов жёлтого тошнотворного газа с центром на точке в пределах дистанции. Это облако обходит углы, и его пространство — сильно заслонённая местность. Облако держится в воздухе, пока активно заклинание.\n\nВсе существа, находящиеся полностью в облаке в начале своего хода, должны совершить спасбросок Телосложения от яда. При провале существо теряет своё Действие, так как его тошнит и его голова кружится. Существа, которые не обязаны дышать, а также обладающие иммунитетом к ядам, автоматически преуспевают в этом спасброске.\n\nУмеренный ветер (как минимум 10 миль в час) рассеивает облако через 4 раунда. Сильный ветер (как минимум 20 миль в час) рассеивает его через 1 раунд.","translationSource":"5e14.ttg.club"},{"id":"counterspell","ru":"Контрзаклинание","en":"Counterspell","lvl":3,"school":"ограждение","cls":["paladin","sorcerer","warlock","wizard"],"time":"1 реакция","range":"60 футов","comp":"С","dur":"Мгновенная","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вы пытаетесь прервать процесс накладывания заклинания. Если существо накладывает заклинание 3 уровня или ниже, его заклинание проваливается, и не оказывает никакого эффекта.\n\nЕсли оно накладывало заклинание 4 уровня или выше, совершите проверку базовой характеристики. Сл равна 10 + уровень заклинания. В случае успеха заклинание проваливается и не оказывает никакого эффекта.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 4 уровня или выше, прерванное заклинание автоматически не оказывает эффекта, если его уровень не превышает уровень использованной вами ячейки.","translationSource":"5e14.ttg.club"},{"id":"leomunds_tiny_hut","ru":"Леомундова хижина","en":"Leomund's Tiny Hut","lvl":3,"school":"воплощение","cls":["bard","wizard"],"time":"1 минута","range":"На себя","comp":"В, С, М","dur":"8 часов","ritual":true,"desc":"","full":"Над вами и вокруг вас появляется купол из силового поля радиусом 10 футов, остающийся неподвижным всё время существования. Заклинание оканчивается, если вы покидаете его область. Под куполом вместе с вами могут поместиться девять существ с размером не больше Среднего.\n\nЗаклинание срывается, если в его область попадает существо большего размера или более девяти существ.\n\nСущества и предметы, находившиеся под куполом, когда вы наложили это заклинание, могут свободно проходить сквозь него. Все остальные существа и предметы не могут пройти сквозь него.\n\nЗаклинания и прочие магические эффекты не могут простираться под купол и не могут быть наложены сквозь него.\n\nАтмосфера под ним сухая и комфортная, какой бы ни была погода снаружи.\n\nПока заклинание активно, вы можете сделать пространство под ним тускло освещённым или погружённым во тьму.\n\nКупол снаружи матовый, любого цвета, но изнутри он прозрачный.","translationSource":"5e14.ttg.club"},{"id":"magic_circle","ru":"Магический круг","en":"Magic Circle","lvl":3,"school":"ограждение","cls":["cleric","paladin","warlock","wizard"],"time":"1 минута","range":"10 футов","comp":"В, С, М","dur":"1 час","ritual":false,"desc":"спасбросок Харизмы; на высоких уровнях: усиливается","full":"Вы создаёте из магической энергии цилиндр с радиусом 10 футов и высотой 20 футов с центром на точке на полу, видимой в пределах дистанции. Там, где цилиндр пересекает пол или другую поверхность, появляются светящиеся руны.\n\nВыберите один или несколько видов существ из следующего списка: исчадия, небожители, нежить, феи или элементали.\n\nКруг действует на выбранных существ следующим образом:\n\nСущества не могут добровольно войти в цилиндр немагическими средствами. Если существо пытается использовать телепортацию или межпланарное путешествие, оно должно вначале преуспеть в спасброске Харизмы.\nСущество совершает с помехой броски атаки по целям, находящимся в пределах цилиндра.\nЦелей в цилиндре нельзя сделать очарованными, испуганными или одержимыми.\n\nПри накладывании этого заклинания вы можете обратить его магию, чтобы существа выбранного вида не могли покинуть цилиндр, и защищены были цели, находящиеся снаружи.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 4 уровня или выше, длительность увеличивается на 1 час за каждый уровень ячейки выше третьего.","translationSource":"5e14.ttg.club"},{"id":"beacon_of_hope","ru":"Маяк надежды","en":"Beacon of Hope","lvl":3,"school":"ограждение","cls":["cleric","paladin"],"time":"1 действие","range":"30 футов","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Мудрости","full":"Это заклинание дарует надежду и живучесть. Выберите любое количество существ в пределах дистанции.\n\nПока заклинание активно, все цели совершают спасброски Мудрости и спасброски от смерти с преимуществом, а также восстанавливают от любого лечения максимально возможное количество хитов.","translationSource":"5e14.ttg.club"},{"id":"blink","ru":"Мерцание","en":"Blink","lvl":3,"school":"преобразование","cls":["cleric","sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя","comp":"В, С","dur":"1 минута","ritual":false,"desc":"","full":"Пока заклинание активно, бросайте к20 в конце каждого своего хода.\n\nЕсли выпадет «11» или выше, вы исчезаете на текущем плане существования и появляетесь на Эфирном Плане (заклинание проваливается, если вы уже находитесь на этом плане).\n\nВ начале своего следующего хода, а также если заклинание окончится, когда вы будете на Эфирном Плане, вы возвращаетесь в свободное пространство на свой выбор, которое вы видите в пределах 10 футов от места, из которого вы исчезли.\n\nЕсли в пределах дистанции нет свободного пространства, вы появляетесь в ближайшем свободном пространстве (выбранном случайным образом, если есть несколько подходящих мест).\n\nВы можете остановить заклинание Действием.\n\nНаходясь на Эфирном Плане, вы можете видеть и слышать на плане, с которого пришли, видя всё в оттенках серого и не видя того, что происходит за пределами 60 футов. Вы можете воздействовать только на существ, находящихся на Эфирном Плане, и только такие существа могут воздействовать на вас. Существа, не находящиеся там, не могут вас воспринимать и взаимодействовать с вами, если у них нет таких возможностей.","translationSource":"5e14.ttg.club"},{"id":"sleet_storm","ru":"Метель","en":"Sleet Storm","lvl":3,"school":"вызов","cls":["cleric","druid","sorcerer","wizard"],"time":"1 действие","range":"150 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Ловкости","full":"Пока заклинание активно, в цилиндре высотой 20 футов и радиусом 40 футов с центром на точке, выбранной вами в пределах дистанции, идёт мокрый снег. Это сильно заслонённая местность, и открытые источники огня в ней тухнут. Пол в этой местности покрывается скользким льдом, что делает его труднопроходимой местностью.\n\nКогда существо впервые за ход входит в область заклинания или начинает там ход, оно должно совершить спасбросок Ловкости. При провале оно падает ничком.\n\nЕсли существо начинает свой ход в области заклинания и концентрируется1, оно должно совершить успешный спасбросок Телосложения против Сл ваших заклинаний, иначе оно потеряет концентрацию.","translationSource":"5e14.ttg.club"},{"id":"mass_healing_word","ru":"Множественное лечащее слово","en":"Mass Healing Word","lvl":3,"school":"воплощение","cls":["cleric"],"time":"1 бонусное действие","range":"60 футов","comp":"В","dur":"Мгновенная","ritual":false,"desc":"на высоких уровнях: усиливается (1d4)","full":"Вы произносите слова восстановления, и до шести существ на ваш выбор, видимых в пределах дистанции, восстанавливают хиты в количестве, равном 1к4 + ваш модификатор базовой характеристики.\n\nЭто заклинание не оказывает никакого эффекта на нежить и конструктов.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 4 уровня или выше, восстанавливается дополнительно 1к4 хитов за каждый уровень ячейки выше 3.","translationSource":"5e14.ttg.club"},{"id":"lightning_bolt","ru":"Молния","en":"Lightning Bolt","lvl":3,"school":"воплощение","cls":["druid","sorcerer","wizard"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"урон 8d6 (электричеством); спасбросок Ловкости; на высоких уровнях: усиливается (1d6)","full":"Разряд молнии формирует линию длиной 100 футов и шириной 5 футов, вылетающую в выбранном вами направлении.\n\nВсе существа в линии должны совершить спасбросок Ловкости. При провале существо получает 8к6 урона электричеством, или половину урона при успехе.\n\nМолния поджигает горючие предметы в поражаемой области, которые никто не несёт и не носит.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 4 уровня или выше, урон увеличивается на 1к6 за каждый уровень ячейки выше третьего.","translationSource":"5e14.ttg.club"},{"id":"nondetection","ru":"Необнаружимость","en":"Nondetection","lvl":3,"school":"ограждение","cls":["bard","cleric","ranger","wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"8 часов","ritual":false,"desc":"","full":"Пока заклинание активно, цель, которой вы коснулись, сокрыта от заклинаний школы Прорицания. Целью может быть согласное существо, место или предмет, не превышающий 10 футов ни по одному из линейных размеров.\n\nЦель не может стать целью магии школы Прорицания, и её не воспринимают магические наблюдательные сенсоры.","translationSource":"5e14.ttg.club"},{"id":"major_image","ru":"Образ","en":"Major Image","lvl":3,"school":"иллюзия","cls":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"120 футов","comp":"В, С, М","dur":"Концентрация, до 10 минут","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вы создаёте образ предмета, существа или другого видимого явления, помещающийся в объёме в куб с длиной ребра 20 футов. Образ появляется в точке, которую вы видите в пределах дистанции, и существует, пока активно заклинание. Он выглядит абсолютно реальным, включая звук, запах и температуру, соответствующую этому предмету.\n\nВы не можете создать жар или холод, достаточный для получения урона, звук, громкость которого может причинить урон звуком или оглушить существо, или запах, способный вызвать тошноту (такую как вонь троглодита [troglodyte]).\n\nПока вы находитесь в пределах дистанции от иллюзии, вы можете Действием заставить образ переместиться в любое место в пределах дистанции. Пока образ меняет местоположение, вы можете изменять его внешность, чтобы перемещение выглядело естественным.\n\nНапример, если вы создаёте образ существа и перемещаете его, вы можете изменить образ, чтобы казалось, что оно идёт. Точно так же, вы можете заставить иллюзию издавать в разное время разные звуки, и даже заставлять её принимать участие в беседе, например.\n\nФизическое взаимодействие с образом даёт понять, что это иллюзия, потому что сквозь него всё проходит. Существа, исследующие образ действием, могут определить, что это иллюзия, совершив успешную проверку Интеллекта (Анализ) против Сл ваших заклинаний.\n\nЕсли существо распознаёт иллюзию, оно может видеть сквозь неё, и все прочие сенсорные эффекты иллюзии тоже притупляются.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 6 уровня или выше, оно длится, пока не рассеется, не требуя от вас концентрацию.","translationSource":"5e14.ttg.club"},{"id":"fireball","ru":"Огненный шар","en":"Fireball","lvl":3,"school":"воплощение","cls":["sorcerer","wizard"],"time":"1 действие","range":"150 футов","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"урон 8d6 (огнём); спасбросок Ловкости; на высоких уровнях: усиливается (1d6)","full":"Яркий луч вылетает из вашего указательного пальца в точку, выбранную вами в пределах дистанции, где и происходит взрыв пламени с гулким рёвом.\n\nВсе существа в пределах сферы с радиусом 20 футов с центром в этой точке должны совершить спасбросок Ловкости. Цель получает 8к6 урона огнём при провале или половину этого урона при успехе.\n\nЭтот огонь огибает углы. Он воспламеняет горючие предметы, которые никто не несёт и не носит.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 4 уровня или выше, урон увеличивается на 1к6 за каждый уровень ячейки выше третьего.","translationSource":"5e14.ttg.club"},{"id":"glyph_of_warding","ru":"Охранные руны","en":"Glyph of Warding","lvl":3,"school":"ограждение","cls":["bard","cleric","wizard"],"time":"1 час","range":"Касание","comp":"В, С, М","dur":"Пока не рассеяно или не сработает","ritual":false,"desc":"спасбросок Ловкости; на высоких уровнях: усиливается (1d8)","full":"Когда вы накладываете это заклинание, вы рисуете руну, впоследствии выпускающую магический эффект.1 Руна рисуется либо на поверхности (такой как стол или часть пола или стены) либо в предмете, который можно закрыть (книга, свиток или сундук с сокровищами), спрятав, таким образом, руну. Руна может покрывать площадь диаметром не больше 10 футов. Если предмет или поверхность переместят более чем на 10 футов от того места, где вы накладываете заклинание, руна сломается, и заклинание окончится, не срабатывая.2\n\nРуна практически невидимая, и для её обнаружения требуется успешная проверка Интеллекта (Анализ) против Сл ваших заклинаний.\n\nВы решаете, что вызовет срабатывание руны, когда накладываете заклинание. Руны, написанные на поверхности, обычно срабатывают от касания, вставания на неё, снимания предмета, стоящего на руне, приближения на определённое расстояние, или манипулирования предметом, на котором начертана руна.\n\nДля рун, начертанных внутри предметов, чаще всего выбирают открывание, приближение на определённое расстояние, взгляд, брошенный на руну или попытку е
