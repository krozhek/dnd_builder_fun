устно командам (действие не требуется), если они не противоречат его мировоззрению.\n\nЕсли вы не отдаёте команду, он защищается от враждебных существ, но действий не совершает. Параметры небожителя есть у Мастера.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 9 уровня, вы призываете небожителя с показателем опасности 5 или ниже.","translationSource":"5e14.ttg.club"},{"id":"delayed_blast_fireball","ru":"Замедленный огненный шар","en":"Delayed Blast Fireball","lvl":7,"school":"воплощение","cls":["sorcerer","wizard"],"time":"1 действие","range":"150 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Ловкости; на высоких уровнях: усиливается (1d6)","full":"Из вашего указательного пальца вылетает луч жёлтого света, концентрирующийся в светящемся шарике в пределах дистанции. Когда заклинание оканчивается, либо из-за того, что вы теряете концентрацию, либо когда вы сами это решите, шарик взрывается с гулким рокотом вспышкой пламени, огибающего углы.\n\nВсе существа в сфере с радиусом 20 футов с центром в этой точке должны совершить спасбросок Ловкости. При провале существо получает урон огнём, равный сумме накопленного урона, или половине этого урона в случае успеха. Базовый урон этого заклинания 12к6.\n\nВ конце каждого вашего хода, пока шарик не сдетонировал, урон увеличивается на 1к6.\n\nЕсли светящегося шарика кто-то коснётся до того как он взорвётся, коснувшееся существо должно совершить спасбросок Ловкости. При провале заклинание мгновенно оканчивается, а шарик взрывается. При успешном спасении существо может отбросить шарик на 40 футов.\n\nУдарившись о существо или твёрдый предмет, шарик взрывается, оканчивая заклинание. Огонь причиняет урон предметам и воспламеняет горючие предметы, которые никто не несёт и не носит.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 8 уровня или выше, базовый урон увеличивается на 1к6 за каждый уровень ячейки выше седьмого.","translationSource":"5e14.ttg.club"},{"id":"symbol","ru":"Знак","en":"Symbol","lvl":7,"school":"ограждение","cls":["bard","cleric","wizard"],"time":"1 минута","range":"Касание","comp":"В, С, М","dur":"Пока не рассеяно или не сработает","ritual":false,"desc":"спасбросок Телосложения","full":"Когда вы накладываете это заклинание, вы рисуете губительный знак на любой поверхности (такой как пол, стена или стол) или внутри предмета, который можно закрыть, чтобы скрыть знак (например, в книге, свитке или сундуке).\n\nЕсли вы выбрали поверхность, знак может покрыть площадь не больше 10 футов диаметром. Если вы выбрали предмет, он должен оставаться на месте; если предмет перенесут более чем на 10 футов от того места, где было активировано это заклинание, знак будет сломан, и заклинание окончится, не сработав. Знак практически невидим, для его обнаружения требуется успешная проверка Интеллекта (Анализ) против Сл ваших заклинаний. При накладывании заклинания вы определяете, что вызовет срабатывание знака.\n\nДля знаков, написанных на поверхности, чаще всего используют касание или наступание на знак, снятие другого предмета, закрывающего знак, приближение к нему на определённое расстояние, или манипулирование предметом, содержащим его.\n\nДля знаков, написанных внутри предмета, чаще всего используют открывание предмета, приближение к нему на определённое расстояние, осмотр или прочтение знака. Вы можете уточнить условие, чтобы заклинание активировалось только при определённых условиях или в зависимости от физических характеристик существа (таких как рост и вес), или его вида (например, можно выставить защиту от карг или от перевёртышей). Вы можете также определить существ, которые не будут активировать знак, например, тех, кто произнесёт пароль. \n\nСработав, знак вспыхивает, заполняя на 10 минут сферу с радиусом 60 футов тусклым светом, после чего заклинание оканчивается.\n\nВсе существа, находящиеся в сфере, когда знак активируется, становятся целью эффекта заклинания, так же как существа, впервые за ход входящие в сферу или оканчивающие в ней ход.\n\nКогда вы рисуете знак, выберите из приведённого списка один эффект:\n\nБезнадёжность. Все цели должны совершить спасбросок Харизмы. При провале цель охватывается отчаянием на 1 минуту. В это время она не может атаковать и нацеливаться на существ вредоносными умениями, заклинаниями и прочими магическими эффектами.\nБезумие. Все цели должны совершить спасбросок Интеллекта. При провале цель становится безумной на 1 минуту. Безумное существо не может совершать действия, не понимает ничего, что говорят другие существа, не может читать, и произносит только неразборчивую чушь. Мастер контролирует его перемещения, которые весьма хаотичны.\nБоль. Все цели должны совершить спасбросок Телосложения, становясь недееспособными от мучительной боли на 1 минуту при провале.\nОшеломление. Все цели должны совершить спасбросок Мудрости, становясь ошеломлёнными на 1 минуту при провале.\nРазногласие. Все цели должны совершить спасбросок Телосложения. При провале цель спорит и ругается с другими существами в течение 1 минуты. В это время она не способна осмысленно общаться и совершает броски атаки и проверки характеристик с помехой.\nСмерть. Все цели должны совершить спасбросок Телосложения, получая урон некротической энергией 10к10 при провале, или половину этого урона при успехе.\nСон. Все цели должны совершить спасбросок Мудрости, теряя сознание на 10 минут при провале. Существо пробуждается, если получает урон или если кто-то Действием потрясёт его или даст пощёчину.\nСтрах. Все цели должны совершить спасбросок Мудрости, становясь испуганными на 1 минуту при провале. Будучи испуганной, цель бросает всё, что держит, и должна в каждом своём ходу перемещаться как минимум на 30 футов от знака, если это возможно.","translationSource":"5e14.ttg.club"},{"id":"reverse_gravity","ru":"Изменение тяготения","en":"Reverse Gravity","lvl":7,"school":"преобразование","cls":["druid","sorcerer","wizard"],"time":"1 действие","range":"100 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Ловкости","full":"Это заклинание обращает гравитацию в цилиндре с радиусом 50 футов и высотой 100 футов с центром на точке в пределах дистанции. Все существа и предметы, не прикреплённые к полу, падают вверх до верхушки цилиндра, когда вы накладываете это заклинание.\n\nСущество может совершить спасбросок Ловкости, чтобы схватиться за закреплённый предмет, и тем самым избежать падения.\n\nЕсли в процесс падения на пути встречается твёрдый предмет (такой как потолок), ударившиеся об него существа и предметы получают обычный урон как от падения вниз.\n\nЕсли существо или предмет достигают верха, ничего не встретив, они остаются там, немного покачиваясь, на период действия заклинания.\n\nВ конце длительности заклинания существа и предметы падают вниз.","translationSource":"5e14.ttg.club"},{"id":"sequester","ru":"Изоляция","en":"Sequester","lvl":7,"school":"преобразование","cls":["wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"Пока не рассеяно","ritual":false,"desc":"","full":"При помощи этого заклинания согласное существо или предмет можно защитить на время действия заклинания от обнаружения. Когда вы накладываете это заклинание и касаетесь цели, она становится невидимой, и не может стать целью заклинаний школы Прорицания, а также не обнаруживается сенсорами, созданными заклинаниями школы Прорицания.\n\nЕсли цель — существо, оно входит в состояние приостановленной жизнедеятельности. Время для него не течёт, и оно не стареет.\n\nВы можете определить условия, при которых заклинание окончится. Это может быть что угодно, но оно должно произойти в пределах 1 мили от цели. Примерами могут стать «через 1000 лет» и «когда проснётся Тараск». Это заклинание также оканчивается, если цель получает урон.","translationSource":"5e14.ttg.club"},{"id":"mordenkainens_sword","ru":"Меч Морденкайнена","en":"Mordenkainen's Sword","lvl":7,"school":"воплощение","cls":["bard","wizard"],"time":"1 действие","range":"60 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"урон 3d10 (силовым уроном); атака заклинанием","full":"Вы создаёте сгусток силового поля в форме меча, парящий в пределах дистанции. Он существует, пока активно заклинание.\n\nКогда меч появляется, вы совершаете рукопашную атаку заклинанием по цели на ваш выбор, находящейся в пределах 5 футов от меча. При попадании цель получает 3к10 урона силовым полем.\n\nПока заклинание активно, вы можете в каждом своём ходу бонусным действием перемещать меч на 20 футов в видимое место, и повторять эту атаку по той же самой или другой цели.","translationSource":"5e14.ttg.club"},{"id":"fire_storm","ru":"Огненная буря","en":"Fire Storm","lvl":7,"school":"воплощение","cls":["cleric","druid","sorcerer"],"time":"1 действие","range":"150 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"урон 7d10 (огнём); спасбросок Ловкости","full":"В выбранном вами в пределах дистанции пространстве начинается огненная буря. Область бури состоит из 1–10 кубов с длиной ребра 10 футов, которые вы можете располагать как вам захочется. Каждый куб должен иметь хотя бы одну общую грань с другим кубом.\n\nВсе существа в этом пространстве должны совершить спасбросок Ловкости. Они получают 7к10 урона огнём при провале, или половину этого урона при успехе.\n\nЭтот урон повреждает предметы и воспламеняет горючие предметы, которые никто не несёт и не носит. Если хотите, растения не будут затронуты этим заклинанием.","translationSource":"5e14.ttg.club"},{"id":"finger_of_death","ru":"Перст смерти","en":"Finger of Death","lvl":7,"school":"некромантия","cls":["sorcerer","warlock","wizard"],"time":"1 действие","range":"60 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"урон 7d8 + 30 (некротический); спасбросок Телосложения","full":"Вы посылаете негативную энергию в видимое вами существо в пределах дистанции, вызывая у него сильную боль.\n\nЦель должна совершить спасбросок Телосложения или в случае провала получает 7к8 + 30 урона некротической энергией или половину этого урона в случае успеха.\n\nГуманоид, убитый этим заклинанием, воскресает в начале вашего следующего хода как зомби [zombie], постоянно находящийся под вашим командованием и выполняющий ваши устные команды.","translationSource":"5e14.ttg.club"},{"id":"simulacrum","ru":"Подобие","en":"Simulacrum","lvl":7,"school":"иллюзия","cls":["wizard"],"time":"12 часов","range":"Касание","comp":"В, С, М","dur":"Пока не рассеяно","ritual":false,"desc":"","full":"Вы создаёте иллюзорную копию зверя или гуманоида, который находится в пределах дистанции всё время, пока активируется заклинание. Копия является существом, частично реальным, созданным изо льда или снега, и она может совершать действия и вести себя как настоящее существо. Оно выглядит так же, как оригинал, но у него только половина от максимума хитов, и оно создаётся без снаряжения. Во всём остальном иллюзия использует все параметры копируемого существа за исключением того, что это конструкт.1\n\nКопия дружелюбна по отношению к вам и указанным вами существам. Она подчиняется вашим устным командам, перемещается и действует согласно вашей воле, и в сражении действует в ваш ход. Копия не может обучаться и становиться сильнее, так что она никогда не повышает уровень и характеристики, и не может восстанавливать использованные ячейки заклинаний.\n\nЕсли копия получает урон, вы можете исправлять его в алхимической лаборатории, используя редкие травы и минералы стоимостью 100 зм. за каждый восстанавливаемый хит. Копия существует, пока её хиты не опустятся до 0, после чего она превращается в снег и мгновенно тает.\n\nЕсли вы используете это заклинание ещё раз, существующие активные копии, созданные вами этим заклинанием, мгновенно уничтожаются.","translationSource":"5e14.ttg.club"},{"id":"project_image","ru":"Проекция","en":"Project Image","lvl":7,"school":"иллюзия","cls":["bard","wizard"],"time":"1 действие","range":"500 миль","comp":"В, С, М","dur":"Концентрация, до 24 часов","ritual":false,"desc":"","full":"Вы создаёте иллюзорную копию себя, существующую, пока активно заклинание. Копия может появиться в любом месте в пределах дистанции, которое вы до этого видели, вне зависимости от всех возможных препятствий. Иллюзия выглядит и звучит как вы, но неосязаема.\n\nЕсли иллюзия получает урон, она исчезает, а заклинание оканчивается. Вы можете Действием переместить эту иллюзию на расстояние, вдвое превышающее вашу скорость, и заставить её жестикулировать, говорить и вообще, вести себя так, как решите вы. Она идеально повторяет ваши манеры.\n\nВы можете видеть её глазами и слышать её ушами, как если бы находились в её пространстве.\n\nВы можете в свой ход бонусным действием переключиться с её чувств на свои или обратно. Пока вы используете её чувства, вы слепы и глухи для своего окружения.\n\nФизическое взаимодействие с образом даёт понять, что это иллюзия, потому что сквозь него всё проходит. Существа, исследующие образ Действием, могут определить, что это иллюзия, совершив успешную проверку Интеллекта (Анализ) против Сл ваших заклинаний.\n\nЕсли существо распознаёт иллюзию, оно может видеть сквозь неё, и издаваемые ей звуки тоже становятся незначащими.","translationSource":"5e14.ttg.club"},{"id":"prismatic_spray","ru":"Радужные брызги","en":"Prismatic Spray","lvl":7,"school":"воплощение","cls":["sorcerer","wizard"],"time":"1 действие","range":"На себя","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"урон 10d6 (огнём); урон 10d6 (кислотой); урон 10d6 (электричеством); урон 10d6 (ядом); урон 10d6 (холодом); спасбросок Ловкости","full":"Восемь разноцветных лучей света вылетают из вашей ладони. Каждый луч своего цвета, и у каждого свои особые свойства.\n\nВсе существа в пределах 60-футового конуса должны совершить спасбросок Ловкости. Для каждой цели совершите бросок к8, чтобы определить, луч какого цвета её коснулся.\n\nКрасный. Цель получает 10к6 урона огнём при провале или половину этого урона при успехе.\nОранжевый. Цель получает 10к6 урона кислотой при провале или половину этого урона при успехе.\nЖёлтый. Цель получает 10к6 урона электричеством при провале или половину этого урона при успехе.\nЗелёный. Цель получает 10к6 урона ядом при провале или половину этого урона при успехе.\nГолубой. Цель получает 10к6 урона холодом при провале или половину этого урона при успехе.\nСиний. При провале цель становится опутанной. После этого цель в конце каждого своего хода совершает спасбросок Телосложения. Если будет совершено три успешных спасброска, заклинание оканчивается. Если накопится три провала, цель навсегда превращается в камень и становится окаменевшей. Успехи и провалы не обязаны быть последовательными; отслеживайте их отдельно друг от друга, пока не накопится три результата одного вида.\nФиолетовый. При провале цель становится ослепшей. В начале вашего следующего хода она совершает спасбросок Мудрости. Успех оканчивает ослепление. При провале существо перемещается на другой план существования на выбор Мастера и перестаёт быть ослепшей (обычно существа на неродных планах изгоняются домой, а остальные существа обычно выбрасываются на Астральный или Эфирный планы).\nОсобенность. По цели попадают два луча. Совершите ещё два броска кости, перебрасывая выпавшие «8».","translationSource":"5e14.ttg.club"},{"id":"regenerate","ru":"Регенерация","en":"Regenerate","lvl":7,"school":"преобразование","cls":["bard","cleric","druid"],"time":"1 минута","range":"Касание","comp":"В, С, М","dur":"1 час","ritual":false,"desc":"лечение 4d8 + 15","full":"Вы касаетесь существа и активируете его врождённые способности к исцелению. Цель восстанавливает 4к8 + 15 хитов. Пока заклинание активно, цель восстанавливает 1 хит в начале каждого своего хода (10 хитов в минуту).\n\nОтрубленные части тела цели (пальцы, ноги, хвосты, и так далее), если они были, восстанавливаются через 2 минуты.\n\nЕсли отрубленная часть тела есть в наличии, и её можно приставить к обрубку, заклинание мгновенно сращивает их.","translationSource":"5e14.ttg.club"},{"id":"mirage_arcane","ru":"Таинственный мираж","en":"Mirage Arcane","lvl":7,"school":"иллюзия","cls":["bard","druid","wizard"],"time":"10 минут","range":"В пределах видимости","comp":"В, С","dur":"10 дней","ritual":false,"desc":"","full":"Вы заставляете местность в пределах 1 квадратной мили выглядеть, звучать, пахнуть и даже ощущаться как другая местность. Общая форма местности остаётся той же самой. Открытые поля и дороги можно сделать похожими на болото, холм, расселину или другую труднопроходимую или непроходимую местность. Пруд можно сделать похожим на травяную лужайку, пропасть сделать пологим склоном, а каменистый овраг — широкой и ровной дорогой.\n\nТочно так же, вы можете изменять внешний облик строений, или создавать их там, где их не было. Это заклинание не маскирует, не скрывает и не добавляет существ. Иллюзия включает в себя слышимые, видимые, тактильные и обонятельные элементы, так что она может сделать обычную местность труднопроходимой (и наоборот), и как-то иначе препятствовать перемещению.\n\nВсе части иллюзорной местности (такие как камни и палки), вынесенные за пределы области пространства, мгновенно исчезают. Существа с истинным зрением могут видеть сквозь иллюзию настоящую местность; однако, все элементы иллюзии для него остаются, так что хоть оно и будет знать о наличии иллюзии, оно всё ещё может взаимодействовать с ней.","translationSource":"5e14.ttg.club"},{"id":"teleport","ru":"Телепортация","en":"Teleport","lvl":7,"school":"вызов","cls":["bard","sorcerer","wizard"],"time":"1 действие","range":"10 футов","comp":"В","dur":"Мгновенная","ritual":false,"desc":"урон 3d10 (силовым уроном)","full":"Это заклинание мгновенно переносит вас и до восьми согласных существ на ваш выбор, видимых вами и находящихся в пределах дистанции, или один предмет, видимый в пределах дистанции, в выбранное вами место.\n\nЕсли целью является предмет, он должен полностью помещаться в куб с длиной ребра 10 футов, и его не может носить или нести несогласное существо. Выбранное место назначения должно быть известно вам, и оно должно находиться на одном плане существования с вами. Ваша ознакомленность с местом назначения определяет, успешным ли будет перемещение. Мастер бросает к100 и сверяется с таблицей.\n\nОзнакомленность\tНеудача\tПохожее место\tМимо цели\tТочно в цель\nПостоянный круг\t-\t-\tНет\t01-100\nСвязанный предмет\t-\t-\tНет\t01-100\nОчень знакомое\t01-05\t06-13\t14-24\t25-100\nИзредка видимое\t01-33\t34-43\t44-53\t54-100\nВиденное один раз\t01-43\t44-53\t54-73\t74-100\nОписанное\t01-43\t44-53\t54-73\t74-100\nЛожно описанное\t01-50\t51-100\t-\t-\n\nОзнакомленность. «Постоянный круг» означает постоянный круг телепортации, последовательность знаков которого вам известна. «Связанный предмет» означает, что у вас есть предмет, взятый из места назначения не позднее шести месяцев назад, например, книга из библиотеки волшебника, постельное бельё из королевской спальни, или кусок мрамора из потайного склеп лича.\n\n«Очень знакомое» это место, в котором вы часто бываете, место, которое вам довелось изучить, или место, которое вы видите в процессе накладывания заклинания.\n\n«Изредка видимое» это место, которое вы видели несколько раз, но которое вам не очень хорошо известно.\n\n«Виденное один раз» это место, которое вы видели один раз, возможно, при помощи магии.\n\n«Описанное» это место, чьё местоположение и внешний облик вам известно со слов других, возможно, по карте.\n\n«Ложно описанное» это место, которое не существует. Возможно, вы пытались подсмотреть святилище врага, но на самом деле видели иллюзию, или вы пытались телепортироваться в знакомое место, которое больше не существует.\n\nТочно в цель. Вы и ваша группа (или предмет) появляетесь там, где было задумано.\n\nМимо цели. Вы и ваша группа (или предмет) появляетесь на случайном расстоянии от места назначения в случайном направлении. Расстояние от цели равно (1к10 × 1к10) процентов от расстояния, на которое вы перемещались. Например, если вы пытались перенестись на 120 миль, промахиваетесь мимо цели, и на двух 1к10 у вас выпадает «5» и «3», то вы промахиваетесь мимо цели на 15 процентов, то есть на 18 миль. Мастер определяет направление случайным образом, бросая к8, где «1» означает север, «2» — северо-восток, «3» — восток, и так далее. Если вы телепортировались в город на побережье, и оказываетесь в море на расстоянии 18 миль, вы окажетесь в беде.\n\nПохожее место. Вы и ваша группа (или предмет) оказываетесь в другом месте, визуально или тематически похожем на место назначения. Например, если вы направлялись в свою лабораторию, вы можете оказаться в лаборатории другого волшебника или алхимическом магазине с таким же оборудованием как в вашей лаборатории. Обычно вы появляетесь в ближайшем похожем месте, но так как у заклинания нет ограничений по дистанции, вы можете оказаться где угодно на текущем плане.\n\nНеудача. Непредсказуемая магия заклинания делает перемещение опасным. Все телепортирующиеся существа (или предмет) получают урон силовым полем 3к10, и Мастер совершает новый бросок по таблице, чтобы определить место назначения (возможны несколько неудач, и каждая будет причинять урон).","translationSource":"5e14.ttg.club"},{"id":"forcecage","ru":"Узилище","en":"Forcecage","lvl":7,"school":"воплощение","cls":["bard","warlock","wizard"],"time":"1 действие","range":"100 футов","comp":"В, С, М","dur":"1 час","ritual":false,"desc":"спасбросок Харизмы","full":"Вокруг области, выбранной вами в пределах дистанции, возникает неподвижная, невидимая тюрьма в форме куба, созданная из магической силы. Тюрьма может быть клеткой или сплошной коробкой, на ваш выбор. Тюрьма в форме клетки может быть с длиной ребра до 20 футов, и состоит из сантиметровых прутьев (диаметр 1/2 дюйма), отстоящих друг от друга на 1 сантиметр (1/2 дюйма).\n\nТюрьма в форме коробки может быть с длиной ребра до 10 футов, и она является сплошным барьером, останавливающим любую материю, и блокирующую заклинания, накладываемые как внутрь коробки, так и направленные из неё наружу. Когда вы накладываете это заклинание, под его действие попадают все существа, находящиеся целиком внутри области.\n\nСущества, находящиеся в области лишь частично, или слишком большие для заточения внутри, отталкиваются от центра области, пока не окажутся снаружи.\n\nСущество, находящееся в узилище, не может покинуть его без помощи магии. Если оно пытается использовать телепортацию или перемещение между планами, оно должно вначале преуспеть в спасброске Харизмы. В случае успеха существо может использовать эту магию для выхода из узилища. При провале существо не может покинуть узилище, и тратит впустую использование заклинания или эффект.\n\nУзилище простирается и на Эфирный План, запрещая перемещение через него.\n\nЭто заклинание нельзя рассеять заклинанием рассеиванием магии [dispel magic].","translationSource":"5e14.ttg.club"},{"id":"plane_shift","ru":"Уход в иной мир","en":"Plane Shift","lvl":7,"school":"вызов","cls":["cleric","sorcerer","warlock","wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"спасбросок Харизмы; атака заклинанием","full":"Вы и до восьми согласных существ, взявшиеся за руки кругом, перемещаетесь на другой план существования. Вы можете указать в общих чертах точку прибытия, например, Медный город на Стихийном Плане Огня или дворец Диспатера на втором уровне Девяти Преисподних, и вы появитесь возле этого места. Например, если вы хотели оказаться в Медном городе, вы можете прибыть на Стальную улицу, перед Вратами Пепла, или оказаться посреди Моря Огня, на выбор Мастера.\n\nВ качестве альтернативы, если вы знаете последовательность знаков телепортационного круга на другом плане существования, это заклинание может перенести вас в этот круг. Если круг телепортации слишком мал для переносимого количества существ, они появляются в ближайшем свободном пространстве рядом с кругом.\n\nВы можете использовать это заклинание, чтобы изгонять несогласных существ на другой план. Выберите существо в пределах досягаемости и совершите по нему рукопашную атаку заклинанием. При попадании существо должно совершить спасбросок Харизмы. Если существо его проваливает, оно переносится в случайным образом выбранное место на выбранном вами плане существования. Перенесённое таким образом существо должно будет самостоятельно найти дорогу на ваш текущий план существования.","translationSource":"5e14.ttg.club"},{"id":"etherealness","ru":"Эфирность","en":"Etherealness","lvl":7,"school":"преобразование","cls":["bard","cleric","sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя","comp":"В, С","dur":"8 часов","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вы вступаете в пограничные окрестности Эфирного Плана, в местность, в которой он пересекается с вашим текущим планом. Вы остаётесь в Пограничном Эфире, пока активно заклинание, или пока вы не окончите его действием. Всё это время вы можете перемещаться в любом направлении.\n\nЕсли вы перемещаетесь вверх или вниз, каждый фут перемещения стоит 1 дополнительный фут.\n\nВы можете видеть и слышать то, что происходит на плане, с которого вы пришли, но всё выглядит серым, и вы не видите то, что находится за пределами 60 футов. Находясь на Эфирном Плане, вы можете воздействовать только на существ, которые находятся там же, и только они могут воздействовать на вас. Существа, не находящиеся на Эфирном Плане, не могут воспринимать вас и взаимодействовать с вами, если только у них нет особого умения или магии, позволяющей делать это.\n\nВы игнорируете все предметы и эффекты, не находящиеся на Эфирном Плане, что позволяет вам проходить сквозь предметы, оставленные на исходном плане. Когда заклинание заканчивается, вы мгновенно возвращаетесь на план, с которого пришли, в месте, которое занимаете в данный момент.\n\nЕсли вы при этом находитесь в месте, занятом предметом или существом, вас мгновенно переносит в ближайшее свободное пространство, которое вы можете занимать, и вы получаете урон силовым полем, равный удвоенному количеству футов, на которое вас телепортировало.\n\nЭто заклинание не оказывает эффекта, если вы накладываете его, уже находясь на Эфирном Плане или плане, который не граничит с ним, например, на одном из Внешних Планов.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 8 уровня или выше, вы можете сделать целью до трёх согласных существ (включая вас) за каждый уровень ячейки выше седьмого. Существа должны находиться в пределах 10 футов от вас, когда вы накладываете это заклинание.","translationSource":"5e14.ttg.club"},{"id":"antipathy_or_sympathy","ru":"Антипатия/симпатия","en":"Antipathy or Sympathy","lvl":8,"school":"очарование","cls":["druid","wizard"],"time":"1 час","range":"60 футов","comp":"В, С, М","dur":"10 дней","ritual":false,"desc":"спасбросок Мудрости","full":"Это заклинание привлекает или отталкивает выбранных вами существ. Вы выбираете цель в пределах дистанции: либо предмет размером не больше Огромного, либо существо, либо область не больше куба с длиной ребра 200 футов. Затем укажите вид разумных существ, такой как красные драконы, гоблины или вампиры.\n\nВы наделяете цель аурой, которая в течение длительности либо привлекает, либо отталкивает указанных существ.\n\nВыберите либо эффект антипатии, либо эффект симпатии:\n\nАнтипатия. Эти чары вызывают у выбранных вами существ непреодолимое желание покинуть область и избегать цель. Если такое существо видит цель и оказывается в пределах 60 футов от неё, оно должно преуспеть в спасброске Мудрости, иначе станет испуганным. Существо остаётся испуганным, пока видит цель или находится в пределах 60 футов от неё. Будучи испуганным целью, существо должно тратить своё перемещение на побег в ближайшее безопасное место, откуда оно уже не увидит цель. Если существо отдалится от цели более чем на 60 футов и не сможет её видеть, оно перестаёт быть испуганным, но становится испуганным вновь, если увидит цель или окажется в пределах 60 футов от неё.\nСимпатия. Эти чары вызывают у выбранных вами существ непреодолимое желание приблизиться к цели, если они находятся в пределах 60 футов от неё или видят её. Если такое существо видит цель или оказывается в пределах 60 футов от неё, оно должно преуспеть в спасброске Мудрости, иначе оно в каждом своём ходу тратит перемещение на то, чтобы войти в область или прикоснуться к цели. Сделав это, оно уже не может добровольно отойти от цели. Если цель причиняет урон или как-то иначе вредит указанному существу, существо может совершить спасбросок Мудрости для окончания эффекта, как описано ниже.\n\nОкончание эффекта. Если указанное существо окончит ход за пределами 60 футов от цели или не сможет её видеть, оно совершает спасбросок Мудрости. В случае успеха эффект на существе заканчивается и оно понимает, что тяга или отвращение были вызваны магией. Кроме того, попавшему под эффект заклинания существу позволяется спасбросок Мудрости каждые 24 часа, пока заклинание активно. Совершившее успешный спасбросок существо получает иммунитет к эффекту на 1 минуту, после чего снова попадает под его действие.","translationSource":"5e14.ttg.club"},{"id":"holy_aura","ru":"Аура святости","en":"Holy Aura","lvl":8,"school":"ограждение","cls":["cleric"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"","full":"Божественный свет исходит от вас мягким сиянием в радиусе 30 футов. Пока заклинание активно, существа в этом радиусе, выбранные вами при накладывании этого заклинания, испускают тусклый свет в радиусе 5 футов и совершают все спасброски с преимуществом, а остальные существа совершают с помехой броски атаки по ним.\n\nКроме того, если исчадие или нежить попадает по такому существу рукопашной атакой, аура вспыхивает ярким светом. Атакующий должен преуспеть в спасброске Телосложения, иначе станет ослеплённым, пока не окончится это заклинание.","translationSource":"5e14.ttg.club"},{"id":"control_weather","ru":"Власть над погодой","en":"Control Weather","lvl":8,"school":"преобразование","cls":["cleric","druid","wizard"],"time":"10 минут","range":"На себя","comp":"В, С, М","dur":"Концентрация, до 8 часов","ritual":false,"desc":"","full":"Вы получаете на время длительности контроль над погодой в пределах 5 миль от себя. Для накладывания этого заклинания вы должны находиться на открытом воздухе. Если вы переместитесь в место, где над головой не будет неба, заклинание тут же закончится. Когда вы накладываете это заклинание, вы изменяете текущую погоду, которую определяет Мастер в зависимости от климата и времени года. Вы можете изменить осадки, температуру и ветер. Требуется 1к4 × 10 минут, чтобы новые условия вступили в силу. Когда новые условия вступят в силу, вы можете создать новые условия. Когда заклинание оканчивается, погода постепенно возвращается к нормальной.\n\nИзменяя погоду, найдите текущее состояние в таблицах и измените их на 1 позицию выше или ниже. Изменяя ветер, можете изменить его направление.\n\nОСАДКИ\n\nСила\tСостояние\n1\tЧистое небо\n2\tНебольшая облачность\n3\tПасмурно или густой туман\n4\tДождь, град или снег\n5\tПроливной дождь, сильный град или метель\n\nТЕМПЕРАТУРА\n\nСила\tСостояние\n1\tНевыносимая жара\n2\tЖара\n3\tТепло\n4\tПрохлада\n5\tХолод\n6\tАрктическая стужа\n\nВЕТЕР\n\nСила\tСостояние\n1\tШтиль\n2\tУмеренный ветер\n3\tСильный ветер\n4\tБуря\n5\tШторм","translationSource":"5e14.ttg.club"},{"id":"incendiary_cloud","ru":"Воспламеняющаяся туча","en":"Incendiary Cloud","lvl":8,"school":"вызов","cls":["sorcerer","wizard"],"time":"1 действие","range":"150 футов","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"урон 10d8 (огнём); спасбросок Ловкости","full":"Кружащееся облако дыма с ярко-белыми огоньками появляется в сфере с радиусом 20 футов с центром на точке, находящейся в пределах дистанции. Облако огибает углы и является сильно заслонённой местностью. Оно существует, пока активно заклинание, или пока его не развеет умеренный или сильный ветер (как минимум 10 миль в час).\n\nКогда облако появляется, все существа, находящиеся в нём, должны совершить спасбросок Ловкости. Существо получает 10к8 урона огнём при провале или половину этого урона при успехе.\n\nСущества должны также совершать этот спасбросок, когда впервые за ход входят в область заклинания или оканчивают там ход.\n\nВ начале каждого вашего хода облако перемещается на 10 футов прочь от вас в направлении, выбираемом вами.","translationSource":"5e14.ttg.club"},{"id":"clone","ru":"Двойник","en":"Clone","lvl":8,"school":"некромантия","cls":["wizard"],"time":"1 час","range":"Касание","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"","full":"Это заклинание выращивает инертную копию живого существа, которое станет гарантией бессмертия. Этот клон формируется в запечатанном сосуде и вырастает до полного размера за 120 дней; вы можете сделать так, что двойник будет более молодой версией этого существа.\n\nОн остаётся инертным и будет оставаться таким сколько угодно, пока сосуд остаётся целым. В любое время после того, как двойник будет готов, когда настоящее существо умирает, его душа переносится в двойника, при условии, что она свободна и хочет вернуться.\n\nДвойник физически идентичен оригиналу и обладает той же индивидуальностью, воспоминаниями и умениями, но у него нет снаряжения оригинала. Тело исходного существа, если оно ещё существует, остаётся инертным, и его впоследствии нельзя оживить, так как душа обитает в другом месте.","translationSource":"5e14.ttg.club"},{"id":"demiplane","ru":"Демиплан","en":"Demiplane","lvl":8,"school":"вызов","cls":["warlock","wizard"],"time":"1 действие","range":"60 футов","comp":"С","dur":"1 час","ritual":false,"desc":"","full":"Вы создаёте тёмную дверь на твёрдой плоской поверхности, которую вы видите в пределах дистанции. Дверь достаточно большая, чтобы существа Среднего размера могли свободно проходить через неё.\n\nЕсли дверь открыть, она будет вести в демиплан, который выглядит как пустая комната по 30 футов во всех измерениях, построенная из дерева или камня.\n\nКогда заклинание заканчивается, дверь исчезает, а существа и предметы, находящиеся в демиплане, остаются запертыми там, так как дверь исчезает и с другой стороны тоже.\n\nКаждый раз, когда вы накладываете это заклинание, вы либо создаёте новый демиплан, либо соединяете дверь с демипланом, созданным предыдущим накладыванием этого заклинания.\n\nКроме того, если вы знаете природу и содержимое демиплана, созданного этим заклинанием другого существа, вы можете соединить свою дверь с этим демипланом.","translationSource":"5e14.ttg.club"},{"id":"earthquake","ru":"Землетрясение","en":"Earthquake","lvl":8,"school":"воплощение","cls":["cleric","druid","sorcerer"],"time":"1 действие","range":"500 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"урон 5d6 (дробящий); спасбросок Телосложения","full":"Вы создаёте сейсмические возмущения в точке на земле, которую видите в пределах дистанции. Пока заклинание активно, на земле в круге с радиусом 100 футов от этой точки ощущаются интенсивные толчки, сотрясающие существ и строения, находящиеся там.\n\nМестность в этой области становится труднопроходимой. Все существа, находящиеся на земле и концентрирующиеся при этом, должны совершить спасбросок Телосложения. При провале концентрация существа нарушается.\n\nКогда вы накладываете это заклинание, а также в конце каждого хода, когда вы на нём концентрируетесь, все существа, находящиеся на земле в области заклинания, должны совершать спасброски Ловкости. При провале существо сбивается с ног. У этого заклинания могут быть другие эффекты, зависящие от местности, на усмотрение Мастера.\n\nТрещины. В области заклинания в начале вашего хода, следующего за тем, в котором вы наложили это заклинание, появляются трещины. Появляется 1к6 трещин в местах, определённых Мастером. Каждая 1к10 × 10 футов глубиной, 10 футов в ширину, а длиной от одного края заклинания до другого. Существо, стоящее в месте, где должна появиться трещина, должно преуспеть в спасброске Ловкости, иначе упадёт внутрь. Успешно спасшееся существо перемещается вместе с одним из краёв трещины. Трещины, открывающиеся под зданиями, заставляют их автоматически обрушиться (смотрите ниже).\n\nЗдания. Толчки причиняют дробящий урон 50 строениям, находящимся в контакте с землёй, когда вы накладываете это заклинание, а также в начале каждого вашего хода, пока заклинание активно. Если хиты здания опускаются до 0, оно обрушивается, и потенциально может причинить урон существам.\n\nСущество, находящееся в пределах половины высоты здания, должно совершить спасбросок Ловкости. При провале существо получает дробящий урон 5к6, сбивается с ног и погребается под завалами, после чего для высвобождения требуется проверка Силы (Атлетика) со Сл 20, совершённая Действием.\n\nМастер может корректировать Сл, в зависимости от характера обломков. При успешном спасении существо получает половину урона, не сбивается с ног и не погребается.","translationSource":"5e14.ttg.club"},{"id":"maze","ru":"Лабиринт","en":"Maze","lvl":8,"school":"вызов","cls":["wizard"],"time":"1 действие","range":"60 футов","comp":"В, С","dur":"Концентрация, до 10 минут","ritual":false,"desc":"","full":"Вы изгоняете существо, видимое в пределах дистанции, в похожий на лабиринт демиплан. Цель остаётся там, пока заклинание активно, или пока она не найдёт выход.\n\nЦель может действием пытаться найти выход. Для этого она совершает проверку Интеллекта со Сл 20. При успехе она находит выход, а заклинание оканчивается (минотавры и демоны гористро преуспевают автоматически).\n\nКогда заклинание заканчивается, цель возвращается в пространство, которое она покинула, или, если оно занято, в ближайшее свободное пространство.","translationSource":"5e14.ttg.club"},{"id":"glibness","ru":"Находчивость","en":"Glibness","lvl":8,"school":"преобразование","cls":["bard","warlock"],"time":"1 действие","range":"На себя","comp":"В","dur":"1 час","ritual":false,"desc":"","full":"Пока заклинание не окончится, каждый раз, когда вы совершаете проверку Харизмы, вы можете заменить выпавший результат числом «15».\n\nКроме того, что бы вы ни говорили, магия, проверяющая, говорите ли вы правду, показывает, что вы искренни.","translationSource":"5e14.ttg.club"},{"id":"dominate_monster","ru":"Подчинение чудовища","en":"Dominate Monster","lvl":8,"school":"очарование","cls":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"60 футов","comp":"В, С","dur":"Концентрация, до 1 часа","ritual":false,"desc":"спасбросок Мудрости; на высоких уровнях: усиливается","full":"Вы пытаетесь взять под контроль существо, которого видите в пределах дистанции. Существо должно преуспеть в спасброске Мудрости, иначе оно станет очарованным вами на время действия заклинания.\n\nЕсли вы или дружественные вам существа сражаются с ним, оно совершает спасбросок с преимуществом.\n\nПока существо очаровано, вы обладаете телепатической связью с ним, пока вы оба находитесь на одном плане существования. При помощи этой связи вы можете отдавать ему команды, пока находитесь в сознании (действие не требуется), и оно должно будет их выполнять.\n\nВы можете указать общее действие, такое как «атакуй вон то существо», «беги отсюда» или «принеси вот это». Если существо выполняет приказ и не получает дальнейших указаний от вас, оно в меру своих сил обороняется и защищает себя.\n\nВы можете Действием захватить полный контроль над целью. До конца вашего следующего хода существо совершает только выбранные вами действия, и не делает ничего, что вы ему не позволяете. В это время вы можете заставлять существо совершать реакции, но при этом вы тратите и свою реакцию тоже.\n\nКаждый раз, когда цель получает урон, она совершает новый спасбросок Мудрости от этого заклинания. В случае успеха заклинание оканчивается.\n\nНа более высоких уровнях: Если вы накладываете это заклинание с уровнем ячейки 9, концентрацию можно поддерживать до 8 часов.","translationSource":"5e14.ttg.club"},{"id":"animal_shapes","ru":"Превращение в животных","en":"Animal Shapes","lvl":8,"school":"преобразование","cls":["druid"],"time":"1 действие","range":"30 футов","comp":"В, С","dur":"Концентрация, до 24 часов","ritual":false,"desc":"","full":"Ваша магия превращает существ в зверей. Выберите любое число согласных существ, которых видите в пределах дистанции.\n\nВы меняете облик каждой цели на облик зверя Большого или меньше размера с показателем опасности не больше 4.\n\nВ последующие ходы вы можете Действием дать этим существам новый облик.\n\nПревращение держится всю длительность заклинания, или пока хиты цели не опустятся до 0, или она не умрёт. У каждой цели может быть свой облик.\n\nИгровые параметры целей меняются на параметры выбранных зверей, но у них остаётся своё мировоззрение и значения Интеллекта, Мудрости и Харизмы.\n\nЦель принимает хиты нового облика, а по возвращении в свой облик у неё будут хиты как перед превращением. Если свой облик возвращается в результате опускания хитов до 0, весь излишний урон переносится на хиты естественного облика.\n\nЕсли излишний урон не опустил хиты естественного облика ниже 0, существо не теряет сознание.\n\nДействия существа ограничены теми, что доступны новому облику, и оно не может разговаривать и накладывать заклинания. Снаряжение цели сливается с новым обликом.\n\nЦель не может активировать, использовать своё снаряжение и получать от него преимущества.","translationSource":"5e14.ttg.club"},{"id":"antimagic_field","ru":"Преграда магии","en":"Antimagic Field","lvl":8,"school":"ограждение","cls":["cleric","wizard"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"Вас окружает невидимая сфера антимагии с радиусом 10 футов. Эта область отделена от магической энергии, пронизывающей мультивселенную. В пределах этой сферы нельзя накладывать заклинания, призванные существа исчезают, и даже магические предметы становятся обычными.\n\nПока заклинание активно, сфера перемещается вместе с вами, оставаясь с центром на вас. Заклинания и прочие магические эффекты, кроме тех, что созданы артефактами и божествами, в сфере подавляются, и не могут проникать в неё. Ячейка, потраченная на накладывание подавленного заклинания, всё равно тратится. Пока эффект подавлен, он не действует, но время в подавленном состоянии всё равно учитывается при определении его длительности.\n\nЭффекты с целью. Заклинания и прочие магические эффекты, такие как волшебная стрела [magic missile] и очарование личности [charm person], нацеленные на существо или предмет, находящиеся в сфере, не оказывают на цель никакого эффекта.\n\nОбласти магии. Область магических эффектов и других заклинаний, таких как огненный шар [fireball], не может проникать в сферу. Если сфера оказывается в области магии, область, находящаяся в сфере, подавляется. Например, пламя, созданное огненной стеной [wall of fire], подавляется внутри сферы, создавая брешь в стене, если позволяют габариты.\n\nЗаклинания. Все активные заклинания и прочие магические эффекты на существах и предметах подавляются, пока они находятся в сфере.\n\nМагические предметы. Свойства и таланты магических предметов в сфере подавляются. Например, длинный меч +1 в сфере будет обычным длинным мечом [longsword]. Свойства и таланты магического оружия подавляются, если используются против цели в сфере или используются атакующим, находящимся в сфере. Если магическое оружие или боеприпас полностью покидает сферу (например, если вы выстрелите магической стрелой или метнёте магическое копьё в цель, находящуюся вне сферы), магия предмета возвращается.\n\nМагическое перемещение. В сфере не работают телепортация и перемещение между планами, вне зависимости от того, в сферу или из сферы пытаются перенестись. Порталы в другие места, миры и планы существования, а также входы в межпространство, такие как созданные заклинанием трюк с верёвкой [rope trick], временно закрываются, пока они находятся в сфере.\n\nСущества и предметы. Существа и предметы, призванные или созданные магией, временно прекращают существовать, пока они находятся в сфере. Существа возвращаются обратно, когда сфера покидает место, занимаемое ими до исчезновения.\n\nРассеивание магии. Заклинания и магические эффекты, такие как рассеивание магии [dispel magic], не оказывают на сферу никакого воздействия. Сферы, созданные разными заклинаниями преграда магии, не отменяют друг друга.","translationSource":"5e14.ttg.club"},{"id":"feeblemind","ru":"Слабоумие","en":"Feeblemind","lvl":8,"school":"очарование","cls":["bard","druid","warlock","wizard"],"time":"1 действие","range":"150 футов","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"урон 4d6 (психический); спасбросок Интеллекта","full":"Вы врываетесь в сознание существа, которое видите в пределах дистанции, пытаясь подавить его интеллект и сознание.\n\nЦель получает 4к6 урона психической энергией и должна совершить спасбросок Интеллекта. В случае провала Интеллект и Харизма существа становятся равны 1.\n\nОно не может накладывать заклинания, активировать магические предметы, понимать языки и вразумительно общаться. Однако существо признаёт друзей, следует за ними, и даже защищает их.\n\nВ конце каждых 30 дней существо может повторять спасбросок от этого заклинания. Если оно преуспевает, заклинание оканчивается.\n\nЭто заклинание также оканчивается заклинаниями высшее восстановление [greater restoration], исполнение желаний [wish] и полное исцеление [heal].","translationSource":"5e14.ttg.club"},{"id":"power_word_stun","ru":"Слово силы: Оглушение","en":"Power Word Stun","lvl":8,"school":"очарование","cls":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"60 футов","comp":"В","dur":"Мгновенная","ritual":false,"desc":"спасбросок Телосложения","full":"Вы произносите слово силы, способное захлестнуть сознание одного существа, видимого в пределах дистанции, делая его потрясённым. Если у существа не больше 150 хитов, оно становится ошеломлённым. В противном случае это заклинание не оказывает никакого эффекта. Ошеломлённая цель должна в конце каждого своего хода совершать спасбросок Телосложения. При успехе ошеломление проходит.","translationSource":"5e14.ttg.club"},{"id":"mind_blank","ru":"Сокрытие разума","en":"Mind Blank","lvl":8,"school":"ограждение","cls":["bard","wizard"],"time":"1 действие","range":"Касание","comp":"В, С","dur":"24 часа","ritual":false,"desc":"","full":"Пока заклинание активно, одно согласное существо, которого вы касаетесь, получает иммунитет к урону психической энергией, и всем эффектам, которые должны чувствовать его эмоции или читать мысли, заклинаниям школы Прорицания и состоянию очарованности.\n\nЭто заклинание даже помогает от заклинания исполнение желаний [wish], а также от заклинаний и эффектов аналогичной силы, использованных для воздействия на сознание цели или получение от неё информации.","translationSource":"5e14.ttg.club"},{"id":"sunburst","ru":"Солнечный ожог","en":"Sunburst","lvl":8,"school":"воплощение","cls":["druid","sorcerer","wizard"],"time":"1 действие","range":"150 футов","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"урон 12d6 (излучением); спасбросок Телосложения","full":"Яркий солнечный свет освещает всё в 60-футовом радиусе с центром на точке, выбранной вами в пределах дистанции.\n\nВсе существа, находящиеся в нём, должны совершить спасбросок Телосложения. При провале существо получает 12к6 урона излучением и становится ослеплённым на 1 минуту. При успехе оно получает половину урона и не становится ослеплённым.\n\nНежить и слизи совершают этот спасбросок с помехой.\n\nСущество, ослеплённое этим заклинанием, совершает повторные спасброски Телосложения в конце каждого своего хода. В случае успеха оно перестаёт быть ослеплённым.\n\nЭто заклинание рассеивает любую тьму в своей области, созданную заклинанием.","translationSource":"5e14.ttg.club"},{"id":"gate","ru":"Врата","en":"Gate","lvl":9,"school":"вызов","cls":["cleric","sorcerer","wizard"],"time":"1 действие","range":"60 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"","full":"Вы создаёте портал, соединяющий свободное пространство, видимое вами в пределах дистанции, с точным местом на другом плане существования. Портал представляет собой круглое отверстие, которое может быть диаметром от 5 до 20 футов.\n\nВы можете ориентировать портал в любом направлении. Портал существует, пока заклинание активно. На каждом плане у портала есть передняя и задняя сторона. Путешествовать через портал можно только проходя через его переднюю часть. Всё, что так проходит, мгновенно перемещается на другой план, появляясь в свободном пространстве рядом с порталом. Божества и другие планарные правители могут предотвращать создание порталов этим заклинанием в их присутствии или где угодно в пределах их домена.\n\nКогда вы накладываете это заклинание, вы можете назвать имя конкретного существа (псевдоним, титул или прозвище не подходят). Если это существо находится на другом плане, портал открывается непосредственно возле него, и это существо втягивается, оказываясь в ближайшем свободном пространстве с вашей стороны портала.\n\nВы не получаете над ним никакого особого контроля, и оно может действовать так, как сочтёт нужным Мастер. Оно может уйти, может напасть на вас, а может помочь вам.","translationSource":"5e14.ttg.club"},{"id":"storm_of_vengeance","ru":"Гроза гнева","en":"Storm of Vengeance","lvl":9,"school":"вызов","cls":["druid"],"time":"1 действие","range":"В пределах видимости","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"урон 2d6 (звуком); урон 1d6 (кислотой); урон 10d6 (электричеством); урон 2d6 (дробящий); урон 1d6 (холодом); спасбросок Телосложения","full":"Появляются клубящиеся облака с центром на точке, видимой вами, распространяющиеся в радиусе 360 футов. В этой области бьют молнии, грохочет гром и дует сильный ветер.\n\nВсе существа, находящиеся под облаками (на расстоянии не больше 5 000 футов под облаком), когда те появляются, должны совершить спасбросок Телосложения. При провале существо получает 2к6 урона звуком и становится оглохшим на 5 минут.\n\nКаждый раунд, в котором вы поддерживаете концентрацию на этом заклинании, гроза в ваш ход создаёт различные1 эффекты:\n\nРаунд 2. Из облаков выпадает кислотный дождь. Все существа и предметы под облаками получают 1к6 урона кислотой.\nРаунд 3. Вы создаёте шесть разрядов молний из облаков, ударяющих в шесть существ или предметов на ваш выбор под облаками. Существа и предметы не могут стать целью более одной молнии. Ударенное существо должно совершить спасбросок Ловкости. Существо получает 10к6 урона электричеством при провале, или половину этого урона при успехе.\nРаунд 4. Из облаков выпадает град. Все существа под облаками получают 2к6 дробящего урона.\nРаунд 5–10. Под облаками бушует сильный ветер и идёт мокрый снег. Местность становится труднопроходимой и сильно заслонённой. Все находящиеся там существа получают 1к6 урона холодом. Дальнобойные атаки оружием в этой местности невозможны. Ветер и дождь считаются сильным отвлекающим фактором при концентрации на заклинаниях. И наконец, порывы сильного ветра (скорость от 20 до 50 миль в час) автоматически рассеивают туман, испарения и подобные явления, как естественной, так и магической природы.","translationSource":"5e14.ttg.club"},{"id":"imprisonment","ru":"Заточение","en":"Imprisonment","lvl":9,"school":"ограждение","cls":["warlock","wizard"],"time":"1 минута","range":"30 футов","comp":"В, С, М","dur":"Пока не рассеяно","ritual":false,"desc":"спасбросок Мудрости","full":"Вы создаёте магические оковы, удерживающие существо, видимое вами в пределах дистанции.\n\nЦель должна преуспеть в спасброске Мудрости, иначе она станет скованной заклинанием.\n\nПри успехе цель получает иммунитет к этому заклинанию, если вы будете накладывать его повторно.\n\nНаходясь под действием этого заклинания, существо не обязано дышать, есть и пить, и оно не стареет. Заклинания школы Прорицания не могут найти или почувствовать цель.\n\nПри накладывании этого заклинания вы выбираете один из следующих видов заточения:\n\nЗахоронение. Цель становится заточённой глубоко под землёй в сфере из магической силы, достаточно большой, чтобы цель могла в ней поместиться. Ничто не может проникнуть сквозь эту сферу, и никакие существа не могут при помощи телепортации или путешествий между планами проникнуть внутрь или наружу. Особым компонентом для этой версии заклинания является небольшая мифриловая сфера.\nМиниатюризация. Цель уменьшается до высоты 1 дюйм (2,5 сантиметра), и становится заточённой в драгоценном камне или подобном предмете. Свет проходит через камень как обычно (что позволяет цели видеть, а другим существам видеть её), но больше сквозь него ничто не проходит, даже за счёт телепортации и планарных путешествий. Пока заклинание активно, этот камень нельзя ни разрезать, ни сломать. Особым компонентом для этой версии заклинания является большой прозрачный драгоценный камень, такой как корунд, алмаз или рубин.\nОграждённая тюрьма. Заклинание переносит цель в крохотный демиплан, защищённый от телепортации и планарных путешествий. Это может быть лабиринт, клетка, башня, или другое подобное укреплённое строение или местность. Особым компонентом для этой версии заклинания является миниатюрная копия тюрьмы, изготовленная из нефрита.\nОцепенение. Цель засыпает, и её нельзя разбудить. Особым компонентом для этой версии заклинания являются редкие снотворные травы.\nСковывание. Цель удерживают на месте толстые цепи, крепко связанные с землёй, удерживающие цель на месте. Цель опутана, пока заклинание активно, и в это время она не может перемещаться и каким-либо образом быть перемещённой. Особым компонентом для этой версии заклинания является тонкая цепочка из драгоценного металла.\n\nОкончание заклинания.Во время накладывания этого заклинания, какую бы версию вы не выбрали, вы можете указать условие, оканчивающее заклинание и отпускающее цель. Условие может быть простым или замысловатым, но Мастер должен признать условие разумным и вероятным. Условия могут основываться на имени существа, его личности, или его божестве, но во всём остальном должны полагаться на обозримые действия или качества, и не должны основываться на таких неосязаемых факторах как уровень, класс или хиты.\n\nЗаклинание рассеивание магии [dispel magic] может окончить это заклинание только если будет наложено заклинанием 9 уровня, нацеливаясь либо на тюрьму, либо на особый компонент, использовавшийся для её создания. Вы можете использовать конкретный особый компонент для создания только одной тюрьмы одновременно. Если вы активируете это заклинание ещё раз, используя тот же компонент, предыдущая цель тут же освобождается.","translationSource":"5e14.ttg.club"},{"id":"wish","ru":"Исполнение желаний","en":"Wish","lvl":9,"school":"вызов","cls":["sorcerer","wizard"],"time":"1 действие","range":"На себя","comp":"В","dur":"Мгновенная","ritual":false,"desc":"урон 1d10 (некротический)","full":"Исполнение желаний это самое мощное заклинание, которое могут накладывать смертные. Высказав вслух свои пожелания, вы можете изменить основы мироздания.\n\nЭто заклинание может дублировать эффекты любого заклинания с уровнем не больше 8.\n\nВы не обязаны выполнять требования этих заклинаний, включая стоимость дорогих компонентов. Заклинание просто начинает оказывать свой эффект.\n\nВ качестве альтернативы, вы можете создать один из следующих эффектов на свой выбор:\n\nВы создаёте один предмет, стоящий до 25 000 зм, не являющийся волшебным. Этот предмет не может превышать ни в одном измерении 300 футов, и он появляется в свободном пространстве, видимом вами, на земле.\nВы позволяете до двенадцати другим существам, видимым вами, восстановить все хиты, и вы оканчиваете все действующие на них эффекты, описанные в заклинании высшее восстановление [greater restoration].\nВы даруете до десяти существам, видимым вами, сопротивление к выбранному вами виду урона.\nВы даруете до десяти существам, видимым вами, иммунитет к одному заклинанию или другому магическому эффекту на 8 часов. Например, вы можете даровать себе и всем своим спутникам иммунитет к вытягивающей жизнь атаке лича.\nВы отменяете одно недавно произошедшее событие, заставив перебросить любой бросок, совершённый в последнем раунде (включая ваш последний ход). Реальность будет сформирована заново, согласно новому результату. Например, заклинание исполнение желаний может отменить успешный спасбросок противника, его критическое попадание, или проваленный спасбросок друга.\n\nВы можете даровать помеху или преимущество к броску, и можете либо выбрать новый результат, либо оставить старый. Вы можете попытаться получить эффект, отличный от приведённых примеров.\n\nМаксимально точно передайте желание Мастеру. Мастер обладает широкой свободой выбора при вынесении суждения о том, что произошло; чем больше желание, тем больше вероятность того, что что-то пойдёт не так.\n\nЭто заклинание может просто провалиться, желаемый эффект может осуществиться лишь частично, или же вы можете претерпеть непредвиденные последствия из-за формулировки желания.\n\nНапример, желание, чтобы злодей был мёртв, может зашвырнуть вас вперёд во времени, фактически, выводя вас из игры.\n\nЖелание получить легендарный магический предмет или артефакт может мгновенно перенести вас к его текущему обладателю.\n\nСоздание этим заклинанием любого эффекта кроме дублирования другого заклинания ослабляет вас.\n\nПолучив это ослабление, каждый раз до окончания продолжительного отдыха, когда вы накладываете заклинание, вы получаете 1к10 урона некротической энергией за каждый уровень этого заклинания. Этот урон никак нельзя отменить или уменьшить.\n\nКроме того, ваша Сила на 2к4 дня опускается до 3, если она была больше 3. За каждый день, в течение которого вы только отдыхаете и не делаете ничего кроме лёгкой деятельности, оставшееся время сокращается на 2 дня.\n\nКроме того, если вы получили это ослабление, существует 33% шанс, что вы больше никогда не сможете накладывать заклинание исполнение желаний.","translationSource":"5e14.ttg.club"},{"id":"true_resurrection","ru":"Истинное воскрешение","en":"True Resurrection","lvl":9,"school":"некромантия","cls":["cleric","druid"],"time":"1 час","range":"Касание","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы касаетесь существа, мёртвого не больше двух сотен лет, умершего от чего угодно кроме старости. Если душа цели свободна и согласна, цель возвращается к жизни с полными хитами.\n\nЭто заклинание закрывает все раны, нейтрализует все яды, исцеляет все болезни и снимает все проклятья, бывшие у существа в момент смерти. Заклинание заменяет повреждённые и отсутствующие органы и части тела.\n\nЭто заклинание может даже воссоздать новое тело, если старого больше нет. В этом случае вы должны произнести вслух имя существа. Это существо появляется в свободном пространстве, выбранном вами в пределах 10 футов.","translationSource":"5e14.ttg.club"},{"id":"true_polymorph","ru":"Истинное превращение","en":"True Polymorph","lvl":9,"school":"преобразование","cls":["bard","warlock","wizard"],"time":"1 действие","range":"30 футов","comp":"В, С, М","dur":"Концентрация, до 1 часа","ritual":false,"desc":"спасбросок Мудрости","full":"Выберите существо или немагический предмет, видимый в пределах дистанции. Вы превращаете существо в другое существо, существо в немагический1 предмет или предмет в существо (предмет не должно носить и нести другое существо). Превращение длится, пока активно заклинание, или пока хиты цели не опустятся до 0, или она не умрёт. Если вы концентрируетесь на заклинании его полную длительность, превращение длится, пока не будет рассеяно.\n\nПеревёртыши не попадают под действие этого заклинания. Несогласные существа могут совершить спасбросок Мудрости, и в случае успеха они не попадают под действие заклинания. Это заклинание не может подействовать на цель, у которой 0 хитов.\n\nСущество в существо. Если вы превращаете существо в другое существо, новый облик может быть любым, лишь бы его показатель опасности не превышал ПО цели (или её уровня, если у цели нет показателя опасности). Игровые характеристики цели, включая значения ментальных характеристик, заменяются характеристиками нового облика. У цели остаётся мировоззрение и характер.\n\nЦель принимает хиты нового облика. При возвращении в естественный облик количество его хитов будет как до превращения. Если оно возвращается в свой облик от того, что хиты опустились до 0, весь «лишний» урон перенесётся на естественный облик. Если «лишний» урон не опускает хиты естественного облика существа до 0, оно не теряет сознание.\n\nДействия существа в новом облике ограничены теми, что доступны ей, и она не может говорить, накладывать заклинания и совершать другие действия, требующие рук или речи, если только новый облик не способен выполнять такие действия. Снаряжение цели сливается с её новым обликом. Существо не может активировать, использовать, надевать или получать какие-то иные преимущества от своего снаряжения.\n\nПредмет в существо. Вы можете превратить предмет в любое существо, чей размер не превышает размер предмета, и чей показатель опасности не превышает 9. Существо будет дружелюбным по отношению к вам и вашим спутникам. Оно будет действовать в ваш ход. Вы сами решаете, какие действия оно будет совершать, и как будет перемещаться. Характеристики существа есть у Мастера, и он же решает, что получилось из его действий и перемещений.\n\nЕсли заклинание становится постоянным, вы перестаёте контролировать существо. Оно может остаться дружественным по отношению к вам, в зависимости от того, как вы с ним обращались.\n\nСущество в предмет. Если вы превращаете существо в предмет, оно превращается вместе с тем, что оно несёт и носит, пока размер предмета не превышает размер существа.2 Его параметрами становятся параметры предмета, и существо не помнит о времени, проведённом в этом облике, когда заклинание оканчивается и оно обретает свой естественный облик.","translationSource":"5e14.ttg.club"},{"id":"meteor_swarm","ru":"Метеоритный дождь","en":"Meteor Swarm","lvl":9,"school":"воплощение","cls":["sorcerer","wizard"],"time":"1 действие","range":"1 миль","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"урон 20d6 (огнём); урон 20d6 (дробящий); спасбросок Ловкости","full":"Пылающие шары ударяют о землю в четырёх разных точках, видимых в пределах дистанции.\n\nВсе существа в сфере с радиусом 40 футов с центром на каждой из точек должны совершить спасбросок Ловкости. Существо получает при провале 20к6 урона огнём и 20к6 дробящего урона, или половину урона при успехе.\n\nСфера огибает углы.\n\nСущество, находящееся в области двух взрывов получает урон только один раз.\n\nЗаклинание причиняет урон предметам и воспламеняет горючие предметы, которые никто не несёт и не носит.","translationSource":"5e14.ttg.club"},{"id":"mass_heal","ru":"Множественное полное исцеление","en":"Mass Heal","lvl":9,"school":"воплощение","cls":["cleric"],"time":"1 действие","range":"60 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"","full":"Поток целительной энергии перетекает от вас к раненым существам. Вы восстанавливаете до 700 хитов, разделённых на ваш выбор между любым количеством существ, видимых вами в пределах дистанции.\n\nСущества, вылеченные этим заклинанием, также исцеляются от всех эффектов, делающих их ослеплёнными или оглушёнными, а также от всех болезней.\n\nЭто заклинание не оказывает никакого эффекта на нежить и конструктов.","translationSource":"5e14.ttg.club"},{"id":"time_stop","ru":"Остановка времени","en":"Time Stop","lvl":9,"school":"преобразование","cls":["sorcerer","wizard"],"time":"1 действие","range":"На себя","comp":"В","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы ненадолго останавливаете поток времени для всех кроме себя. Для всех остальных существ время перестаёт течь, а вы получаете 1к4 + 1 ход подряд, во время которых можете совершать действия и перемещаться как обычно.\n\nЭто заклинание оканчивается, если одно из ваших действий, совершённых за этот период, или любой из эффектов, созданных вами за этот период, воздействует на других существ или предмет, несомый или носимый кем-то другим.\n\nКроме того, заклинание оканчивается, если вы перемещаетесь в место, находящееся более чем в 1 000 футов от того места, где вы его активировали.","translationSource":"5e14.ttg.club"},{"id":"shapechange","ru":"Полное превращение","en":"Shapechange","lvl":9,"school":"преобразование","cls":["druid","wizard"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"Вы принимаете на время действия заклинания облик другого существа. Новый облик может принадлежать существу с показателем опасности не больше вашего уровня. Это не может быть конструкт или нежить, и вы должны хотя бы раз видеть такое существо.\n\nВы превращаетесь в среднестатистического представителя таких существ, без уровней классов и умения Использование заклинаний. Ваши игровые параметры заменяются параметрами выбранного существа, хотя у вас остаётся мировоззрение и значения Интеллекта, Мудрости и Харизмы.\n\nВы также сохраняете все владения навыками и спасбросками, но также получаете те, что есть у нового облика.\n\nЕсли у вас и существа есть совпадающие владения, и указанный для него бонус выше вашего, вы используете бонус существа.\n\nВы не можете использовать легендарные действия и действия в логове нового облика.\n\nВы принимаете хиты и Кость Хитов нового облика. Когда вы возвращаете свой облик, ваши хиты будут такими же, как до превращения.\n\nЕсли вы возвращаете облик из-за того, что хиты опустились до 0, весь излишний урон переносится на ваш облик. Если излишний урон не опустил ваши хиты до 0, вы не теряете сознание.\n\nВы сохраняете все преимущества от умений класса, расы и прочих источников, и можете использовать их, при условии, что новый облик физически на это способен.\n\nВы не можете использовать особые чувства (например, тёмное зрение), если их нет и у нового облика.\n\nВы можете говорить только если существо в естественных условиях может говорить.\n\nКогда вы превращаетесь, вы выбираете, свалится ли ваше снаряжение на землю, сольётся с новым обликом или окажется на него надетым. Носимое снаряжение функционирует как обычно. Мастер определяет, сможет ли новый облик использовать тот или иной предмет снаряжения, в зависимости от формы и размера существа.\n\nВаше снаряжение не меняет форму и размер, и снаряжение, которое не может быть надето на новый облик, должно либо свалиться на землю, либо слиться с новым обликом. Слившееся снаряжение не оказывает никакого эффекта.\n\nПока это заклинание активно, вы можете действием принимать новые облики, подчиняющиеся тем же самым ограничениям, с одним исключением: если у нового облика больше хитов чем у вашего текущего, количество хитов остаётся прежним.","translationSource":"5e14.ttg.club"},{"id":"foresight","ru":"Предвидение","en":"Foresight","lvl":9,"school":"прорицание","cls":["bard","druid","warlock","wizard"],"time":"1 минута","range":"Касание","comp":"В, С, М","dur":"8 часов","ritual":false,"desc":"","full":"Вы касаетесь согласного существа, даруя ограниченную способность предвидеть будущее.\n\nПока заклинание активно, цель нельзя застать врасплох, и она совершает с преимуществом броски атаки, проверки характеристик и спасброски.\n\nКроме того, пока заклинание активно, другие существа совершают по цели броски атаки с помехой.\n\nЭто заклинание мгновенно оканчивается, если вы активируете его ещё раз до окончания длительности.","translationSource":"5e14.ttg.club"},{"id":"astral_projection","ru":"Проекция в астрал","en":"Astral Projection","lvl":9,"school":"некромантия","cls":["cleric","warlock","wizard"],"time":"1 час","range":"10 футов","comp":"В, С, М","dur":"Special","ritual":false,"desc":"","full":"Вы и до восьми согласных существ в пределах дистанции проецируете свои астральные тела в Астральный План (заклинание проваливается, если вы уже находитесь на этом плане). Оставленные вами материальные тела лежат без сознания в состоянии приостановленной жизнедеятельности; им не нужна пища, воздух, и они не стареют.\n\nВаше астральное тело во всём похоже на смертное тело, оно обладает теми же параметрами и снаряжением. Единственным отличием является серебряная нить, исходящая у вас между лопаток и торчащая наружу, становясь невидимой через 1 фут. Эта нить связывает вас с материальным телом.\n\nПока эта нить цела, вы можете найти путь домой. Если нить перерезать (это могут сделать только эффекты, явно указывающие, что они могут это) ваши душа и тело разделяются, и вы мгновенно умираете.\n\nВаше астральное тело может свободно ходить по Астральному Плану и проходить сквозь порталы, ведущие в другие планы. Если вы входите в новый план или возвращаетесь в свой, ваши тело и снаряжение переносятся по серебряной нити, позволяя вернуться в своё тело при входе на другой план.\n\nВаше астральное тело — отдельное воплощение. Урон и прочие эффекты, применимые к нему, не оказывают воздействие на физическое тело, и не остаются при вашем возвращении в тело.\n\nЗаклинание оканчивается для вас и ваших спутников, если вы оканчиваете его действием. При этом существа возвращаются в свои тела и просыпаются.\n\nЗаклинание может окончиться для отдельных существ преждевременно. Успешное заклинание рассеивание магии [dispel magic], использованное либо на астральное, либо на физическое тело, оканчивает это заклинание для этого существа.\n\nЕсли хиты физического или астрального тела существа опускаются до 0, заклинание оканчивается для него.\n\nЕсли заклинание оканчивается, и серебряная нить нетронута, она возвращает астральное тело в физическое, оканчивая состояние приостановленной жизнедеятельности.\n\nЕсли вы вернулись в своё тело, а спутники остались в астральных телах, но хотят вернуться, они сами должны найти способ вернуться, что обычно происходит в результате опускания хитов до 0.","translationSource":"5e14.ttg.club"},{"id":"prismatic_wall","ru":"Радужная стена","en":"Prismatic Wall","lvl":9,"school":"ограждение","cls":["wizard"],"time":"1 действие","range":"60 футов","comp":"В, С","dur":"10 минут","ritual":false,"desc":"урон 10d6 (огнём); урон 10d6 (кислотой); урон 10d6 (электричеством); урон 10d6 (ядом); урон 10d6 (холодом); спасбросок Телосложения","full":"Мерцающая разноцветная плоскость формирует вертикальную непрозрачную стену с длиной 90 футов, высотой 30 футов и толщиной 1 дюйм, с центром на точке, видимой в пределах дистанции. В качестве альтернативы, вы можете свернуть стену в сферу до 30-ти футов диаметром с центром на точке, видимой в пределах дистанции. Стена существует, пока активно заклинание.\n\nЕсли вы размещаете стену так, что она пройдёт по пространству, занятому существом, заклинание проваливается, а ваше действие и ячейка заклинания тратятся. Стена испускает яркий свет в пределах 100 футов и тусклый свет в пределах ещё 100 футов. Вы и существа, указанные вами при накладывании заклинания, можете без вреда проходить сквозь стену и оставаться возле неё. Если другое существо, способное видеть, перемещением оказывается в пределах 20 футов от стены или начинает там ход, оно должно преуспеть в спасброске Телосложения, иначе оно станет ослеплённым на 1 минуту. Стена состоит из семи слоёв разного цвета.\n\nКогда существо пытается коснуться стены или пройти сквозь неё, оно проходит по одному слою за раз, пока не пройдёт сквозь все. Коснувшись очередного слоя, существо должно совершить спасбросок Ловкости, чтобы защититься от его эффектов, описанных ниже. \n\nСтену можно уничтожить по одному слою за раз в порядке от красного к фиолетовому средствами, специфичными для каждого слоя. Уничтоженный слой остаётся уничтоженным на период всего действия заклинания. Преграда магии [antimagic field] не оказывает на стену эффекта, а рассеивание магии [dispel magic] уничтожает только фиолетовый слой.1\n\nКрасный. Существо получает 10к6 урона огнём при провале или половину этого урона при успехе. Пока этот слой существует, немагические дальнобойные атаки не могут проходить сквозь стену. Этот слой можно уничтожить, причинив ему 25 урона холодом.\nОранжевый. Существо получает 10к6 урона кислотой при провале или половину этого урона при успехе. Пока этот слой существует, магические дальнобойные атаки не могут проходить сквозь стену. Этот слой можно уничтожить сильным ветром.\nЖёлтый. Существо получает 10к6 урона электричеством при провале или половину этого урона при успехе. Этот слой можно уничтожить, причинив ему 60 урона силовым полем .\nЗелёный. Существо получает 10к6 урона ядом при провале или половину этого урона при успехе. Заклинание создание прохода [passwall], а также другие заклинания, с неменьшим уровнем, открывающие проходы в твёрдой поверхности, уничтожают этот слой.\nГолубой. Существо получает 10к6 урона холодом при провале или половину этого урона при успехе. Этот слой можно уничтожить, причинив ему 25 урона огнём.\nСиний. При провале существо становится опутанным. После этого оно в конце каждого своего хода должно совершать спасброски Телосложения. Если оно успешно спасётся три раза, заклинание оканчивается. Если оно провалит спасбросок три раза, оно превращается в камень и получает состояние окаменевшее на время длительности заклинания. Успехи и провалы не обязаны быть последовательными; отслеживайте их отдельно, пока не накопится три вида чего-то одного. Пока этот слой существует, сквозь стену нельзя накладывать заклинания. Этот слой уничтожается ярким светом от заклинания дневной свет [daylight] или подобного заклинания с не меньшим уровнем.\nФиолетовый. При провале существо становится ослеплённым. После этого оно в начале вашего следующего хода должно совершить спасбросок Мудрости. Успешное спасение оканчивает слепоту. При провале существо переносится на другой план, выбранный Мастером, и перестаёт быть ослеплённым (обычно существа на неродных планах изгоняются домой, а остальные существа обычно выбрасываются на Астральный или Эфирный планы). Этот слой уничтожается заклинанием рассеивание магии [dispel magic] или подобными заклинаниями с неменьшим уровнем, оканчивающими заклинания и магические эффекты.","translationSource":"5e14.ttg.club"},{"id":"power_word_kill","ru":"Слово силы: Смерть","en":"Power Word Kill","lvl":9,"school":"очарование","cls":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"60 футов","comp":"В","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы произносите слово силы, заставляющее существо, которое вы видите в пределах дистанции, мгновенно умереть. Если у выбранного вами существа не больше 100 хитов, он умирает. В противном случае это заклинание не оказывает никакого эффекта.","translationSource":"5e14.ttg.club"},{"id":"weird","ru":"Смертный ужас","en":"Weird","lvl":9,"school":"иллюзия","cls":["wizard"],"time":"1 действие","range":"120 футов","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"урон 4d10 (психический); спасбросок Мудрости","full":"Воззвав к сильнейшим страхам группы существ, вы создаёте иллюзорных существ в их сознаниях, видимых только для них.\n\nВсе существа в сфере с радиусом 30 футов с центром на выбранной точке в пределах дистанции, должны совершить спасбросок Мудрости. При провале существо становится испуганным на время длительности заклинания.\n\nИллюзия взывает к самым потаённым страхам, проявляясь в виде худших кошмаров и неумолимой угрозы.\n\nВ конце каждого своего хода испуганное существо должно преуспевать в спасброске Мудрости, иначе оно получает 4к10 урона психической энергией. При успехе для этого существа заклинание оканчивается.","translationSource":"5e14.ttg.club"},{"id":"booming_blade","ru":"Громовой клинок","en":"Booming Blade","lvl":0,"school":"воплощение","cls":["sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя (радиусом 5 футов)","comp":"Соматический, Материальный (рукопашное оружие стоимостью не менее 1 см.)","dur":"1 раунд","ritual":false,"desc":"","full":"Вы взмахиваете оружием, выбранным в качестве материального компонента, и совершаете им атаку ближнего боя против одного существа в пределах 5 футов от вас. При попадании цель получает обычный эффект атаки этим оружием, и становится покрытой бушующей энергией до начала вашего следующего хода. Если цель добровольно перемещается на 5 футов или более до окончания действия заклинания, то получает 1к8 урона звуком, а заклинание заканчивается.\n\nУрон этого заклинания увеличивается, когда вы достигаете определенных уровней. На 5-м уровне рукопашная атака наносит дополнительно 1к8 урона звуком при попадании, а урон получаемый при перемещении, увеличивается до 2к8. Оба броска урона снова увеличиваются на 1к8 на 11-м уровне (2к8 и 3к8) и на 17-м уровне (3к8 и 4к8).","src":"Таша","translationSource":"5e14.ttg.club"},{"id":"green_flame_blade","ru":"Клинок зелёного пламени","en":"Green Flame Blade","lvl":0,"school":"воплощение","cls":["sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя (радиусом 5 футов)","comp":"Соматический, Материальный (рукопашное оружие стоимостью не менее 1 см)","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы делаете взмах рукопашным оружием, используемым при произнесении заклинания, и совершаете им рукопашную атаку оружием против одного существа в пределах 5 футов от вас. При попадании, цель подвергается обычным эффектам атаки оружием, и вы можете заставить зеленый огонь перескочить с цели на другое существо по вашему выбору, которое вы видите в пределах 5 футов от нее. Второе существо получает урон огнем, равный вашему модификатору колдовской способности.\n\nУрон этого заклинания увеличивается при достижении определенных уровней. На 5-м уровне рукопашная атака наносит дополнительно 1к8 урона огнём цели при попадании, а урон, получаемый вторым существом, увеличивается до 1к8 + модификатор вашей заклинательной характеристики.\n\nОба этих урона увеличиваются на 11-м уровне (2к8 и 2к8) и 17-м уровне (3к8 и 3к8).","src":"Таша","translationSource":"5e14.ttg.club"},{"id":"lightning_lure","ru":"Лассо молнии","en":"Lightning Lure","lvl":0,"school":"воплощение","cls":["sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя (15 футовым радиусом)","comp":"Вербальный","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы создаёте хлыст из молний, поражающий одно существо по вашему выбору, которое вы можете видеть в пределах 15 футов от вас. Цель должна преуспеть в спасброске Силы, иначе будет притянута на 10 футов по прямой к вам, после чего получит 1к8 урона электричеством, если окажется в пределах 5 футов от вас.\n\nУрон этого заклинания увеличивается на 1к8, когда вы достигаете 5-го уровня (2к8), 11-го уровня (3к8) и 17-го уровня (4к8).","src":"Таша","translationSource":"5e14.ttg.club"},{"id":"sword_burst","ru":"Вспышка мечей","en":"Sword Burst","lvl":0,"school":"вызов","cls":["sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя (радиус 5 футов)","comp":"Вербальный","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы создаете круг призрачных клинков, которые кружатся вокруг вас.\n\nВсе существа (исключая вас) в пределах 5 футов от вас должны преуспеть в спасброске Ловкости, иначе получат 1к6 урона силовым полем.\n\nУрон этого заклинания увеличивается на 1к6, когда вы достигаете 5-го уровня (2к6), 11-го уровня (3к6) и 17-го уровня (4к6).","src":"Таша","translationSource":"5e14.ttg.club"},{"id":"mind_sliver","ru":"Расщепление разума","en":"Mind Sliver","lvl":0,"school":"очарование","cls":["sorcerer","warlock","wizard"],"time":"1 действие","range":"60 футов","comp":"Вербальный","dur":"1 раунд","ritual":false,"desc":"","full":"Вы вводите дезориентирующий всплеск психической энергии в разум одного существа, которого видите в пределах досягаемости.\n\nЦель должна преуспеть в спасброске Интеллекта, иначе получит 1к6 урона психической энергией и вычтет 1к4 из следующего спасброска, который она сделает до конца вашего следующего хода.\n\nУрон это
