ё прочтения. После того как руна сработает, заклинание оканчивается. Вы можете внести уточнения, чтобы заклинание срабатывало только в определённых обстоятельствах или при соблюдении внешних признаков (таких как рост и вес), вид существа (например, руна может защищать только от аберраций и дроу), или мировоззрение.\n\nВы можете также определить условия, при которых существо не будет активировать руну, например, произношение пароля.\n\nКогда вы наносите руну, выберите взрывную руну или заклинательную руну:\n\nВзрывная руна. Когда эта руна срабатывает, она испускает магическую энергию сферой с радиусом 20 футов с центром на руне. Эта сфера огибает углы. Все существа в этой области должны совершить спасбросок Ловкости. Существо получает 5к8 урона звуком, кислотой, огнём, холодом или электричеством при провале (вид урона вы выбираете при начертании руны), или половину этого урона при успехе.\nЗаклинательная руна. Вы можете сохранить подготовленное заклинание с уровнем не выше 3 в руне, наложив его частью начертания руны. Заклинание должно нацеливаться на одно существо или область. При этом заклинание временно не вступает в силу. Когда руна срабатывает, хранящееся заклинание активируется. Если у заклинания есть цель, целью становится существо, вызвавшее срабатывание руны. Если заклинание действует на область, центр этой области будет на этом существе. Если заклинание призывает враждебных существ или создаёт вредоносные предметы или ловушки, они появляются как можно ближе к нарушителю и атакуют его. Если заклинание требует концентрации, оно длится до конца своей максимальной длительности.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 4 уровня или выше, урон от Взрывной руны увеличивается на 1к8 за каждый уровень ячейки выше третьего. Если вы накладывали Заклинательную руну, вы можете хранить в ней заклинание уровень которого равен или меньше уровня ячейки, использованной для охранных рун.","translationSource":"5e14.ttg.club"},{"id":"water_breathing","ru":"Подводное дыхание","en":"Water Breathing","lvl":3,"school":"преобразование","cls":["druid","ranger","sorcerer","wizard"],"time":"1 действие","range":"30 футов","comp":"В, С, М","dur":"24 часа","ritual":true,"desc":"","full":"Это заклинание дарует на время своего действия до десяти существам, видимым вами в пределах дистанции, способность дышать под водой. Эти существа сохраняют и обычное дыхание.","translationSource":"5e14.ttg.club"},{"id":"clairvoyance","ru":"Подсматривание","en":"Clairvoyance","lvl":3,"school":"прорицание","cls":["bard","cleric","sorcerer","warlock","wizard"],"time":"10 минут","range":"1 миль","comp":"В, С, М","dur":"Концентрация, до 10 минут","ritual":false,"desc":"","full":"Вы создаёте невидимый сенсор в пределах дистанции в известном вам месте (месте, которое вы уже видели или посещали) или очевидном месте, незнакомом вам (например, за дверью, за углом, или в роще деревьев).\n\nСенсор остаётся на месте, и его нельзя атаковать или как-то с ним взаимодействовать.\n\nНакладывая заклинание, вы выбираете зрение или слух.\n\nВы можете использовать выбранное чувство через сенсор, как если бы вы находились на его месте. Вы можете Действием переключаться между зрением и слухом.\n\nСущество, способное увидеть сенсор (например, находящееся под заклинанием видение невидимого [see invisibility] или с истинным зрением) видит светящийся нематериальный шарик размером с ваш кулак.","translationSource":"5e14.ttg.club"},{"id":"fly","ru":"Полёт","en":"Fly","lvl":3,"school":"преобразование","cls":["sorcerer","warlock","wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"Концентрация, до 10 минут","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вы касаетесь согласного существа. Цель получает на время длительности заклинания скорость полёта 60 футов. Когда заклинание оканчивается, цель падает, если всё ещё находится в полёте и ничем не может остановить падение.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 4 уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше 3.","translationSource":"5e14.ttg.club"},{"id":"sending","ru":"Послание","en":"Sending","lvl":3,"school":"воплощение","cls":["bard","cleric","warlock","wizard"],"time":"1 действие","range":"Неограниченно","comp":"В, С, М","dur":"1 раунд","ritual":false,"desc":"","full":"Вы посылаете короткое сообщение длиной не больше 25 слов существу, известному вам. Это существо слышит послание в сознании, распознаёт вас в качестве отправителя, если оно вас знает, и тут же может ответить (не более 25 слов).\n\nЭто заклинание позволяет существам с Интеллектом как минимум 1 понимать смысл вашего послания. Вы можете передать послание на любое расстояние, и даже на другие планы существования, но если цель находится на ином плане, существует 5-процентный шанс, что послание не будет доставлено.","translationSource":"5e14.ttg.club"},{"id":"phantom_steed","ru":"Призрачный скакун","en":"Phantom Steed","lvl":3,"school":"иллюзия","cls":["wizard"],"time":"1 минута","range":"30 футов","comp":"В, С","dur":"1 час","ritual":true,"desc":"","full":"На полу в свободном пространстве на ваш выбор в пределах дистанции появляется Большое полуреальное похожее на лошадь существо. Вы сами определяете его внешность, но у него есть седло, удила и уздечка.\n\nВсё снаряжение, созданное этим заклинанием, исчезает в клубах дыма, если его отнести на 10 футов от скакуна.\n\nПока заклинание активно, вы или выбранное вами существо можете ехать на скакуне верхом. Используются характеристики ездовой лошади [riding horse], за исключением того, что скорость существа 100 футов, и оно может проскакать 10 миль за час или 13 миль в быстром темпе.\n\nКогда заклинание заканчивается, скакун медленно исчезает, давая ездоку 1 минуту на спешивание.\n\nЗаклинание оканчивается, если вы окончите его Действием или если скакун получит какой-либо урон.","translationSource":"5e14.ttg.club"},{"id":"call_lightning","ru":"Призыв молнии","en":"Call Lightning","lvl":3,"school":"вызов","cls":["cleric","druid"],"time":"1 действие","range":"120 футов","comp":"В, С","dur":"Концентрация, до 10 минут","ritual":false,"desc":"урон 3d10 (электричеством); спасбросок Ловкости; на высоких уровнях: усиливается (1d10)","full":"Появляется туча в форме цилиндра 10 футов в высоту и с радиусом 60 футов, с центром в точке, которую вы видите в пределах дистанции над головой1.\n\nЗаклинание проваливается, если вы не видите точку в воздухе, где должна появиться туча (например, если вы находитесь в комнате, в которой туча не поместится).\n\nАктивировав заклинание, выберите видимую точку2 под тучей, из тучи в эту точку бьёт разряд молнии. Все существа в пределах 5 футов от этой точки должны совершить спасбросок Ловкости. Существо получает 3к10 урона электричеством при провале или половину этого урона в случае успешного спасброска.\n\nПока заклинание активно, вы можете в каждый свой ход Действием вызывать новую молнию, в ту же или другую точку.\n\nЕсли в момент накладывания заклинания вы находитесь на открытом воздухе во время грозы, заклинание не создаёт новую тучу, а даёт контроль над существующей. В такой ситуации урон от заклинания увеличивается на 1к10.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 4 уровня или выше, урон увеличивается на 1к10 за каждый уровень ячейки выше третьего.","translationSource":"5e14.ttg.club"},{"id":"vampiric_touch","ru":"Прикосновение вампира","en":"Vampiric Touch","lvl":3,"school":"некромантия","cls":["warlock","wizard"],"time":"1 действие","range":"На себя","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"урон 3d6 (некротический); атака заклинанием; на высоких уровнях: усиливается (1d6)","full":"Касание вашей окутанной тенями рукой может вытягивать жизненные силы у других, залечивая ваши раны.\n\nСовершите рукопашную атаку заклинанием по существу в пределах вашей досягаемости. При попадании цель получает 3к6 урона некротической энергией, а вы восстанавливаете количество хитов, равное половине причинённого урона некротической энергией. Пока заклинание активно, вы в каждом ходу можете Действием совершать эту атаку.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 4 уровня или выше, урон увеличивается на 1к6 за каждый уровень ячейки выше третьего.","translationSource":"5e14.ttg.club"},{"id":"bestow_curse","ru":"Проклятие","en":"Bestow Curse","lvl":3,"school":"некромантия","cls":["bard","cleric","wizard"],"time":"1 действие","range":"Касание","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"урон 1d8 (некротический); спасбросок Мудрости; на высоких уровнях: усиливается","full":"Вы касаетесь существа, и оно должно преуспеть в спасброске Мудрости, иначе станет проклятым на период действия заклинания. Накладывая это заклинание, выберите характер проклятья из следующего списка:\n\nВыберите одну характеристику. Будучи проклятой, цель совершает проверки и спасброски этой характеристики с помехой.\nБудучи проклятой, цель совершает с помехой броски атаки по вам.\nБудучи проклятой, цель должна в начале каждого своего хода совершать спасбросок Мудрости. В случае провала она впустую тратит своё действие.\nПока цель проклята, ваши атаки и заклинания причиняют ей дополнительно 1к8 урона некротической энергией. Заклинание снятие проклятья [remove curse] оканчивает этот эффект.\n\nС разрешения Мастера, вы можете создать альтернативный эффект проклятья, но он не должен быть сильнее тех, что представлены выше. Финальное решение об эффекте проклятья остаётся за Мастером.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 4 уровня или выше, длительность будет «Концентрация, вплоть до 10 минут». Если вы использовали ячейку 5 уровня или выше, длительность будет «8 часов». Если вы использовали ячейку 7 уровня или выше, длительность будет «24 часа». Если вы использовали ячейку 9 уровня, заклинание действует, пока не рассеется. При использовании ячейки как минимум 5 уровня концентрация не требуется.","translationSource":"5e14.ttg.club"},{"id":"speak_with_dead","ru":"Разговор с мёртвыми","en":"Speak with Dead","lvl":3,"school":"некромантия","cls":["bard","cleric"],"time":"1 действие","range":"10 футов","comp":"В, С, М","dur":"10 минут","ritual":false,"desc":"","full":"Вы даёте подобие жизни и сознания трупу, выбранному в пределах дистанции, позволяя ему отвечать на задаваемые вами вопросы. У трупа должен быть рот, и он не может быть нежитью. Заклинание проваливается, если этот труп был целью этого заклинания в течение последних 10 дней.\n\nПока заклинание активно, вы можете задать трупу пять вопросов. Труп знает только то, что знал при жизни, включая известные языки. Ответы обычно короткие, загадочные или невыразительные, и труп не обязан давать правдивый ответ, если вы враждебны к нему или он распознает в вас врага.\n\nЭто заклинание не возвращает душу в тело существа, а только оживляет дух. Таким образом, труп не может узнавать новую информацию, не осознаёт того, что происходило после его смерти, и не может размышлять о будущих событиях.","translationSource":"5e14.ttg.club"},{"id":"speak_with_plants","ru":"Разговор с растениями","en":"Speak with Plants","lvl":3,"school":"преобразование","cls":["bard","druid","ranger"],"time":"1 действие","range":"На себя","comp":"В, С","dur":"10 минут","ritual":false,"desc":"","full":"Вы наделяете растения в пределах 30 футов от себя ограниченным сознанием и подобием жизни, позволяя им общаться с вами и выполнять ваши простые инструкции.\n\nВы можете спрашивать их о событиях, происходивших в области заклинания за последний день, получая информацию о проходивших существах, погоде и прочих обстоятельствах.\n\nВы можете также превратить на время действия заклинания труднопроходимую местность, вызванную растениями (кусты и заросли), в обычную местность. Вы можете превратить на время действия заклинания обычную местность в труднопроходимую, если там есть растения, например, заставляя ветки и лианы хватать преследователей. На усмотрение Мастера, растения могут выполнять и другие задачи.\n\nЭто заклинание не позволяет растениям выкапываться и перемещаться, но они могут свободно двигать ветками, ростками и стеблями. Если в области заклинания есть растительное существо, вы можете общаться с ним, как если бы у вас был общий язык, но вы не получаете магическую способность влиять на него.\n\nЭто заклинание может заставить растения, созданные заклинанием опутывание [entangle], отпустить существо.","translationSource":"5e14.ttg.club"},{"id":"dispel_magic","ru":"Рассеивание магии","en":"Dispel Magic","lvl":3,"school":"ограждение","cls":["bard","cleric","druid","paladin","sorcerer","warlock","wizard"],"time":"1 действие","range":"120 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Выберите одно существо, предмет или магический эффект в пределах дистанции. Все заклинания 3 уровня и ниже на цели оканчиваются.\n\nДля каждого заклинания с уровнем 4 или выше совершите проверку базовой характеристики. Сл равна 10 + уровень заклинания.\n\nВ случае успеха это заклинание оканчивается.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 4 уровня или выше, вы автоматически заканчиваете эффекты заклинаний на цели, чей уровень не превышает уровень использованной ячейки заклинаний.","translationSource":"5e14.ttg.club"},{"id":"plant_growth","ru":"Рост растений","en":"Plant Growth","lvl":3,"school":"преобразование","cls":["bard","cleric","druid","paladin","ranger","warlock"],"time":"1 действие","range":"150 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"","full":"Это заклинание вливает жизненные силы в растения, находящиеся в определённой области.\n\nЕсть два варианта использования этого заклинания; одно даёт краткосрочный, другое — долговременный эффект.\n\nЕсли вы активируете это заклинание 1 действием, выберите точку в пределах дистанции. Все обычные растения в пределах 100-футового радиуса с центром на этой точке становятся густыми и рослыми. Существо, перемещающееся по этой местности, должно потратить 4 фута перемещения за каждый 1 пройдённый фут. Вы можете исключить одну или несколько областей любого размера в пределах зоны действия заклинания.\n\nЕсли вы активируете это заклинание 8 часов, вы делаете почву удобренной. Все растения в радиусе полумили с центром на точке в пределах дистанции становятся удобренными на 1 год. Эти растения приносят удвоенный урожай еды.","translationSource":"5e14.ttg.club"},{"id":"meld_into_stone","ru":"Слияние с камнем","en":"Meld Into Stone","lvl":3,"school":"преобразование","cls":["cleric","druid"],"time":"1 действие","range":"Касание","comp":"В, С","dur":"8 часов","ritual":true,"desc":"урон 6d6 (дробящий)","full":"Вы входите в каменный предмет или поверхность, достаточно большую, чтобы там поместилось ваше тело, и сливаетесь на время действия заклинания вместе со всем снаряжением с камнем. Используя перемещение, вы выходите из камня в точке, которой можете коснуться.\n\nВаше присутствие абсолютно незаметно, и без помощи магии обнаружить вас невозможно. Слившись с камнем, вы не можете видеть, что происходит вокруг, и все проверки Мудрости (Внимательность), совершённые, чтобы слушать, совершаются с помехой.\n\nВы осознаёте ход времени и можете в камне накладывать заклинания на себя.\n\nВы можете перемещением выйти из камня в том месте, где вы входили, что оканчивает это заклинание. Иначе вы перемещаться не можете.\n\nНебольшие физические повреждения камня не причиняют вам вреда, но частичное разрушение или изменение его формы (так, что вы больше внутри не поместитесь) изгоняют вас и причиняют 6к6 дробящего урон.\n\nПолное разрушение камня (или превращение его в другую субстанцию) изгоняет вас и причиняет 50 дробящего урона. Если вас изгоняют, вы падаете ничком в свободном пространстве, ближайшем к месту, в котором вы входили в камень.","translationSource":"5e14.ttg.club"},{"id":"remove_curse","ru":"Снятие проклятья","en":"Remove Curse","lvl":3,"school":"ограждение","cls":["cleric","paladin","warlock","wizard"],"time":"1 действие","range":"Касание","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"","full":"После вашего касания все проклятья, действующие на одно существо или предмет, оканчиваются. Если предмет был проклятым магическим предметом, проклятье остаётся, но заклинание разрывает настройку владельца на него, поэтому его можно снять или выбросить.","translationSource":"5e14.ttg.club"},{"id":"create_food_and_water","ru":"Сотворение пищи и воды","en":"Create Food and Water","lvl":3,"school":"вызов","cls":["cleric","druid","paladin"],"time":"1 действие","range":"30 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы создаёте 45 фунтов еды и 30 галлонов (100 литров) воды на земле или в контейнере в пределах дистанции, которых достаточно для питания пятнадцати гуманоидов или пятерых скакунов на 24 часа. Еда безвкусная, но сытная, и портится, если её не съесть за 24 часа. Вода чистая, и она не портится.","translationSource":"5e14.ttg.club"},{"id":"wind_wall","ru":"Стена ветров","en":"Wind Wall","lvl":3,"school":"воплощение","cls":["cleric","druid","ranger"],"time":"1 действие","range":"120 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"урон 3d8 (дробящий); спасбросок Силы","full":"В точке на земле, выбранной вами в пределах дистанции, начинает дуть сильный ветер. Вы можете сделать стену длиной до 50 футов, высотой до 15 футов и толщиной до 1 фута. Вы можете как угодно изгибать стену, лишь бы это был непрерывный путь по земле.\n\nСтена существует, пока активно заклинание. Когда стена появляется, все существа в её области должны совершить спасброски Силы. Существо получает 3к8 дробящего урона при провале, или половину этого урона при успехе.\n\nСильный ветер сдерживает туман, дым и прочие газы.\n\nМаленькие и ещё меньшие летающие существа и предметы не могут пройти через эту стену. Лёгкие, сыпучие материалы, оказавшиеся в стене, взлетают вверх. Стрелы, болты и прочие обычные боеприпасы, выпущенные в цели, находящиеся за стеной, отклоняются вверх и автоматически промахиваются (валуны, брошенные великанами и осадными машинами, а также подобные боеприпасы, не отклоняются). Существа в газообразной форме не могут пройти через неё.","translationSource":"5e14.ttg.club"},{"id":"fear","ru":"Ужас","en":"Fear","lvl":3,"school":"иллюзия","cls":["bard","sorcerer","warlock","wizard"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Мудрости","full":"Вы проецируете призрачное изображение худших кошмаров других существ. Все существа в 30-футовом конусе должны преуспеть в спасброске Мудрости, иначе они бросают всё, что держат в руках, и становятся испуганными на время действия заклинания.\n\nБудучи испуганным этим заклинанием, существо должно каждый свой ход совершать действие Рывок, и перемещаться прочь от вас по самому безопасному маршруту, пока у неё есть куда перемещаться.\n\nЕсли существо оканчивает ход в месте, откуда у него нет линии обзора до вас, оно может совершить спасбросок Мудрости. В случае спасения заклинание перестаёт действовать на это существо.","translationSource":"5e14.ttg.club"},{"id":"haste","ru":"Ускорение","en":"Haste","lvl":3,"school":"преобразование","cls":["druid","paladin","sorcerer","wizard"],"time":"1 действие","range":"30 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Ловкости","full":"Выберите согласное существо, видимое в пределах дистанции. Пока заклинание активно, скорость цели удваивается, она получает бонус +2 к КД, она совершает с преимуществом спасброски Ловкости, и в каждом своём ходу может совершать дополнительное действие. Этим действием может быть только Атака (одна атака оружием), Засада, Использование предмета, Отход или Рывок.\n\nКогда заклинание оканчивается, цель не может перемещаться и совершать Действия, пока не пропустит свой следующий ход, так как становится заторможенной.","translationSource":"5e14.ttg.club"},{"id":"water_walk","ru":"Хождение по воде","en":"Water Walk","lvl":3,"school":"преобразование","cls":["cleric","druid","ranger","sorcerer"],"time":"1 действие","range":"30 футов","comp":"В, С, М","dur":"1 час","ritual":true,"desc":"","full":"Это заклинание дарует способность перемещаться по жидкой поверхности — такой как вода, кислота, грязь, снег, зыбучий песок или лава — как если бы это была безвредная твёрдая поверхность (существа, идущие по жидкой лаве, всё равно получают урон от жара).\n\nДо десяти согласных существ, видимых вами в пределах дистанции, получают эту же способность на время действия заклинания. Если вы делаете целью существо, погружённое в жидкость, заклинание поднимает его на поверхность со скоростью 60 футов в раунд.","translationSource":"5e14.ttg.club"},{"id":"tongues","ru":"Языки","en":"Tongues","lvl":3,"school":"прорицание","cls":["bard","cleric","sorcerer","warlock","wizard"],"time":"1 действие","range":"Касание","comp":"В, М","dur":"1 час","ritual":false,"desc":"","full":"Это заклинание дарует существу, которого вы касаетесь, способность понимать все языки, которые оно слышит. Более того, когда цель говорит, все существа, знающие хотя бы один язык, и слышащие цель, понимают, что она сказала.","translationSource":"5e14.ttg.club"},{"id":"mordenkainens_faithful_hound","ru":"Верный пёс Морденкайнена","en":"Mordenkainen's Faithful Hound","lvl":4,"school":"вызов","cls":["wizard"],"time":"1 действие","range":"30 футов","comp":"В, С, М","dur":"8 часов","ritual":false,"desc":"урон 4d8 (колющий)","full":"Вы создаёте призрачного сторожевого пса в свободном пространстве, видимом в пределах дистанции, где он и остаётся на время длительности заклинания, пока вы не отпустите его Действием, или пока вы не отойдёте от него более чем на 100 футов. Пёс невидим для всех существо кроме вас, и ему нельзя причинить вред.\n\nЕсли в пределах 30 футов от него оказывается существо с размером Маленькое или больше, не произнося при этом пароль, указанный вами при накладывании этого заклинания, пёс начинает громко лаять.\n\nПёс видит невидимых существ и его зрение простирается на Эфирный План. Он игнорирует иллюзии. В начале каждого вашего хода пёс пытается укусить одно существо в пределах 5 футов от себя, враждебное вам. Бонус атаки пса равен вашему модификатору базовой характеристики + ваш бонус мастерства. При попадании он причиняет 4к8 колющего урона.","translationSource":"5e14.ttg.club"},{"id":"control_water","ru":"Власть над водами","en":"Control Water","lvl":4,"school":"преобразование","cls":["cleric","druid","wizard"],"time":"1 действие","range":"300 футов","comp":"В, С, М","dur":"Концентрация, до 10 минут","ritual":false,"desc":"урон 2d8 (дробящий); спасбросок Силы","full":"Пока это заклинание активно, вы контролируете свободно текущую или стоячую воду в кубе с длиной ребра 100 футов. Вы можете выбрать один эффект из перечисленных ниже. Вы можете в свой ход Действием повторить тот же эффект или выбрать другой.\n\nВодоворот. Для этого эффекта требуется объём воды в квадрате с длиной стороны 50 футов и глубиной 25 футов. В центре области вы формируете водоворот. Водоворот создаёт воронку шириной 5 футов в основании, 50 футов в верхней части, и высотой 25 футов. Все существа и предметы, находящиеся в воде в пределах 25 футов от водоворота, подтягиваются к нему на 10 футов. Существа могут плыть прочь от водоворота, совершая проверку Силы (Атлетика) против Сл ваших заклинаний.\n\nЕсли существо впервые за раунд входит в пространство воронки или начинает в ней ход, оно должно совершить спасбросок Силы. При провале существо получает 2к8 дробящего урона и становится пойманным воронкой, пока заклинание активно. При успешном спасении существо получает половину урона, и не становится пойманным воронкой. Пойманное воронкой существо может действием пытаться уплыть от водоворота, как описано выше, но проверка Силы (Атлетика) совершается с помехой. В каждом ходу в первый раз, когда предмет оказывается в области воронки, он получает 2к8 дробящего урона; этот же урон причиняется за каждый раунд, проведённый предметом в воронке.\n\nНаводнение. Вы увеличиваете уровень стоячей воды в области на высоту до 20 футов. Если в область попадает берег, вода выливается на землю. Если вы выбрали область посреди другого водного пространства, то вы вместо этого создаёте волну высотой 20 футов, проходящую с одного края области до другого, где она и опадает. Все транспортные средства Огромного размера и меньше по ходу волны уносятся вместе с волной на противоположную сторону. Все транспортные средства Огромного размера и меньше, ударенные волной, получают 25 процентный шанс опрокинуться. Уровень воды остаётся повышенным, пока заклинание не окончится или вы не выберете другой эффект. Если этот эффект создал волну, волна будет повторяться в начале вашего следующего хода, пока длится эффект «наводнение».\n\nПеренаправление потока. Вы заставляете текущую воду в области перемещаться в выбранном вами направлении, даже если воде придётся течь через препятствия, вверх по стенам или в другом неугодном ей направлении. В области заклинания вода течёт так, как укажете вы, но оказавшись за пределами зоны заклинания, она возвращается к естественному течению. Вода продолжает течь в указанном вами направлении, пока заклинание активно или пока вы не выберете другой эффект.\n\nРазделение воды. Вы заставляете воду в области разойтись в стороны, формируя проход. Проход простирается в области заклинания, а разделённые воды формируют стены с обеих сторон. Проход существует, пока заклинание активно, или пока вы не выберете другой эффект. После этого вода в течение раунда медленно заполняет проход, восстанавливаясь до нормального уровня.","translationSource":"5e14.ttg.club"},{"id":"phantasmal_killer","ru":"Воображаемый убийца","en":"Phantasmal Killer","lvl":4,"school":"иллюзия","cls":["wizard"],"time":"1 действие","range":"120 футов","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"урон 4d10 (психический); спасбросок Мудрости; на высоких уровнях: усиливается (1d10)","full":"Вы заглядываете в кошмары существа, видимого в пределах дистанции, и создаёте иллюзорное проявление его страхов, видимое только ему.\n\nЦель должна совершить спасбросок Мудрости. При провале цель становится испуганной до конца действия заклинания.\n\nВ конце каждого своего хода, пока заклинание активно, цель должна преуспевать в спасброске Мудрости, иначе она получает 4к10 урона психической энергией. При успехе заклинание заканчивается.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 5 уровня или выше, урон увеличивается на 1к10 за каждый уровень ячейки выше четвёртого.","translationSource":"5e14.ttg.club"},{"id":"conjure_woodland_beings","ru":"Вызов лесных обитателей","en":"Conjure Woodland Beings","lvl":4,"school":"вызов","cls":["druid","ranger"],"time":"1 действие","range":"60 футов","comp":"В, С, М","dur":"Концентрация, до 1 часа","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вы призываете фейских существ, которые появляются в свободном пространстве, которое вы видите в пределах дистанции. Выберите один из вариантов того, кто появляется:\n\nОдно фейское существо с показателем опасности 2 или ниже\nДва фейских существа с показателем опасности 1 или ниже\nЧетыре фейских существа с показателем опасности 1/2 или ниже\nВосемь фейских существ с показателем опасности 1/4 или ниже.\n\nПризванное существо исчезает, когда его хиты опускаются до 0, или когда заклинание оканчивается. Призванные существа дружественны к вам и вашим спутникам.\n\nСовершите проверку инициативы за призванных существ как за одну группу, и они будут совершать свои собственные ходы. Они подчиняются отданным вами устно командам (действие не требуется). Если вы не отдаёте команду, они защищаются от враждебных существ, но действий не совершают. Параметры существ есть у Мастера.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейки большего уровня, вы выбираете один из описанных выше вариантов, но появляется в два раза больше существ при ячейке 6 уровня, и в три раза больше при ячейке 8 уровня. Параметры существ есть у Мастера.","translationSource":"5e14.ttg.club"},{"id":"conjure_minor_elementals","ru":"Вызов малых элементалей","en":"Conjure Minor Elementals","lvl":4,"school":"вызов","cls":["druid","wizard"],"time":"1 минута","range":"90 футов","comp":"В, С","dur":"Концентрация, до 1 часа","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вы призываете элементалей, которые появляются в свободном пространстве, которое вы видите в пределах дистанции. Выберите один из вариантов того, кто появляется:\n\nОдин элементаль с показателем опасности 2 или ниже\nДва элементаля с показателем опасности 1 или ниже\nЧетыре элементаля с показателем опасности 1/2 или ниже\nВосемь элементалей с показателем опасности 1/4 или ниже\n\nЭлементаль исчезает, когда его хиты опускаются до 0, или когда заклинание оканчивается.\n\nПризванные существа дружественны к вам и вашим спутникам.\n\nСовершите проверку инициативы за призванных существ как за одну группу, и они будут совершать свои собственные ходы. Они подчиняются отданным вами устно командам (действие не требуется). Если вы не отдаёте команду, они защищаются от враждебных существ, но действий не совершают.\n\nПараметры существ есть у Мастера.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейки большего уровня, вы выбираете один из описанных выше вариантов, но появляется в два раза больше существ при ячейке 6 уровня, и в три раза больше при ячейке 8 уровня.","translationSource":"5e14.ttg.club"},{"id":"greater_invisibility","ru":"Высшая невидимость","en":"Greater Invisibility","lvl":4,"school":"иллюзия","cls":["bard","druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"Касание","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"","full":"Вы или существо, которого вы касаетесь, становитесь невидимым, пока активно заклинание. Всё, что цель носит и несёт, становится невидимым, пока находится у этой личности.","translationSource":"5e14.ttg.club"},{"id":"giant_insect","ru":"Гигантское насекомое","en":"Giant Insect","lvl":4,"school":"преобразование","cls":["druid"],"time":"1 действие","range":"30 футов","comp":"В, С","dur":"Концентрация, до 10 минут","ritual":false,"desc":"","full":"Вы превращаете на время действия заклинания до десяти многоножек, трёх пауков, пяти ос или одного скорпиона, находящихся в пределах дистанции, в гигантские версии своих сородичей.\n\nМногоножка становится гигантской многоножкой [giant centipede], паук становится гигантским пауком [giant spider], оса становится гигантской осой [giant wasp], а скорпион становится гигантским скорпионом [giant scorpion].\n\nВсе существа повинуются вашим устным командам, и в бою они в каждом раунде действуют в ваш ход. Действия и перемещения контролирует Мастер.\n\nСущество сохраняет гигантский размер всю длительность заклинания, пока его хиты не опустятся до 0, или пока вы не окончите действием эффект на нём.\n\nМастер может позволить вам выбирать другие цели.\n\nНапример, если вы превращаете жука, его гигантская версия может обладать теми же характеристиками, что и гигантская оса.","translationSource":"5e14.ttg.club"},{"id":"ice_storm","ru":"Град","en":"Ice Storm","lvl":4,"school":"воплощение","cls":["cleric","druid","paladin","sorcerer","wizard"],"time":"1 действие","range":"300 футов","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"урон 2d8 (дробящий); урон 4d6 (холодом); спасбросок Ловкости; на высоких уровнях: усиливается (1d8)","full":"На землю в цилиндре с радиусом 20 футов и высотой 40 футов, с центром на точке в пределах дистанции, падают куски льда. Все существа в цилиндре должны совершить спасбросок Ловкости. Существо получает 2к8 дробящего урона и 4к6 урона холодом при провале, или половину этого урона при успехе.\n\nГрад превращает область воздействия в труднопроходимую местность до конца вашего следующего хода.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 5 уровня или выше, дробящий урон увеличивается на 1к8 за каждый уровень ячейки выше четвёртого.","translationSource":"5e14.ttg.club"},{"id":"death_ward","ru":"Защита от смерти","en":"Death Ward","lvl":4,"school":"ограждение","cls":["cleric","paladin"],"time":"1 действие","range":"Касание","comp":"В, С","dur":"8 часов","ritual":false,"desc":"","full":"Вы касаетесь существа и даруете ему некоторую защиту от смерти. Когда хиты цели впервые опускаются до 0 из-за получения урона, хиты цели опускаются всего лишь до 1, и заклинание заканчивается.\n\nЕсли заклинание ещё действует, а цель попадает под действие эффекта, убивающего её мгновенно, не причиняя урона, то этот эффект игнорируется, и заклинание заканчивается.","translationSource":"5e14.ttg.club"},{"id":"banishment","ru":"Изгнание","en":"Banishment","lvl":4,"school":"ограждение","cls":["cleric","paladin","sorcerer","warlock","wizard"],"time":"1 действие","range":"60 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Харизмы; на высоких уровнях: усиливается","full":"Вы пытаетесь послать одно существо, которое видите в пределах дистанции, на другой план существования. Цель должна преуспеть в спасброске Харизмы, иначе будет изгнана. Если цель родом с того плана существования, на котором находитесь вы, вы изгоняете её в безопасный демиплан. Находясь там, цель недееспособна. Она остаётся там, пока активно заклинание, после чего возвращается в пространство, из которого исчезла, или ближайшее свободное пространство, если то место занято.\n\nЕсли цель родом не с того плана существования, на котором находитесь вы, цель изгоняется с негромким хлопком, возвращаясь на свой родной план.\n\nЕсли заклинание окончится раньше чем через 1 минуту, цель возвращается в пространство, из которого исчезла, или ближайшее свободное пространство, если то место занято. В противном случае цель не возвращается.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 5 уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше четвёртого.","translationSource":"5e14.ttg.club"},{"id":"fabricate","ru":"Изготовление","en":"Fabricate","lvl":4,"school":"преобразование","cls":["wizard"],"time":"10 минут","range":"120 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы превращаете сырьё в готовое изделие из этого материала. Например, вы можете создать деревянный мост из нескольких деревьев, верёвку из груды пеньки, или одежду изо льна или шерсти.\n\nВыберите сырьё, которое видите в пределах дистанции. Вы можете создать предмет Большого или меньшего размера (помещающийся в куб с длиной ребра 10 футов, или восемь соединённых кубов с длиной ребра 5 футов), при условии, что сырья хватит.\n\nЕсли вы работаете с металлом, камнем или другой минеральной материей, создаваемый предмет не может быть больше Среднего размера (должен помещаться в один куб с длиной ребра 5 футов).\n\nКачество предметов, изготавливаемых этим заклинанием, напрямую зависит от качества сырья.\n\nЭтим заклинанием нельзя создавать и изменять существ и магические предметы. Вы также не можете создавать с его помощью предметы, обычно требующие высокого мастерства, такие как ювелирные изделия, оружие, стекло или доспех, если только вы не владеете ремесленным инструментом, необходимым для создания таких предметов.","translationSource":"5e14.ttg.club"},{"id":"stone_shape","ru":"Изменение формы камня","en":"Stone Shape","lvl":4,"school":"преобразование","cls":["cleric","druid","wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы касаетесь каменного предмета с размером не больше Среднего, или камня, не превышающего ни по одному из измерений более 5 футов, и придаёте ему любую форму.\n\nТак, например, вы можете превратить большой камень в оружие, статую или гроб, или создать небольшой проход в стене, если эта стена толщиной меньше 5 футов.\n\nВы можете также скорректировать каменную дверь или её обрамление, чтобы запереть наглухо. У создаваемого вами предмета могут быть две дверные петли и щеколда, но более мелкие механические детали невозможны.","translationSource":"5e14.ttg.club"},{"id":"mordenkainens_private_sanctum","ru":"Кабинет Морденкайнена","en":"Mordenkainen's Private Sanctum","lvl":4,"school":"ограждение","cls":["wizard"],"time":"10 минут","range":"120 футов","comp":"В, С, М","dur":"24 часа","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вы создаёте в пределах дистанции защищённое магией место. Это куб с длиной ребра от 5 до 100 футов. Заклинание длится, пока не окончится, или вы не окончите его Действием. Когда вы накладываете это заклинание, вы решаете, какую именно безопасность обеспечивает заклинание, выбирая все или некоторые из следующих свойств:\n\nЗвуки не проходят сквозь границу защищённого пространства.\nГраница защищённого пространства выглядит тёмной и затуманенной, блокируя обзор (в том числе и тёмное зрение) сквозь неё.\nСенсоры, создаваемые заклинаниями школы Прорицания, не могут появляться в защищённой области и проходить сквозь её периметр.\nСущества в области не могут становиться целями заклинаний школы Прорицания.\nНичто не может телепортироваться в охраняемую область или из неё.\nВ охраняемой области блокируются планарные перемещения.\nНакладывание этого заклинания на одно и то же место в течение года делает этот эффект постоянным.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 5 уровня или выше, вы можете увеличить размер куба на 100 футов за каждый уровень ячейки выше 4. Таким образом, это заклинание, использованное ячейкой 5 уровня, может создать куб с длиной ребра 200 футов.","translationSource":"5e14.ttg.club"},{"id":"stoneskin","ru":"Каменная кожа","en":"Stoneskin","lvl":4,"school":"ограждение","cls":["cleric","druid","paladin","ranger","sorcerer","wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"Это заклинание делает плоть согласного существа, которого вы коснулись, твёрдой как камень. Пока заклинание активно, цель получает сопротивление немагическому дробящему, колющему и рубящему урону.","translationSource":"5e14.ttg.club"},{"id":"leomunds_secret_chest","ru":"Леомундов потайной сундук","en":"Leomund's Secret Chest","lvl":4,"school":"вызов","cls":["wizard"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы прячете сундук вместе со всем его содержимым на Эфирном Плане. Вы должны касаться и сундука и его миниатюрной копии, служащей материальным компонентом для заклинания. Сундук может содержать до 12 кубических футов неживой материи (3×2×2 фута).\n\nПока сундук остаётся на Эфирном Плане, вы можете действием прикоснуться к копии, чтобы вернуть сундук. Он появляется в свободном пространстве на полу в пределах 5 футов от вас.\n\nВы можете отослать сундук обратно на Эфирный План, прикоснувшись действием к сундуку и его копии. Спустя 60 дней появляется накопительный шанс 5 процентов в день, что эффект заклинания окончится.\n\nЭффект оканчивается, если вы активируете это заклинание ещё раз, если копия сундука будет уничтожена, или если вы окончите это заклинание действием. Если заклинание оканчивается, а сундук находится на Эфирном Плане, он безвозвратно теряется.","translationSource":"5e14.ttg.club"},{"id":"arcane_eye","ru":"Магический глаз","en":"Arcane Eye","lvl":4,"school":"прорицание","cls":["cleric","wizard"],"time":"1 действие","range":"30 футов","comp":"В, С, М","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"Вы создаёте невидимый магический глаз в пределах дистанции, который парит в воздухе на время длительности. Вы мысленно воспринимаете зрительную информацию с глаза, у которого обычное зрение и тёмное зрение в пределах 30 футов. Глаз смотрит во всех направлениях.\n\nВы можете Действием переместить глаз на 30 футов в любом направлении. Глаз может удаляться от вас на любое расстояние, но не может уходить на другие планы существования.\n\nСплошные препятствия блокируют движение глаза, но он может проходить через отверстия диаметром в 1 дюйм (2,5 сантиметра).","translationSource":"5e14.ttg.club"},{"id":"hallucinatory_terrain","ru":"Мираж","en":"Hallucinatory Terrain","lvl":4,"school":"иллюзия","cls":["bard","druid","warlock","wizard"],"time":"10 минут","range":"300 футов","comp":"В, С, М","dur":"24 часа","ritual":false,"desc":"","full":"Вы заставляете природную местность в пределах куба с длиной ребра 150 футов, находящегося в пределах дистанции, выглядеть, звучать и пахнуть как другая природная местность. Таким образом, поле или дорогу можно сделать похожей на болото, холм, расселину или другую труднопроходимую или непроходимую местность. Пруд можно сделать похожим на травяную лужайку, пропасть сделать пологим спуском, а каменистый овраг — широкой и ровной дорогой.\n\nРукотворные строения, снаряжение и существа в области не меняют облик. Тактильные ощущения местности не меняются, поэтому существа, входящие в неё, скорее всего, поймут обман.\n\nЕсли на прикосновение разница не очевидна, существо, тщательно исследующее иллюзию, может предпринять проверку Интеллекта (Анализ) против Сл ваших заклинаний, чтобы не поверить.\n\nСущество, способное распознавать иллюзии, видит полупрозрачный образ, наложенный на местность.","translationSource":"5e14.ttg.club"},{"id":"wall_of_fire","ru":"Огненная стена","en":"Wall of Fire","lvl":4,"school":"воплощение","cls":["cleric","druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"120 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"урон 5d8 (огнём); спасбросок Ловкости; на высоких уровнях: усиливается (1d8)","full":"Вы создаёте стену из огня на твёрдой поверхности в пределах дистанции. Вы можете создать стену до 60 футов в длину, 20 футов в высоту и 1 фут толщиной, или замкнутой кольцом стеной до 20 футов диаметром, 20 футов высотой и толщиной 1 фут.\n\nСтена непрозрачная и существует, пока активно заклинание. Когда стена появляется, все существа в её области должны совершить спасбросок Ловкости. При провале они получают 5к8 урона огнём или половину этого урона при успехе.\n\nОдна сторона стены, выбранная при накладывании заклинания, причиняет 5к8 урона огнём всем существам, оканчивающим ход в пределах 10 футов от этой стороны или внутри стены.\n\nСущества получают такой же урон когда впервые за ход входят в стену или оканчивают там ход. Другая сторона стены не причиняет урон.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 5 уровня или выше, урон увеличивается на 1к8 за каждый уровень ячейки выше четвёртого.","translationSource":"5e14.ttg.club"},{"id":"fire_shield","ru":"Огненный щит","en":"Fire Shield","lvl":4,"school":"воплощение","cls":["warlock","wizard"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"10 минут","ritual":false,"desc":"","full":"На время длительности заклинания ваше тело покрывается тонким слоем пламени, испускающим яркий свет в пределах 10-футового радиуса и тусклый свет в пределах ещё 10 футов. Вы можете досрочно окончить это заклинание Действием.\n\nЭто пламя предоставляет вам либо тёплый щит, либо прохладный щит, на ваш выбор.\n\nТёплый щит даёт вам сопротивление к урону холодом, а прохладный щит даёт сопротивление к урону огнём.\n\nКроме того, каждый раз, когда существо, находящееся в пределах 5 футов от вас, попадает по вам рукопашной атакой, щит испускает пламя. Атакующий получает 2к8 урона огнём в случае тёплого щита или 2к8 урона холодом в случае прохладного щита.","translationSource":"5e14.ttg.club"},{"id":"otilukes_resilient_sphere","ru":"Отилюков упругий шар","en":"Otiluke's Resilient Sphere","lvl":4,"school":"воплощение","cls":["wizard"],"time":"1 действие","range":"30 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Ловкости","full":"Сфера из мерцающей силы окружает находящееся в пределах дистанции существо или предмет с размером не больше Большого.\n\nНежелающее существо должно совершить спасбросок Ловкости. При провале существо окружается сферой на время действия заклинания.\n\nНичто — ни физические предметы, ни энергия, ни эффекты прочих заклинаний — не могут проходить через этот барьер, как внутрь, так и наружу, хотя существо в сфере может дышать нормально.\n\nСфера обладает иммунитетом ко всем видам урона, и находящееся внутри существо или предмет не может получать урон от атак и эффектов, исходящих снаружи, но и находящееся в сфере существо не может причинить урон ничему, что находится снаружи.\n\nСфера ничего не весит, и она достаточно велика, чтобы вместить существо или предмет. Окружённое существо может действием толкать стены сферы и таким образом перемещаться со скоростью, уменьшенной вдвое.\n\nТочно так же, сферу могут поднять и переносить другие существа.\n\nЗаклинание распад [disintegrate], нацеленное на сферу, уничтожает её, не причиняя вреда тому, что находится внутри.","translationSource":"5e14.ttg.club"},{"id":"dimension_door","ru":"Переносящая дверь","en":"Dimension Door","lvl":4,"school":"вызов","cls":["bard","cleric","paladin","sorcerer","warlock","wizard"],"time":"1 действие","range":"500 футов","comp":"В","dur":"Мгновенная","ritual":false,"desc":"урон 4d6 (силовым уроном)","full":"Вы телепортируетесь в другое пространство в пределах дистанции. Вы оказываетесь точно в выбранном месте. Это может быть место, которое вы видели, которое вы представляете, или которое вы можете описать указаниями направления и расстояния, например, «200 футов подо мной» или «на северо-запад, вверх под углом 45 градусов, на 300 футов».\n\nВы можете взять с собой предметы, если их вес позволяет вам их нести. Вы также можете взять с собой одно согласное существо, с размером не больше вашего, которое тоже может нести дозволенный вес предметов.\n\nПри накладывании заклинания существо должно находиться в пределах 5 футов от вас. Если вы должны оказаться в месте, уже занятом существом или предметом, вы и все перемещающиеся с вами существа получаете 4к6 урона силовым полем, и заклинание вас не телепортирует.","translationSource":"5e14.ttg.club"},{"id":"dominate_beast","ru":"Подчинение зверя","en":"Dominate Beast","lvl":4,"school":"очарование","cls":["cleric","druid","sorcerer","warlock"],"time":"1 действие","range":"60 футов","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Мудрости; на высоких уровнях: усиливается","full":"Вы пытаетесь взять под контроль зверя, которого видите в пределах дистанции. Зверь должен преуспеть в спасброске Мудрости, иначе он станет очарован вами на время действия заклинания.\n\nЕсли вы или дружественные вам существа сражаются с ним, он совершает спасбросок с преимуществом. Пока зверь очарован, вы обладаете телепатической связью с ним, пока вы оба находитесь на одном плане существования. При помощи этой связи вы можете отдавать ему команды, пока находитесь в сознании (действие не требуется), и он должен будет их выполнять.\n\nВы можете указать общее действие, такое как «атакуй вон то существо», «беги отсюда» или «принеси вот это». Если существо выполняет приказ и не получает дальнейших указаний от вас, оно в меру своих сил обороняется и защищает себя.\n\nВы можете Действием захватить полный контроль над целью. До конца вашего следующего хода существо совершает только выбранные вами действия, и не делает ничего, что вы ему не позволяете. В это время вы можете заставлять существо совершать реакции, но при этом вы тратите и свою реакцию тоже.\n\nКаждый раз, когда цель получает урон, она совершает новый спасбросок Мудрости от этого заклинания. В случае успеха заклинание оканчивается.\n\nНа более высоких уровнях: Если вы накладываете это заклинание с уровнем ячейки 5, концентрацию можно поддерживать до 10 минут. Если вы накладываете это заклинание с уровнем ячейки 6, концентрацию можно поддерживать до 1 часа. Если вы накладываете это заклинание с уровнем ячейки 7 или выше, концентрацию можно поддерживать до 8 часов.","translationSource":"5e14.ttg.club"},{"id":"locate_creature","ru":"Поиск существа","en":"Locate Creature","lvl":4,"school":"прорицание","cls":["bard","cleric","druid","paladin","ranger","wizard"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"Концентрация, до 1 часа","ritual":false,"desc":"","full":"Опишите или назовите известное вам существо. Вы чувствуете направление к этому существу, пока оно находится в пределах 1 000 футов от вас. Если существо перемещается, вы узнаёте, в какую сторону оно направляется. Это заклинание может искать конкретное известное вам существо, или ближайшее существо конкретного вида (например, человек или единорог), если вы хотя бы раз видели такое существо вблизи (в пределах 30 футов).\n\nЕсли описанное или названное вами существо находится в другом обличье, например, под эффектом заклинания превращение [polymorph], это заклинание не найдёт это существо.\n\nЭто заклинание не может обнаружить существ, если прямой путь между вами перерезан текущей водой шириной как минимум 10 футов.","translationSource":"5e14.ttg.club"},{"id":"polymorph","ru":"Превращение","en":"Polymorph","lvl":4,"school":"преобразование","cls":["bard","cleric","druid","sorcerer","wizard"],"time":"1 действие","range":"60 футов","comp":"В, С, М","dur":"Концентрация, до 1 часа","ritual":false,"desc":"спасбросок Мудрости","full":"Это заклинание придаёт новый облик существу, которое вы видите в пределах дистанции. Несогласное существо должно совершить спасбросок Мудрости, чтобы избежать эффекта. Перевёртыши автоматически преуспевают в этом спасброске. Это заклинание не может подействовать на цель, у которой 0 хитов.\n\nПревращение длится, пока активно заклинание, или пока хиты цели не опустятся до 0, или она не умрёт. Новый облик может принадлежать зверю, чей ПО не превышает ПО цели (или уровень цели, если у неё нет показателя опасности). Игровые характеристики цели, включая значения ментальных характеристик, заменяются характеристиками выбранного зверя. У цели остаётся мировоззрение и ее личность.\n\nЦель принимает хиты нового облика. При возвращении в естественный облик количество её хитов будет как до превращения. Если она возвращается в свой облик от того, что хиты опустились до 0, весь излишний урон перенесётся на естественный облик. Если излишний урон не опускает хиты естественного облика существа до 0, оно не теряет сознание. Действия существа в новом облике ограничены теми, что доступны ей, и она не может говорить, накладывать заклинания и совершать другие действия, требующие рук или речи.\n\nСнаряжение цели сливается с её новым обликом. Существо не может активировать, использовать, надевать или получать какие-то иные преимущества от своего снаряжения.","translationSource":"5e14.ttg.club"},{"id":"divination","ru":"Предсказание","en":"Divination","lvl":4,"school":"прорицание","cls":["cleric","druid"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"Мгновенная","ritual":true,"desc":"","full":"Ваша магия и жертвоприношение связывают вас с богом или его слугой. Вы задаёте один вопрос о конкретной цели, событии, или деятельности, которая произойдёт в течение следующих 7 дней. Мастер даёт на это честный ответ.\n\nЭто может быть короткая фраза, загадочный стих или знамение. Это заклинание не учитывает всевозможные обстоятельства, способные изменить исход событий, такие как накладывание дополнительных заклинаний и потеря и приобретение спутников.\n\nЕсли вы накладываете это заклинание несколько раз до завершения продолжительного отдыха, существует накопительный шанс 25 процентов за каждое использование, начиная со второго, что вы получите случайный ответ. Мастер совершает этот бросок скрытно.","translationSource":"5e14.ttg.club"},{"id":"compulsion","ru":"Принуждение","en":"Compulsion","lvl":4,"school":"очарование","cls":["bard"],"time":"1 действие","range":"30 футов","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Мудрости","full":"Выбранные вами существа, которых вы видите в пределах дистанции, и которые слышат вас, должны совершить спасбросок Мудрости. Цель автоматически преуспевает, если не может быть очарована. При провале спасброска цель попадает под действие этого заклинания.\n\nПока заклинание активно, вы можете в каждом своём ходу бонусным действием указать направление, горизонтальное для вас. Все попавшие под действие цели должны в свой следующий ход максимально возможно перемещаться в том направлении. Перед перемещением они могут совершить свои действия. После перемещения из-за заклинания они могут совершить ещё один спасбросок Мудрости, чтобы окончить этот эффект.\n\nЦель не обязана перемещаться в очевидно опасное место, такое как огонь или костёр, но она провоцирует атаки, когда идёт в указанном направлении.","translationSource":"5e14.ttg.club"},{"id":"freedom_of_movement","ru":"Свобода перемещения","en":"Freedom of Movement","lvl":4,"school":"ограждение","cls":["bard","cleric","druid","paladin","ranger"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"1 час","ritual":false,"desc":"","full":"Вы касаетесь согласного существа. Пока заклинание активно, на перемещения цели не влияет труднопроходимая местность, а заклинания и прочие магические эффекты не могут ни уменьшить её скорость, ни сделать её парализованной или опутанной.\n\nЦель может также потратить 5 футов перемещения, чтобы автоматически высвободиться из немагических оков, таких как кандалы или захват другого существа. Более того, нахождение под водой не накладывает штрафы на перемещение и атаки цели.","translationSource":"5e14.ttg.club"},{"id":"confusion","ru":"Смятение","en":"Confusion","lvl":4,"school":"очарование","cls":["bard","cleric","druid","sorcerer","wizard"],"time":"1 действие","range":"90 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Мудрости; на высоких уровнях: усиливается","full":"Это заклинание атакует и скручивает сознание существ, порождая галлюцинации и провоцируя на необдуманные действия.\n\nВсе существа в сфере с радиусом 10 футов с центром на точке, выбранной в пределах дистанции, должны преуспеть в спасброске Мудрости, иначе попадут под действие эффекта.\n\nПопавшая под эффект цель не может совершать реакции и должна бросать к10 в начале каждого своего хода, чтобы определить своё поведение в этом ходу.\n\nк10\tПоведение\n1\tСущество использует всё своё перемещение на движение в случайном направлении. Для определения направления бросьте к8, назначив каждой грани своё направление. Действие в этом ходу существо не совершает.\n2-6\tСущество в этом ходу не перемещается и не совершает действий.\n7-8\tCущество действием совершает рукопашную атаку по случайным образом выбранному существу в пределах досягаемости. Если в пределах досягаемости нет других существ, существо в этот ход ничего не делает.\n9-10\tСущество может действовать и перемещаться как обычно.\n\nВ конце каждого своего хода цель может совершать спасбросок Мудрости. В случае успеха на этой цели эффект заканчивается.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 5 уровня или выше, радиус сферы увеличивается на 5 футов за каждый уровень ячейки выше четвёртого.","translationSource":"5e14.ttg.club"},{"id":"guardian_of_faith","ru":"Страж веры","en":"Guardian of Faith","lvl":4,"school":"вызов","cls":["cleric"],"time":"1 действие","range":"30 футов","comp":"В","dur":"8 часов","ritual":false,"desc":"спасбросок Ловкости","full":"В выбранной и видимой вами свободной клетке в пределах дистанции появляется и начинает парить призрачный страж. Страж занимает своё пространство, и его контуры плохо видны за исключением сверкающего меча и щита, украшенного символом вашего божества.\n\nВсе существа, враждебные вам, перемещающиеся впервые за ход в пространство, находящееся в пределах 10 футов от стража, должны преуспеть в спасброске Ловкости. При провале такое существо получает 20 урона излучением или половину этого урона при успехе.\n\nСтраж исчезает, когда причинит суммарно 60 урона.","translationSource":"5e14.ttg.club"},{"id":"blight","ru":"Усыхание","en":"Blight","lvl":4,"school":"некромантия","cls":["druid","sorcerer","warlock","wizard"],"time":"1 действие","range":"30 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"урон 8d8 (некротический); спасбросок Телосложения; на высоких уровнях: усиливается (1d8)","full":"Некротическая энергия омывает выбранное вами существо, которое вы видите в пределах дистанции, забирая из него жидкость и жизненные силы.\n\nЦель должна совершить спасбросок Телосложения. Цель получает 8к8 урона некротической энергией в случае провала или половину этого урона в случае успеха.\n\nЭто заклинание не оказывает никакого эффекта на нежить и конструктов. Если цель — растительное существо или магическое растение, оно совершает спасбросок с помехой, и заклинание причиняет ему максимальный урон.\n\nЕсли цель — немагическое растение, не являющееся существом, например, дерево или куст, оно не совершает спасбросок; а просто засыхает и умирает.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 5 уровня или выше, урон увеличивается на 1к8 за каждый уровень ячейки выше четвёртого.","translationSource":"5e14.ttg.club"},{"id":"evards_black_tentacles","ru":"Эвардовы чёрные щупальца","en":"Evard's Black Tentacles","lvl":4,"school":"вызов","cls":["warlock","wizard"],"time":"1 действие","range":"90 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"урон 3d6 (дробящий); спасбросок Ловкости","full":"Чёрные извивающиеся щупальца заполняют квадрат на полу с длиной стороны 20 футов, который вы видите в пределах дистанции. Пока заклинание активно, эти щупальца делают местность труднопроходимой.\n\nКогда существо впервые за ход входит в область заклинания или начинает там ход, оно должно преуспеть в спасброске Ловкости, иначе получит 3к6 дробящего урона и станет опутанным щупальцами до окончания заклинания.\n\nСущество, начинающее ход в этой области, уже опутанное щупальцами, получает 3к6 дробящего урона.\n\nОпутанное щупальцами существо может Действием совершить проверку Силы или Ловкости (на свой выбор) против Сл ваших заклинаний. В случае успеха оно высвобождается.","translationSource":"5e14.ttg.club"},{"id":"dream","ru":"Вещий сон","en":"Dream","lvl":5,"school":"иллюзия","cls":["bard","druid","warlock","wizard"],"time":"1 минута","range":"Special","comp":"В, С, М","dur":"8 часов","ritual":false,"desc":"урон 3d6 (психический); спасбросок Мудрости","full":"Это заклинание формирует сон другого существа. Выберите целью этого заклинания известное вам существо. Цель должна находиться на одном плане существования с вами. Этим заклинанием нельзя связаться с существами, которые не спят, например, с эльфами.\n\nВы или согласное существо, которого вы касаетесь, входите в транс, становясь посыльным. Находясь в трансе, посыльный осознаёт своё окружение, но не может совершать действий и перемещаться. Если цель спит, посыльный появляется в её сне и может беседовать с ней, пока та спит, и пока заклинание активно.\n\nПосыльный также может формировать окружение сна, создавая местность, предметы и прочие образы. Посыльный может в любое время выйти из транса, окончив эффект этого заклинания. После пробуждения цель прекрасно помнит сон.\n\nЕсли в момент накладывания заклинания цель бодрствует, посыльный это узнаёт, и может либо окончить транс (и заклинание), либо подождать, пока цель заснёт, и тогда он появится во сне цели. Вы можете сделать посыльного кошмарным для цели. В этом случае посыльный может передать послание не длиннее десяти слов, и цель обязана совершить спасбросок Мудрости.\n\nПри провале отголоски кошмара длятся весь сон, и цель не получает преимуществ от этого отдыха. Кроме того, когда цель просыпается, она получает урон психической энергией 3к6. Если у вас есть часть тела, клок волос, обрезки ногтей или другая подобная часть тела цели, она совершает спасбросок с помехой.","translationSource":"5e14.ttg.club"},{"id":"conjure_elemental","ru":"Вызов элементаля","en":"Conjure Elemental","lvl":5,"school":"вызов","cls":["druid","wizard"],"time":"1 минута","range":"90 футов","comp":"В, С, М","dur":"Концентрация, до 1 часа","ritual":false,"desc":"на высоких уровнях: усиливается","full":"Вы вызываете прислуживающего элементаля. Выберите область воды, воздуха, земли или огня, помещающуюся в куб с длиной ребра 10 футов. В свободном пространство в пределах 10 клеток от выбранной области появляется соответствующий местности элементаль с показателем опасности 5 или меньше.\n\nНапример, из костра выходит огненный элементаль [fire elemental], а земляной элементаль [earth elemental] выбирается из-под земли. Элементаль исчезает, когда его хиты опускаются до 0, или когда заклинание оканчивается. Элементаль дружественен к вам и вашим спутникам, пока заклинание активно.\n\nСовершите проверку инициативы за элементаля, и он будет совершать свои собственные ходы. Он подчиняется отданным вами устно командам (действие не требуется).\n\nЕсли вы не отдаёте команду, он защищается от враждебных существ, но действий не совершает.\n\nЕсли ваша концентрация нарушена, элементаль не исчезает. Вместо этого вы теряете над ним контроль, и он становится враждебным к вам и вашим спутникам, и может напасть.\n\nНеуправляемый элементаль не может быть отпущен вами, но он исчезает через 1 час после того, как был призван.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 6 уровня или выше, показатель опасности увеличивается на 1 за каждый уровень ячейки выше пятого.","translationSource":"5e14.ttg.club"},{"id":"greater_restoration","ru":"Высшее восстановление","en":"Greater Restoration","lvl":5,"school":"ограждение","cls":["bard","cleric","druid"],"time":"1 действие","range":"Касание","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"","full":"Вы наделяете существо, которого касаетесь, позитивной энергией, отменяющей ослабляющие эффекты.\n\nВы можете уменьшить уровень истощения цели на 1, или окончить на ней один из следующих эффектов:\n\nОдин эффект, делающий цель очарованной или окаменевшей.\nОдно проклятье, включая настройку на проклятый магический предмет\nЛюбое уменьшение одной из характеристик цели\nОдин эффект, уменьшающий максимум хитов цели","translationSource":"5e14.ttg.club"},{"id":"bigbys_hand","ru":"Длань Бигби","en":"Bigby's Hand","lvl":5,"school":"воплощение","cls":["wizard"],"time":"1 действие","range":"120 футов","comp":"В, С, М","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"урон 4d8 (силовым уроном); атака заклинанием; на высоких уровнях: усиливается (2d8)","full":"Вы создаёте мерцающую руку Большого размера из полупрозрачного силового поля в свободном пространстве, которое видите в пределах дистанции.\n\nРука существует, пока активно заклинание, и она перемещается по вашей команде, подражая движениям вашей собственной руки. Эта рука является предметом, у которого КД 20, а количество хитов равно максимуму ваших хитов. Когда хиты руки опускаются до 0, заклинание оканчивается. У руки Сила 26 (+8), а Ловкость 10 (+0). Рука не заполняет своё пространство.\n\nКогда вы накладываете это заклинание, а также в последующие ходы, но уже бонусным действием, вы можете перемещать руку на 60 футов и создавать ей один из следующих эффектов:\n\nМогучая длань. Рука пытается толкнуть существо, находящееся в пределах 5 футов от неё, в выбранном вами направлении. Совершите проверку Силы руки, противопоставленную проверке Силы (Атлетика) цели. Если цель Среднего размера или меньше, вы совершаете проверку с преимуществом. В случае успеха рука толкает цель на 5 футов плюс количество футов, равное модификатору базовой характеристики, умноженному на 5. Рука перемещается вместе с целью, оставаясь в пределах 5 футов от неё.\nПреграждающая длань. Рука встаёт между вами и выбранным вами существом, пока вы не отдадите руке другую команду. Рука перемещается так, что находится между вами и целью, предоставляя вам от цели укрытие на половину. Цель не может пройти сквозь пространство руки, если её значение Силы не больше значения Силы руки. Если значение Силы у цели больше, чем у руки, она может подойти к вам сквозь руку, но пространство руки для цели считается труднопроходимой местностью.\nСжатый кулак. Рука ударяет одно существо или предмет в пределах 5 футов от себя. Совершите рукопашную атаку заклинанием за руку, используя свои параметры. При попадании цель получает 4к8 урона силовым полем.\nСжимающая длань. Рука пытается схватить существо с размером Огромное или меньше, находящееся в пределах 5 футов от неё. При проверке захвата вы используете значение Силы руки. Если размер цели Средний или меньше, вы совершаете проверку с преимуществом. Пока рука держит цель в захвате, вы можете бонусным действием сдавливать её рукой. Цель при этом получает дробящий урон 2к6 + модификатор вашей базовой характеристики.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 6 уровня или выше, за каждый уровень ячейки выше пятого урон от сжатого кулака увеличивается на 2к8, а урон от сжимающей длани увеличивается на 2к6.","translationSource":"5e14.ttg.club"},{"id":"tree_stride","ru":"Древесный путь","en":"Tree Stride","lvl":5,"school":"вызов","cls":["cleric","druid","paladin","ranger"],"time":"1 действие","range":"На себя","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"","full":"Вы получаете способность входить в дерево и перемещаться через него в другое дерево того же вида, находящееся в пределах 500 футов. Оба дерева должны быть живыми, и размер обоих должен быть не меньше вашего. Вы должны использовать 5 футов перемещения, чтобы войти в дерево.\n\nВы мгновенно узнаёте местоположение всех других деревьев этого вида в пределах 500 футов, и частью этого же перемещения можете либо перейти в одно из этих деревьев, либо выйти из дерева, в котором вы находитесь.\n\nВы появляетесь в пространстве на свой выбор в пределах 5 футов от текущего дерева, используя ещё 5 футов перемещения.\n\nЕсли у вас не осталось перемещения, вы появляетесь в пределах 5 футов от дерева, в которое входили. Вы можете использовать эту перемещающую способность один раз в раунд, пока активно заклинание.\n\nКаждый ход вы должны заканчивать вне дерева.","translationSource":"5e14.ttg.club"},{"id":"contagion","ru":"Заражение","en":"Contagion","lvl":5,"school":"некромантия","cls":["cleric","druid"],"time":"1 действие","range":"Касание","comp":"В, С","dur":"7 дней","ritual":false,"desc":"спасбросок Телосложения; атака заклинанием","full":"Ваше касание вызывает болезнь. Совершите рукопашную атаку заклинанием по существу, находящемуся в пределах вашей досягаемости. При попадании существо отравлено.1\n\nВ конце каждого своего хода отравленная цель должна совершить спасбросок Телосложения. Преуспев в трёх спасбросках, существо больше не отравлено, и заклинание заканчивается. После провала трёх спасбросков существо больше не отравлено, но вы выбираете одну из болезней в списке ниже. Эффекты выбранной болезни действуют на цель до конца длительности заклинания2.\n\nПоскольку это заклинание вызывает у цели настоящую болезнь, все эффекты, исцеляющие болезни и влияющие на течение болезней, применимы.\n\nВоспаление разума. Сознание существа лихорадит. Существо совершает с помехой проверки и спасброски Интеллекта, и в бою существо ведёт себя так, будто находится под действием заклинания смятение [confusion].\nГниение плоти. Плоть существа начинает разлагаться. Существо совершает с помехой проверки Харизмы и получает уязвимость ко всем видам урона.\nГрязевая лихорадка. Грязевая лихорадка охватывает тело существа. Существо совершает с помехой проверки Силы, спасброски Силы и броски атаки, использующие Силу.\nПрипадок. Существо сотрясают неостановимые судороги. Существо совершает с помехой проверки Ловкости, спасбросок Ловкости и броски атаки, использующие Ловкость.\nСклизкая смерть. Существо начинает неконтролируемо кровоточить. Существо совершает с помехой проверки и спасброски Телосложения. Кроме того, каждый раз, когда цель получает урон, она становится ошеломлённой до конца своего следующего хода.\nСлепотуха. Боль заволакивает сознание существа, а его глаза становятся молочно-белыми. Существо совершает с помехой проверки и спасброски Мудрости, и становится ослеплённым.","translationSource":"5e14.ttg.club"},{"id":"legend_lore","ru":"Знание легенд","en":"Legend Lore","lvl":5,"school":"прорицание","cls":["bard","cleric","wizard"],"time":"10 минут","range":"На себя","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"","full":"Назовите или опишите личность, место или вещь. Заклинание создаёт в вашем сознании краткое описание важных знаний о данном предмете. Это могут быть текущие разговоры, забытые истории, или даже тайные знания, никогда не выходящие за рамки определённого круга посвящённых.\n\nЕсли названный предмет не обладает легендарной значимостью, вы не получаете информацию. Чем больше информации о выбранном предмете у вас уже есть, тем точнее и детальнее будет полученная вами информация.\n\nПолученная информация правдива, но может быть завуалирована. Например, если вы нашли таинственный топор, заклинание может выдать такую информацию: «Горе злодею, коснувшемуся этого топора, ибо даже древко его способно отрубить руки негодяю. Только истинный Сын Камня, почитатель и любимец Морадина, может пробудить истинную силу этого топора, и то только если назовёт священное слово Рудногг».","translationSource":"5e14.ttg.club"},{"id":"modify_memory","ru":"Изменение памяти","en":"Modify Memory","lvl":5,"school":"очарование","cls":["bard","cleric","wizard"],"time":"1 действие","range":"30 футов","comp":"В, С","dur":"Концентрация, до 1 минуты","ritual":false,"desc":"спасбросок Мудрости; на высоких уровнях: усиливается","full":"Вы пытаетесь изменить воспоминания другого существа. Одно существо, которое вы видите, должно совершить спасбросок Мудрости. Если вы с ним сражаетесь, оно совершает спасбросок с преимуществом.\n\nПри провале цель становится очарованной вами на время действия заклинания. Очарованная цель недееспособна и не осознаёт окружение, но всё ещё может слышать вас.\n\nЕсли она получит урон или станет целью другого заклинания, это заклинание оканчивается, и воспоминания цели не изменяются. Пока длится это очарование, вы можете повлиять на воспоминание цели, произошедшее за последние 24 часа и длящееся не больше 10 минут.\n\nВы можете полностью стереть память об этом событии, позволить цели вспомнить всё с потрясающей точностью, изменить детали этого события, или заменить это воспоминание на что-то совершенно иное.\n\nВы должны произнести цели её новые воспоминания, и она должна понимать ваш язык, чтобы изменённые воспоминания заняли место. Её сознание само заполнит пробелы в деталях вашего описания.\n\nЕсли заклинание оканчивается до того как вы закончите описывать новые воспоминания, память существа не будет затронута. В противном случае изменённые воспоминания вступают в силу в конце действия заклинания.\n\nИзменённая память не обязательно будет влиять на поведение существа, особенно если она противоречит его наклонностям, мировоззрению или вере. Нелогичная изменённая память, такая как внедрение воспоминаний о том, как существу нравится купаться в кислоте, отбрасываются, как дурной сон.\n\nМастер может посчитать, что изменённая память слишком абсурдная, чтобы влиять на существо в значительной степени.\n\nЗаклинания снятие проклятья [remove curse] и высшее восстановление [greater restoration], наложенные на цель, восстанавливают её истинную память.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 6 уровня или выше, вы можете изменить воспоминания о событиях, произошедших до 7 дней назад (6 уровень), 30 дней назад (7 уровень), 1 года назад (8 уровень), или в любой момент в жизни существа (9 уровень).","translationSource":"5e14.ttg.club"},{"id":"wall_of_stone","ru":"Каменная стена","en":"Wall of Stone","lvl":5,"school":"воплощение","cls":["druid","sorcerer","wizard"],"time":"1 действие","range":"120 футов","comp":"В, С, М","dur":"Концентрация, до 10 минут","ritual":false,"desc":"спасбросок Ловкости","full":"В точке, выбранной вами в пределах дистанции, появляется немагическая стена из камня. Стена толщиной 6 дюймов (15 сантиметров) и составлена из десяти плит 10 × 10 футов. Каждая плита должна соседствовать как минимум с одной другой плитой.\n\nВ качестве альтернативы, вы можете создать плиты 10 × 20 футов, но толщиной только 3 дюйма (7,5 сантиметров). Если стена при появлении проходит по пространству существа, это существо выталкивается по одну из сторон стены (на ваш выбор).\n\nЕсли существо со всех сторон окружается стеной (или стеной и другой сплошной поверхностью), это существо может совершить спасбросок Ловкости. При успехе оно может реакцией переместиться на расстояние, равное своей скорости, чтобы не быть окружённым стеной. Стена может иметь любую форму, хотя и не может занимать одно пространство с существами и предметами. Стена не обязана быть вертикальной, и не обязана целиком покоиться на твёрдом основании. Однако, она должна сливаться с существующим камнем, опираясь на него. Таким образом, вы можете создать этим заклинанием мост через пропасть или наклонный спуск.\n\nЕсли вы создаёте пролёт длиной больше 20 футов, вы должны уменьшить вдвое размер каждой плиты, чтобы создать поддержку. Вы можете придавать стене грубую форму, создавая бойницы, зубцы, и так далее. Стена является предметом, изготовленным из камня, которому можно причинить урон и, тем самым, пробить.\n\nУ каждой плиты КД 15 и по 30 хитов за каждый 1 дюйм (2,5 сантиметра) толщины. Уменьшение хитов плиты до 0 уничтожает её, и по решению Мастера, может вызвать обвал смежных плит.\n\nЕсли вы поддерживаете концентрацию на этом заклинании в течение всей длительности, стена становится постоянной, и с этого момента её уже нельзя будет рассеять. В противном случае стена исчезает, когда заклинание будет окончено.","translationSource":"5e14.ttg.club"},{"id":"cone_of_cold","ru":"Конус холода","en":"Cone of Cold","lvl":5,"school":"воплощение","cls":["druid","sorcerer","wizard"],"time":"1 действие","range":"На себя","comp":"В, С, М","dur":"Мгновенная","ritual":false,"desc":"урон 8d8 (холодом); спасбросок Телосложения; на высоких уровнях: усиливается (1d8)","full":"Из ваших рук вырывается волна холодного воздуха. Все существа в 60-футовом конусе должны совершить спасбросок Телосложения. Существа получают 8к8 урона холодом при провале, или половину этого урона при успехе.\n\nСущества, убитые этим заклинанием, становятся замороженными статуями, пока не растают.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 6 уровня или выше, урон увеличивается на 1к8 за каждый уровень ячейки выше пятого.","translationSource":"5e14.ttg.club"},{"id":"teleportation_circle","ru":"Круг телепортации","en":"Teleportation Circle","lvl":5,"school":"вызов","cls":["bard","sorcerer","wizard"],"time":"1 минута","range":"10 футов","comp":"В, М","dur":"1 раунд","ritual":false,"desc":"","full":"В процессе накладывания заклинания вы рисуете на полу круг диаметром 10 футов, исписанный знаками, связывающими ваше местоположение с постоянным кругом телепортации на ваш выбор, чью последовательность знаков вы знаете, и находящимся на том же плане существования, что и вы. В нарисованном круге появляется мерцающий портал, остающийся открытым до конца вашего следующего хода.\n\nВсе существа, входящие в портал, мгновенно появляются в пределах 5 футов от места назначения или в ближайшем свободном пространстве, если то место занято. Во многих основных храмах, гильдиях и прочих важных местах есть постоянные круги телепортации, начертанные где-то на их территории. У каждого такого круга есть уникальная последовательность знаков — серия рун, начертанных в определённом узоре.\n\nКогда вы впервые получаете возможность накладывать это заклинание, вы изучаете последовательность знаков двух местонахождений на Материальном Плане, выбранных Мастером.\n\nВы можете узнать дополнительные последовательности знаков во время приключений. Вы можете запомнить новую последовательность, изучая её 1 минуту. Вы можете создать постоянный круг телепортации, накладывая это заклинание в одном и том же месте в течение одного года. При этом вы не обязаны тут же использовать свежесозданный круг.","translationSource":"5e14.ttg.club"},{"id":"rarys_telepathic_bond","ru":"Ментальная связь Рэри","en":"Rary's Telepathic Bond","lvl":5,"school":"прорицание","cls":["wizard"],"time":"1 действие","range":"30 футов","comp":"В, С, М","dur":"1 час","ritual":true,"desc":"","full":"Вы создаёте телепатическую связь между восемью согласными существами на ваш выбор в пределах досягаемости.\n\nСущества с Интеллектом 2 и ниже не попадают под действие этого заклинания.\n\nПока заклинание активно, цели могут телепатически общаться посредством этой связи, даже если у них нет общего языка. Общение возможно на любом расстоянии, но оно не может простираться на другие планы существования.","translationSource":"5e14.ttg.club"},{"id":"mass_cure_wounds","ru":"Множественное лечение ран","en":"Mass Cure Wounds","lvl":5,"school":"воплощение","cls":["bard","cleric","druid"],"time":"1 действие","range":"60 футов","comp":"В, С","dur":"Мгновенная","ritual":false,"desc":"на высоких уровнях: усиливается (1d8)","full":"Волна целительной энергии исходит из точки, выбранной вами в пределах дистанции. Выберите до шести существ в сфере с радиусом 30 футов с центром на этой точке.\n\nВсе цели восстанавливают хиты в количестве, равном 3к8 + модификатор вашей базовой характеристики.\n\nЭто заклинание не оказывает никакого эффекта на нежить и конструктов.\n\nНа более высоких уровнях: Если вы накладываете это заклинание, используя ячейку 6 уровня или выше, восстанавливается дополнительно 1к8 хитов за каждый уровень ячейки выше пятого.","translationSource":"5e14.ttg.club"},{"id":"scrying","ru":"Наблюдение","en":"Scrying","lvl":5,"school":"прорицание","cls":["bard","cleric","druid","paladin","warlock","wizard"],"time":"10 минут","range":"На себя","comp":"В, С, М","dur":"Концентрация, до 10 минут","ritual":false,"desc":"спасбросок Мудрости","full":"Вы можете видеть и слышать конкретное выбранное вами существо, находящееся на том же плане существования, что и вы.\n\nЦель должна совершить спасбросок Мудрости, модифицируемый тем, как хорошо вы знаете цель, и тем, какая связь с этим существом у вас есть. Если цель знает, что вы накладываете это заклинание, она может добровольно провалить спасбросок, если хочет, чтобы за ней следили.\n\nЗнание\tМодификатор спасброска\nЧерез посредников (вы только слышали о цели)\t+5\nИз первых рук (вы встречались с целью)\t+0\nЗнакомые (вы хорошо знаете цель)\t−5\nСвязь\tМодификатор спасброска\nОбраз или рисунок\t−2\nВещь или одежда\t−4\nЧасть тела, прядь волос, кусок ногтя, и т. п.\t−10\n\nПри успехе цель не попадает под действие, и вы не можете использовать это заклинание на ней в течение 24 часов. При провале заклинание создаёт невидимый сенсор в пределах 10 футов от цели.\n\nВы можете видеть и слышать через него, как если бы вы там находились. Сенсор перемещается вместе с целью, оставаясь в пределах 10 футов от неё, пока активно заклинание. Существа, способные видеть невидимые предметы, видят сенсор как светящийся шарик размером с ваш кулак.\n\nВместо того чтобы нацеливаться на существо, вы можете выбрать целью место, уже видимое вами. В этом случае сенсор появляется в этом месте и не перемещается.","translationSource":"5e14.ttg.club"},{"id":"insect_plague","ru":"Нашествие насекомых","en":"Insect Plague","lvl":5,"school":"вызов","cls":["cleric","druid","sorcerer"],"time":"1 действие","range":"3
